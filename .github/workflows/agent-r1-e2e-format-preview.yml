name: Agent R1 E2E Format Preview

on:
  push:
    branches:
      - r1-e2e-real-core-intake

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm prettier --write apps/admin/src/server/e2e/core-intake-real-core.e2e.ts
          git diff --no-ext-diff --unified=0 -- apps/admin/src/server/e2e/core-intake-real-core.e2e.ts
