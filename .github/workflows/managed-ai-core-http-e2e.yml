name: Managed AI Core HTTP E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - ".github/workflows/managed-ai-core-http-e2e.yml"
      - "scripts/core-drift-gate.mjs"
      - "scripts/core-drift-gate.test.mjs"
      - "apps/worker/src/adk-knowledge-job-worker.ts"
      - "apps/worker/src/adk-deepseek-provider.ts"
      - "packages/worker-runtime/src/ai-distilled-knowledge-acquirer.ts"
      - "packages/worker-runtime/src/managed-ai-knowledge-adapter.ts"
      - "packages/worker-runtime/src/managed-ai-execution-http-client.ts"
      - "packages/worker-runtime/src/managed-ai-knowledge-http-adapter.ts"
      - "packages/worker-runtime/src/capability-runtime-v2-http-client.ts"
      - "packages/worker-runtime/src/managed-ai-capability-http-adapter.ts"
      - "packages/worker-runtime/src/managed-ai-core-http-e2e.test.ts"
      - "packages/worker-runtime/src/capability-v2-core-http-e2e.test.ts"

permissions:
  contents: read

env:
  CORE_REF: 0ff0d806fbb632584f2aefba41134a771ba02b6e

jobs:
  core-ref-freshness:
    runs-on: ubuntu-24.04
    outputs:
      core_ref_to_test: ${{ steps.classify.outputs.core_ref_to_test }}
      drift_state: ${{ steps.classify.outputs.drift_state }}
    steps:
      - name: Checkout Knowledge
        uses: actions/checkout@v4
      - name: Checkout Core history for drift classification
        uses: actions/checkout@v4
        with:
          repository: yoomarks/markorbit
          ref: main
          fetch-depth: 0
          filter: blob:none
          path: .core-drift/markorbit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Classify Core dependency drift
        id: classify
        run: >-
          node scripts/core-drift-gate.mjs
          --repo .core-drift/markorbit
          --baseline "$CORE_REF"
          --profile managed-ai
          --github-output "$GITHUB_OUTPUT"

  managed-ai-core-http:
    needs: core-ref-freshness
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Knowledge
        uses: actions/checkout@v4
      - name: Checkout classified current Core
        uses: actions/checkout@v4
        with:
          repository: yoomarks/markorbit
          ref: ${{ needs.core-ref-freshness.outputs.core_ref_to_test }}
          path: .e2e/markorbit-core
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Knowledge dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Core dependencies
        working-directory: .e2e/markorbit-core
        run: pnpm install --frozen-lockfile
      - name: Build Core Capability Engine dependency closure
        working-directory: .e2e/markorbit-core
        run: pnpm exec turbo run build --filter=@markorbit/capability-engine...
      - name: Run real Knowledge to Core Managed AI and Capability V2 HTTP acceptance
        env:
          MARKORBIT_CORE_CHECKOUT: ${{ github.workspace }}/.e2e/markorbit-core
        run: >-
          pnpm --filter @markorbit/worker-runtime exec vitest run
          src/managed-ai-core-http-e2e.test.ts
          src/capability-v2-core-http-e2e.test.ts
