name: Managed AI Core HTTP E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - ".github/workflows/managed-ai-core-http-e2e.yml"
      - "apps/worker/src/adk-deepseek-provider.ts"
      - "apps/worker/src/adk-deepseek-provider.test.ts"
      - "apps/worker/src/adk-knowledge-job-worker.ts"
      - "packages/worker-runtime/src/ai-distilled-knowledge-acquirer.ts"
      - "packages/worker-runtime/src/managed-ai-knowledge-adapter.ts"
      - "packages/worker-runtime/src/managed-ai-execution-http-client.ts"
      - "packages/worker-runtime/src/managed-ai-knowledge-http-adapter.ts"
      - "packages/worker-runtime/src/capability-runtime-managed-ai-http-client.ts"
      - "packages/worker-runtime/src/capability-runtime-managed-ai-http-client.test.ts"
      - "packages/worker-runtime/src/managed-ai-core-http-e2e.test.ts"
      - "packages/worker-runtime/package.json"

permissions:
  contents: read

env:
  CORE_REF: 86f4f666bdf0c621c9832115a2018a6d29ad0d5a

jobs:
  core-ref-freshness:
    runs-on: ubuntu-24.04
    steps:
      - name: Require pinned Core ref to match current main
        shell: bash
        run: |
          current_core_ref="$(git ls-remote https://github.com/yoomarks/markorbit.git refs/heads/main | awk '{print $1}')"
          if [ -z "$current_core_ref" ]; then
            echo "::error::Unable to resolve yoomarks/markorbit main SHA."
            exit 1
          fi

          echo "Current Core main: $current_core_ref"
          echo "Pinned Core ref:    $CORE_REF"
          if [ "$current_core_ref" != "$CORE_REF" ]; then
            echo "::error::Capability Runtime V2 acceptance pin is stale. Audit the new Core main, update CORE_REF, and rerun the real localhost E2E before treating the boundary as current."
            exit 1
          fi

  managed-ai-core-http:
    needs: core-ref-freshness
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Knowledge
        uses: actions/checkout@v4
      - name: Checkout pinned Core
        uses: actions/checkout@v4
        with:
          repository: yoomarks/markorbit
          ref: ${{ env.CORE_REF }}
          path: .e2e/markorbit-core
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Knowledge dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Core dependencies
        working-directory: .e2e/markorbit-core
        run: pnpm install --frozen-lockfile
      - name: Build Core Capability Engine dependency closure
        working-directory: .e2e/markorbit-core
        run: pnpm exec turbo run build --filter=@markorbit/capability-engine...
      - name: Build exact-Core internal E2E entry bundles
        working-directory: .e2e/markorbit-core
        run: >-
          pnpm exec tsup
          services/capability-engine/src/governed-runtime-bootstrap.ts
          services/capability-engine/src/durable-governed-capability-runtime.ts
          services/capability-engine/src/capability-runtime-replay-store.ts
          services/capability-engine/src/managed-ai-execution-claim.ts
          services/capability-engine/src/managed-ai-exact-output.ts
          --format esm
          --target es2022
          --out-dir services/capability-engine/.e2e-dist
      - name: Run real Knowledge to Core Capability Runtime V2 acceptance
        env:
          MARKORBIT_CORE_CHECKOUT: ${{ github.workspace }}/.e2e/markorbit-core
        run: >-
          pnpm --filter @markorbit/worker-runtime exec vitest run
          src/capability-runtime-managed-ai-http-client.test.ts
          src/managed-ai-core-http-e2e.test.ts
