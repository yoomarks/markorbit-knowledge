name: M7 Format

on:
  push:
    branches:
      - agent/source-supply-health-v1

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'M7 format source supply health') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/source-supply-health-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/admin/src/app/api/source-supply-health/route.ts docs/architecture/M7_SOURCE_SUPPLY_HEALTH.md packages/persistence/src/source-supply-health.ts packages/persistence/tests/source-supply-health.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/app/api/source-supply-health/route.ts docs/architecture/M7_SOURCE_SUPPLY_HEALTH.md packages/persistence/src/source-supply-health.ts packages/persistence/tests/source-supply-health.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "M7 format source supply health"
          git push
