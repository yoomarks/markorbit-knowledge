name: M14 Format

on:
  push:
    branches:
      - m14-retrieval-quality-audit

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m14-retrieval-quality-audit
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/persistence/src/retrieval-quality-audit.ts packages/persistence/tests/retrieval-quality-audit.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/retrieval-quality-audit.ts packages/persistence/tests/retrieval-quality-audit.test.ts
          git commit -m "chore: format M14 retrieval audit"
          git push origin HEAD:m14-retrieval-quality-audit
