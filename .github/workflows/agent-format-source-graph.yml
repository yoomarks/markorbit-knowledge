name: Agent Format Source Graph

on:
  push:
    branches:
      - agent/website-source-profile-contracts

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/website-source-profile-contracts
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add exhaustive guard fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/contracts/src/source-graph-v1.ts')
          text = path.read_text()
          old = '''    case "CONTACT_POINT":
      return (
        hasOnlyKeys(value, [
          ...NODE_BASE_KEYS,
          "contactKind",
          "value",
          "visibility",
          "roleLabel",
          "lastVerifiedAt",
        ]) &&
        (value.identity as SourceGraphIdentity).strategy === "SOURCE_LOCAL" &&
        isEnumValue(SOURCE_GRAPH_CONTACT_KINDS, value.contactKind) &&
        isNonEmptyString(value.value) &&
        isEnumValue(SOURCE_GRAPH_CONTACT_VISIBILITIES, value.visibility) &&
        isOptionalString(value.roleLabel) &&
        (value.lastVerifiedAt === undefined || isTimestamp(value.lastVerifiedAt))
      );
  }
}
'''
          new = '''    case "CONTACT_POINT":
      return (
        hasOnlyKeys(value, [
          ...NODE_BASE_KEYS,
          "contactKind",
          "value",
          "visibility",
          "roleLabel",
          "lastVerifiedAt",
        ]) &&
        (value.identity as SourceGraphIdentity).strategy === "SOURCE_LOCAL" &&
        isEnumValue(SOURCE_GRAPH_CONTACT_KINDS, value.contactKind) &&
        isNonEmptyString(value.value) &&
        isEnumValue(SOURCE_GRAPH_CONTACT_VISIBILITIES, value.visibility) &&
        isOptionalString(value.roleLabel) &&
        (value.lastVerifiedAt === undefined || isTimestamp(value.lastVerifiedAt))
      );
  }

  return false;
}
'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
      - run: >-
          pnpm exec prettier --write
          docs/architecture/SOURCE_GRAPH_PROTOCOL_V1.md
          packages/contracts/src/source-graph-v1.ts
          schemas/source-graph/v1/source-graph.schema.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/SOURCE_GRAPH_PROTOCOL_V1.md packages/contracts/src/source-graph-v1.ts schemas/source-graph/v1/source-graph.schema.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format source graph protocol"
          git push origin HEAD:agent/website-source-profile-contracts
