name: Agent Format Source Graph

on:
  push:
    branches:
      - agent/website-source-profile-contracts

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/website-source-profile-contracts
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/architecture/SOURCE_GRAPH_PROTOCOL_V1.md packages/contracts/src/source-graph-v1.ts schemas/source-graph/v1/source-graph.schema.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/SOURCE_GRAPH_PROTOCOL_V1.md packages/contracts/src/source-graph-v1.ts schemas/source-graph/v1/source-graph.schema.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format source graph protocol"
          git push origin HEAD:agent/website-source-profile-contracts
