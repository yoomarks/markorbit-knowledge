name: USPTO Golden Source Live Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uspto-golden-source-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MARKORBIT_CONTROL_PLANE_URL: http://127.0.0.1:3000
      MARKORBIT_ARTIFACT_MAX_BYTES: "16777216"
      MARKORBIT_GOLDEN_SOURCE_TIMEOUT_MS: "420000"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure isolated state
        run: |
          echo "MARKORBIT_KNOWLEDGE_DB_PATH=$RUNNER_TEMP/markorbit-golden-source.sqlite" >> "$GITHUB_ENV"
          echo "MARKORBIT_ARTIFACT_STORE_PATH=$RUNNER_TEMP/markorbit-artifacts" >> "$GITHUB_ENV"
          echo "MARKORBIT_REPOSITORY_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "MARKORBIT_CRAWL4AI_SCRIPT=$GITHUB_WORKSPACE/workers/crawl4ai/acquire.py" >> "$GITHUB_ENV"

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install Crawl4AI runtime
        run: |
          python -m pip install --disable-pip-version-check -r workers/crawl4ai/requirements.txt
          crawl4ai-setup
          crawl4ai-doctor

      - name: Build control plane
        run: pnpm --filter @markorbit/admin build

      - name: Start isolated control plane
        run: |
          pnpm --filter @markorbit/admin start > "$RUNNER_TEMP/admin.log" 2>&1 &
          echo "ADMIN_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail "$MARKORBIT_CONTROL_PLANE_URL/api/sources?limit=1" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/admin.log"
          exit 1

      - name: Bootstrap authorized USPTO run
        run: |
          pnpm --filter @markorbit/worker bootstrap:uspto -- --dispatch > "$RUNNER_TEMP/bootstrap.raw"
          node <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync(process.env.RUNNER_TEMP + '/bootstrap.raw', 'utf8');
          const start = raw.indexOf('{');
          const end = raw.lastIndexOf('}');
          if (start < 0 || end < start) throw new Error('Bootstrap did not emit JSON');
          const value = JSON.parse(raw.slice(start, end + 1));
          for (const key of ['workerId', 'workerCredential', 'runId']) {
            if (typeof value[key] !== 'string' || !value[key]) throw new Error(`Bootstrap missing ${key}`);
          }
          process.stdout.write(`::add-mask::${value.workerCredential}\n`);
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `MARKORBIT_WORKER_ID=${value.workerId}\nMARKORBIT_WORKER_CREDENTIAL=${value.workerCredential}\nMARKORBIT_GOLDEN_RUN_ID=${value.runId}\n`,
          );
          NODE
          rm -f "$RUNNER_TEMP/bootstrap.raw"

      - name: Start production Worker protocol with CI direct-egress exception
        env:
          NODE_ENV: test
          MARKORBIT_CRAWL4AI_REQUIRE_EGRESS_PROXY: "0"
          MARKORBIT_CRAWL4AI_PYTHON: python
          MARKORBIT_WORKER_POLL_INTERVAL_MS: "500"
          MARKORBIT_WORKER_KEEPALIVE_INTERVAL_MS: "15000"
          MARKORBIT_WORKER_MAX_ACQUISITION_MS: "360000"
        run: |
          pnpm --filter @markorbit/worker start > "$RUNNER_TEMP/worker.log" 2>&1 &
          echo "WORKER_PID=$!" >> "$GITHUB_ENV"

      - name: Verify live RawArtifact and execution evidence
        run: pnpm --filter @markorbit/worker verify:uspto -- "$MARKORBIT_GOLDEN_RUN_ID"

      - name: Stop local processes
        if: always()
        run: |
          if [ -n "${WORKER_PID:-}" ]; then kill "$WORKER_PID" 2>/dev/null || true; fi
          if [ -n "${ADMIN_PID:-}" ]; then kill "$ADMIN_PID" 2>/dev/null || true; fi

      - name: Upload sanitized smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uspto-golden-source-live-smoke-logs
          path: |
            ${{ runner.temp }}/admin.log
            ${{ runner.temp }}/worker.log
          if-no-files-found: ignore
          retention-days: 7
