name: RSS Connector Hardening Once

on:
  push:
    branches:
      - codex/connector-rss-v1

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/connector-rss-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Share network policy and preserve XML mixed-content order
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('packages/worker-runtime/src/index.ts')
          text = index.read_text()
          anchor = 'export * from "./api-acquirer";\n'
          addition = 'export * from "./public-network-policy";\nexport * from "./rss-acquirer";\n'
          if 'export * from "./rss-acquirer";' not in text:
            if anchor not in text:
              raise SystemExit('worker-runtime index API export anchor missing')
            text = text.replace(anchor, anchor + addition, 1)
          index.write_text(text)

          api = Path('packages/worker-runtime/src/api-acquirer.ts')
          text = api.read_text()
          text = text.replace('import { BlockList, isIP } from "node:net";', 'import { isIP } from "node:net";', 1)
          import_anchor = '} from "./artifact-backed-collection-executor";\n'
          shared_import = 'import { isPublicNetworkAddress, normalizedUrlHostname } from "./public-network-policy";\n'
          if shared_import not in text:
            if import_anchor not in text:
              raise SystemExit('API artifact executor import anchor missing')
            text = text.replace(import_anchor, import_anchor + shared_import, 1)
          text, count = re.subn(
            r'const NON_PUBLIC_ADDRESSES = new BlockList\(\);.*?\nexport type ApiAuthBinding',
            'export type ApiAuthBinding',
            text,
            count=1,
            flags=re.S,
          )
          if count != 1:
            raise SystemExit('API private-network block not removed exactly once')
          text, count = re.subn(
            r'function normalizedEndpointHostname\(url: URL\): string \{.*?\n\}\n\n',
            '',
            text,
            count=1,
            flags=re.S,
          )
          if count != 1:
            raise SystemExit('API hostname helper not removed exactly once')
          text, count = re.subn(
            r'function publicAddress\(address: string, family: 4 \| 6\): boolean \{.*?\n\}\n\n',
            '',
            text,
            count=1,
            flags=re.S,
          )
          if count != 1:
            raise SystemExit('API public-address helper not removed exactly once')
          text = text.replace('normalizedEndpointHostname', 'normalizedUrlHostname')
          text = text.replace('publicAddress', 'isPublicNetworkAddress')
          api.write_text(text)

          rss = Path('packages/worker-runtime/src/rss-acquirer.ts')
          text = rss.read_text()
          text = text.replace('import { BlockList, isIP } from "node:net";', 'import { isIP } from "node:net";', 1)
          if shared_import not in text:
            if import_anchor not in text:
              raise SystemExit('RSS artifact executor import anchor missing')
            text = text.replace(import_anchor, import_anchor + shared_import, 1)
          text, count = re.subn(
            r'const NON_PUBLIC_ADDRESSES = new BlockList\(\);.*?\ntype RssSourceConfig',
            'type RssSourceConfig',
            text,
            count=1,
            flags=re.S,
          )
          if count != 1:
            raise SystemExit('RSS private-network block not removed exactly once')
          text, count = re.subn(
            r'function normalizedEndpointHostname\(url: URL\): string \{.*?\n\}\n\n',
            '',
            text,
            count=1,
            flags=re.S,
          )
          if count != 1:
            raise SystemExit('RSS hostname helper not removed exactly once')
          text, count = re.subn(
            r'function publicAddress\(address: string, family: 4 \| 6\): boolean \{.*?\n\}\n\n',
            '',
            text,
            count=1,
            flags=re.S,
          )
          if count != 1:
            raise SystemExit('RSS public-address helper not removed exactly once')
          text = text.replace('normalizedEndpointHostname', 'normalizedUrlHostname')
          text = text.replace('publicAddress', 'isPublicNetworkAddress')

          type_anchor = '  children: XmlNode[];\n  text: string[];\n};'
          if type_anchor not in text:
            raise SystemExit('RSS XmlNode type anchor missing')
          text = text.replace(
            type_anchor,
            '  children: XmlNode[];\n  text: string[];\n  segments: Array<string | XmlNode>;\n};',
            1,
          )
          text = text.replace(
            'const documentRoot: XmlNode = { name: "#document", attributes: {}, children: [], text: [] };',
            'const documentRoot: XmlNode = { name: "#document", attributes: {}, children: [], text: [], segments: [] };',
            1,
          )
          text = text.replace(
            'const node: XmlNode = { name: parsed.name, attributes: parsed.attributes, children: [], text: [] };',
            'const node: XmlNode = { name: parsed.name, attributes: parsed.attributes, children: [], text: [], segments: [] };',
            1,
          )
          old = 'if (tail.trim()) stack[stack.length - 1]!.text.push(decodeXmlEntities(tail));'
          new = '''if (tail.trim()) {
            const decoded = decodeXmlEntities(tail);
            stack[stack.length - 1]!.text.push(decoded);
            stack[stack.length - 1]!.segments.push(decoded);
          }'''
          if old not in text:
            raise SystemExit('RSS XML tail text anchor missing')
          text = text.replace(old, new, 1)
          old = 'if (text) stack[stack.length - 1]!.text.push(decodeXmlEntities(text));'
          new = '''if (text) {
            const decoded = decodeXmlEntities(text);
            stack[stack.length - 1]!.text.push(decoded);
            stack[stack.length - 1]!.segments.push(decoded);
          }'''
          if old not in text:
            raise SystemExit('RSS XML text anchor missing')
          text = text.replace(old, new, 1)
          old = 'stack[stack.length - 1]!.text.push(xml.slice(opening + 9, end));'
          new = '''const cdata = xml.slice(opening + 9, end);
            stack[stack.length - 1]!.text.push(cdata);
            stack[stack.length - 1]!.segments.push(cdata);'''
          if old not in text:
            raise SystemExit('RSS XML CDATA anchor missing')
          text = text.replace(old, new, 1)
          old = 'stack[stack.length - 1]!.children.push(node);'
          new = '''stack[stack.length - 1]!.children.push(node);
            stack[stack.length - 1]!.segments.push(node);'''
          if old not in text:
            raise SystemExit('RSS XML child anchor missing')
          text = text.replace(old, new, 1)
          old = '''function nodeText(node: XmlNode): string {
            const parts = [...node.text];
            for (const nested of node.children) parts.push(nodeText(nested));
            return parts.join(" ").replace(/\\s+/g, " ").trim();
          }'''
          new = '''function nodeText(node: XmlNode): string {
            const parts = node.segments.map((segment) =>
              typeof segment === "string" ? segment : nodeText(segment),
            );
            return parts.join(" ").replace(/\\s+/g, " ").trim();
          }'''
          if old not in text:
            raise SystemExit('RSS nodeText anchor missing')
          text = text.replace(old, new, 1)
          rss.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          replacements = [
            (
              'DATABASE, GITHUB and RSS connector breadth can be added later through the existing contracts without reopening the trunk architecture.',
              'DATABASE and GITHUB connector breadth can be added later through the existing contracts without reopening the trunk architecture.',
            ),
            (
              '- production governed HTTPS API Worker with runtime-only endpoint/auth bindings, DNS/IP SSRF fail-closed controls, pinned-IP TLS transport, bounded structured responses and safe logical provenance;\n',
              '- production governed HTTPS API Worker with runtime-only endpoint/auth bindings, DNS/IP SSRF fail-closed controls, pinned-IP TLS transport, bounded structured responses and safe logical provenance;\n- production governed RSS 2.0 / Atom 1.0 Worker with exact feed evidence, deterministic entry envelopes, stable RawArtifact version identity, shared public-network SSRF controls and bounded XML parsing;\n',
            ),
            (
              '- additional DATABASE, GITHUB and RSS production connector implementations;',
              '- additional DATABASE and GITHUB production connector implementations;',
            ),
            (
              'Use [.env.example](.env.example) for storage, Worker, Core intake, Vault, Local Folder, API and conversion configuration.',
              'Use [.env.example](.env.example) for storage, Worker, Core intake, Vault, Local Folder, API, RSS and conversion configuration.',
            ),
            (
              '- [API Connector V1](docs/operations/API_CONNECTOR_V1.md)\n',
              '- [API Connector V1](docs/operations/API_CONNECTOR_V1.md)\n- [RSS Connector V1](docs/operations/RSS_CONNECTOR_V1.md)\n',
            ),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'README anchor missing: {old}')
            text = text.replace(old, new, 1)
          readme.write_text(text)

          env = Path('.env.example')
          text = env.read_text()
          old = '# Collection provider for this Worker process: crawl4ai (default), local-folder, or api.\n'
          new = '# Collection provider for this Worker process: crawl4ai (default), local-folder, api, or rss.\n'
          if old not in text:
            raise SystemExit('.env collection provider anchor missing')
          text = text.replace(old, new, 1)
          anchor = '''MARKORBIT_API_MAX_RESPONSE_BYTES=10485760

# Production Conversion Worker.'''
          block = '''MARKORBIT_API_MAX_RESPONSE_BYTES=10485760

# Production governed RSS 2.0 / Atom 1.0 Worker. Feed URL is public Source configuration; credentials are unsupported in v1.
MARKORBIT_RSS_FEED_URL=
MARKORBIT_RSS_SOURCE_NAME=
MARKORBIT_RSS_TIMEOUT_MS=30000
MARKORBIT_RSS_MAX_RESPONSE_BYTES=5242880
MARKORBIT_RSS_MAX_ENTRIES=100

# Production Conversion Worker.'''
          if anchor not in text:
            raise SystemExit('.env RSS insertion anchor missing')
          env.write_text(text.replace(anchor, block, 1))
          PY
      - name: Format permanent parser-supported files
        run: >-
          pnpm exec prettier --write
          README.md
          apps/worker/package.json
          apps/worker/src/bootstrap-rss.ts
          apps/worker/src/config.ts
          apps/worker/src/main.ts
          apps/worker/tests/config.test.ts
          docs/operations/RSS_CONNECTOR_V1.md
          packages/worker-runtime/src/api-acquirer.ts
          packages/worker-runtime/src/index.ts
          packages/worker-runtime/src/public-network-policy.ts
          packages/worker-runtime/src/rss-acquirer.ts
          packages/worker-runtime/tests/rss-acquirer.test.ts
      - name: Run focused connector checks
        run: |
          pnpm --filter @markorbit/worker-runtime test -- tests/api-acquirer.test.ts tests/rss-acquirer.test.ts
          pnpm --filter @markorbit/worker test -- tests/config.test.ts
          pnpm --filter @markorbit/worker-runtime typecheck
          pnpm --filter @markorbit/worker typecheck
          pnpm format:check
      - name: Commit hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .env.example README.md apps/worker docs/operations/RSS_CONNECTOR_V1.md packages/worker-runtime/src packages/worker-runtime/tests/rss-acquirer.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(rss): harden shared network and feed parsing boundaries'
          git push origin HEAD:codex/connector-rss-v1
