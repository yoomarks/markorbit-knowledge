name: RSS Connector Hardening Once

on:
  push:
    branches:
      - codex/connector-rss-v1

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/connector-rss-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply RSS connector hardening
        run: python .github/scripts/rss-connector-hardening.py
      - name: Format permanent parser-supported files
        run: >-
          pnpm exec prettier --write
          README.md
          apps/worker/package.json
          apps/worker/src/bootstrap-rss.ts
          apps/worker/src/config.ts
          apps/worker/src/main.ts
          apps/worker/tests/config.test.ts
          docs/operations/RSS_CONNECTOR_V1.md
          packages/worker-runtime/src/api-acquirer.ts
          packages/worker-runtime/src/index.ts
          packages/worker-runtime/src/public-network-policy.ts
          packages/worker-runtime/src/rss-acquirer.ts
          packages/worker-runtime/tests/rss-acquirer.test.ts
      - name: Run focused connector checks
        run: |
          pnpm --filter @markorbit/worker-runtime test -- tests/api-acquirer.test.ts tests/rss-acquirer.test.ts
          pnpm --filter @markorbit/worker test -- tests/config.test.ts
          pnpm --filter @markorbit/worker-runtime typecheck
          pnpm --filter @markorbit/worker typecheck
          pnpm format:check
      - name: Commit hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .env.example README.md apps/worker docs/operations/RSS_CONNECTOR_V1.md packages/worker-runtime/src packages/worker-runtime/tests/rss-acquirer.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(rss): harden shared network and feed parsing boundaries'
          git push origin HEAD:codex/connector-rss-v1
