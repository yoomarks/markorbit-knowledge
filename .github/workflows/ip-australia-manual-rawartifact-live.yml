name: IP Australia Manual RawArtifact Live

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ip-australia-manual-rawartifact-live.yml
      - apps/worker/src/ip-australia-manual-artifact-acquirer.ts
      - apps/worker/src/ip-australia-manual-inventory.ts
      - apps/worker/src/ip-australia-manual-article-fidelity.ts
      - apps/worker/src/main.ts
      - apps/worker/src/config.ts
      - packages/worker-runtime/src/artifact-backed-collection-executor.ts
      - packages/worker-runtime/src/controlled-collection-worker-runtime.ts
      - packages/worker-runtime/src/http-controlled-collection-client.ts
      - packages/persistence/src/controlled-worker-execution.ts
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: ip-australia-manual-rawartifact-live-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  rawartifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MARKORBIT_CONTROL_PLANE_URL: http://127.0.0.1:3000
      MARKORBIT_ARTIFACT_MAX_BYTES: "16777216"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure isolated evidence stores
        run: |
          echo "MARKORBIT_KNOWLEDGE_DB_PATH=$RUNNER_TEMP/ip-au-rawartifact.sqlite" >> "$GITHUB_ENV"
          echo "MARKORBIT_ARTIFACT_STORE_PATH=$RUNNER_TEMP/ip-au-artifacts" >> "$GITHUB_ENV"
          echo "MARKORBIT_REPOSITORY_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Configure isolated Admin auth
        run: bash scripts/ci-admin-auth-configure.sh

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @markorbit/admin build
          pnpm --filter @markorbit/worker build

      - name: Resolve authoritative Manual inventory baseline
        run: |
          pnpm --filter @markorbit/worker inventory:ip-australia-manual > "$RUNNER_TEMP/ip-au-inventory.json"
          node <<'NODE'
          const fs=require('node:fs');
          const report=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/ip-au-inventory.json','utf8'));
          const expected=Number(report.totalUniqueManualPageCount);
          if(!Number.isSafeInteger(expected)||expected<=0)throw new Error(`Invalid Manual inventory count ${report.totalUniqueManualPageCount}`);
          if(report.failedUpdateHistoryPageCount!==0||report.currentNavigationPageCount<=0)throw new Error('Authoritative Manual inventory is incomplete');
          fs.appendFileSync(process.env.GITHUB_ENV,`MARKORBIT_IP_AU_EXPECTED_COUNT=${expected}\n`);
          NODE

      - name: Start isolated Core auth stub
        run: bash scripts/ci-admin-auth-stub-start.sh

      - name: Start isolated control plane
        run: |
          pnpm --filter @markorbit/admin start > "$RUNNER_TEMP/admin.log" 2>&1 &
          echo "ADMIN_PID=$!" >> "$GITHUB_ENV"
          bash scripts/ci-admin-control-plane-ready.sh

      - name: Register connector
        run: |
          cat > "$RUNNER_TEMP/connector.json" <<'JSON'
          {"connectorId":"ip-australia-manual-http","displayName":"IP Australia Trade Marks Manual HTTP","version":"1.0.0","sourceTypes":["WEB"],"runtime":"NODE","capabilities":["COLLECT","WATCH"],"supportedJobTypes":["WEB_CRAWL","PAGE_UPDATE_CHECK"],"configurationSchema":{"type":"object","properties":{}},"secretSchema":{"type":"object","properties":{}},"outputArtifactKinds":["HTML"],"healthCheck":{"mode":"WORKER_PROBE","timeoutSeconds":30},"status":"ACTIVE","extensions":{"x-markorbit-source-specific-adapter":"ip-australia-trade-marks-manual"}}
          JSON
          bash scripts/ci-admin-api-curl.sh --silent --show-error --fail-with-body -X POST "$MARKORBIT_CONTROL_PLANE_URL/api/connectors" -H 'content-type: application/json' --data-binary "@$RUNNER_TEMP/connector.json" >/dev/null

      - name: Create governed Source
        run: |
          cat > "$RUNNER_TEMP/source.json" <<'JSON'
          {"name":"IP Australia Trade Marks Manual","slug":"ip-australia-trade-marks-manual-live","sourceType":"WEB","category":"OFFICIAL_GUIDANCE","authorityLevel":"PRIMARY_OFFICIAL","status":"ACTIVE","jurisdictions":["AU"],"languages":["en"],"connector":{"connectorId":"ip-australia-manual-http","version":"1.0.0"},"canonicalUri":"https://manuals.ipaustralia.gov.au/trademark","entrypoints":[{"uri":"https://manuals.ipaustralia.gov.au/trademark","label":"Trade Marks Manual"}],"tags":["ip-australia","trademark","manual","golden-corpus"]}
          JSON
          bash scripts/ci-admin-api-curl.sh --silent --show-error --fail-with-body -X POST "$MARKORBIT_CONTROL_PLANE_URL/api/sources" -H 'content-type: application/json' --data-binary "@$RUNNER_TEMP/source.json" > "$RUNNER_TEMP/source-create.json"
          node <<'NODE'
          const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/source-create.json','utf8'));
          if(!d?.source?.id)throw new Error('Source creation did not return an id');
          fs.appendFileSync(process.env.GITHUB_ENV,`MARKORBIT_IP_AU_SOURCE_ID=${d.source.id}\n`);
          NODE

      - name: Create initial MANUAL plan
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/plan.json',JSON.stringify({sourceId:process.env.MARKORBIT_IP_AU_SOURCE_ID,name:'IP Australia Manual RawArtifact Live',status:'ACTIVE',schedule:{mode:'MANUAL'},priority:'HIGH',policy:{includePatterns:['https://manuals.ipaustralia.gov.au/trademark*'],excludePatterns:[],maxDepth:1,maxItems:700,renderJavascript:false,fetchAttachments:false,respectRobots:true,rateLimitPerMinute:120,timeoutSeconds:60,retry:{maxAttempts:1,backoffSeconds:15},locale:'en-AU'},output:{artifactKinds:['HTML']},extensions:{'x-markorbit-acceptance':'ip-australia-manual-rawartifact-live-v2'}}));
          NODE
          bash scripts/ci-admin-api-curl.sh --silent --show-error --fail-with-body -X POST "$MARKORBIT_CONTROL_PLANE_URL/api/plans" -H 'content-type: application/json' --data-binary "@$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/plan-create.json"
          node <<'NODE'
          const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/plan-create.json','utf8')); const p=d?.plan?.plan;
          if(!p?.id||p.status!=='ACTIVE')throw new Error('Active plan creation failed');
          fs.appendFileSync(process.env.GITHUB_ENV,`MARKORBIT_IP_AU_PLAN_ID=${p.id}\nMARKORBIT_IP_AU_PLAN_UPDATED_AT=${p.updatedAt}\n`);
          NODE

      - name: Register exact Worker binding
        run: |
          cat > "$RUNNER_TEMP/worker.json" <<'JSON'
          {"displayName":"IP Australia Manual RawArtifact Live Worker","desiredState":"ACTIVE","runtime":{"runtimeId":"node-worker","version":"1.0.0"},"supportedJobTypes":["WEB_CRAWL","PAGE_UPDATE_CHECK"],"connectorBindings":[{"connectorId":"ip-australia-manual-http","version":"1.0.0","capabilities":["COLLECT","WATCH"]}],"maxConcurrency":1,"labels":["production","ip-australia","manual","rawartifact-live"]}
          JSON
          bash scripts/ci-admin-api-curl.sh --silent --show-error --fail-with-body -X POST "$MARKORBIT_CONTROL_PLANE_URL/api/workers" -H 'content-type: application/json' --data-binary "@$RUNNER_TEMP/worker.json" > "$RUNNER_TEMP/worker-create.secret.json"
          node <<'NODE'
          const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/worker-create.secret.json','utf8'));
          if(!d?.view?.worker?.id||!d?.credential)throw new Error('Worker registration failed');
          process.stdout.write(`::add-mask::${d.credential}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV,`MARKORBIT_WORKER_ID=${d.view.worker.id}\nMARKORBIT_WORKER_CREDENTIAL=${d.credential}\n`);
          NODE
          rm -f "$RUNNER_TEMP/worker-create.secret.json"

      - name: Dispatch first full collection
        run: |
          node <<'NODE'
          const fs=require('node:fs'); fs.writeFileSync(process.env.RUNNER_TEMP+'/first-dispatch-request.json',JSON.stringify({planId:process.env.MARKORBIT_IP_AU_PLAN_ID}));
          NODE
          bash scripts/ci-admin-api-curl.sh --silent --show-error --fail-with-body -X POST "$MARKORBIT_CONTROL_PLANE_URL/api/runs" -H 'content-type: application/json' -H 'Idempotency-Key: ip-au-manual-rawartifact-first' --data-binary "@$RUNNER_TEMP/first-dispatch-request.json" > "$RUNNER_TEMP/first-dispatch.json"
          node <<'NODE'
          const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/first-dispatch.json','utf8'));
          if(!d?.record?.run?.id)throw new Error('First dispatch did not return run id'); fs.appendFileSync(process.env.GITHUB_ENV,`MARKORBIT_FIRST_RUN_ID=${d.record.run.id}\n`);
          NODE

      - name: Start production Worker
        env:
          NODE_ENV: test
          MARKORBIT_COLLECTION_PROVIDER: ip-australia-manual
          MARKORBIT_WORKER_POLL_INTERVAL_MS: "750"
          MARKORBIT_WORKER_KEEPALIVE_INTERVAL_MS: "15000"
          MARKORBIT_WORKER_MAX_COLLECTION_RUNTIME_MS: "840000"
        run: |
          pnpm --filter @markorbit/worker start > "$RUNNER_TEMP/worker.log" 2>&1 &
          echo "WORKER_PID=$!" >> "$GITHUB_ENV"

      - name: Resolve first collected corpus against authoritative inventory
        run: |
          for attempt in $(seq 1 150); do
            bash scripts/ci-admin-api-curl.sh --silent --show-error --fail "$MARKORBIT_CONTROL_PLANE_URL/api/runs/$MARKORBIT_FIRST_RUN_ID" > "$RUNNER_TEMP/first-run.json"
            status=$(node -e "const d=require('$RUNNER_TEMP/first-run.json');process.stdout.write(d.run.run.status)")
            if [ "$status" = COMPLETED ]; then break; fi
            if [ "$status" = FAILED ] || [ "$status" = CANCELLED ]; then cat "$RUNNER_TEMP/first-run.json"; cat "$RUNNER_TEMP/worker.log"; exit 1; fi
            sleep 5
          done
          node -e "const d=require('$RUNNER_TEMP/first-run.json');if(d.run.run.status!=='COMPLETED')throw new Error('First run did not finish')"
          bash scripts/ci-admin-api-curl.sh --silent --show-error --fail "$MARKORBIT_CONTROL_PLANE_URL/api/artifacts?sourceId=$MARKORBIT_IP_AU_SOURCE_ID&runId=$MARKORBIT_FIRST_RUN_ID&artifactKind=HTML&limit=100" > "$RUNNER_TEMP/first-artifacts.json"
          node <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/first-artifacts.json','utf8'));
          const inventory=Number(process.env.MARKORBIT_IP_AU_EXPECTED_COUNT);
          if(!Number.isSafeInteger(d.total)||d.total<=0||d.total>inventory)throw new Error(`Invalid RawArtifact count ${d.total} for authoritative inventory ${inventory}`);
          fs.appendFileSync(process.env.GITHUB_ENV,`MARKORBIT_IP_AU_INVENTORY_COUNT=${inventory}\nMARKORBIT_IP_AU_EXPECTED_COUNT=${d.total}\n`);
          NODE

      - name: Convert same plan to CHANGE_WATCH
        run: |
          node <<'NODE'
          const fs=require('node:fs'); fs.writeFileSync(process.env.RUNNER_TEMP+'/plan-patch.json',JSON.stringify({expectedUpdatedAt:process.env.MARKORBIT_IP_AU_PLAN_UPDATED_AT,schedule:{mode:'CHANGE_WATCH',pollIntervalSeconds:3600}}));
          NODE
          bash scripts/ci-admin-api-curl.sh --silent --show-error --fail-with-body -X PATCH "$MARKORBIT_CONTROL_PLANE_URL/api/plans/$MARKORBIT_IP_AU_PLAN_ID" -H 'content-type: application/json' --data-binary "@$RUNNER_TEMP/plan-patch.json" > "$RUNNER_TEMP/plan-watch.json"

      - name: Verify change-watch convergence
        run: |
          cat > "$RUNNER_TEMP/validate-watch.cjs" <<'NODE'
          const fs=require('node:fs');
          const run=JSON.parse(fs.readFileSync(process.env.RUN_FILE,'utf8'));
          const artifacts=JSON.parse(fs.readFileSync(process.env.ARTIFACTS_FILE,'utf8'));
          const all=JSON.parse(fs.readFileSync(process.env.ALL_ARTIFACTS_FILE,'utf8'));
          const job=run?.run?.jobs?.[0];
          const previous=Number(process.env.PREVIOUS_TOTAL);
          if(run?.run?.run?.status!=='COMPLETED')throw new Error(`Watch ${process.env.WATCH_INDEX} did not finish`);
          if(job?.jobType!=='PAGE_UPDATE_CHECK')throw new Error(`Expected PAGE_UPDATE_CHECK, got ${job?.jobType}`);
          if(!Number.isSafeInteger(artifacts.total)||artifacts.total<0)throw new Error(`Invalid watch artifact count ${artifacts.total}`);
          if(all.total!==previous+artifacts.total)throw new Error(`Immutable corpus total ${all.total} does not equal previous ${previous} + new ${artifacts.total}`);
          process.stdout.write(String(artifacts.total));
          NODE

          previous_total="$MARKORBIT_IP_AU_EXPECTED_COUNT"
          converged_watch=0
          for watch_index in 1 2 3; do
            request="$RUNNER_TEMP/watch-${watch_index}-dispatch-request.json"
            dispatch="$RUNNER_TEMP/watch-${watch_index}-dispatch.json"
            run_file="$RUNNER_TEMP/watch-${watch_index}-run.json"
            artifacts="$RUNNER_TEMP/watch-${watch_index}-artifacts.json"
            all_artifacts="$RUNNER_TEMP/watch-${watch_index}-all-artifacts.json"

            node -e "require('node:fs').writeFileSync('$request',JSON.stringify({planId:process.env.MARKORBIT_IP_AU_PLAN_ID}))"
            bash scripts/ci-admin-api-curl.sh --silent --show-error --fail-with-body -X POST "$MARKORBIT_CONTROL_PLANE_URL/api/runs" -H 'content-type: application/json' -H "Idempotency-Key: ip-au-manual-rawartifact-watch-${watch_index}" --data-binary "@$request" > "$dispatch"
            run_id=$(node -e "const d=require('$dispatch');if(!d?.record?.run?.id)throw new Error('Watch dispatch did not return run id');process.stdout.write(d.record.run.id)")

            for attempt in $(seq 1 150); do
              bash scripts/ci-admin-api-curl.sh --silent --show-error --fail "$MARKORBIT_CONTROL_PLANE_URL/api/runs/$run_id" > "$run_file"
              status=$(node -e "const d=require('$run_file');process.stdout.write(d.run.run.status)")
              if [ "$status" = COMPLETED ]; then break; fi
              if [ "$status" = FAILED ] || [ "$status" = CANCELLED ]; then cat "$run_file"; cat "$RUNNER_TEMP/worker.log"; exit 1; fi
              sleep 5
            done
            bash scripts/ci-admin-api-curl.sh --silent --show-error --fail "$MARKORBIT_CONTROL_PLANE_URL/api/artifacts?sourceId=$MARKORBIT_IP_AU_SOURCE_ID&runId=$run_id&artifactKind=HTML&limit=100" > "$artifacts"
            bash scripts/ci-admin-api-curl.sh --silent --show-error --fail "$MARKORBIT_CONTROL_PLANE_URL/api/artifacts?sourceId=$MARKORBIT_IP_AU_SOURCE_ID&artifactKind=HTML&limit=100" > "$all_artifacts"
            watch_new=$(WATCH_INDEX="$watch_index" PREVIOUS_TOTAL="$previous_total" RUN_FILE="$run_file" ARTIFACTS_FILE="$artifacts" ALL_ARTIFACTS_FILE="$all_artifacts" node "$RUNNER_TEMP/validate-watch.cjs")
            previous_total=$((previous_total + watch_new))
            if [ "$watch_new" -eq 0 ]; then converged_watch="$watch_index"; break; fi
          done

          if [ "$converged_watch" -eq 0 ]; then
            echo "Manual source did not converge to an identity-skip run within three change-watch executions" >&2
            exit 1
          fi
          echo "MARKORBIT_IP_AU_CONVERGED_WATCH=$converged_watch" >> "$GITHUB_ENV"
          echo "MARKORBIT_IP_AU_FINAL_CORPUS_TOTAL=$previous_total" >> "$GITHUB_ENV"

      - name: Write evidence summary
        if: always()
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const read=(name)=>{const p=`${process.env.RUNNER_TEMP}/${name}`;return fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):null;};
          const inventory=read('ip-au-inventory.json'),first=read('first-artifacts.json');
          const lines=['## IP Australia Manual RawArtifact Live',''];
          if(inventory)lines.push(`- Authoritative inventory baseline: ${inventory.totalUniqueManualPageCount}`);
          if(first)lines.push(`- First run RawArtifacts / collected baseline: ${first.total}`);
          for(let index=1;index<=3;index++){const watch=read(`watch-${index}-artifacts.json`);if(watch)lines.push(`- Change-watch ${index} new RawArtifacts: ${watch.total}`);}
          if(process.env.MARKORBIT_IP_AU_CONVERGED_WATCH)lines.push(`- Identity-skip convergence watch: ${process.env.MARKORBIT_IP_AU_CONVERGED_WATCH}`);
          if(process.env.MARKORBIT_IP_AU_FINAL_CORPUS_TOTAL)lines.push(`- Immutable corpus versions after convergence: ${process.env.MARKORBIT_IP_AU_FINAL_CORPUS_TOTAL}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE

      - name: Stop isolated processes
        if: always()
        run: |
          if [ -n "${WORKER_PID:-}" ]; then kill "$WORKER_PID" 2>/dev/null || true; fi
          if [ -n "${ADMIN_PID:-}" ]; then kill "$ADMIN_PID" 2>/dev/null || true; fi
          if [ -n "${AUTH_STUB_PID:-}" ]; then kill "$AUTH_STUB_PID" 2>/dev/null || true; fi

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ip-australia-manual-rawartifact-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ip-au-inventory.json
            ${{ runner.temp }}/first-run.json
            ${{ runner.temp }}/first-artifacts.json
            ${{ runner.temp }}/watch-*-run.json
            ${{ runner.temp }}/watch-*-artifacts.json
            ${{ runner.temp }}/watch-*-all-artifacts.json
            ${{ runner.temp }}/worker.log
            ${{ runner.temp }}/admin.log
            ${{ runner.temp }}/admin-auth-stub.log
          if-no-files-found: warn
          retention-days: 30
