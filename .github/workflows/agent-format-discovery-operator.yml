name: Agent Format Discovery Operator

on:
  push:
    branches:
      - agent/discovery-operator-workbench

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/discovery-operator-workbench
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/admin/src/components/discovery/discovery-workspace.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/components/discovery/discovery-workspace.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format discovery operator workbench"
          git push origin HEAD:agent/discovery-operator-workbench
