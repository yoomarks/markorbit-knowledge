name: Admin V2 Lint Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix mount effects
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('apps/admin/src/components/discovery/discovery-intake.tsx'),
              Path('apps/admin/src/components/sources/source-review-queue.tsx'),
          ]
          old = '''  useEffect(() => {\n    void refresh();\n  }, [refresh]);'''
          new = '''  useEffect(() => {\n    const timer = window.setTimeout(() => void refresh(), 0);\n    return () => window.clearTimeout(timer);\n  }, [refresh]);'''
          for path in files:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'expected effect not found in {path}')
              path.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/components/discovery/discovery-intake.tsx apps/admin/src/components/sources/source-review-queue.tsx
          git commit -m "fix: defer initial source review loading"
          git push origin HEAD:${{ github.head_ref }}
