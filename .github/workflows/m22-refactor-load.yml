name: M22 Refactor Load

on:
  push:
    branches:
      - m22-foundational-readiness-workbench

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m22-foundational-readiness-workbench
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refactor effect loading
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/admin/src/components/foundational/foundational-remediation-console.tsx")
          text = path.read_text()
          text = text.replace(
              'import { useCallback, useEffect, useMemo, useState } from "react";',
              'import { useEffect, useMemo, useState } from "react";',
          )

          queue_map = '''function queueMap(snapshot: Snapshot): Map<string, QueueItem> {
            return new Map(snapshot.remediationQueue.items.map((item) => [item.targetId, item]));
          }
          '''
          request_snapshot = '''function queueMap(snapshot: Snapshot): Map<string, QueueItem> {
            return new Map(snapshot.remediationQueue.items.map((item) => [item.targetId, item]));
          }

          async function requestSnapshot(
            workspaceId: string,
            jurisdiction: Jurisdiction,
          ): Promise<Snapshot> {
            const query = new URLSearchParams({ workspaceId, jurisdiction, topK: "5" });
            const response = await fetch(`/api/foundational/remediation-queue?${query.toString()}`, {
              cache: "no-store",
            });
            const payload: unknown = await response.json();
            if (!response.ok) {
              const message = (payload as ErrorEnvelope)?.error?.message;
              throw new Error(message || `HTTP ${response.status}`);
            }
            if (!isSnapshot(payload)) throw new Error("Invalid foundational remediation snapshot");
            return payload;
          }
          '''
          if queue_map not in text:
              raise SystemExit("queueMap anchor not found")
          text = text.replace(queue_map, request_snapshot, 1)

          start = text.index('  const load = useCallback(async () => {')
          end_marker = '  }, [load]);\n'
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''  useEffect(() => {
            let active = true;
            void requestSnapshot(workspaceId, jurisdiction)
              .then((nextSnapshot) => {
                if (!active) return;
                setSnapshot(nextSnapshot);
                setError(null);
                setLoading(false);
              })
              .catch((loadError: unknown) => {
                if (!active) return;
                setSnapshot(null);
                setError(
                  loadError instanceof Error ? loadError.message : "Unable to load foundational status",
                );
                setLoading(false);
              });
            return () => {
              active = false;
            };
          }, [jurisdiction, workspaceId]);

          async function refresh() {
            setLoading(true);
            setError(null);
            try {
              setSnapshot(await requestSnapshot(workspaceId, jurisdiction));
            } catch (loadError) {
              setSnapshot(null);
              setError(
                loadError instanceof Error ? loadError.message : "Unable to load foundational status",
              );
            } finally {
              setLoading(false);
            }
          }

          function chooseJurisdiction(code: Jurisdiction) {
            if (code === jurisdiction) return;
            setLoading(true);
            setError(null);
            setSnapshot(null);
            setJurisdiction(code);
          }
          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace('onClick={() => setJurisdiction(code)}', 'onClick={() => chooseJurisdiction(code)}')
          text = text.replace('onClick={() => void load()}', 'onClick={() => void refresh()}')
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/admin/src/components/foundational/foundational-remediation-console.tsx
      - name: Commit refactor
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/components/foundational/foundational-remediation-console.tsx
          git commit -m "M22 refactor effect-driven snapshot loading"
          git push origin HEAD:m22-foundational-readiness-workbench
