name: M5 Type Fix

on:
  push:
    branches:
      - agent/us-source-coverage-map-v1

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'M5 fix optional verification evidence input') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/us-source-coverage-map-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('packages/persistence/src/source-coverage-catalog.ts')
          text = path.read_text()
          pattern = r'(\| "catalogState"\s*\n)(\s*\| "verifiedAt")'
          updated, count = re.subn(pattern, r'\1    | "verificationEvidenceUri"\n\2', text, count=1)
          if count != 1:
              raise SystemExit(f'expected one source coverage helper target, got {count}')
          path.write_text(updated)
          PY
          pnpm exec prettier --write packages/persistence/src/source-coverage-catalog.ts
          pnpm --filter @markorbit/persistence typecheck
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/source-coverage-catalog.ts
          git commit -m "M5 fix optional verification evidence input"
          git push
