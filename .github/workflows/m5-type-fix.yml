name: M5 Type Fix

on:
  push:
    branches:
      - agent/us-source-coverage-map-v1

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'M5 fix optional verification evidence input') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/us-source-coverage-map-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/persistence/src/source-coverage-catalog.ts')
          text = path.read_text()
          old = '    | "catalogState"\n  > & {'
          new = '    | "catalogState"\n    | "verificationEvidenceUri"\n  > & {'
          if old not in text:
              raise SystemExit('source coverage helper target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write packages/persistence/src/source-coverage-catalog.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/source-coverage-catalog.ts
          git commit -m "M5 fix optional verification evidence input"
          git push
