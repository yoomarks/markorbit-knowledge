name: Issue 715 Format Verifier

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-715-format-verifier.yml
      - apps/worker/src/verify-ip-australia-manual-bulk-conversion.ts

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'fix/715-live-evidence-admin-auth'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/715-live-evidence-admin-auth
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format verifier
        run: pnpm exec prettier --write apps/worker/src/verify-ip-australia-manual-bulk-conversion.ts
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet; then
            echo "Verifier already formatted"
            exit 0
          fi
          git add apps/worker/src/verify-ip-australia-manual-bulk-conversion.ts
          git commit -m "style: format IP Australia verifier"
          git push origin HEAD:fix/715-live-evidence-admin-auth
