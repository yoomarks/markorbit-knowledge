name: Temporary Run LATAM P2 Fixed

on:
  push:
    branches:
      - agent/priority-120-latam-p2-ec-uy-gt-cr-pa-do-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/priority-120-latam-p2-ec-uy-gt-cr-pa-do-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Execute corrected source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/temp-priority-120-latam-p2-six.yml').read_text()
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          old = '''old_loop = '    for (const jurisdiction of ["IR", "PK", "IQ", "NL", "BE", "AL", "BA", "MK", "BY", "MN", "KH", "LA", "MM", "BN"] as const) {'
new_loop = '    for (const jurisdiction of ["IR", "PK", "IQ", "NL", "BE", "AL", "BA", "MK", "BY", "MN", "KH", "LA", "MM", "BN", "EC", "UY", "GT", "CR", "PA", "DO"] as const) {'
replace_once('packages/persistence/tests/retrieval-relevance-audit.test.ts', old_loop, new_loop)'''
          new = '''replace_once(
    'packages/persistence/tests/retrieval-relevance-audit.test.ts',
    '      "BN",\\n    ] as const) {',
    '      "BN",\\n      "EC",\\n      "UY",\\n      "GT",\\n      "CR",\\n      "PA",\\n      "DO",\\n    ] as const) {'
)'''
          if old not in script:
              raise SystemExit('original LATAM P2 loop patch not found')
          script = script.replace(old, new, 1)
          exec(compile(script, 'latam-p2-source-patch', 'exec'), {})
          PY
      - name: Format and verify
        run: |
          pnpm exec prettier --write \
            packages/persistence/src/priority-national-source-coverage.ts \
            packages/persistence/src/retrieval-relevance-audit.ts \
            packages/persistence/src/source-coverage-catalog.ts \
            packages/persistence/src/priority-trademark-jurisdictions.ts \
            packages/persistence/tests/priority-national-source-coverage.test.ts \
            packages/persistence/tests/retrieval-relevance-audit.test.ts \
            packages/persistence/tests/priority-trademark-jurisdictions.test.ts
          pnpm --filter @markorbit/persistence test -- \
            tests/priority-national-source-coverage.test.ts \
            tests/retrieval-relevance-audit.test.ts \
            tests/priority-trademark-jurisdictions.test.ts
          pnpm typecheck
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/persistence/src/priority-national-source-coverage.ts \
            packages/persistence/src/retrieval-relevance-audit.ts \
            packages/persistence/src/source-coverage-catalog.ts \
            packages/persistence/src/priority-trademark-jurisdictions.ts \
            packages/persistence/tests/priority-national-source-coverage.test.ts \
            packages/persistence/tests/retrieval-relevance-audit.test.ts \
            packages/persistence/tests/priority-trademark-jurisdictions.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add six LATAM P2 trademark source sets"
          git push origin HEAD:agent/priority-120-latam-p2-ec-uy-gt-cr-pa-do-v1
