name: K-EXT-A format remediation

on:
  push:
    branches:
      - k-ext-a-manual-upload-production-ingestion

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: k-ext-a-manual-upload-production-ingestion
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format K-EXT-A files
        run: |
          pnpm exec prettier --write \
            apps/admin/src/components/artifacts/manual-upload-form.tsx \
            apps/admin/src/server/__tests__/manual-upload-service.test.ts \
            apps/admin/src/server/manual-upload-service.ts \
            packages/persistence/src/manual-upload-registry.ts
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/components/artifacts/manual-upload-form.tsx \
            apps/admin/src/server/__tests__/manual-upload-service.test.ts \
            apps/admin/src/server/manual-upload-service.ts \
            packages/persistence/src/manual-upload-registry.ts
          git commit -m "style(manual-upload): apply repository formatting"
          git push origin HEAD:k-ext-a-manual-upload-production-ingestion
