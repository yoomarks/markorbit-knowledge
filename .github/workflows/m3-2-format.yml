name: M3.2 Format

on:
  push:
    branches:
      - feature/m3-2-html-pdf-normalization

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'M3.2 apply prettier') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-2-html-pdf-normalization
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          packages/worker-runtime/src/production-conversion-worker-runtime.ts
          packages/worker-runtime/src/production-document-normalization.ts
          packages/worker-runtime/tests/production-document-normalization.test.ts
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/worker-runtime/src/production-conversion-worker-runtime.ts \
            packages/worker-runtime/src/production-document-normalization.ts \
            packages/worker-runtime/tests/production-document-normalization.test.ts
          git commit -m "M3.2 apply prettier"
          git push
