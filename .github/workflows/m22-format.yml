name: M22 Format

on:
  push:
    branches:
      - m22-foundational-readiness-workbench

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m22-foundational-readiness-workbench
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/admin/src/components/foundational/foundational-remediation-console.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/components/foundational/foundational-remediation-console.tsx
          git commit -m "chore: format M22 lint fix"
          git push origin HEAD:m22-foundational-readiness-workbench
