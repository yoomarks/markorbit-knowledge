name: M4 Core Attachment Integration

on:
  push:
    branches:
      - feature/m4-attachment-acquisition-reliability

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'M4 integrate attachment acquisition core') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m4-attachment-acquisition-reliability
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"target not found: {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, count))

          p = 'workers/crawl4ai/acquire.py'
          replace(p, ')\n\nPROTOCOL_VERSION = "1.0"\nSUPPORTED_OUTPUT_KINDS = {"HTML", "MARKDOWN"}\n', ')\nfrom attachments import (\n    AttachmentDownload,\n    SUPPORTED_ATTACHMENT_KINDS,\n    attachment_kind_for_url,\n    download_attachment,\n)\n\nPROTOCOL_VERSION = "1.0"\nSUPPORTED_OUTPUT_KINDS = {"HTML", "MARKDOWN"} | set(SUPPORTED_ATTACHMENT_KINDS)\n')
          replace(p, '        "render_javascript": _require_bool(payload.get("renderJavascript"), "renderJavascript"),\n        "respect_robots": _require_bool(payload.get("respectRobots"), "respectRobots"),', '        "render_javascript": _require_bool(payload.get("renderJavascript"), "renderJavascript"),\n        "fetch_attachments": _require_bool(payload.get("fetchAttachments"), "fetchAttachments"),\n        "respect_robots": _require_bool(payload.get("respectRobots"), "respectRobots"),')
          marker = '\n\nasync def _crawl(request: dict[str, Any]) -> dict[str, Any]:\n'
          writer = '''\n\ndef _write_attachment_artifact(\n    output_directory: Path,\n    sequence: int,\n    attachment: AttachmentDownload,\n    max_artifact_bytes: int,\n    current_total_bytes: int,\n    max_total_bytes: int,\n) -> tuple[dict[str, Any], int]:\n    content = attachment.content\n    if not content:\n        raise SafetyError("EMPTY_ARTIFACT_NOT_ALLOWED", "Attachment output is empty")\n    if len(content) > max_artifact_bytes:\n        raise SafetyError("ARTIFACT_TOO_LARGE", "Attachment exceeds the configured byte limit")\n    if current_total_bytes + len(content) > max_total_bytes:\n        raise SafetyError("COLLECTION_TOO_LARGE", "Collection exceeds the configured total byte limit")\n    digest = hashlib.sha256(content).hexdigest()\n    suffix = Path(attachment.original_name).suffix.lower()\n    if not suffix or len(suffix) > 10 or not re.fullmatch(r"\\.[a-z0-9]+", suffix):\n        suffix = ".bin"\n    filename = f"{sequence:04d}-{_safe_stem(attachment.final_url)}-{digest[:12]}{suffix}"\n    path = output_directory / filename\n    with path.open("xb") as handle:\n        handle.write(content)\n    return ({\n        "artifactKind": attachment.artifact_kind,\n        "mimeType": attachment.mime_type,\n        "originalName": attachment.original_name,\n        "sourceUri": attachment.source_url,\n        "canonicalUri": attachment.final_url,\n        "fileName": filename,\n        "sizeBytes": len(content),\n        "sha256": digest,\n    }, current_total_bytes + len(content))\n'''
          replace(p, marker, writer + marker)
          replace(p, 'async def _crawl(request: dict[str, Any]) -> dict[str, Any]:\n    proxy_config = _proxy_configuration(request["require_egress_proxy"])\n', 'async def _crawl(request: dict[str, Any]) -> dict[str, Any]:\n    proxy_config = _proxy_configuration(request["require_egress_proxy"])\n    proxy_server = proxy_config["server"] if proxy_config else None\n')
          replace(p, '    artifacts: list[dict[str, Any]] = []\n    total_bytes = 0\n    pages_attempted = 0\n    seen: set[str] = set()\n', '    artifacts: list[dict[str, Any]] = []\n    total_bytes = 0\n    items_attempted = 0\n    pages_attempted = 0\n    attachments_attempted = 0\n    attachment_hashes: set[str] = set()\n    seen: set[str] = set()\n')
          replace(p, '                if pages_attempted >= request["max_items"]:\n', '                if items_attempted >= request["max_items"]:\n')
          replace(p, '                while queue and pages_attempted < request["max_items"]:\n', '                while queue and items_attempted < request["max_items"]:\n')
          old = '''                    seen.add(current_url)\n                    await assert_public_dns(current_url)\n                    await rate_gate.wait()\n                    pages_attempted += 1\n\n                    try:\n                        result = await crawler.arun(url=current_url, config=run_config)\n                    except Exception as exc:\n'''
          new = '''                    attachment_kind = attachment_kind_for_url(current_url)\n                    if attachment_kind is not None:\n                        seen.add(current_url)\n                        if not request["fetch_attachments"] or attachment_kind not in request["output_kinds"]:\n                            continue\n                        await assert_public_dns(current_url)\n                        await rate_gate.wait()\n                        items_attempted += 1\n                        attachments_attempted += 1\n                        try:\n                            attachment = await download_attachment(\n                                current_url,\n                                seed_host=seed_host,\n                                proxy_server=proxy_server,\n                                locale=request["locale"],\n                                timeout_seconds=request["timeout_seconds"],\n                                max_bytes=min(request["max_artifact_bytes"], request["max_total_bytes"] - total_bytes),\n                            )\n                        except SafetyError as exc:\n                            last_error = exc\n                            continue\n                        if attachment.artifact_kind not in request["output_kinds"]:\n                            continue\n                        digest = hashlib.sha256(attachment.content).hexdigest()\n                        if digest in attachment_hashes:\n                            continue\n                        attachment_hashes.add(digest)\n                        manifest, total_bytes = _write_attachment_artifact(\n                            request["output_directory"], len(artifacts) + 1, attachment,\n                            request["max_artifact_bytes"], total_bytes, request["max_total_bytes"],\n                        )\n                        artifacts.append(manifest)\n                        continue\n\n                    seen.add(current_url)\n                    await assert_public_dns(current_url)\n                    await rate_gate.wait()\n                    items_attempted += 1\n                    pages_attempted += 1\n\n                    try:\n                        result = await crawler.arun(url=current_url, config=run_config)\n                    except Exception as exc:\n'''
          replace(p, old, new)
          replace(p, '        "pagesAttempted": pages_attempted,\n        "totalBytes": total_bytes,\n', '        "pagesAttempted": pages_attempted,\n        "attachmentsAttempted": attachments_attempted,\n        "totalBytes": total_bytes,\n')

          p = 'packages/worker-runtime/src/crawl4ai-subprocess-acquirer.ts'
          replace(p, 'const SUPPORTED_OUTPUT_KINDS = new Set<ArtifactKind>(["HTML", "MARKDOWN"]);', 'const SUPPORTED_OUTPUT_KINDS = new Set<ArtifactKind>([\n  "HTML", "MARKDOWN", "PDF", "DOCX", "XLSX", "CSV", "JSON", "XML", "EMAIL", "IMAGE", "TEXT",\n]);')
          replace(p, '  renderJavascript: boolean;\n  respectRobots: boolean;', '  renderJavascript: boolean;\n  fetchAttachments: boolean;\n  respectRobots: boolean;')
          replace(p, '''  if (job.planSnapshot.policy.fetchAttachments) {\n    throw new CollectionAcquisitionError(\n      "FETCH_ATTACHMENTS_NOT_SUPPORTED",\n      "Crawl4AI attachment downloads are not authorized by this production adapter yet",\n      false,\n    );\n  }\n''', '')
          replace(p, '      "Crawl4AI production adapter currently supports only HTML and MARKDOWN artifacts",', '      "Crawl4AI production adapter received an unsupported page or attachment artifact kind",')
          replace(p, '    version: "0.9.2",\n    mode: "PRODUCTION",', '    version: "1.0.0",\n    mode: "PRODUCTION",')
          replace(p, '        renderJavascript: policy.renderJavascript,\n        respectRobots: policy.respectRobots,', '        renderJavascript: policy.renderJavascript,\n        fetchAttachments: policy.fetchAttachments,\n        respectRobots: policy.respectRobots,')

          p = 'apps/admin/src/server/crawl4ai-production-connector.ts'
          replace(p, '  version: "1.1.0",', '  version: "1.2.0",')
          replace(p, '  displayName: "Crawl4AI Web Connector — Production HTML/Markdown",', '  displayName: "Crawl4AI Web Connector — Production Pages + Attachments",')
          replace(p, '  capabilities: ["COLLECT", "DEEP_CRAWL", "RENDER_JAVASCRIPT"],', '  capabilities: ["COLLECT", "DEEP_CRAWL", "RENDER_JAVASCRIPT", "FETCH_ATTACHMENTS"],')
          replace(p, '  outputArtifactKinds: ["HTML", "MARKDOWN"],', '  outputArtifactKinds: ["HTML", "MARKDOWN", "PDF", "DOCX", "XLSX", "CSV", "JSON", "XML", "EMAIL", "IMAGE", "TEXT"],')
          replace(p, '    "x-markorbit-evidence-boundary": "raw-html-markdown",', '    "x-markorbit-evidence-boundary": "raw-pages-and-authorized-attachments",')

          p = 'apps/worker/src/bootstrap-uspto.ts'
          replace(p, 'const CONNECTOR_VERSION = "1.1.0";', 'const CONNECTOR_VERSION = "1.2.0";')
          replace(p, '      displayName: "Crawl4AI Web Connector — Production HTML/Markdown",', '      displayName: "Crawl4AI Web Connector — Production Pages + Attachments",')
          replace(p, '      capabilities: ["COLLECT", "DEEP_CRAWL", "RENDER_JAVASCRIPT"],', '      capabilities: ["COLLECT", "DEEP_CRAWL", "RENDER_JAVASCRIPT", "FETCH_ATTACHMENTS"],', 2)
          replace(p, '      outputArtifactKinds: ["HTML", "MARKDOWN"],', '      outputArtifactKinds: ["HTML", "MARKDOWN", "PDF", "DOCX", "XLSX", "CSV", "JSON", "XML", "EMAIL", "IMAGE", "TEXT"],')
          replace(p, '        "x-markorbit-evidence-boundary": "raw-html-markdown",', '        "x-markorbit-evidence-boundary": "raw-pages-and-authorized-attachments",')

          p = 'apps/admin/src/server/__tests__/discovery-service.test.ts'
          replace(p, 'version: "1.1.0"', 'version: "1.2.0"')
          replace(p, 'connectors.get("crawl4ai-web", "1.1.0")', 'connectors.get("crawl4ai-web", "1.2.0")')

          p = Path('packages/worker-runtime/tests/crawl4ai-subprocess-acquirer.test.ts')
          text = p.read_text()
          end = '\n});\n'
          if not text.endswith(end): raise SystemExit('unexpected test ending')
          extra = '''\n  it("passes explicit attachment authorization and verifies PDF bytes", async () => {\n    const ctx = context();\n    ctx.job.planSnapshot.policy.fetchAttachments = true;\n    ctx.job.planSnapshot.output.artifactKinds = ["HTML", "PDF"];\n    let authorized = false;\n    const runner: Crawl4AiProcessRunner = {\n      async run(request) {\n        authorized = request.fetchAttachments;\n        const content = new TextEncoder().encode("%PDF-1.4\\nfixture\\n%%EOF\\n");\n        const sha256 = createHash("sha256").update(content).digest("hex");\n        await writeFile(join(request.outputDirectory, "guide.pdf"), content);\n        return { protocolVersion: "1.0", ok: true, pagesAttempted: 1, totalBytes: content.byteLength, artifacts: [{ artifactKind: "PDF", mimeType: "application/pdf", originalName: "guide.pdf", sourceUri: "https://example.com/guide.pdf", canonicalUri: "https://example.com/guide.pdf", fileName: "guide.pdf", sizeBytes: content.byteLength, sha256 }] };\n      },\n    };\n    const acquirer = new Crawl4AiSubprocessAcquirer({ runner, requireEgressProxy: false });\n    const artifacts = await acquirer.acquire(ctx);\n    expect(authorized).toBe(true);\n    expect(artifacts[0]?.artifactKind).toBe("PDF");\n  });\n'''
          p.write_text(text[:-len(end)] + extra + end)
          PY
      - run: |
          cat > workers/crawl4ai/tests/test_attachments.py <<'PY'
          import unittest
          from unittest.mock import patch
          import attachments
          from attachments import attachment_kind_for_url, download_attachment
          from safety import SafetyError

          class AttachmentTests(unittest.TestCase):
              def test_extension_classification(self):
                  self.assertEqual(attachment_kind_for_url("https://example.com/a.pdf"), "PDF")
                  self.assertEqual(attachment_kind_for_url("https://example.com/a.docx?x=1"), "DOCX")
                  self.assertEqual(attachment_kind_for_url("https://example.com/a.png"), "IMAGE")
                  self.assertIsNone(attachment_kind_for_url("https://example.com/a.html"))

              def test_html_masquerade_rejected(self):
                  with self.assertRaises(SafetyError) as caught:
                      attachments._kind_and_mime("https://example.com/a.pdf", {"Content-Type": "text/html"})
                  self.assertEqual(caught.exception.code, "ATTACHMENT_MEDIA_TYPE_MISMATCH")

              def test_signatures(self):
                  attachments._validate_signature("PDF", b"%PDF-1.7\n")
                  attachments._validate_signature("DOCX", b"PK\x03\x04fixture")
                  with self.assertRaises(SafetyError): attachments._validate_signature("PDF", b"no")

          class AttachmentAsyncTests(unittest.IsolatedAsyncioTestCase):
              async def test_download_scope_and_name(self):
                  async def public_dns(_url): return ("93.184.216.34",)
                  def sync(*_a, **_k): return ("https://example.com/a.pdf", {"Content-Type": "application/pdf", "Content-Disposition": 'attachment; filename="official.pdf"'}, b"%PDF-1.7\nfixture")
                  with patch.object(attachments, "assert_public_dns", public_dns), patch.object(attachments, "_download_sync", sync):
                      result = await download_attachment("https://example.com/a.pdf", seed_host="example.com", proxy_server=None, locale=None, timeout_seconds=10, max_bytes=1024)
                  self.assertEqual(result.original_name, "official.pdf")

              async def test_cross_host_final_rejected(self):
                  async def public_dns(_url): return ("93.184.216.34",)
                  def sync(*_a, **_k): return ("https://evil.example.net/a.pdf", {"Content-Type": "application/pdf"}, b"%PDF-1.7\nfixture")
                  with patch.object(attachments, "assert_public_dns", public_dns), patch.object(attachments, "_download_sync", sync):
                      with self.assertRaises(SafetyError) as caught:
                          await download_attachment("https://example.com/a.pdf", seed_host="example.com", proxy_server=None, locale=None, timeout_seconds=10, max_bytes=1024)
                  self.assertEqual(caught.exception.code, "CROSS_DOMAIN_REDIRECT_BLOCKED")
          PY
      - run: pnpm exec prettier --write packages/worker-runtime/src/crawl4ai-subprocess-acquirer.ts packages/worker-runtime/tests/crawl4ai-subprocess-acquirer.test.ts apps/admin/src/server/crawl4ai-production-connector.ts apps/admin/src/server/__tests__/discovery-service.test.ts apps/worker/src/bootstrap-uspto.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/crawl4ai/acquire.py workers/crawl4ai/attachments.py workers/crawl4ai/tests/test_attachments.py packages/worker-runtime/src/crawl4ai-subprocess-acquirer.ts packages/worker-runtime/tests/crawl4ai-subprocess-acquirer.test.ts apps/admin/src/server/crawl4ai-production-connector.ts apps/admin/src/server/__tests__/discovery-service.test.ts apps/worker/src/bootstrap-uspto.ts
          git commit -m "M4 integrate attachment acquisition core"
          git push
