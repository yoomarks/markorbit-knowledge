name: Source Intelligence Calibration

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of calibration sources to attempt
        required: false
        default: "12"
      min_success:
        description: Minimum successful sources required for the run to pass
        required: false
        default: "6"

permissions:
  contents: read

concurrency:
  group: source-intelligence-calibration
  cancel-in-progress: false

jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MARKORBIT_CONTROL_PLANE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure isolated registry
        run: |
          echo "MARKORBIT_KNOWLEDGE_DB_PATH=$RUNNER_TEMP/markorbit-source-intelligence-calibration.sqlite" >> "$GITHUB_ENV"
          echo "MARKORBIT_ARTIFACT_STORE_PATH=$RUNNER_TEMP/markorbit-calibration-artifacts" >> "$GITHUB_ENV"

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Validate calibration manifest
        run: |
          node --check scripts/source-intelligence-calibration.mjs
          node -e 'const fs=require("node:fs"); const x=JSON.parse(fs.readFileSync("config/source-intelligence-calibration-cohort.json","utf8")); if(x.version!=="1.0"||!Array.isArray(x.sources)||x.sources.length<10) process.exit(1)'

      - name: Build control plane
        run: pnpm --filter @markorbit/admin build

      - name: Start isolated control plane
        run: |
          pnpm --filter @markorbit/admin start > "$RUNNER_TEMP/admin.log" 2>&1 &
          echo "ADMIN_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail "$MARKORBIT_CONTROL_PLANE_URL/api/discovery" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/admin.log"
          exit 1

      - name: Run bounded live cohort calibration
        run: |
          node scripts/source-intelligence-calibration.mjs \
            --base-url "$MARKORBIT_CONTROL_PLANE_URL" \
            --manifest config/source-intelligence-calibration-cohort.json \
            --limit "${{ inputs.limit }}" \
            --min-success "${{ inputs.min_success }}" \
            --output "$RUNNER_TEMP/source-intelligence-calibration.json"

      - name: Verify governance boundaries and calibration coverage
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const report = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'source-intelligence-calibration.json'), 'utf8'));
          if (report.calibrationMode !== 'DISCOVERY_GRAPH_ONLY') throw new Error('Unexpected calibration mode');
          if (report.boundaries?.collectionAuthorized !== false || report.boundaries?.collectionExecuted !== false) {
            throw new Error('Calibration crossed the collection authorization boundary');
          }
          const successful = report.results.filter((item) => item.status === 'SUCCESS');
          for (const item of successful) {
            if (item.planStatusAfterAcceptance !== 'PAUSED') throw new Error(`${item.key} plan was not PAUSED after acceptance`);
            if (item.connector?.connectorId !== 'crawl4ai-web' || item.connector?.version !== '1.1.0') {
              throw new Error(`${item.key} did not use production crawl4ai-web@1.1.0`);
            }
          }
          const primary = successful.filter((item) => item.authorityLevel === 'PRIMARY_OFFICIAL').length;
          const professional = successful.filter((item) => item.authorityLevel === 'PROFESSIONAL').length;
          if (successful.length >= 6 && primary === 0) throw new Error('Calibration succeeded without any primary official anchor');
          if (successful.length >= 8 && professional < 2) throw new Error('Calibration lacks enough professional-source comparison points');
          process.stdout.write(`${JSON.stringify({ event: 'source-intelligence.calibration.verified', summary: report.summary, primaryOfficial: primary, professional }, null, 2)}\n`);
          NODE

      - name: Stop local process
        if: always()
        run: |
          if [ -n "${ADMIN_PID:-}" ]; then kill "$ADMIN_PID" 2>/dev/null || true; fi

      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-intelligence-calibration-report
          path: |
            ${{ runner.temp }}/source-intelligence-calibration.json
            ${{ runner.temp }}/admin.log
          if-no-files-found: ignore
          retention-days: 14
