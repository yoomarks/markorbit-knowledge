name: Issue 725 Prettier Once

on:
  push:
    branches: [issue-725-evidence-workspace]

permissions:
  contents: write

jobs:
  prettier-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-725-evidence-workspace
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and self-remove
        run: |
          pnpm exec prettier --write \
            apps/admin/src/components/knowledge/knowledge-browser-model.ts \
            apps/admin/src/components/knowledge/knowledge-workspace-surfaces.tsx
          rm .github/workflows/issue-725-prettier-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/components/knowledge/knowledge-browser-model.ts \
            apps/admin/src/components/knowledge/knowledge-workspace-surfaces.tsx \
            .github/workflows/issue-725-prettier-once.yml
          git commit -m "style: finish formatting #725 files"
          git push origin HEAD:issue-725-evidence-workspace
