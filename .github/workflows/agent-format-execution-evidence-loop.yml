name: Agent Format Execution Evidence Loop

on:
  push:
    branches:
      - agent/accepted-source-collection-evidence-loop

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/accepted-source-collection-evidence-loop
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export controlled collection runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/worker-runtime/src/index.ts')
          text = path.read_text()
          anchor = 'export * from "./http-controlled-collection-client";\n'
          export = 'export * from "./controlled-collection-worker-runtime";\n'
          if export not in text:
              if anchor not in text:
                  raise SystemExit('HTTP controlled client export anchor not found')
              text = text.replace(anchor, anchor + export, 1)
              path.write_text(text)
          PY
      - run: pnpm format
      - name: Commit formatting and runtime export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin packages/integration-tests packages/worker-runtime
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format execution evidence loop"
          git push origin HEAD:agent/accepted-source-collection-evidence-loop
