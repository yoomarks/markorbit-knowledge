name: API Connector Docs Sync Once

on:
  push:
    branches:
      - codex/connector-api-v1

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/connector-api-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Synchronize README API status
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          replacements = [
            (
              'API, DATABASE, GITHUB and RSS connector breadth can be added later through the existing contracts without reopening the trunk architecture.',
              'DATABASE, GITHUB and RSS connector breadth can be added later through the existing contracts without reopening the trunk architecture.',
            ),
            (
              '- production read-only IMAP Email Worker ingestion with secret exclusion and replay/cursor boundaries;\n',
              '- production read-only IMAP Email Worker ingestion with secret exclusion and replay/cursor boundaries;\n- production governed HTTPS API Worker with runtime-only endpoint/auth bindings, DNS/IP SSRF fail-closed controls, pinned-IP TLS transport, bounded structured responses and safe logical provenance;\n',
            ),
            (
              '- additional API, DATABASE, GITHUB and RSS production connector implementations;',
              '- additional DATABASE, GITHUB and RSS production connector implementations;',
            ),
            (
              'Use [.env.example](.env.example) for storage, Worker, Core intake, Vault, Local Folder and conversion configuration.',
              'Use [.env.example](.env.example) for storage, Worker, Core intake, Vault, Local Folder, API and conversion configuration.',
            ),
            (
              '- [Crawl4AI Worker deployment and USPTO Golden Source](docs/operations/CRAWL4AI_WORKER_DEPLOYMENT.md)\n',
              '- [Crawl4AI Worker deployment and USPTO Golden Source](docs/operations/CRAWL4AI_WORKER_DEPLOYMENT.md)\n- [API Connector V1](docs/operations/API_CONNECTOR_V1.md)\n',
            ),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'missing expected README fragment: {old}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Format final API Connector files
        run: >-
          pnpm exec prettier --write
          README.md
          packages/worker-runtime/src/api-acquirer.ts
          packages/worker-runtime/tests/api-acquirer.test.ts
          packages/worker-runtime/src/index.ts
          apps/worker/src/config.ts
          apps/worker/src/main.ts
          apps/worker/src/bootstrap-api.ts
          apps/worker/tests/config.test.ts
          docs/operations/API_CONNECTOR_V1.md
          package.json
      - name: Commit synchronized files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md .env.example package.json apps/worker/src packages/worker-runtime/src/api-acquirer.ts packages/worker-runtime/src/index.ts packages/worker-runtime/tests/api-acquirer.test.ts docs/operations/API_CONNECTOR_V1.md
          git commit -m 'docs(api-connector): synchronize production status'
          git push origin HEAD:codex/connector-api-v1
