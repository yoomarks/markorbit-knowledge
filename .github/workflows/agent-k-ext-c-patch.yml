name: Agent K-EXT-C Patch

on:
  push:
    branches:
      - codex/k-ext-c-converter-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/k-ext-c-converter-hardening
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Repair staged patch quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/k_ext_c_patch.py')
          lines = path.read_text().splitlines()
          for index, line in enumerate(lines):
              if "xml = b'''<!DOCTYPE root" in line:
                  lines[index] = '        xml = b\'<!DOCTYPE root [<!ENTITY x "expanded">]><root>&x;</root>\''
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Apply K-EXT-C patch
        run: python scripts/k_ext_c_patch.py
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            packages/worker-runtime/src/local-document-extraction.ts \
            packages/worker-runtime/src/production-conversion-worker-runtime.ts \
            packages/worker-runtime/tests/local-document-extraction.test.ts \
            apps/worker/src/source-supply-conversion.ts \
            apps/worker/tests/source-supply-conversion.test.ts \
            docs/architecture/DOCUMENT_EXTRACTION_PRODUCTION_HARDENING_V1.md \
            README.md
      - name: Focused validation
        run: |
          python -m compileall -q workers/document_extraction
          python -m unittest discover -s workers/document_extraction/tests -p 'test_*.py'
          pnpm --filter @markorbit/worker-runtime test -- local-document-extraction.test.ts
          pnpm --filter @markorbit/worker test -- source-supply-conversion.test.ts
          pnpm --filter @markorbit/worker-runtime typecheck
          pnpm --filter @markorbit/worker typecheck
      - name: Remove agent patch scaffolding
        run: rm -f scripts/k_ext_c_patch.py .github/workflows/agent-k-ext-c-patch.yml
      - name: Commit K-EXT-C implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: harden production document extraction providers"
          git push origin HEAD:codex/k-ext-c-converter-hardening
