name: M20 Format

on:
  push:
    branches:
      - m20-foundational-remediation-queue

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m20-foundational-remediation-queue
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/worker/src/foundational-remediation-queue.ts
          apps/worker/tests/foundational-remediation-queue.test.ts
          apps/worker/src/operate-foundational.ts
          apps/worker/src/operate-us-foundational.ts
          docs/architecture/M20_FOUNDATIONAL_REMEDIATION_QUEUE.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/foundational-remediation-queue.ts apps/worker/tests/foundational-remediation-queue.test.ts apps/worker/src/operate-foundational.ts apps/worker/src/operate-us-foundational.ts docs/architecture/M20_FOUNDATIONAL_REMEDIATION_QUEUE.md
          git commit -m "chore: format M20 remediation queue"
          git push origin HEAD:m20-foundational-remediation-queue
