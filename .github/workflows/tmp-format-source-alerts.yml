name: Temporary source alerts formatter

on:
  push:
    branches:
      - codex/source-staleness-alerts-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/admin/src/server/source-collection-health.ts
          apps/admin/src/server/__tests__/source-collection-health.test.ts
          apps/admin/src/app/api/sources/route.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/source-collection-health.ts apps/admin/src/server/__tests__/source-collection-health.test.ts apps/admin/src/app/api/sources/route.ts
          git commit -m "style: format source staleness alerts"
          git push
