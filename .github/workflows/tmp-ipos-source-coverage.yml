name: Temporary IPOS source coverage verification

on:
  push:
    branches:
      - codex/ipos-source-coverage-v1

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/tmp/patch_ipos_source_coverage.py
      - name: Update unique URI cardinality assertion
        run: python -c "from pathlib import Path; p=Path('packages/persistence/tests/priority-national-source-coverage.test.ts'); s=p.read_text(); s=s.replace('    ).toBe(34);', '    ).toBe(40);'); p.write_text(s)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/persistence/src/priority-national-source-coverage.ts packages/persistence/src/source-coverage-catalog.ts packages/persistence/tests/priority-national-source-coverage.test.ts
      - run: pnpm --filter @markorbit/persistence exec vitest run tests/priority-national-source-coverage.test.ts tests/source-coverage-catalog.test.ts
      - run: pnpm typecheck
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/priority-national-source-coverage.ts packages/persistence/src/source-coverage-catalog.ts packages/persistence/tests/priority-national-source-coverage.test.ts
          git commit -m "Sources: add Singapore IPOS trademark coverage" || true
          git push
