name: Agent R1-K04 Implement

on:
  push:
    branches:
      - r1-k04-core-content-delivery

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r1-k04-core-content-delivery
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fix one-shot implementation marker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/agent-r1-k04-implement.py')
          text = path.read_text()
          old = '''first = text.find(class_list_marker)\nsecond = text.find(class_list_marker, first + 1)\nif second == -1:\n    raise SystemExit("class list method marker not found")\ntext = text[:second] + class_methods + text[second:]'''
          new = '''position = text.find(class_list_marker)\nif position == -1:\n    raise SystemExit("class list method marker not found")\ntext = text[:position] + class_methods + text[position:]'''
          if old not in text:
              raise SystemExit('implementation marker hotfix target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Generate R1-K04 implementation
        run: python scripts/agent-r1-k04-implement.py
      - name: Repair generated fixtures and compatibility types
        run: |
          python - <<'PY'
          from pathlib import Path

          fixes = {
              'apps/admin/src/server/__tests__/ready-package-core-content-submit.test.ts':
                  'const MARKDOWN = "# Frozen content\\n\\nSecond-stage delivery.\\n";',
              'apps/admin/src/server/e2e/core-intake-real-core.e2e.ts':
                  'const MARKDOWN = "# Real Core E2E\\n\\nFrozen canonical content.\\n";',
          }
          for filename, replacement in fixes.items():
              path = Path(filename)
              text = path.read_text()
              start = text.index('const MARKDOWN = ')
              end = text.index(';', start) + 1
              path.write_text(text[:start] + replacement + text[end:])

          path = Path('packages/persistence/src/ready-package-core-intake-submission.ts')
          text = path.read_text()
          start = text.index('export interface ReadyPackageCoreIntakeSubmissionRepository {')
          end_marker = '\n}\n\nfunction submissionId'
          end = text.index(end_marker, start) + 2
          interfaces = '''export interface ReadyPackageCoreIntakeSubmissionRepository {
            prepare(
              input: PrepareReadyPackageCoreIntakeSubmissionInput,
            ): PrepareReadyPackageCoreIntakeSubmissionResult;
            recordTransportResult(
              submissionId: string,
              workspaceId: string,
              result: CoreIntakeResult,
            ): ReadyPackageCoreIntakeSubmission;
            recordResult(
              submissionId: string,
              workspaceId: string,
              result: CoreIntakeResult,
            ): ReadyPackageCoreIntakeSubmission;
            list(readyPackageId: string, workspaceId: string): ReadyPackageCoreIntakeSubmission[];
          }

          export interface ReadyPackageCoreContentDeliveryRepository
            extends ReadyPackageCoreIntakeSubmissionRepository {
            prepareContentDelivery(
              submissionId: string,
              workspaceId: string,
              input: PrepareReadyPackageCoreContentDeliveryInput,
            ): PrepareReadyPackageCoreContentDeliveryResult;
            recordContentTransportResult(
              submissionId: string,
              workspaceId: string,
              result: ReadyPackageCoreContentResult,
            ): ReadyPackageCoreIntakeSubmission;
            recordContentResult(
              submissionId: string,
              workspaceId: string,
              result: ReadyPackageCoreContentResult,
            ): ReadyPackageCoreIntakeSubmission;
          }'''
          text = text[:start] + interfaces + text[end:]
          text = text.replace(
              'implements ReadyPackageCoreIntakeSubmissionRepository {',
              'implements ReadyPackageCoreContentDeliveryRepository {',
              1,
          )
          path.write_text(text)

          path = Path('apps/admin/src/server/ready-package-core-content-submit.ts')
          text = path.read_text()
          old_import = '''  ReadyPackageCoreContentResult,
            ReadyPackageCoreIntakeSubmission,
            ReadyPackageCoreIntakeSubmissionRepository,'''
          if old_import not in text:
              old_import = '''  ReadyPackageCoreContentResult,
  ReadyPackageCoreIntakeSubmission,
  ReadyPackageCoreIntakeSubmissionRepository,'''
          new_import = '''  ReadyPackageCoreContentDeliveryRepository,
            ReadyPackageCoreContentResult,
            ReadyPackageCoreContentResultEvidence,
            ReadyPackageCoreIntakeSubmission,'''
          if old_import not in text:
              raise SystemExit('content submit import block not found')
          text = text.replace(old_import, new_import, 1)
          start = text.index('function resultFromEvidence(')
          end = text.index('\n}\n\nfunction parseFrozenRequest', start) + 2
          simple = '''function resultFromEvidence(
            evidence: ReadyPackageCoreContentResultEvidence | undefined,
          ): ReadyPackageCoreContentResult | null {
            if (!evidence) return null;
            return {
              intakeId: evidence.intakeId,
              readyPackageId: evidence.readyPackageId,
              status: evidence.status,
              exportSha256: evidence.exportSha256,
            };
          }'''
          text = text[:start] + simple + text[end:]
          text = text.replace(
              'submissions: ReadyPackageCoreIntakeSubmissionRepository,',
              'submissions: ReadyPackageCoreContentDeliveryRepository,',
              1,
          )
          path.write_text(text)
          PY
      - name: Format generated changes
        run: pnpm exec prettier --write packages/persistence/src/ready-package-core-intake-submission.ts apps/admin/src/server/core-content-http-transport.ts apps/admin/src/server/ready-package-core-content-submit.ts apps/admin/src/server/__tests__/core-content-http-transport.test.ts apps/admin/src/server/__tests__/ready-package-core-content-submit.test.ts apps/admin/src/server/e2e/core-intake-real-core.e2e.ts 'apps/admin/src/app/api/ready-packages/[id]/core-content/submit/route.ts' .github/workflows/core-intake-e2e.yml
      - name: Typecheck
        run: pnpm typecheck
      - name: Focused tests
        run: pnpm --filter @markorbit/admin exec vitest run src/server/__tests__/core-content-http-transport.test.ts src/server/__tests__/ready-package-core-content-submit.test.ts src/server/__tests__/core-intake-frozen-workspace.test.ts src/server/__tests__/ready-package-content-export.test.ts
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: deliver frozen ReadyPackage content to Core"
          git push origin HEAD:r1-k04-core-content-delivery
