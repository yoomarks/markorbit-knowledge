name: Agent R1-K04 Implement

on:
  push:
    branches:
      - r1-k04-core-content-delivery

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r1-k04-core-content-delivery
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate R1-K04 implementation
        run: python scripts/agent-r1-k04-implement.py
      - name: Format generated changes
        run: pnpm exec prettier --write .env.example packages/persistence/src/ready-package-core-intake-submission.ts apps/admin/src/server/core-content-http-transport.ts apps/admin/src/server/ready-package-core-content-submit.ts apps/admin/src/server/__tests__/core-content-http-transport.test.ts apps/admin/src/server/__tests__/ready-package-core-content-submit.test.ts apps/admin/src/server/e2e/core-intake-real-core.e2e.ts 'apps/admin/src/app/api/ready-packages/[id]/core-content/submit/route.ts' .github/workflows/core-intake-e2e.yml
      - name: Typecheck
        run: pnpm typecheck
      - name: Focused tests
        run: pnpm --filter @markorbit/admin exec vitest run src/server/__tests__/core-content-http-transport.test.ts src/server/__tests__/ready-package-core-content-submit.test.ts src/server/__tests__/core-intake-frozen-workspace.test.ts src/server/__tests__/ready-package-content-export.test.ts
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: deliver frozen ReadyPackage content to Core"
          git push origin HEAD:r1-k04-core-content-delivery
