name: Temporary Romania OSIM source coverage verification

on:
  push:
    branches:
      - codex/ro-osim-source-coverage-v1

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Romania OSIM patch
        run: |
          sed -i 's/if count != 1:/if count < 1:/' .github/tmp/patch_ro_osim_source_coverage.py
          python .github/tmp/patch_ro_osim_source_coverage.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          packages/persistence/src/priority-national-source-coverage.ts
          packages/persistence/src/source-coverage-catalog.ts
          packages/persistence/tests/priority-national-source-coverage.test.ts
          packages/persistence/src/retrieval-relevance-audit.ts
          packages/persistence/tests/retrieval-relevance-audit.test.ts
      - run: >-
          pnpm --filter @markorbit/persistence exec vitest run
          tests/priority-national-source-coverage.test.ts
          tests/source-coverage-catalog.test.ts
          tests/retrieval-relevance-audit.test.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/persistence/src/priority-national-source-coverage.ts \
            packages/persistence/src/source-coverage-catalog.ts \
            packages/persistence/tests/priority-national-source-coverage.test.ts \
            packages/persistence/src/retrieval-relevance-audit.ts \
            packages/persistence/tests/retrieval-relevance-audit.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: add Romania OSIM trademark source coverage"
          git push
