name: Release Closeout Format Once

on:
  push:
    branches:
      - codex/v0-1-release-closeout

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0-1-release-closeout
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/release-preflight.mjs scripts/release-backup-restore-drill.mjs
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/release-preflight.mjs scripts/release-backup-restore-drill.mjs
          git commit -m "chore(release): format closeout scripts"
          git push origin HEAD:codex/v0-1-release-closeout
