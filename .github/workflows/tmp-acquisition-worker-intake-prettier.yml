name: Temporary Acquisition Worker Intake Prettier

on:
  pull_request:
    branches: [main]

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier apps/admin/src/server/acquisition-intelligence-worker-intake.ts --write
          git diff -- apps/admin/src/server/acquisition-intelligence-worker-intake.ts
