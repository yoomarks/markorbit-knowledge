name: Apply catalog verification audit patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/catalog-verification-audit-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Extract national target builder without changing catalog declarations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path("packages/persistence/src/priority-national-source-coverage.ts")
          text = path.read_text()
          marker = "const CNIPA: Authority = {"
          index = text.find(marker)
          if index < 0:
              raise SystemExit("priority national catalog anchor missing")
          prefix = '''import type { SourceCoverageTarget } from "@markorbit/contracts";\nimport {\n  buildPriorityNationalSourceCoverageTarget as target,\n  type PriorityNationalCoverageAuthority as Authority,\n} from "./priority-national-source-coverage-builder";\n\n'''
          path.write_text(prefix + text[index:])

          package_path = Path("packages/persistence/package.json")
          package = json.loads(package_path.read_text())
          exports = package["exports"]
          exports["./source-coverage-verification-audit"] = "./src/source-coverage-verification-audit.ts"
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          Path(".github/workflows/catalog-verification-audit-patch.yml").unlink()
          PY
      - name: Format touched files
        run: pnpm exec prettier --write packages/persistence/src/priority-national-source-coverage.ts packages/persistence/src/priority-national-source-coverage-builder.ts packages/persistence/src/source-coverage-verification-audit.ts packages/persistence/src/source-coverage-verification-audit.test.ts packages/persistence/package.json
      - name: Commit patch and remove helper
        shell: bash
        run: |
          git config user.name "markorbit-ci"
          git config user.email "ci@markorbit.invalid"
          git add -A
          git commit -m "refactor(catalog): make target verification independently auditable"
          git push origin HEAD:agent/catalog-verification-audit-v1
