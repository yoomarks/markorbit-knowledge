name: Temporary Discovery Review Identity Patch

on:
  push:
    branches: [codex/discovery-review-website-identity-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/discovery-review-website-identity-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply review identity hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/admin/src/server/discovery-service.ts")
          text = path.read_text()

          text = text.replace(
              "    const isExternalCandidate = candidateOrigin !== seedOrigin;",
              '''    const seedIdentity = websiteIdentity(seed.locator);
            const candidateIdentity = websiteIdentity(current.candidate.locator);
            const isExternalCandidate = candidateIdentity !== seedIdentity;''',
              1,
          )

          text = re.sub(
              r'''    const targetProfile = this\.dependencies\.graph\.getProfileByCanonicalOrigin\(\n      DEFAULT_WORKSPACE\.id,\n      candidateOrigin,\n    \);''',
              '''    const targetOrigin = isExternalCandidate ? candidateOrigin : seedOrigin;
            const exactTargetProfile = this.dependencies.graph.getProfileByCanonicalOrigin(
              DEFAULT_WORKSPACE.id,
              targetOrigin,
            );
            let identitySource: SourceDefinition | null = null;
            let sourceOffset = 0;
            while (!identitySource) {
              const page = this.dependencies.sources.list({
                sourceType: "WEB",
                limit: 100,
                offset: sourceOffset,
              });
              identitySource =
                page.items.find(
                  (source) =>
                    source.status !== "ARCHIVED" &&
                    sourceWebsiteIdentities(source).includes(candidateIdentity),
                ) ?? null;
              sourceOffset += page.items.length;
              if (identitySource || page.items.length === 0 || sourceOffset >= page.total) break;
            }
            const identityProfile = identitySource
              ? this.dependencies.graph.getProfileBySourceId(identitySource.id)
              : null;
            const targetProfile =
              exactTargetProfile ?? identityProfile ?? (!isExternalCandidate ? seedProfile : null);''',
              text,
              count=1,
          )

          text = text.replace(
              "      let profile = targetProfile;",
              '''      let profile = targetProfile;
              if (!profile && identitySource) {
                profile = ensureWebsiteSourceProfile(
                  this.dependencies.graph,
                  identitySource,
                  sourceExpansionLocator(identitySource),
                  targetObservedAt,
                  batchRecord.batch.batchId,
                );
              }''',
              1,
          )
          text = text.replace("          canonicalUri: candidateOrigin,", "          canonicalUri: targetOrigin,", 1)
          text = text.replace(
              ".filter((item) => belongsToOrigin(item.locator, candidateOrigin));",
              ".filter((item) => websiteIdentity(item.locator) === candidateIdentity);",
              1,
          )
          path.write_text(text)

          test_path = Path("apps/admin/src/server/__tests__/discovery-service.test.ts")
          test = test_path.read_text()
          test = test.replace(
              "https://example.com/guides/fees.pdf",
              "https://www.example.com/guides/fees.pdf",
          )
          test = test.replace(
              "https://peer.example/blog",
              "https://www.peer.example/blog",
              1,
          )
          test_path.write_text(test)
          PY
          pnpm exec prettier --write apps/admin/src/server/discovery-service.ts apps/admin/src/server/__tests__/discovery-service.test.ts
          git diff --check
          test -n "$(git status --porcelain apps/admin/src/server/discovery-service.ts apps/admin/src/server/__tests__/discovery-service.test.ts)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/discovery-service.ts apps/admin/src/server/__tests__/discovery-service.test.ts
          git commit -m "fix(discovery): reuse sources across website aliases"
          git push origin HEAD:codex/discovery-review-website-identity-v1
