name: Temporary Discovery Review Identity Patch

on:
  push:
    branches: [codex/discovery-review-website-identity-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/discovery-review-website-identity-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply review identity hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/admin/src/server/discovery-service.ts")
          text = path.read_text()

          old = "    const isExternalCandidate = candidateOrigin !== seedOrigin;"
          new = '''    const seedIdentity = websiteIdentity(seed.locator);
            const candidateIdentity = websiteIdentity(current.candidate.locator);
            const isExternalCandidate = candidateIdentity !== seedIdentity;'''
          if text.count(old) != 1:
              raise SystemExit(f"external identity anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''    const targetProfile = this.dependencies.graph.getProfileByCanonicalOrigin(
              DEFAULT_WORKSPACE.id,
              candidateOrigin,
            );'''
          new = '''    const targetOrigin = isExternalCandidate ? candidateOrigin : seedOrigin;
            const exactTargetProfile = this.dependencies.graph.getProfileByCanonicalOrigin(
              DEFAULT_WORKSPACE.id,
              targetOrigin,
            );
            let identitySource: SourceDefinition | null = null;
            let sourceOffset = 0;
            while (!identitySource) {
              const page = this.dependencies.sources.list({
                sourceType: "WEB",
                limit: 100,
                offset: sourceOffset,
              });
              identitySource =
                page.items.find(
                  (source) =>
                    source.status !== "ARCHIVED" &&
                    sourceWebsiteIdentities(source).includes(candidateIdentity),
                ) ?? null;
              sourceOffset += page.items.length;
              if (identitySource || page.items.length === 0 || sourceOffset >= page.total) break;
            }
            const identityProfile = identitySource
              ? this.dependencies.graph.getProfileBySourceId(identitySource.id)
              : null;
            const targetProfile =
              exactTargetProfile ?? identityProfile ?? (!isExternalCandidate ? seedProfile : null);'''
          if text.count(old) != 1:
              raise SystemExit(f"target profile anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = "          canonicalUri: candidateOrigin,"
          if text.count(old) != 1:
              raise SystemExit(f"canonical origin anchor count={text.count(old)}")
          text = text.replace(old, "          canonicalUri: targetOrigin,", 1)

          old = ".filter((item) => belongsToOrigin(item.locator, candidateOrigin));"
          if text.count(old) != 1:
              raise SystemExit(f"candidate filter anchor count={text.count(old)}")
          text = text.replace(
              old,
              ".filter((item) => websiteIdentity(item.locator) === candidateIdentity);",
              1,
          )
          path.write_text(text)

          test_path = Path("apps/admin/src/server/__tests__/discovery-service.test.ts")
          test = test_path.read_text()
          guide = "https://example.com/guides/fees.pdf"
          if test.count(guide) < 2:
              raise SystemExit(f"guide fixture count={test.count(guide)}")
          test = test.replace(guide, "https://www.example.com/guides/fees.pdf")
          peer = "https://peer.example/blog"
          if test.count(peer) != 1:
              raise SystemExit(f"peer fixture count={test.count(peer)}")
          test = test.replace(peer, "https://www.peer.example/blog", 1)
          test_path.write_text(test)
          PY
          pnpm exec prettier --write apps/admin/src/server/discovery-service.ts apps/admin/src/server/__tests__/discovery-service.test.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/discovery-service.ts apps/admin/src/server/__tests__/discovery-service.test.ts
          git commit -m "fix(discovery): reuse sources across website aliases"
          git push origin HEAD:codex/discovery-review-website-identity-v1
