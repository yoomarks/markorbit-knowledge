name: Temporary Discovery Review Identity Patch

on:
  push:
    branches: [codex/discovery-review-website-identity-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/discovery-review-website-identity-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply review identity hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path("apps/admin/src/server/discovery-service.ts")
          text = service_path.read_text()

          marker = "\nfunction websiteSourceSlug(locator: string, identity: string): string {"
          if marker not in text:
              raise SystemExit("websiteSourceSlug marker missing")
          helper = '''

          function findWebsiteSourceByIdentity(
            sources: SourceRepository,
            identity: string,
          ): SourceDefinition | null {
            let offset = 0;
            while (true) {
              const page = sources.list({ sourceType: "WEB", limit: 100, offset });
              for (const source of page.items) {
                if (source.status === "ARCHIVED") continue;
                if (sourceWebsiteIdentities(source).includes(identity)) return source;
              }
              offset += page.items.length;
              if (page.items.length === 0 || offset >= page.total) return null;
            }
          }
          '''
          text = text.replace(marker, helper + marker, 1)

          old_preamble = '''    const seedOrigin = websiteOrigin(seed.locator);
            const candidateOrigin = websiteOrigin(current.candidate.locator);
            const isExternalCandidate = candidateOrigin !== seedOrigin;
            const seedProfile = this.dependencies.graph.getProfileByCanonicalOrigin(
              DEFAULT_WORKSPACE.id,
              seedOrigin,
            );
            const targetProfile = this.dependencies.graph.getProfileByCanonicalOrigin(
              DEFAULT_WORKSPACE.id,
              candidateOrigin,
            );
          '''
          new_preamble = '''    const seedOrigin = websiteOrigin(seed.locator);
            const candidateOrigin = websiteOrigin(current.candidate.locator);
            const seedIdentity = websiteIdentity(seed.locator);
            const candidateIdentity = websiteIdentity(current.candidate.locator);
            const isExternalCandidate = candidateIdentity !== seedIdentity;
            const seedProfile = this.dependencies.graph.getProfileByCanonicalOrigin(
              DEFAULT_WORKSPACE.id,
              seedOrigin,
            );
            const targetOrigin = isExternalCandidate ? candidateOrigin : seedOrigin;
            const exactTargetProfile = this.dependencies.graph.getProfileByCanonicalOrigin(
              DEFAULT_WORKSPACE.id,
              targetOrigin,
            );
            const identitySource = findWebsiteSourceByIdentity(
              this.dependencies.sources,
              candidateIdentity,
            );
            const identityProfile = identitySource
              ? this.dependencies.graph.getProfileBySourceId(identitySource.id)
              : null;
            const targetProfile =
              exactTargetProfile ?? identityProfile ?? (!isExternalCandidate ? seedProfile : null);
          '''
          if old_preamble not in text:
              raise SystemExit("review preamble missing")
          text = text.replace(old_preamble, new_preamble, 1)

          old_existing = '''      if (profile) {
                const existingSource = this.dependencies.sources.getById(profile.sourceId);
                if (!existingSource) {
                  throw new RegistryConflictError(
                    "DISCOVERY_GRAPH_SOURCE_MISSING",
                    `WebsiteSourceProfile ${profile.id} points to missing source ${profile.sourceId}`,
                  );
                }
                const planRecord = existingSource.defaultCollectionPlanId
                  ? this.dependencies.plans.getById(existingSource.defaultCollectionPlanId)
                  : null;
                if (!planRecord) {
                  throw new RegistryConflictError(
                    "DISCOVERY_GRAPH_PLAN_MISSING",
                    `Website source ${existingSource.id} has no default collection plan`,
                  );
                }
                source = existingSource;
                plan = planRecord.plan;
              } else {
          '''
          new_existing = '''      const existingSource = profile
                ? this.dependencies.sources.getById(profile.sourceId)
                : identitySource;
              if (profile && !existingSource) {
                throw new RegistryConflictError(
                  "DISCOVERY_GRAPH_SOURCE_MISSING",
                  `WebsiteSourceProfile ${profile.id} points to missing source ${profile.sourceId}`,
                );
              }

              if (existingSource) {
                if (!profile) {
                  profile = ensureWebsiteSourceProfile(
                    this.dependencies.graph,
                    existingSource,
                    sourceExpansionLocator(existingSource),
                    targetObservedAt,
                    batchRecord.batch.batchId,
                  );
                }
                const planRecord = existingSource.defaultCollectionPlanId
                  ? this.dependencies.plans.getById(existingSource.defaultCollectionPlanId)
                  : null;
                if (!planRecord) {
                  throw new RegistryConflictError(
                    "DISCOVERY_GRAPH_PLAN_MISSING",
                    `Website source ${existingSource.id} has no default collection plan`,
                  );
                }
                source = existingSource;
                plan = planRecord.plan;
              } else {
          '''
          if old_existing not in text:
              raise SystemExit("existing source branch missing")
          text = text.replace(old_existing, new_existing, 1)

          if "          canonicalUri: candidateOrigin," not in text:
              raise SystemExit("canonicalUri candidate origin missing")
          text = text.replace("          canonicalUri: candidateOrigin,", "          canonicalUri: targetOrigin,", 1)

          old_filter = ".filter((item) => belongsToOrigin(item.locator, candidateOrigin));"
          if old_filter not in text:
              raise SystemExit("candidate origin filter missing")
          text = text.replace(
              old_filter,
              ".filter((item) => websiteIdentity(item.locator) === candidateIdentity);",
              1,
          )
          service_path.write_text(text)

          test_path = Path("apps/admin/src/server/__tests__/discovery-service.test.ts")
          test = test_path.read_text()
          if test.count("https://example.com/guides/fees.pdf") < 2:
              raise SystemExit("expected guide URL fixtures missing")
          test = test.replace(
              "https://example.com/guides/fees.pdf",
              "https://www.example.com/guides/fees.pdf",
          )
          if "https://peer.example/blog" not in test:
              raise SystemExit("peer blog fixture missing")
          test = test.replace("https://peer.example/blog", "https://www.peer.example/blog", 1)
          test_path.write_text(test)
          PY
          pnpm exec prettier --write apps/admin/src/server/discovery-service.ts apps/admin/src/server/__tests__/discovery-service.test.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/discovery-service.ts apps/admin/src/server/__tests__/discovery-service.test.ts
          git commit -m "fix(discovery): reuse sources across website aliases"
          git push origin HEAD:codex/discovery-review-website-identity-v1
