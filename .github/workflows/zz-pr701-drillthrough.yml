name: PR701 drill-through fixer

on:
  push:
    branches: [issue-698-producer-core-reliability-scorecard]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply bounded drill-through patch
        run: python scripts/zz-pr701-drillthrough.py
      - name: Format touched files
        run: >-
          pnpm exec prettier --write
          apps/admin/src/server/producer-core-reliability-service.ts
          apps/admin/src/app/api/knowledge/reliability/deliveries/[submissionId]/route.ts
          apps/admin/src/components/overview/producer-core-reliability.tsx
      - name: Validate focused surface
        run: |
          pnpm --filter @markorbit/persistence typecheck
          pnpm --filter @markorbit/persistence test -- producer-core-reliability-scorecard.test.ts
          pnpm --filter @markorbit/admin typecheck
      - name: Commit drill-through changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/producer-core-reliability-service.ts apps/admin/src/app/api/knowledge/reliability/deliveries/[submissionId]/route.ts apps/admin/src/components/overview/producer-core-reliability.tsx
          git commit -m "feat: add bounded reliability evidence drill-through"
          git push origin HEAD:issue-698-producer-core-reliability-scorecard
