name: Temporary Change Evidence Binary Prettier

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prettier:
    if: github.head_ref == 'agent/change-evidence-raw-binary-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write packages/persistence/src/document-change-evidence.ts
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/document-change-evidence.ts
          git commit -m "style: format raw binary change evidence"
          git push origin HEAD:${{ github.head_ref }}
