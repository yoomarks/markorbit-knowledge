name: Temporary discovery page value deadline patch

on:
  push:
    branches:
      - codex/discovery-page-value-deadline-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/discovery-page-value-deadline-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply deadline changes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new))

          # Capability transport: allow callers to use a shorter operation-specific abort deadline.
          replace(
              "apps/admin/src/server/capability-client.ts",
              '''function timeoutMs(): number {\n  const configured = process.env.MARKORBIT_CAPABILITY_TIMEOUT_MS?.trim();\n  if (!configured) return DEFAULT_TIMEOUT_MS;\n  const value = Number(configured);\n  if (!Number.isSafeInteger(value) || value < 1_000 || value > 180_000) {\n    throw new RegistryValidationError(\n      "MARKORBIT_CAPABILITY_TIMEOUT_MS must be an integer from 1000 to 180000",\n    );\n  }\n  return value;\n}\n''',
              '''function configuredTimeoutMs(): number {\n  const configured = process.env.MARKORBIT_CAPABILITY_TIMEOUT_MS?.trim();\n  if (!configured) return DEFAULT_TIMEOUT_MS;\n  const value = Number(configured);\n  if (!Number.isSafeInteger(value) || value < 1_000 || value > 180_000) {\n    throw new RegistryValidationError(\n      "MARKORBIT_CAPABILITY_TIMEOUT_MS must be an integer from 1000 to 180000",\n    );\n  }\n  return value;\n}\n\nfunction requestTimeoutMs(value: number | undefined): number {\n  if (value === undefined) return configuredTimeoutMs();\n  if (!Number.isSafeInteger(value) || value < 1_000 || value > 180_000) {\n    throw new RegistryValidationError("Capability timeoutMs must be an integer from 1000 to 180000");\n  }\n  return value;\n}\n''',
          )
          replace(
              "apps/admin/src/server/capability-client.ts",
              '''  errorCodePrefix: string;\n}): Promise<TResponse> {\n''',
              '''  errorCodePrefix: string;\n  timeoutMs?: number;\n}): Promise<TResponse> {\n''',
          )
          replace(
              "apps/admin/src/server/capability-client.ts",
              '''  const controller = new AbortController();\n  const timer = setTimeout(() => controller.abort(), timeoutMs());\n''',
              '''  const controller = new AbortController();\n  const timer = setTimeout(() => controller.abort(), requestTimeoutMs(input.timeoutMs));\n''',
          )

          # Discovery ranker: short semantic deadline, independently configurable from generic capabilities.
          replace(
              "apps/admin/src/server/discovery-page-value-ranker.ts",
              '''const MAX_SCREEN_CANDIDATES = 500;\nconst MAX_RANKED_RESULTS = 100;\n''',
              '''const MAX_SCREEN_CANDIDATES = 500;\nconst MAX_RANKED_RESULTS = 100;\nconst DEFAULT_DISCOVERY_PAGE_VALUE_TIMEOUT_MS = 8_000;\n\nexport function discoveryPageValueTimeoutMs(): number {\n  const configured = process.env.MARKORBIT_DISCOVERY_PAGE_VALUE_TIMEOUT_MS?.trim();\n  if (!configured) return DEFAULT_DISCOVERY_PAGE_VALUE_TIMEOUT_MS;\n  const value = Number(configured);\n  if (!Number.isSafeInteger(value) || value < 1_000 || value > 30_000) {\n    throw new RegistryValidationError(\n      "MARKORBIT_DISCOVERY_PAGE_VALUE_TIMEOUT_MS must be an integer from 1000 to 30000",\n    );\n  }\n  return value;\n}\n''',
          )
          replace(
              "apps/admin/src/server/discovery-page-value-ranker.ts",
              '''    locale?: string;\n    objective?: string;\n  }): Promise<DiscoveryPageValueRanking>;\n''',
              '''    locale?: string;\n    objective?: string;\n    timeoutMs?: number;\n  }): Promise<DiscoveryPageValueRanking>;\n''',
          )
          replace(
              "apps/admin/src/server/discovery-page-value-ranker.ts",
              '''    locale?: string;\n    objective?: string;\n  }): Promise<DiscoveryPageValueRanking> {\n''',
              '''    locale?: string;\n    objective?: string;\n    timeoutMs?: number;\n  }): Promise<DiscoveryPageValueRanking> {\n''',
          )
          replace(
              "apps/admin/src/server/discovery-page-value-ranker.ts",
              '''      errorCodePrefix: "PAGE_VALUE_CAPABILITY",\n      validate: (value) =>\n''',
              '''      errorCodePrefix: "PAGE_VALUE_CAPABILITY",\n      timeoutMs: input.timeoutMs,\n      validate: (value) =>\n''',
          )

          # Workflow: enforce the same deadline even for an injected/custom ranker that ignores timeoutMs.
          replace(
              "apps/admin/src/server/discovery-service.ts",
              '''  SharedCapabilityDiscoveryPageValueRanker,\n  type DiscoveryPageValueRanker,\n} from "./discovery-page-value-ranker";\n''',
              '''  SharedCapabilityDiscoveryPageValueRanker,\n  discoveryPageValueTimeoutMs,\n  type DiscoveryPageValueRanker,\n} from "./discovery-page-value-ranker";\n''',
          )
          replace(
              "apps/admin/src/server/discovery-service.ts",
              '''  provider: SourceDiscoveryProvider;\n  pageValueRanker?: DiscoveryPageValueRanker;\n  transaction: <T>(operation: () => T) => T;\n''',
              '''  provider: SourceDiscoveryProvider;\n  pageValueRanker?: DiscoveryPageValueRanker;\n  pageValueTimeoutMs?: number;\n  transaction: <T>(operation: () => T) => T;\n''',
          )
          replace(
              "apps/admin/src/server/discovery-service.ts",
              '''function discoveryScanBudget(reviewCandidateLimit: number): number {\n  return Math.min(500, Math.max(reviewCandidateLimit, reviewCandidateLimit * 3));\n}\n\nexport type DiscoveryOverviewInput = {\n''',
              '''function discoveryScanBudget(reviewCandidateLimit: number): number {\n  return Math.min(500, Math.max(reviewCandidateLimit, reviewCandidateLimit * 3));\n}\n\nasync function withinDeadline<T>(operation: Promise<T>, timeoutMs: number): Promise<T> {\n  let timer: ReturnType<typeof setTimeout> | undefined;\n  try {\n    return await Promise.race([\n      operation,\n      new Promise<never>((_, reject) => {\n        timer = setTimeout(\n          () => reject(new Error(`Discovery page value ranking exceeded ${timeoutMs}ms`)),\n          timeoutMs,\n        );\n      }),\n    ]);\n  } finally {\n    if (timer) clearTimeout(timer);\n  }\n}\n\nexport type DiscoveryOverviewInput = {\n''',
          )
          replace(
              "apps/admin/src/server/discovery-service.ts",
              '''        try {\n          const ranking = await this.dependencies.pageValueRanker.rank({\n            candidates: screenedCandidates,\n            maxResults: reviewCandidateLimit,\n          });\n''',
              '''        try {\n          const rankingTimeoutMs =\n            this.dependencies.pageValueTimeoutMs ?? discoveryPageValueTimeoutMs();\n          const ranking = await withinDeadline(\n            this.dependencies.pageValueRanker.rank({\n              candidates: screenedCandidates,\n              maxResults: reviewCandidateLimit,\n              timeoutMs: rankingTimeoutMs,\n            }),\n            rankingTimeoutMs,\n          );\n''',
          )

          # Regression: a ranker that never resolves must not block structural discovery.
          replace(
              "apps/admin/src/server/__tests__/discovery-page-value-ranking.test.ts",
              '''import { describe, expect, it } from "vitest";\n''',
              '''import { describe, expect, it, vi } from "vitest";\n''',
          )
          replace(
              "apps/admin/src/server/__tests__/discovery-page-value-ranking.test.ts",
              '''  pageValueRanker: DiscoveryPageValueRanker;\n  onProviderBatch?: (batch: SourceDiscoveryBatch) => void;\n}) {\n''',
              '''  pageValueRanker: DiscoveryPageValueRanker;\n  pageValueTimeoutMs?: number;\n  onProviderBatch?: (batch: SourceDiscoveryBatch) => void;\n}) {\n''',
          )
          replace(
              "apps/admin/src/server/__tests__/discovery-page-value-ranking.test.ts",
              '''    pageValueRanker: input.pageValueRanker,\n    transaction(operation) {\n''',
              '''    pageValueRanker: input.pageValueRanker,\n    pageValueTimeoutMs: input.pageValueTimeoutMs,\n    transaction(operation) {\n''',
          )
          test = Path("apps/admin/src/server/__tests__/discovery-page-value-ranking.test.ts")
          text = test.read_text()
          insert = '''\n  it("enforces a short ranking deadline and falls back when a ranker never settles", async () => {\n    vi.useFakeTimers();\n    try {\n      const candidates = [\n        candidate("cand_first", "first"),\n        candidate("cand_second", "second"),\n        candidate("cand_third", "third"),\n      ];\n      let receivedTimeout: number | undefined;\n      let recordCalled = false;\n      const pageValueRanker: DiscoveryPageValueRanker = {\n        rank(input) {\n          receivedTimeout = input.timeoutMs;\n          return new Promise(() => undefined);\n        },\n        record() {\n          recordCalled = true;\n        },\n      };\n      const { database, discovery, service } = createService({\n        providerCandidates: candidates,\n        pageValueRanker,\n        pageValueTimeoutMs: 50,\n      });\n\n      const pending = service.start({\n        locator: "https://example.com/",\n        maxCandidates: 2,\n        maxFetches: 10,\n      });\n      await vi.advanceTimersByTimeAsync(50);\n      const result = await pending;\n\n      expect(receivedTimeout).toBe(50);\n      expect(result.candidates.map((item) => item.candidateId)).toEqual([\n        "cand_first",\n        "cand_second",\n      ]);\n      expect(discovery.listCandidates({ limit: 100 }).total).toBe(2);\n      expect(recordCalled).toBe(false);\n\n      database.close();\n    } finally {\n      vi.useRealTimers();\n    }\n  });\n'''
          closing = '\n});\n'
          if not text.endswith(closing):
              raise SystemExit("discovery-page-value-ranking.test.ts: unexpected ending")
          test.write_text(text[:-len(closing)] + insert + closing)
      - name: Format changed files
        run: pnpm exec prettier --write apps/admin/src/server/capability-client.ts apps/admin/src/server/discovery-page-value-ranker.ts apps/admin/src/server/discovery-service.ts apps/admin/src/server/__tests__/discovery-page-value-ranking.test.ts
      - name: Targeted checks
        run: |
          pnpm --filter @markorbit/admin test -- discovery-page-value-ranking.test.ts
          pnpm --filter @markorbit/admin typecheck
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/admin/src/server/capability-client.ts apps/admin/src/server/discovery-page-value-ranker.ts apps/admin/src/server/discovery-service.ts apps/admin/src/server/__tests__/discovery-page-value-ranking.test.ts
          git commit -m "Discovery: bound page value ranking latency"
          git push origin HEAD:codex/discovery-page-value-deadline-v1
