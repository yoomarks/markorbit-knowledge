name: Agent Finalize PR12
on:
  push:
    branches: [agent/uspto-production-staging-ready-package]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uspto-production-staging-ready-package
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove fake Core receipt semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/worker-runtime/src/production-markdown-staging.ts')
          s = p.read_text()
          s = s.replace('  coreIntakeReceiptId?: string;\n', '')
          p.write_text(s)
          p = Path('packages/worker-runtime/tests/production-markdown-staging.test.ts')
          s = p.read_text()
          s = s.replace('          coreIntakeReceiptId: "cir_01H00000000000000000000000",\n', '')
          p.write_text(s)
          PY
      - run: >-
          pnpm exec prettier --write
          apps/worker/tests/config.test.ts
          packages/persistence/tests/ready-package-registry.test.ts
          packages/worker-runtime/src/production-markdown-staging.ts
          packages/worker-runtime/tests/production-markdown-staging.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add .
            git commit -m "chore: finalize production conversion increment"
            git push origin HEAD:agent/uspto-production-staging-ready-package
          fi
