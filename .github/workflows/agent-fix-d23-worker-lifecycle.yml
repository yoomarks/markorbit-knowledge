name: Agent Fix D2.3 Worker Lifecycle

on:
  push:
    branches:
      - agent/source-intelligence-before-after-evidence
    paths:
      - .github/workflows/agent-fix-d23-worker-lifecycle.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/source-intelligence-before-after-evidence
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix Worker process-group shutdown
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path("scripts/source-intelligence-evidence-calibration.mjs")
          text = path.read_text()
          old_spawn = '''    stdio: ["ignore", "pipe", "pipe"],\n  });'''
          new_spawn = '''    stdio: ["ignore", "pipe", "pipe"],\n    detached: process.platform !== "win32",\n  });'''
          if old_spawn not in text:
              raise SystemExit("spawn block not found")
          text = text.replace(old_spawn, new_spawn, 1)
          old_stop = '''async function stopWorker(runtime) {\n  if (!runtime || runtime.child.exitCode !== null) return;\n  runtime.child.kill("SIGTERM");\n  await Promise.race([\n    new Promise((resolvePromise) => runtime.child.once("exit", resolvePromise)),\n    new Promise((resolvePromise) => setTimeout(resolvePromise, 5_000)),\n  ]);\n  if (runtime.child.exitCode === null) runtime.child.kill("SIGKILL");\n}'''
          new_stop = '''function signalWorkerTree(child, signal) {\n  if (!child || child.pid === undefined) return;\n  if (process.platform === "win32") {\n    child.kill(signal);\n    return;\n  }\n  try {\n    process.kill(-child.pid, signal);\n  } catch (error) {\n    if (error?.code !== "ESRCH") throw error;\n  }\n}\n\nasync function stopWorker(runtime) {\n  if (!runtime) return;\n  const { child } = runtime;\n  if (child.exitCode === null) {\n    signalWorkerTree(child, "SIGTERM");\n    await Promise.race([\n      new Promise((resolvePromise) => child.once("exit", resolvePromise)),\n      new Promise((resolvePromise) => setTimeout(resolvePromise, 5_000)),\n    ]);\n  }\n  if (child.exitCode === null) {\n    signalWorkerTree(child, "SIGKILL");\n    await Promise.race([\n      new Promise((resolvePromise) => child.once("exit", resolvePromise)),\n      new Promise((resolvePromise) => setTimeout(resolvePromise, 2_000)),\n    ]);\n  }\n  child.stdout?.destroy();\n  child.stderr?.destroy();\n}'''
          if old_stop not in text:
              raise SystemExit("stopWorker block not found")
          text = text.replace(old_stop, new_stop, 1)
          path.write_text(text)
          PY
          pnpm exec prettier --write scripts/source-intelligence-evidence-calibration.mjs
          node --check scripts/source-intelligence-evidence-calibration.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/source-intelligence-evidence-calibration.mjs
          git commit -m "fix: terminate D2.3 calibration Worker process tree"
          git push origin HEAD:agent/source-intelligence-before-after-evidence
