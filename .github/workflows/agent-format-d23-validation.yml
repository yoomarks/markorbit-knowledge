name: Agent Format D2.3 Validation

on:
  push:
    branches:
      - agent/source-intelligence-before-after-evidence
    paths:
      - .github/workflows/agent-format-d23-validation.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/source-intelligence-before-after-evidence
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/validation/SOURCE_INTELLIGENCE_EVIDENCE_CALIBRATION_BASELINE_2026-08-08.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/SOURCE_INTELLIGENCE_EVIDENCE_CALIBRATION_BASELINE_2026-08-08.md
          git commit -m "style: format D2.3 calibration baseline"
          git push origin HEAD:agent/source-intelligence-before-after-evidence
