name: ADK One-Time Format

on:
  push:
    branches:
      - agent/adk-00-01-ai-distilled-acquisition

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adk-00-01-ai-distilled-acquisition
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/contracts/src/ai-distilled-knowledge-v1.ts packages/worker-runtime/src/ai-distilled-knowledge-acquirer.ts packages/worker-runtime/src/ai-distilled-knowledge-acquirer.test.ts
      - name: Commit locked formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/ai-distilled-knowledge-v1.ts packages/worker-runtime/src/ai-distilled-knowledge-acquirer.ts packages/worker-runtime/src/ai-distilled-knowledge-acquirer.test.ts
          git commit -m "style(adk): apply locked Prettier output"
          git push origin HEAD:agent/adk-00-01-ai-distilled-acquisition
