name: M3.3 Semantic Fix

on:
  push:
    branches:
      - feature/m3-3-retrieval-foundation

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'M3.3 apply retrieval consistency fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-3-retrieval-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply bounded retrieval consistency fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/persistence/src/retrieval-index.ts')
          text = path.read_text()
          old = '`${documentId}\\u0000${artifactVersion}\\u0000${ordinal}\\u0000${item.headingPath.join("\\u0000")}\\u0000${item.text}`'
          new = '`${stagingDocumentId}\\u0000${documentId}\\u0000${artifactVersion}\\u0000${ordinal}\\u0000${item.headingPath.join("\\u0000")}\\u0000${item.text}`'
          if old not in text:
              raise SystemExit('chunk identity pattern not found')
          text = text.replace(old, new, 1)
          old = 'text: String(row.text),\n    contentSha256: String(row.content_sha256),'
          new = 'text: String(row.text),\n    contentSha256: String(row.chunk_content_sha256 ?? row.content_sha256),'
          if old not in text:
              raise SystemExit('chunk hash mapping pattern not found')
          text = text.replace(old, new, 1)
          old = 'SELECT c.*, d.*, bm25(retrieval_chunks_fts, 0.0, 0.0, 0.0, 7.0, 4.0, 1.0) AS rank,'
          new = 'SELECT c.*, d.*, c.content_sha256 AS chunk_content_sha256,\n          bm25(retrieval_chunks_fts, 0.0, 0.0, 0.0, 7.0, 4.0, 1.0) AS rank,'
          if old not in text:
              raise SystemExit('search projection pattern not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          pnpm exec prettier --write packages/persistence/src/retrieval-index.ts
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/retrieval-index.ts
          git commit -m "M3.3 apply retrieval consistency fixes"
          git push
