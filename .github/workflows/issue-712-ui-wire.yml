name: Issue 712 UI wire

on:
  push:
    branches: [issue-712-workspace-aware-knowledge]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-712-workspace-aware-knowledge
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire UI navigation
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, -1 if count is None else count))

          section = "apps/admin/src/app/[section]/page.tsx"
          replace(
              section,
              'import { KnowledgeBrowser } from "@/components/knowledge/knowledge-browser";\n',
              'import { KnowledgeWorkspaceBoundary } from "@/components/knowledge/knowledge-workspace";\nimport {\n  KnowledgeBrowseSurface,\n  KnowledgeSearchEntryLink,\n} from "@/components/knowledge/knowledge-workspace-surfaces";\n',
          )
          replace(
              section,
              '''function KnowledgePage() {
            return (
              <>
                <CorePageHeading page="knowledge" />
                <div className="mb-4 flex justify-end">
                  <Link
                    href="/knowledge/search"
                    className="inline-flex items-center rounded-xl border border-slate-300 px-3.5 py-2 text-xs font-semibold text-slate-700 transition hover:border-emerald-300 hover:text-emerald-800"
                  >
                    混合搜索 / Hybrid Search
                  </Link>
                </div>
                <KnowledgeBrowser workspaceId={DEFAULT_WORKSPACE.id} />
              </>
            );
          }
          ''',
              '''function KnowledgePage() {
            return (
              <>
                <CorePageHeading page="knowledge" />
                <KnowledgeWorkspaceBoundary>
                  <div className="mb-4 flex justify-end">
                    <KnowledgeSearchEntryLink />
                  </div>
                  <KnowledgeBrowseSurface />
                </KnowledgeWorkspaceBoundary>
              </>
            );
          }
          ''',
          )

          search = "apps/admin/src/components/knowledge/knowledge-hybrid-search-v2.tsx"
          replace(
              search,
              'import { useAdminI18n } from "@/lib/i18n";\n',
              'import { useAdminI18n } from "@/lib/i18n";\nimport { knowledgeWorkspaceHref } from "@/lib/knowledge-workspace-model";\n',
          )
          replace(
              search,
              'href={`/knowledge/${encodeURIComponent(item.id)}`}',
              'href={knowledgeWorkspaceHref(`/knowledge/${encodeURIComponent(item.id)}`, workspaceId)}',
          )
          replace(
              search,
              'href={`/knowledge/${encodeURIComponent(item.id)}#knowledge-graph`}',
              'href={knowledgeWorkspaceHref(`/knowledge/${encodeURIComponent(item.id)}#knowledge-graph`, workspaceId)}',
          )

          reader = "apps/admin/src/components/knowledge/content-reader.tsx"
          replace(
              reader,
              'import { useAdminI18n } from "@/lib/i18n";\n',
              'import { useAdminI18n } from "@/lib/i18n";\nimport { knowledgeWorkspaceHref } from "@/lib/knowledge-workspace-model";\n',
          )
          replace(
              reader,
              'href="/knowledge"',
              'href={knowledgeWorkspaceHref("/knowledge", workspaceId)}',
          )
      - name: Format workspace changes
        run: >-
          pnpm exec prettier --write
          'apps/admin/src/app/[section]/page.tsx'
          apps/admin/src/app/knowledge/search/page.tsx
          'apps/admin/src/app/knowledge/[id]/page.tsx'
          apps/admin/src/app/api/knowledge/route.ts
          'apps/admin/src/app/api/knowledge/[id]/route.ts'
          'apps/admin/src/app/api/knowledge/[id]/change-review/route.ts'
          'apps/admin/src/app/api/knowledge/[id]/graph/route.ts'
          'apps/admin/src/app/api/knowledge/[id]/relationships/route.ts'
          apps/admin/src/server/knowledge-search-route.ts
          apps/admin/src/components/knowledge/content-reader.tsx
          apps/admin/src/components/knowledge/knowledge-hybrid-search-v2.tsx
          apps/admin/src/components/knowledge/knowledge-workspace.tsx
          apps/admin/src/components/knowledge/knowledge-workspace-surfaces.tsx
          apps/admin/src/lib/knowledge-workspace-model.ts
          apps/admin/src/lib/knowledge-workspace-model.test.ts
          apps/admin/src/server/knowledge-workspace-access.ts
          apps/admin/src/server/knowledge-workspace-access.test.ts
      - name: Commit and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue-712-ui-wire.yml
          git add apps/admin/src
          git commit -m "feat(admin): complete workspace-aware Knowledge navigation"
          git push origin HEAD:issue-712-workspace-aware-knowledge
