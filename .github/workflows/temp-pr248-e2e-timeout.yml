name: Temporary PR248 E2E Timeout

on:
  push:
    branches:
      - agent/priority-120-trademark-jurisdictions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/priority-120-trademark-jurisdictions
      - name: Set explicit timeout on heavy 100-site E2E
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/admin/src/server/__tests__/discovery-bulk-source-pipeline.e2e.test.ts')
          text = path.read_text()
          old = '    database.close();\n  });\n});\n'
          new = '    database.close();\n  }, 15_000);\n});\n'
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('expected E2E test ending not found')
          path.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/__tests__/discovery-bulk-source-pipeline.e2e.test.ts
          git commit -m "test: allow time for 100-site bulk source E2E"
          git push origin HEAD:agent/priority-120-trademark-jurisdictions
