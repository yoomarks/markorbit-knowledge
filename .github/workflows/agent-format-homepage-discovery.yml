name: Agent Format Homepage Discovery

on:
  push:
    branches:
      - agent/homepage-discovery-mvp

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/homepage-discovery-mvp
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          packages/contracts/src/source-discovery-v1.ts
          packages/integration-tests/tests/http-website-discovery.test.ts
          packages/worker-runtime/src/http-website-discovery-provider.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/source-discovery-v1.ts packages/integration-tests/tests/http-website-discovery.test.ts packages/worker-runtime/src/http-website-discovery-provider.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format homepage discovery"
          git push origin HEAD:agent/homepage-discovery-mvp
