name: Temp Core KV2 Format

on:
  push:
    branches:
      - docs/core-kv2-cross-repo-freeze

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/core-kv2-cross-repo-freeze
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write NEXT_TASKS.md docs/tasks/MarkOrbit_Core_Knowledge_Formal_Integration_Task_2026-08-23.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add NEXT_TASKS.md docs/tasks/MarkOrbit_Core_Knowledge_Formal_Integration_Task_2026-08-23.md
          git commit -m "style: format Core KV2 docs"
          git push origin HEAD:docs/core-kv2-cross-repo-freeze
