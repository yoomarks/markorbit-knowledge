name: D2.9 Formatter

on:
  push:
    branches:
      - codex/d2-9-observation-review-queue
    paths:
      - .github/workflows/d2-9-formatter.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d2-9-observation-review-queue
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format D2.9 files
        run: |
          pnpm exec prettier --write \
            apps/admin/src/components/sources/source-intelligence-review-queue.tsx \
            apps/admin/src/server/source-intelligence-review-service.ts \
            packages/contracts/src/source-intelligence-review-queue-v2.ts \
            packages/persistence/src/source-intelligence-review-registry.ts \
            packages/persistence/tests/source-intelligence-review-registry.test.ts \
            packages/worker-runtime/tests/source-intelligence-review-queue.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/src/components/sources/source-intelligence-review-queue.tsx \
            apps/admin/src/server/source-intelligence-review-service.ts \
            packages/contracts/src/source-intelligence-review-queue-v2.ts \
            packages/persistence/src/source-intelligence-review-registry.ts \
            packages/persistence/tests/source-intelligence-review-registry.test.ts \
            packages/worker-runtime/tests/source-intelligence-review-queue.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: format D2.9 review queue"
          git push origin HEAD:codex/d2-9-observation-review-queue
