name: Temporary Source coverage pagination verification

on:
  push:
    branches:
      - codex/source-coverage-pagination-v1

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/admin/src/server/source-pagination.ts apps/admin/src/server/source-coverage-service.ts apps/admin/src/app/api/source-coverage/route.ts apps/admin/src/server/__tests__/source-pagination.test.ts
      - run: pnpm --filter @markorbit/admin exec vitest run src/server/__tests__/source-pagination.test.ts
      - run: pnpm typecheck
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/source-pagination.ts apps/admin/src/server/source-coverage-service.ts apps/admin/src/app/api/source-coverage/route.ts apps/admin/src/server/__tests__/source-pagination.test.ts
          git commit -m "chore: format Source coverage pagination" || true
          git push
