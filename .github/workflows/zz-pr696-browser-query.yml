name: PR696 browser query fixer

on:
  push:
    branches: [issue-696-knowledge-browser-query]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply PR696 product patch
        run: python scripts/zz-pr696-browser-query.py
      - name: Format touched files
        run: >-
          pnpm exec prettier --write
          packages/persistence/src/knowledge-browser-query.ts
          packages/persistence/src/knowledge-browser-query.test.ts
          packages/persistence/package.json
          apps/admin/src/app/api/knowledge/route.ts
      - name: Validate focused surface
        run: |
          pnpm --filter @markorbit/persistence typecheck
          pnpm --filter @markorbit/persistence test -- knowledge-browser-query.test.ts
          pnpm --filter @markorbit/admin typecheck
      - name: Commit product changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/knowledge-browser-query.ts packages/persistence/src/knowledge-browser-query.test.ts packages/persistence/package.json apps/admin/src/app/api/knowledge/route.ts
          git commit -m "fix: make Knowledge Browser corpus-complete"
          git push origin HEAD:issue-696-knowledge-browser-query
