name: Issue 712 workspace patch

on:
  push:
    branches:
      - issue-712-workspace-aware-knowledge

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-712-workspace-aware-knowledge
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire workspace-aware Knowledge navigation
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          replace(
              "apps/admin/src/app/knowledge/search/page.tsx",
              '''import { DEFAULT_WORKSPACE } from "@markorbit/persistence";
          import { AdminShell } from "@/components/admin-shell";
          import { KnowledgeHybridSearch } from "@/components/knowledge/knowledge-hybrid-search";

          export const dynamic = "force-dynamic";

          export default function KnowledgeHybridSearchPage() {
            return (
              <AdminShell>
                <KnowledgeHybridSearch workspaceId={DEFAULT_WORKSPACE.id} />
              </AdminShell>
            );
          }
          ''',
              '''import { AdminShell } from "@/components/admin-shell";
          import { KnowledgeWorkspaceBoundary } from "@/components/knowledge/knowledge-workspace";
          import { KnowledgeSearchSurface } from "@/components/knowledge/knowledge-workspace-surfaces";

          export const dynamic = "force-dynamic";

          export default function KnowledgeHybridSearchPage() {
            return (
              <AdminShell>
                <KnowledgeWorkspaceBoundary>
                  <KnowledgeSearchSurface />
                </KnowledgeWorkspaceBoundary>
              </AdminShell>
            );
          }
          ''',
          )

          replace(
              "apps/admin/src/app/knowledge/[id]/page.tsx",
              '''import { DEFAULT_WORKSPACE } from "@markorbit/persistence";
          import { AdminShell } from "@/components/admin-shell";
          import { ContentLocalGraph } from "@/components/knowledge/content-local-graph";
          import { ContentReader } from "@/components/knowledge/content-reader";
          import { ContentRelationshipPanel } from "@/components/knowledge/content-relationship-panel";
          import { EvidenceChangeReview } from "@/components/knowledge/evidence-change-review";
          import { EvidenceInspector } from "@/components/knowledge/evidence-inspector";

          export const dynamic = "force-dynamic";

          export default async function KnowledgeContentReaderPage({
            params,
          }: {
            params: Promise<{ id: string }>;
          }) {
            const { id } = await params;
            return (
              <AdminShell>
                <div className="space-y-5">
                  <EvidenceInspector />
                  <ContentReader documentId={id} workspaceId={DEFAULT_WORKSPACE.id} />
                  <EvidenceChangeReview documentId={id} workspaceId={DEFAULT_WORKSPACE.id} />
                  <section id="inspector-relations" className="space-y-5 scroll-mt-5">
                    <ContentRelationshipPanel documentId={id} workspaceId={DEFAULT_WORKSPACE.id} />
                    <div id="knowledge-graph">
                      <ContentLocalGraph documentId={id} workspaceId={DEFAULT_WORKSPACE.id} />
                    </div>
                  </section>
                </div>
              </AdminShell>
            );
          }
          ''',
              '''import { AdminShell } from "@/components/admin-shell";
          import { KnowledgeWorkspaceBoundary } from "@/components/knowledge/knowledge-workspace";
          import { KnowledgeReaderSurface } from "@/components/knowledge/knowledge-workspace-surfaces";

          export const dynamic = "force-dynamic";

          export default async function KnowledgeContentReaderPage({
            params,
          }: {
            params: Promise<{ id: string }>;
          }) {
            const { id } = await params;
            return (
              <AdminShell>
                <KnowledgeWorkspaceBoundary>
                  <KnowledgeReaderSurface documentId={id} />
                </KnowledgeWorkspaceBoundary>
              </AdminShell>
            );
          }
          ''',
          )

          section = "apps/admin/src/app/[section]/page.tsx"
          replace(
              section,
              'import { KnowledgeBrowser } from "@/components/knowledge/knowledge-browser";\n',
              'import { KnowledgeWorkspaceBoundary } from "@/components/knowledge/knowledge-workspace";\nimport {\n  KnowledgeBrowseSurface,\n  KnowledgeSearchEntryLink,\n} from "@/components/knowledge/knowledge-workspace-surfaces";\n',
          )
          replace(
              section,
              '''function KnowledgePage() {
            return (
              <>
                <CorePageHeading page="knowledge" />
                <div className="mb-4 flex justify-end">
                  <Link
                    href="/knowledge/search"
                    className="inline-flex items-center rounded-xl border border-slate-300 px-3.5 py-2 text-xs font-semibold text-slate-700 transition hover:border-emerald-300 hover:text-emerald-800"
                  >
                    混合搜索 / Hybrid Search
                  </Link>
                </div>
                <KnowledgeBrowser workspaceId={DEFAULT_WORKSPACE.id} />
              </>
            );
          }
          ''',
              '''function KnowledgePage() {
            return (
              <>
                <CorePageHeading page="knowledge" />
                <KnowledgeWorkspaceBoundary>
                  <div className="mb-4 flex justify-end">
                    <KnowledgeSearchEntryLink />
                  </div>
                  <KnowledgeBrowseSurface />
                </KnowledgeWorkspaceBoundary>
              </>
            );
          }
          ''',
          )

          replace(
              "apps/admin/src/app/api/knowledge/route.ts",
              'import { DEFAULT_WORKSPACE, RegistryValidationError } from "@markorbit/persistence";\n',
              'import { RegistryValidationError } from "@markorbit/persistence";\n',
          )
          replace(
              "apps/admin/src/app/api/knowledge/route.ts",
              'import { resolveAdminBrowserApiReadAccess } from "@/server/admin-browser-api-access";\n',
              'import { resolveKnowledgeWorkspaceReadAccess } from "@/server/knowledge-workspace-access";\n',
          )
          replace(
              "apps/admin/src/app/api/knowledge/route.ts",
              '''    const assertedWorkspaceId = url.searchParams.get("workspaceId")?.trim() || DEFAULT_WORKSPACE.id;
              const { workspaceId } = await resolveAdminBrowserApiReadAccess(request, assertedWorkspaceId);
          ''',
              '''    const { workspaceId } = await resolveKnowledgeWorkspaceReadAccess(request);
          ''',
          )

          for path in [
              "apps/admin/src/app/api/knowledge/[id]/route.ts",
              "apps/admin/src/app/api/knowledge/[id]/graph/route.ts",
              "apps/admin/src/app/api/knowledge/[id]/relationships/route.ts",
          ]:
              replace(path, 'import { DEFAULT_WORKSPACE, RegistryError } from "@markorbit/persistence";\n', 'import { RegistryError } from "@markorbit/persistence";\n')
              replace(path, 'import { resolveAdminBrowserApiReadAccess } from "@/server/admin-browser-api-access";\n', 'import { resolveKnowledgeWorkspaceReadAccess } from "@/server/knowledge-workspace-access";\n')
              replace(
                  path,
                  '''    const assertedWorkspaceId =
              new URL(request.url).searchParams.get("workspaceId")?.trim() || DEFAULT_WORKSPACE.id;
            const { workspaceId } = await resolveAdminBrowserApiReadAccess(request, assertedWorkspaceId);
          ''',
                  '''    const { workspaceId } = await resolveKnowledgeWorkspaceReadAccess(request);
          ''',
              )

          for path in [
              "apps/admin/src/app/api/knowledge/[id]/graph/route.ts",
              "apps/admin/src/app/api/knowledge/[id]/relationships/route.ts",
          ]:
              replace(
                  path,
                  'import { resolveKnowledgeWorkspaceReadAccess } from "@/server/knowledge-workspace-access";\n',
                  'import { knowledgeWorkspaceHref } from "@/lib/knowledge-workspace-model";\nimport { resolveKnowledgeWorkspaceReadAccess } from "@/server/knowledge-workspace-access";\n',
              )
              replace(
                  path,
                  '''        ...(workspaceId === DEFAULT_WORKSPACE.id
                    ? { readerHref: `/knowledge/${encodeURIComponent(neighbor.objectId)}` }
                    : {}),
          ''',
                  '''        readerHref: knowledgeWorkspaceHref(
                  `/knowledge/${encodeURIComponent(neighbor.objectId)}`,
                  workspaceId,
                ),
          ''',
              )

          path = "apps/admin/src/app/api/knowledge/[id]/change-review/route.ts"
          replace(path, 'import { resolveAdminBrowserApiReadAccess } from "@/server/admin-browser-api-access";\n', 'import { resolveKnowledgeWorkspaceReadAccess } from "@/server/knowledge-workspace-access";\n')
          replace(
              path,
              '''    const search = new URL(request.url).searchParams;
            const assertedWorkspaceId = search.get("workspaceId")?.trim();
            if (!assertedWorkspaceId) {
              throw new RegistryError(
                "KNOWLEDGE_CHANGE_REVIEW_WORKSPACE_REQUIRED",
                "workspaceId query parameter is required",
              );
            }
            const { workspaceId } = await resolveAdminBrowserApiReadAccess(request, assertedWorkspaceId);
          ''',
              '''    const { workspaceId } = await resolveKnowledgeWorkspaceReadAccess(request);
          ''',
          )

          path = "apps/admin/src/server/knowledge-search-route.ts"
          replace(path, 'import { resolveAdminBrowserApiReadAccess } from "@/server/admin-browser-api-access";\n', 'import { resolveKnowledgeWorkspaceReadAccess } from "@/server/knowledge-workspace-access";\n')
          replace(
              path,
              '''    const assertedWorkspaceId = url.searchParams.get("workspaceId")?.trim() || undefined;
            const { workspaceId } = await resolveAdminBrowserApiReadAccess(request, assertedWorkspaceId);
          ''',
              '''    const { workspaceId } = await resolveKnowledgeWorkspaceReadAccess(request);
          ''',
          )

          path = "apps/admin/src/components/knowledge/knowledge-hybrid-search-v2.tsx"
          replace(
              path,
              'import { useAdminI18n } from "@/lib/i18n";\n',
              'import { useAdminI18n } from "@/lib/i18n";\nimport { knowledgeWorkspaceHref } from "@/lib/knowledge-workspace-model";\n',
          )
          replace(
              path,
              'href={`/knowledge/${encodeURIComponent(item.id)}`}',
              'href={knowledgeWorkspaceHref(`/knowledge/${encodeURIComponent(item.id)}`, workspaceId)}',
          )
          replace(
              path,
              'href={`/knowledge/${encodeURIComponent(item.id)}#knowledge-graph`}',
              'href={knowledgeWorkspaceHref(\n                          `/knowledge/${encodeURIComponent(item.id)}#knowledge-graph`,\n                          workspaceId,\n                        )}',
          )

          path = "apps/admin/src/components/knowledge/content-reader.tsx"
          replace(
              path,
              'import { useAdminI18n } from "@/lib/i18n";\n',
              'import { useAdminI18n } from "@/lib/i18n";\nimport { knowledgeWorkspaceHref } from "@/lib/knowledge-workspace-model";\n',
          )
          replace(
              path,
              'href="/knowledge"',
              'href={knowledgeWorkspaceHref("/knowledge", workspaceId)}',
          )
      - name: Format touched files
        run: >-
          pnpm exec prettier --write
          apps/admin/src/app/knowledge/search/page.tsx
          'apps/admin/src/app/knowledge/[id]/page.tsx'
          'apps/admin/src/app/[section]/page.tsx'
          apps/admin/src/app/api/knowledge/route.ts
          'apps/admin/src/app/api/knowledge/[id]/route.ts'
          'apps/admin/src/app/api/knowledge/[id]/change-review/route.ts'
          'apps/admin/src/app/api/knowledge/[id]/graph/route.ts'
          'apps/admin/src/app/api/knowledge/[id]/relationships/route.ts'
          apps/admin/src/server/knowledge-search-route.ts
          apps/admin/src/components/knowledge/knowledge-hybrid-search-v2.tsx
          apps/admin/src/components/knowledge/content-reader.tsx
          apps/admin/src/components/knowledge/knowledge-workspace.tsx
          apps/admin/src/components/knowledge/knowledge-workspace-surfaces.tsx
          apps/admin/src/lib/knowledge-workspace-model.ts
          apps/admin/src/lib/knowledge-workspace-model.test.ts
          apps/admin/src/server/knowledge-workspace-access.ts
          apps/admin/src/server/knowledge-workspace-access.test.ts
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue-712-workspace-patch.yml
          git add apps/admin/src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(admin): wire authenticated Knowledge workspace navigation"
          git push origin HEAD:issue-712-workspace-aware-knowledge
