name: Agent R1-K12 Format

on:
  push:
    branches:
      - r1-k12-canonical-downstream-document

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r1-k12-canonical-downstream-document
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format K12 files
        run: |
          pnpm exec prettier --write \
            packages/contracts/src/canonical-downstream-document-v1.ts \
            packages/contracts/src/index.ts \
            packages/persistence/package.json \
            packages/persistence/src/canonical-downstream-document.ts \
            packages/persistence/src/canonical-downstream-document.test.ts \
            apps/admin/src/server/canonical-downstream-promotion-service.ts \
            apps/admin/src/server/__tests__/canonical-downstream-promotion-service.test.ts \
            'apps/admin/src/app/api/workspaces/[id]/canonical-downstream-documents/route.ts' \
            apps/admin/src/components/vault/canonical-downstream-promotion-control.tsx \
            apps/admin/src/components/vault/vault-workbench.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m 'chore(r1-k12): format canonical downstream promotion'
          git push origin HEAD:r1-k12-canonical-downstream-document
