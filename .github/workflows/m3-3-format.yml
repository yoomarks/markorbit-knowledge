name: M3.3 Format

on:
  push:
    branches:
      - feature/m3-3-retrieval-foundation

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'M3.3 apply prettier') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-3-retrieval-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/admin/src/app/api/retrieval/documents/[id]/route.ts
          packages/persistence/src/retrieval-index.ts
          packages/persistence/tests/retrieval-index.test.ts
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/src/app/api/retrieval/documents/[id]/route.ts \
            packages/persistence/src/retrieval-index.ts \
            packages/persistence/tests/retrieval-index.test.ts
          git commit -m "M3.3 apply prettier"
          git push
