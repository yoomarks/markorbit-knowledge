name: PR700 Browser Acceptance Format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr700-browser-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.number == 700 && github.head_ref == 'issue-697-admin-browser-acceptance'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format PR700 browser acceptance files
        run: |
          pnpm exec prettier --write \
            apps/admin/src/components/admin-shell.tsx \
            apps/admin/src/components/knowledge/knowledge-browser.tsx \
            apps/admin/src/lib/use-modal-dialog.ts \
            apps/worker/src/run-admin-browser-acceptance.ts \
            apps/worker/src/run-admin-browser-acceptance-edge.ts \
            .github/workflows/admin-browser-acceptance.yml \
            .github/workflows/zz-pr700-browser-format.yml
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/src/components/admin-shell.tsx \
            apps/admin/src/components/knowledge/knowledge-browser.tsx \
            apps/admin/src/lib/use-modal-dialog.ts \
            apps/worker/src/run-admin-browser-acceptance.ts \
            apps/worker/src/run-admin-browser-acceptance-edge.ts \
            .github/workflows/admin-browser-acceptance.yml \
            .github/workflows/zz-pr700-browser-format.yml
          git commit -m "style: format PR700 browser acceptance"
          git push origin HEAD:${{ github.head_ref }}
