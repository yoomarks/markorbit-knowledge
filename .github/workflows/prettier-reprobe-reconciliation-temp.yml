name: Temporary Reprobe Reconciliation Prettier

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prettier:
    if: github.head_ref == 'agent/reprobe-observation-reconciliation-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write \
            apps/admin/src/app/api/worker/v1/source-compatibility-observations/route.ts \
            apps/admin/src/server/__tests__/source-compatibility-reprobe-binding.test.ts \
            packages/persistence/src/source-compatibility-reprobe-reconciliation.test.ts
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/src/app/api/worker/v1/source-compatibility-observations/route.ts \
            apps/admin/src/server/__tests__/source-compatibility-reprobe-binding.test.ts \
            packages/persistence/src/source-compatibility-reprobe-reconciliation.test.ts
          git commit -m "style: format reprobe reconciliation changes"
          git push origin HEAD:${{ github.head_ref }}
