name: Provider Format Fix

on:
  push:
    branches:
      - feat/web-provider-routing
    paths:
      - ".github/workflows/provider-format-fix.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-provider-routing
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format provider files
        run: >-
          pnpm exec prettier --write
          apps/worker/src/config.ts
          packages/worker-runtime/src/bright-data-fallback-acquirer.test.ts
          packages/worker-runtime/src/bright-data-fallback-acquirer.ts
          packages/worker-runtime/src/tavily-website-discovery-provider.test.ts
          packages/worker-runtime/src/tavily-website-discovery-provider.ts
      - name: Remove one-off formatter and commit
        shell: bash
        run: |
          rm .github/workflows/provider-format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/config.ts \
            packages/worker-runtime/src/bright-data-fallback-acquirer.test.ts \
            packages/worker-runtime/src/bright-data-fallback-acquirer.ts \
            packages/worker-runtime/src/tavily-website-discovery-provider.test.ts \
            packages/worker-runtime/src/tavily-website-discovery-provider.ts \
            .github/workflows/provider-format-fix.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format web provider routing"
          git push origin HEAD:feat/web-provider-routing
