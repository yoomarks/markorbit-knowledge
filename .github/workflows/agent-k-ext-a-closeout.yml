name: Agent K-EXT-A Closeout

on:
  push:
    branches:
      - codex/k-ext-a-manual-upload

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/k-ext-a-manual-upload
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile README status
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()

          anchor = "- immutable RawArtifact ingestion, SHA-256 verification and local content-addressed storage;\n"
          bullet = "- governed Workspace-scoped Manual Upload with bounded media/size policy, exact SHA-256 identity, targeted Job leases, idempotent replay, immutable RawArtifact provenance and Admin UI;\n"
          if bullet not in text:
              if anchor not in text:
                  raise SystemExit("README RawArtifact anchor not found")
              text = text.replace(anchor, anchor + bullet, 1)

          text = text.replace(
              "Production web acquisition now exists for bounded HTML/Markdown collection.",
              "Production web acquisition and governed Workspace-scoped Manual Upload now exist for bounded acquisition.",
              1,
          )
          text = text.replace(
              "Arbitrary PDF/attachment acquisition, converter execution, automatic scheduling, a verified/implemented Core ReadyPackage V2 receiver,",
              "Local Folder ingestion, automatic scheduling, a verified/implemented Core ReadyPackage V2 receiver,",
              1,
          )

          docs_anchor = "- [Artifact Ingestion Protocol v1](docs/architecture/ARTIFACT_INGESTION_PROTOCOL_V1.md)\n"
          docs_link = "- [Manual Upload Ingestion V1](docs/architecture/MANUAL_UPLOAD_INGESTION_V1.md)\n"
          if docs_link not in text:
              if docs_anchor not in text:
                  raise SystemExit("README documentation anchor not found")
              text = text.replace(docs_anchor, docs_anchor + docs_link, 1)

          path.write_text(text)
          PY
      - run: pnpm format
      - name: Commit closeout changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/architecture/MANUAL_UPLOAD_INGESTION_V1.md apps/admin/src/server/__tests__/manual-upload-ingestion.test.ts apps/admin/src/components/artifacts/manual-upload-control.tsx apps/admin/src/app/api/manual-uploads/route.ts apps/admin/src/server/manual-upload-ingestion.ts packages/persistence/src/targeted-worker-claim.ts packages/persistence/package.json apps/admin/src/app/'[section]'/page.tsx
          git commit -m "docs: close out K-EXT-A Manual Upload"
          git push origin HEAD:codex/k-ext-a-manual-upload
