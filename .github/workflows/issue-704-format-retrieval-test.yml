name: Issue 704 Format Retrieval Test

on:
  push:
    branches:
      - issue-hybrid-search-completeness
    paths:
      - .github/workflows/issue-704-format-retrieval-test.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-hybrid-search-completeness
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact regression file
        run: pnpm exec prettier --write packages/persistence/tests/retrieval-index.test.ts
      - name: Commit formatted result and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/issue-704-format-retrieval-test.yml
          git config user.name "markorbit-automation"
          git config user.email "actions@users.noreply.github.com"
          git add packages/persistence/tests/retrieval-index.test.ts .github/workflows/issue-704-format-retrieval-test.yml
          git commit -m "style: format #704 retrieval regression test"
          git push origin HEAD:issue-hybrid-search-completeness
