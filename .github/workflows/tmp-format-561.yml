name: Temporary Source Intelligence 561 Formatter

on:
  push:
    branches:
      - source-intelligence/561-recurring-regression
    paths:
      - .github/workflows/tmp-format-561.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-intelligence/561-recurring-regression
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Source Intelligence Phase 2 files
        run: >-
          pnpm exec prettier --write
          apps/admin/src/server/acquisition-recurring-regression.ts
          apps/admin/src/server/acquisition-recurring-regression.test.ts
          scripts/acquisition-recurring-regression-canary.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/acquisition-recurring-regression.ts apps/admin/src/server/acquisition-recurring-regression.test.ts scripts/acquisition-recurring-regression-canary.ts
          git commit -m "style: format source intelligence recurring regression"
          git push origin HEAD:source-intelligence/561-recurring-regression
