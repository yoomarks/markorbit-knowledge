name: Agent Fix Source Graph Provenance Fixture

on:
  push:
    branches:
      - agent/source-graph-persistence-migration

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/source-graph-persistence-migration
      - name: Make fixture provenance source-scoped
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/persistence/tests/source-graph-registry.test.ts')
          text = path.read_text()
          text = text.replace(
              'function provenance(sourceUri: string, observedAt = T0) {\n  return {\n    kind: "DISCOVERY" as const,\n    sourceId: SOURCE_ID,',
              'function provenance(sourceUri: string, observedAt = T0, sourceId = SOURCE_ID) {\n  return {\n    kind: "DISCOVERY" as const,\n    sourceId,',
              1,
          )
          text = text.replace(
              'provenance: [provenance("https://example.com/")],',
              'provenance: [provenance("https://example.com/", T0, sourceId)],',
              1,
          )
          path.write_text(text)
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-fix-source-graph-provenance.yml
          git add packages/persistence/tests/source-graph-registry.test.ts
          git commit -m "test: keep source graph provenance source-scoped"
          git push origin HEAD:agent/source-graph-persistence-migration
