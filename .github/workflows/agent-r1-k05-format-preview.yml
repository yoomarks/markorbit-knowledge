name: Agent R1-K05 Format Apply

on:
  push:
    branches:
      - r1-k05-content-delivery-workbench

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r1-k05-content-delivery-workbench
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier
        run: |
          pnpm exec prettier --write apps/admin/src/components/ready-packages/ready-package-delivery-workbench.test.ts apps/admin/src/components/ready-packages/ready-package-delivery-workbench.tsx
          if git diff --quiet -- apps/admin/src/components/ready-packages/ready-package-delivery-workbench.test.ts apps/admin/src/components/ready-packages/ready-package-delivery-workbench.tsx; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/admin/src/components/ready-packages/ready-package-delivery-workbench.test.ts apps/admin/src/components/ready-packages/ready-package-delivery-workbench.tsx
          git commit -m "chore(r1-k05): format content delivery workbench"
          git push origin HEAD:r1-k05-content-delivery-workbench
