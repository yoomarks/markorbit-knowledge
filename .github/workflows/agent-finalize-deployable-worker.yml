name: Agent Finalize Deployable Worker

on:
  push:
    branches:
      - agent/deployable-crawl4ai-worker-uspto

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deployable-crawl4ai-worker-uspto
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Update workspace lockfile
        run: pnpm install --lockfile-only
      - name: Install exact workspace
        run: pnpm install --frozen-lockfile
      - name: Format Worker changes
        run: >-
          pnpm exec prettier --write
          apps/worker
          packages/worker-runtime/src/controlled-collection-worker-runtime.ts
          packages/worker-runtime/src/http-controlled-collection-client.ts
          packages/worker-runtime/tests/controlled-collection-worker-runtime.test.ts
          README.md
          docs/operations/CRAWL4AI_WORKER_DEPLOYMENT.md
          deploy/crawl4ai-worker/compose.example.yml
      - name: Typecheck Worker packages
        run: |
          pnpm --filter @markorbit/worker typecheck
          pnpm --filter @markorbit/worker-runtime typecheck
      - name: Test Worker packages
        run: |
          pnpm --filter @markorbit/worker test
          pnpm --filter @markorbit/worker-runtime test
      - name: Commit generated lockfile and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/worker packages/worker-runtime/src/controlled-collection-worker-runtime.ts packages/worker-runtime/src/http-controlled-collection-client.ts packages/worker-runtime/tests/controlled-collection-worker-runtime.test.ts README.md docs/operations/CRAWL4AI_WORKER_DEPLOYMENT.md deploy/crawl4ai-worker/compose.example.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: finalize deployable Crawl4AI Worker"
          git push origin HEAD:agent/deployable-crawl4ai-worker-uspto
