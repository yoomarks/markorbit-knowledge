name: CNIPA Phase 3 Format

on:
  push:
    branches:
      - feat/cnipa-live-acceptance-harness

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cnipa-live-acceptance-harness
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format CNIPA Phase 3 files and remove helper workflow
        shell: bash
        run: |
          pnpm exec prettier --write \
            apps/worker/src/cnipa-live-acceptance.ts \
            apps/worker/src/cnipa-live-acceptance.test.ts \
            apps/worker/src/run-cnipa-live-acceptance.ts
          rm .github/workflows/cnipa-phase3-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/cnipa-live-acceptance.ts \
            apps/worker/src/cnipa-live-acceptance.test.ts \
            apps/worker/src/run-cnipa-live-acceptance.ts \
            .github/workflows/cnipa-phase3-format.yml
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "chore: format CNIPA Phase 3 harness"
          git push origin HEAD:feat/cnipa-live-acceptance-harness
