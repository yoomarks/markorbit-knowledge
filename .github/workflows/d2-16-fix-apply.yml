name: D2.16 Repair Apply

on:
  push:
    branches:
      - codex/d2-16-audit-query-export
    paths:
      - .github/workflows/d2-16-fix-apply.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d2-16-audit-query-export
      - name: Repair page description anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/d2-16-apply.yml')
          text = path.read_text()
          old = 'description="先用 D2.15 Policy Audit & Change History 查看人工 policy 变更，再用 D2.14 Policy Scope & Cohorts 显式定义不同 Source 的 workflow policy；D2.13 继续计算 Manual SLA 与人工升级，后续面板提供运营与证据上下文，所有状态都不构成自动执行授权。"'
          new = 'description="先用 D2.15 Policy Audit 追溯人工策略变化，再用 D2.14 显式定义 Source policy scope，并由 D2.13 计算 Manual SLA 与人工升级；D2.12、D2.11、D2.10、D2.9 与双轴详情继续提供运营与证据上下文，所有状态都不构成自动执行授权。"'
          if old not in text:
              raise SystemExit('old anchor not found in temporary workflow')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/d2-16-apply.yml
          git commit -m "chore: repair D2.16 patch anchor"
          git push origin HEAD:codex/d2-16-audit-query-export
