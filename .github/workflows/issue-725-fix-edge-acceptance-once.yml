name: Issue 725 Fix Edge Acceptance Once

on:
  push:
    branches: [issue-725-evidence-workspace]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-725-evidence-workspace
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate edge evidence path to canonical Inspector
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/worker/src/run-admin-browser-acceptance-edge.ts')
          text = path.read_text()
          old = '''      await page.getByRole("button", { name: /View document|查看资料/ }).click();
          const dialog = page.getByRole("dialog");
          await dialog.waitFor();
          const originalEvidence = dialog.getByRole("link", {
            name: /Open original file|打开原始文件/,
          });
          assert.equal(
            await originalEvidence.getAttribute("href"),
            `/api/artifacts/${ARTIFACT_ID}/content`,
            "Original evidence link must target the canonical authenticated content route",
          );
          const downloadPromise = page.waitForEvent("download");
          await originalEvidence.click();
          const download = await downloadPromise;
          assert.equal(
            download.suggestedFilename(),
            "browser-acceptance-original-evidence.html",
            "Original evidence download must retain its governed filename",
          );
          const downloadedPath = await download.path();
          assert.ok(downloadedPath, "Original evidence download must produce local bytes");
          assert.match(readFileSync(downloadedPath, "utf8"), new RegExp(RAW_MARKER));
          await page.keyboard.press("Escape");
          await dialog.waitFor({ state: "detached" });'''
          new = '''      const inspectEvidence = page
            .getByRole("link", { name: /Inspect evidence|检查证据/ })
            .first();
          await inspectEvidence.click();
          await page.waitForURL((url) => url.pathname === `/knowledge/${STAGING_ID}`);
          const originalEvidence = page.getByRole("link", {
            name: /Open original file|打开原始文件/,
          });
          await originalEvidence.waitFor();
          assert.equal(
            await originalEvidence.getAttribute("href"),
            `/api/artifacts/${ARTIFACT_ID}/content`,
            "Original evidence link must target the canonical authenticated content route",
          );
          const downloadPromise = page.waitForEvent("download");
          await originalEvidence.click();
          const download = await downloadPromise;
          assert.equal(
            download.suggestedFilename(),
            "browser-acceptance-original-evidence.html",
            "Original evidence download must retain its governed filename",
          );
          const downloadedPath = await download.path();
          assert.ok(downloadedPath, "Original evidence download must produce local bytes");
          assert.match(readFileSync(downloadedPath, "utf8"), new RegExp(RAW_MARKER));
          await page
            .getByRole("link", { name: /Back to work context|返回工作上下文/ })
            .click();
          await page.waitForURL((url) => url.pathname === "/knowledge");'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy detail-modal block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write apps/worker/src/run-admin-browser-acceptance-edge.ts
          rm .github/workflows/issue-725-fix-edge-acceptance-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/run-admin-browser-acceptance-edge.ts .github/workflows/issue-725-fix-edge-acceptance-once.yml
          git commit -m "test: migrate #725 edge evidence path"
          git push
