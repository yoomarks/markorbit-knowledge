name: Temporary Philippines IPOPHL source coverage verification

on:
  push:
    branches:
      - codex/ph-ipophl-source-coverage-v1
    paths:
      - .github/tmp/patch_ph_priority_a.py
      - .github/tmp/patch_ph_priority_b.py
      - .github/tmp/patch_ph_retrieval.py
      - .github/tmp/patch_ph_catalog_tests.py
      - .github/workflows/tmp-ph-ipophl-source-coverage.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ph-ipophl-source-coverage-v1
          fetch-depth: 0
      - name: Apply Philippines IPOPHL patches
        run: |
          python .github/tmp/patch_ph_priority_a.py
          python .github/tmp/patch_ph_priority_b.py
          python .github/tmp/patch_ph_retrieval.py
          python .github/tmp/patch_ph_catalog_tests.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/persistence/src/priority-national-source-coverage.ts packages/persistence/src/source-coverage-catalog.ts packages/persistence/tests/priority-national-source-coverage.test.ts packages/persistence/src/retrieval-relevance-audit.ts packages/persistence/tests/retrieval-relevance-audit.test.ts
      - run: pnpm --filter @markorbit/persistence exec vitest run tests/priority-national-source-coverage.test.ts tests/source-coverage-catalog.test.ts tests/retrieval-relevance-audit.test.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/priority-national-source-coverage.ts packages/persistence/src/source-coverage-catalog.ts packages/persistence/tests/priority-national-source-coverage.test.ts packages/persistence/src/retrieval-relevance-audit.ts packages/persistence/tests/retrieval-relevance-audit.test.ts
          git commit -m "feat: add Philippines IPOPHL trademark source coverage"
          git push origin HEAD:codex/ph-ipophl-source-coverage-v1
