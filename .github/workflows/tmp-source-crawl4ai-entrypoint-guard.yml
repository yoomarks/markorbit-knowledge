name: Temporary Source Crawl4AI entrypoint guard verification

on:
  push:
    branches:
      - codex/source-crawl4ai-entrypoint-guard-v1

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/tmp/patch_source_crawl4ai_entrypoint_guard.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/contracts/src/schema-v1.ts packages/persistence/src/index.ts packages/persistence/tests/source-registry.test.ts packages/worker-runtime/src/crawl4ai-subprocess-acquirer.ts
      - run: pnpm --filter @markorbit/persistence exec vitest run tests/source-registry.test.ts
      - run: pnpm --filter @markorbit/worker-runtime exec vitest run tests/crawl4ai-start-url-budget.test.ts tests/crawl4ai-subprocess-acquirer.test.ts
      - run: pnpm typecheck
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/schema-v1.ts packages/persistence/src/index.ts packages/persistence/tests/source-registry.test.ts packages/worker-runtime/src/crawl4ai-subprocess-acquirer.ts
          git commit -m "Sources: enforce Crawl4AI entrypoint budget at registry write" || true
          git push
