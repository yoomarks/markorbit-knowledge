name: Format Probe

on:
  push:
    branches:
      - codex/core-discovery-proposals-v1

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/admin/src/app/api/discovery/core-proposals/route.ts apps/admin/src/server/core-discovery-proposal-service.ts packages/contracts/src/source-discovery-v1.ts
      - name: Show formatting diff
        run: git diff -- apps/admin/src/app/api/discovery/core-proposals/route.ts apps/admin/src/server/core-discovery-proposal-service.ts packages/contracts/src/source-discovery-v1.ts
