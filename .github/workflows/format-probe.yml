name: Format Probe

on:
  push:
    branches: [codex/source-registry-v2-persistence]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show Prettier diff
        run: |
          pnpm exec prettier --write packages/persistence/src/source-discovery.ts packages/persistence/src/source-registry-v2-registry.ts
          git diff -- packages/persistence/src/source-discovery.ts packages/persistence/src/source-registry-v2-registry.ts
