name: M3.4 Type Fix

on:
  push:
    branches:
      - feature/m3-4-change-feed-version-diff

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'M3.4 annotate occurrence') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-4-change-feed-version-diff
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/persistence/src/document-change-feed.ts')
          text = path.read_text()
          old = '      const occurrence = (occurrences.get(pathJson) ?? 0) + 1;'
          new = '      const occurrence: number = (occurrences.get(pathJson) ?? 0) + 1;'
          if old not in text:
              raise SystemExit('target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/document-change-feed.ts
          git commit -m "M3.4 annotate occurrence"
          git push
