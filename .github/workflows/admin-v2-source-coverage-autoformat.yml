name: Admin V2 Business Surface Autoformat

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply KG-004 verifier summary fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path("packages/persistence/src/staging-verification.ts")
          text = path.read_text()
          old = dedent("""\
              const fields = [...parsed.frontmatter.types.entries()]
                .sort(([left], [right]) => left.localeCompare(right))
                .map(([key, valueType]) => ({
                  key: key
                    .split(".")
                    .at(-1)!
                    .replace(/([a-z0-9])([A-Z])/g, "$1_$2")
                    .toLowerCase(),
                  valueType,
                }));
          """)
          new = dedent("""\
              const usedSummaryKeys = new Set<string>();
              const fields = [...parsed.frontmatter.types.entries()]
                .sort(([left], [right]) => left.localeCompare(right))
                .map(([path, valueType]) => {
                  let normalized = path
                    .replace(/([a-z0-9])([A-Z])/g, "$1_$2")
                    .replace(/[^A-Za-z0-9_-]+/g, "_")
                    .replace(/-+/g, "_")
                    .toLowerCase();
                  if (!/^[a-z]/.test(normalized)) normalized = `field_${normalized}`;

                  let key = normalized;
                  if (key.length > 64 || usedSummaryKeys.has(key)) {
                    let attempt = 0;
                    do {
                      const suffix = sha256(attempt === 0 ? path : `${path}:${attempt}`).slice(0, 12);
                      key = `${normalized.slice(0, 51)}_${suffix}`;
                      attempt += 1;
                    } while (usedSummaryKeys.has(key));
                  }
                  usedSummaryKeys.add(key);
                  return { key, valueType };
                });
          """)
          if old not in text:
              raise SystemExit("KG-004 verifier summary target block not found")
          path.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write packages/persistence/src/staging-verification.ts
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/admin-v2-source-coverage-autoformat.yml
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/staging-verification.ts .github/workflows/admin-v2-source-coverage-autoformat.yml
          git commit -m "fix: preserve unique frontmatter summary paths"
          git push origin HEAD:${{ github.head_ref }}
