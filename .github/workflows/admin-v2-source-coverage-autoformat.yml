name: Admin V2 Business Surface Autoformat

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier
        run: |
          # Keep business surfaces and shared ingestion-control helpers formatting-clean,
          # including production staging and the bulk collection-to-Knowledge P0 acceptance path.
          pnpm exec prettier --write \
            apps/admin/src/app/knowledge/[id]/page.tsx \
            apps/admin/src/components/knowledge/content-reader-index.tsx \
            apps/admin/src/components/knowledge/content-reader-model.test.ts \
            apps/admin/src/components/knowledge/content-reader-model.ts \
            apps/admin/src/components/knowledge/content-reader.tsx \
            apps/admin/src/components/sources/source-country-coverage.tsx \
            apps/admin/src/components/sources/radar-review-evidence.tsx \
            apps/admin/src/components/sources/radar-collection-authorization.tsx \
            apps/admin/src/components/sources/source-failure-root-causes.tsx \
            apps/admin/src/components/foundational/foundational-health-dashboard.tsx \
            apps/admin/src/components/foundational/foundational-health-dashboard-v2.tsx \
            apps/admin/src/server/m3-converter-bootstrap.ts \
            apps/admin/src/server/production-conversion-worker-service.ts \
            apps/admin/src/server/raw-artifact-auto-conversion.ts \
            apps/admin/src/server/raw-artifact-conversion-authorization.ts \
            apps/admin/src/server/source-failure-root-causes.ts \
            apps/admin/src/server/__tests__/bulk-conversion-to-knowledge.e2e.test.ts \
            apps/admin/src/server/__tests__/discovery-bulk-source-pipeline.e2e.test.ts \
            apps/admin/src/server/__tests__/m3-converter-bootstrap.test.ts \
            apps/admin/src/server/__tests__/source-failure-root-causes.test.ts \
            packages/persistence/src/case-candidate-intake.ts \
            packages/persistence/src/case-candidate-read-attestation.test.ts
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/src/app/knowledge/[id]/page.tsx \
            apps/admin/src/components/knowledge/content-reader-index.tsx \
            apps/admin/src/components/knowledge/content-reader-model.test.ts \
            apps/admin/src/components/knowledge/content-reader-model.ts \
            apps/admin/src/components/knowledge/content-reader.tsx \
            apps/admin/src/components/knowledge/content-reader.tsx \
            apps/admin/src/components/sources/source-country-coverage.tsx \
            apps/admin/src/components/sources/radar-review-evidence.tsx \
            apps/admin/src/components/sources/radar-collection-authorization.tsx \
            apps/admin/src/components/sources/source-failure-root-causes.tsx \
            apps/admin/src/components/foundational/foundational-health-dashboard.tsx \
            apps/admin/src/components/foundational/foundational-health-dashboard-v2.tsx \
            apps/admin/src/server/m3-converter-bootstrap.ts \
            apps/admin/src/server/production-conversion-worker-service.ts \
            apps/admin/src/server/raw-artifact-auto-conversion.ts \
            apps/admin/src/server/raw-artifact-conversion-authorization.ts \
            apps/admin/src/server/source-failure-root-causes.ts \
            apps/admin/src/server/__tests__/bulk-conversion-to-knowledge.e2e.test.ts \
            apps/admin/src/server/__tests__/discovery-bulk-source-pipeline.e2e.test.ts \
            apps/admin/src/server/__tests__/m3-converter-bootstrap.test.ts \
            apps/admin/src/server/__tests__/source-failure-root-causes.test.ts \
            packages/persistence/src/case-candidate-intake.ts \
            packages/persistence/src/case-candidate-read-attestation.test.ts
          git commit -m "style: format admin v2 business surfaces"
          git push origin HEAD:${{ github.head_ref }}
