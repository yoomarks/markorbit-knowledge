name: Admin V2 Business Surface Autoformat

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier
        run: |
          # Keep business surfaces and shared ingestion-control helpers formatting-clean,
          # including production staging, browser API boundaries and the bulk
          # collection-to-Knowledge P0 acceptance path.
