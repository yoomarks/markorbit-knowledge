name: Admin V2 Business Surface Autoformat

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier
        run: |
          pnpm exec prettier --write \
            packages/persistence/src/knowledge-relationship-vault-export.ts \
            packages/persistence/src/knowledge-relationship-vault-export.test.ts \
            apps/admin/src/server/knowledge-relationship-ready-staging-gateway.ts \
            apps/admin/src/server/__tests__/knowledge-relationship-ready-staging-gateway.e2e.test.ts
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/persistence/src/knowledge-relationship-vault-export.ts \
            packages/persistence/src/knowledge-relationship-vault-export.test.ts \
            apps/admin/src/server/knowledge-relationship-ready-staging-gateway.ts \
            apps/admin/src/server/__tests__/knowledge-relationship-ready-staging-gateway.e2e.test.ts
          git commit -m "style: format KG-004 production gateway"
          git push origin HEAD:${{ github.head_ref }}
