name: Admin V2 Business Surface Autoformat

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire incremental rescan observations
        run: |
          python - <<'PY'
          from pathlib import Path

          provider = Path("packages/worker-runtime/src/http-website-discovery-provider.ts")
          text = provider.read_text()
          old = '''        const contentType = result.response.headers.get("content-type")?.toLowerCase() ?? "";
          if (!contentType.includes("text/html") && !contentType.includes("application/xhtml+xml")) {
            return;
          }

          for (const href of extractLinks(result.text)) {'''
          new = '''        const contentType = result.response.headers.get("content-type")?.toLowerCase() ?? "";
          if (!contentType.includes("text/html") && !contentType.includes("application/xhtml+xml")) {
            return;
          }

          const observedCandidate = candidates.find(
            (candidate) =>
              candidate.locator === current.locator || candidate.locator === result.locator,
          );
          if (observedCandidate) {
            const httpEtag = result.response.headers.get("etag")?.trim();
            const httpLastModified = result.response.headers.get("last-modified")?.trim();
            observedCandidate.metadata = {
              ...observedCandidate.metadata,
              observedContentSha256: createHash("sha256").update(result.text).digest("hex"),
              ...(httpEtag ? { httpEtag } : {}),
              ...(httpLastModified ? { httpLastModified } : {}),
              httpContentType: contentType,
            };
          }

          for (const href of extractLinks(result.text)) {'''
          if old in text:
              provider.write_text(text.replace(old, new, 1))

          detail = Path("apps/admin/src/components/sources/source-detail-workbench.tsx")
          text = detail.read_text()
          old = '''      setMessage(
            zh
              ? "重新扫描已完成。新发现的候选资料会进入 Sources 的待审批队列。"
              : "Rescan completed. Newly discovered candidates will enter the Sources review queue.",
          );'''
          new = '''      const payload = (await response.json()) as {
            observationSummary?: {
              newCount: number;
              knownCount: number;
              changedCount: number;
              rejectedChangedCount: number;
            };
          };
          const summary = payload.observationSummary;
          setMessage(
            summary
              ? zh
                ? `重新扫描完成：新增 ${summary.newCount} · 已知 ${summary.knownCount} · 客观变化 ${summary.changedCount} · 已淘汰但发生变化 ${summary.rejectedChangedCount}。变化仅代表采集证据指纹不同，不代表重要性。`
                : `Rescan completed: ${summary.newCount} new · ${summary.knownCount} known · ${summary.changedCount} objectively changed · ${summary.rejectedChangedCount} rejected but changed. A changed fingerprint does not imply materiality.`
              : zh
                ? "重新扫描已完成。新发现的候选资料会进入 Sources 的待审批队列。"
                : "Rescan completed. Newly discovered candidates will enter the Sources review queue.",
          );'''
          if old in text:
              detail.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write packages/worker-runtime/src/http-website-discovery-provider.ts apps/admin/src/components/sources/source-detail-workbench.tsx packages/persistence/src/source-candidate-observations.ts packages/persistence/src/source-discovery.ts apps/admin/src/components/sources/source-change-review.tsx apps/admin/src/server/change-significance-capability-service.ts apps/admin/src/app/api/discovery/changes/route.ts apps/admin/src/app/api/discovery/changes/[candidateId]/significance/route.ts packages/contracts/src/candidate-change-observation-v1.ts packages/contracts/src/change-significance-capability-v1.ts packages/contracts/tests/change-significance-capability-v1.test.ts packages/persistence/tests/source-candidate-observations.test.ts
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/worker-runtime/src/http-website-discovery-provider.ts apps/admin/src/components/sources/source-detail-workbench.tsx packages/persistence/src/source-candidate-observations.ts packages/persistence/src/source-discovery.ts apps/admin/src/components/sources/source-change-review.tsx apps/admin/src/server/change-significance-capability-service.ts apps/admin/src/app/api/discovery/changes/route.ts apps/admin/src/app/api/discovery/changes/[candidateId]/significance/route.ts packages/contracts/src/candidate-change-observation-v1.ts packages/contracts/src/change-significance-capability-v1.ts packages/contracts/tests/change-significance-capability-v1.test.ts packages/persistence/tests/source-candidate-observations.test.ts
          git commit -m "feat: wire incremental rescan observations"
          git push origin HEAD:${{ github.head_ref }}
