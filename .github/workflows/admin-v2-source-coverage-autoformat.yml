name: Admin V2 Business Surface Autoformat

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier
        run: |
          pnpm exec prettier --write apps/admin/src/components/sources/source-country-coverage.tsx apps/admin/src/components/foundational/foundational-health-dashboard.tsx apps/admin/src/components/foundational/foundational-health-dashboard-v2.tsx packages/persistence/src/source-assessment-registry.ts packages/persistence/tests/source-assessment-registry.test.ts apps/admin/src/server/source-registry.ts apps/admin/src/server/source-assessment-capability-service.ts apps/admin/src/app/api/sources/[id]/assessment/route.ts apps/admin/src/app/api/sources/route.ts apps/admin/src/components/sources/source-assessment-panel.tsx apps/admin/src/components/sources/source-list.tsx packages/persistence/package.json
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/source-assessment-registry.ts packages/persistence/tests/source-assessment-registry.test.ts apps/admin/src/server/source-registry.ts apps/admin/src/server/source-assessment-capability-service.ts apps/admin/src/app/api/sources/[id]/assessment/route.ts apps/admin/src/app/api/sources/route.ts apps/admin/src/components/sources/source-assessment-panel.tsx apps/admin/src/components/sources/source-list.tsx packages/persistence/package.json
          git commit -m "style: format source assessment persistence"
          git push origin HEAD:${{ github.head_ref }}
