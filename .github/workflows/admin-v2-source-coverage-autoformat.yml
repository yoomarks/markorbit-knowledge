name: Admin V2 Business Surface Autoformat

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Apply Prettier and refresh lockfile
        run: |
          pnpm exec prettier --write apps/worker/src/run-representative-live-canaries.ts apps/worker/package.json packages/persistence/src/representative-source-live-canaries.ts packages/persistence/src/representative-source-live-canaries.test.ts packages/persistence/package.json .github/workflows/representative-source-live-canary.yml
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/run-representative-live-canaries.ts apps/worker/package.json packages/persistence/src/representative-source-live-canaries.ts packages/persistence/src/representative-source-live-canaries.test.ts packages/persistence/package.json .github/workflows/representative-source-live-canary.yml pnpm-lock.yaml
          git commit -m "style: format representative live canary"
          git push origin HEAD:${{ github.head_ref }}
