name: Admin V2 Business Surface Autoformat

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch import authority label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/admin/src/components/discovery/discovery-import-panel.tsx")
          text = path.read_text()
          old = '    SECONDARY_OFFICIAL: "二级官方",\n    PROFESSIONAL: "专业来源",'
          new = '    SECONDARY_OFFICIAL: "二级官方",\n    INTERNAL: "内部来源",\n    PROFESSIONAL: "专业来源",'
          if new not in text:
              if old not in text:
                  raise SystemExit("authority label anchor not found")
              path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/admin/src/components/discovery/discovery-import-panel.tsx apps/admin/src/components/sources/source-country-coverage.tsx apps/admin/src/components/foundational/foundational-health-dashboard.tsx apps/admin/src/components/foundational/foundational-health-dashboard-v2.tsx
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/components/discovery/discovery-import-panel.tsx
          git commit -m "fix: add internal authority import label"
          git push origin HEAD:${{ github.head_ref }}
