name: Admin V2 Business Surface Autoformat

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair and format Source detail workbench
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/admin/src/components/sources/source-detail-workbench.tsx")
          text = path.read_text()
          text = text.replace(
              'import { useCallback, useEffect, useMemo, useState } from "react";',
              'import { useCallback, useEffect, useState } from "react";',
          )
          pattern = re.compile(
              r'  const latestRun = useMemo\(\(\) => \{.*?  \}, \[state\?\.plans, state\?\.source\.defaultCollectionPlanId\]\);',
              re.S,
          )
          replacement = '''  const latestRun =
            state && state.runs.length > 0
              ? [...state.runs].sort(
                  (left, right) => Date.parse(right.run.createdAt) - Date.parse(left.run.createdAt),
                )[0]!
              : null;

          const defaultPlan =
            state?.source.defaultCollectionPlanId && state
              ? (state.plans.find(
                  (record) => record.plan.id === state.source.defaultCollectionPlanId,
                ) ?? null)
              : null;'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"expected one memoization block, replaced {count}")
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/admin/src/components/sources/source-detail-workbench.tsx apps/admin/src/components/sources/source-country-coverage.tsx apps/admin/src/components/foundational/foundational-health-dashboard.tsx apps/admin/src/components/foundational/foundational-health-dashboard-v2.tsx
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/components/sources/source-detail-workbench.tsx apps/admin/src/components/sources/source-country-coverage.tsx apps/admin/src/components/foundational/foundational-health-dashboard.tsx apps/admin/src/components/foundational/foundational-health-dashboard-v2.tsx
          git commit -m "fix: remove fragile source detail memoization"
          git push origin HEAD:${{ github.head_ref }}
