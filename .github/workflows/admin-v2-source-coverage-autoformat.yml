name: Admin V2 Business Surface Autoformat

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire spreadsheet discovery import
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("apps/admin/src/server/discovery-service.ts")
          text = path.read_text()

          old_type = '''export type StartBatchDiscoveryInput = Omit<StartDiscoveryInput, "locator" | "lineage"> & {
            locators: string[];
          };'''
          new_type = '''export type StartBatchDiscoveryEntry = {
            locator: string;
            intake?: DiscoveryIntakeDefaults;
          };

          export type StartBatchDiscoveryInput = Omit<StartDiscoveryInput, "locator" | "lineage"> & {
            locators?: string[];
            entries?: StartBatchDiscoveryEntry[];
          };'''
          if old_type in text:
              text = text.replace(old_type, new_type, 1)
          elif new_type not in text:
              raise SystemExit("StartBatchDiscoveryInput anchor not found")

          marker = '''function candidateIntakeDefaults(
            candidate: SourceCandidateRecord["candidate"],
          ): DiscoveryIntakeDefaults | undefined {'''
          merge_helper = '''function mergeIntakeDefaults(
            base: DiscoveryIntakeDefaults | undefined,
            override: DiscoveryIntakeDefaults | undefined,
          ): DiscoveryIntakeDefaults | undefined {
            const normalizedBase = normalizedIntakeDefaults(base);
            const normalizedOverride = normalizedIntakeDefaults(override);
            if (!normalizedBase) return normalizedOverride;
            if (!normalizedOverride) return normalizedBase;
            return normalizedIntakeDefaults({ ...normalizedBase, ...normalizedOverride });
          }

          '''
          if merge_helper not in text:
              if marker not in text:
                  raise SystemExit("candidateIntakeDefaults marker not found")
              text = text.replace(marker, merge_helper + marker, 1)

          new_method = '''  async startBatch(input: StartBatchDiscoveryInput) {
            const entries: StartBatchDiscoveryEntry[] = [
              ...(input.locators ?? []).map((locator) => ({ locator })),
              ...(input.entries ?? []),
            ];
            if (entries.length === 0 || entries.length > 100) {
              throw new RegistryValidationError("Batch discovery requires 1 to 100 entries");
            }

            const existingOrigins = new Map<string, string>();
            let sourceOffset = 0;
            while (true) {
              const page = this.dependencies.sources.list({
                sourceType: "WEB",
                limit: 100,
                offset: sourceOffset,
              });
              for (const source of page.items) {
                if (source.status === "ARCHIVED") continue;
                for (const origin of sourceWebsiteOrigins(source)) existingOrigins.set(origin, source.id);
              }
              sourceOffset += page.items.length;
              if (page.items.length === 0 || sourceOffset >= page.total) break;
            }

            const seenOrigins = new Set<string>();
            const items: Array<{
              input: string;
              locator?: string;
              origin?: string;
              status: "STARTED" | "SKIPPED_DUPLICATE_INPUT" | "SKIPPED_EXISTING_SOURCE" | "FAILED";
              sourceId?: string;
              batchId?: string;
              candidateCount?: number;
              message?: string;
            }> = [];
            let started = 0;
            let skippedDuplicateInput = 0;
            let skippedExistingSource = 0;
            let failed = 0;
            let candidateCount = 0;
            const discoveryOptions = {
              ...(input.maxDepth !== undefined ? { maxDepth: input.maxDepth } : {}),
              ...(input.maxCandidates !== undefined ? { maxCandidates: input.maxCandidates } : {}),
              ...(input.maxFetches !== undefined ? { maxFetches: input.maxFetches } : {}),
              ...(input.discoverExternalLinks !== undefined
                ? { discoverExternalLinks: input.discoverExternalLinks }
                : {}),
              ...(input.maxExternalCandidates !== undefined
                ? { maxExternalCandidates: input.maxExternalCandidates }
                : {}),
              ...(input.maxExpansionGeneration !== undefined
                ? { maxExpansionGeneration: input.maxExpansionGeneration }
                : {}),
              ...(input.deniedUrlPatterns !== undefined
                ? { deniedUrlPatterns: input.deniedUrlPatterns }
                : {}),
            };

            for (const entry of entries) {
              const rawLocator = entry.locator;
              let locator: string;
              let origin: string;
              try {
                locator = normalizeSeedLocator(rawLocator);
                origin = websiteOrigin(locator);
              } catch (error) {
                failed += 1;
                items.push({
                  input: rawLocator,
                  status: "FAILED",
                  message: error instanceof Error ? error.message : "Invalid discovery seed",
                });
                continue;
              }

              if (seenOrigins.has(origin)) {
                skippedDuplicateInput += 1;
                items.push({ input: rawLocator, locator, origin, status: "SKIPPED_DUPLICATE_INPUT" });
                continue;
              }
              seenOrigins.add(origin);

              const profile = this.dependencies.graph.getProfileByCanonicalOrigin(
                DEFAULT_WORKSPACE.id,
                origin,
              );
              const existingSourceId = profile?.sourceId ?? existingOrigins.get(origin);
              if (existingSourceId) {
                skippedExistingSource += 1;
                items.push({
                  input: rawLocator,
                  locator,
                  origin,
                  status: "SKIPPED_EXISTING_SOURCE",
                  sourceId: existingSourceId,
                });
                continue;
              }

              try {
                const result = await this.start({
                  ...discoveryOptions,
                  locator,
                  intake: mergeIntakeDefaults(input.intake, entry.intake),
                });
                started += 1;
                candidateCount += result.candidates.length;
                items.push({
                  input: rawLocator,
                  locator,
                  origin,
                  status: "STARTED",
                  batchId: result.batch.batch.batchId,
                  candidateCount: result.candidates.length,
                });
              } catch (error) {
                failed += 1;
                items.push({
                  input: rawLocator,
                  locator,
                  origin,
                  status: "FAILED",
                  message: error instanceof Error ? error.message : "Discovery failed",
                });
              }
            }

            return {
              summary: {
                submitted: entries.length,
                uniqueOrigins: seenOrigins.size,
                started,
                skippedDuplicateInput,
                skippedExistingSource,
                failed,
                candidateCount,
              },
              items,
            };
          }

'''
          pattern = re.compile(
              r'  async startBatch\(input: StartBatchDiscoveryInput\) \{[\s\S]*?\n  \}\n\n(?=  async expandSource)',
              re.MULTILINE,
          )
          updated, count = pattern.subn(new_method, text, count=1)
          if count != 1:
              raise SystemExit(f"expected one startBatch method, replaced {count}")
          path.write_text(updated)
          PY
          pnpm exec prettier --write apps/admin/src/server/discovery-service.ts apps/admin/src/app/api/discovery/batch/route.ts apps/admin/src/server/discovery-import-parser.ts apps/admin/src/app/api/discovery/import-preview/route.ts apps/admin/src/server/__tests__/discovery-import-parser.test.ts apps/admin/src/components/discovery/discovery-import-panel.tsx apps/admin/src/components/discovery/discovery-intake.tsx
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/discovery-service.ts apps/admin/src/app/api/discovery/batch/route.ts apps/admin/src/server/discovery-import-parser.ts apps/admin/src/app/api/discovery/import-preview/route.ts apps/admin/src/server/__tests__/discovery-import-parser.test.ts apps/admin/src/components/discovery/discovery-import-panel.tsx apps/admin/src/components/discovery/discovery-intake.tsx
          git commit -m "feat: wire spreadsheet discovery import"
          git push origin HEAD:${{ github.head_ref }}
