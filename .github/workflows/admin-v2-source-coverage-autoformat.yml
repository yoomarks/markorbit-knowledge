name: Admin V2 Business Surface Autoformat

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove exact unused lint symbols
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {actual}: {old!r}")
              file.write_text(text.replace(old, new, expected))

          replace(
              "apps/admin/src/server/__tests__/core-discovery-proposal-service.test.ts",
              "  type SourceDiscoveryBatch,\n",
              "",
          )
          replace(
              "apps/admin/src/server/__tests__/core-discovery-proposal-service.test.ts",
              "async discover(_batch: SourceDiscoveryBatch)",
              "async discover()",
          )
          replace(
              "apps/admin/src/server/__tests__/vault-import-execution-service.test.ts",
              "  RecordVaultImportIntentInput,\n",
              "",
          )
          replace(
              "apps/admin/src/server/__tests__/vault-import-execution-service.test.ts",
              "record(_input: RecordVaultImportIntentInput): VaultImportIntentRecordResult",
              "record(): VaultImportIntentRecordResult",
          )
          replace(
              "apps/worker/src/prepare-adk-grounded-execution.test.ts",
              'import { AiSourceGroundingError } from "@markorbit/worker-runtime/ai-source-pack-renderer";\n',
              "",
          )
          replace(
              "apps/worker/src/prepare-adk-grounded-execution.test.ts",
              "  PersistedAiGroundedExecutionPreparationError,\n",
              "",
          )
          replace(
              "packages/contracts/src/worker-protocol-v1.ts",
              "  JOB_STATUSES,\n",
              "",
          )
          replace(
              "packages/persistence/src/conversion-runtime-transitions.ts",
              'import { createHash, randomBytes } from "node:crypto";',
              'import { createHash } from "node:crypto";',
          )
          replace(
              "packages/persistence/src/conversion-runtime-transitions.ts",
              'const CROCKFORD = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";\n',
              "",
          )
          replace(
              "packages/persistence/src/conversion-runtime-transitions.ts",
              '''function encodeBase32(value: bigint, length: number): string {
            let output = "";
            let remaining = value;
            for (let index = 0; index < length; index += 1) {
              output = CROCKFORD[Number(remaining & 31n)] + output;
              remaining >>= 5n;
            }
            return output;
          }

          function typedId(prefix: string, now = Date.now()): string {
            const timestamp = encodeBase32(BigInt(now), 10);
            const randomValue = BigInt(`0x${randomBytes(10).toString("hex")}`);
            return `${prefix}_${timestamp}${encodeBase32(randomValue, 16)}`;
          }

          ''',
              "",
          )
          replace(
              "packages/persistence/src/raw-artifact-registry.ts",
              "  ensureWorkerRegistry,\n",
              "",
          )
          replace(
              "packages/persistence/tests/conversion-runtime-persistence.test.ts",
              'import { DatabaseSync } from "node:sqlite";\n',
              "",
          )
          replace(
              "packages/persistence/tests/foundational-action-execution-ledger.test.ts",
              "  RegistryConflictError,\n",
              "",
          )
          replace(
              "packages/worker-runtime/src/cnipa-source-adapter-pagination.test.ts",
              "decodeList(_kind, _value)",
              "decodeList()",
          )
          replace(
              "packages/worker-runtime/src/foundational-remediation-queue.ts",
              '''function queryEndpoint(path: string, workspaceId: string, jurisdiction: string): string {
            const query = new URLSearchParams({ workspaceId, jurisdiction });
            return `${path}?${query.toString()}`;
          }

          ''',
              "",
          )
          replace(
              "packages/worker-runtime/src/github-acquirer.ts",
              'import { isIP } from "node:net";\n',
              "",
          )
          replace(
              "packages/worker-runtime/tests/attachment-parent-lineage.test.ts",
              "  ExecutionReceipt,\n",
              "",
          )
          replace(
              "packages/worker-runtime/tests/attachment-parent-lineage.test.ts",
              "async complete(_context, _receipt: ExecutionReceipt) {},",
              "async complete() {},",
          )
          replace(
              "packages/worker-runtime/tests/conditional-http-change-watch.test.ts",
              'import type { ExecutionAttempt, ExecutionReceipt } from "@markorbit/contracts";',
              'import type { ExecutionAttempt } from "@markorbit/contracts";',
          )
          replace(
              "packages/worker-runtime/tests/conditional-http-change-watch.test.ts",
              "const complete = vi.fn(async (_context, _receipt: ExecutionReceipt) => {});",
              "const complete = vi.fn(async () => {});",
          )
          replace(
              "packages/worker-runtime/tests/expanding-website-discovery-provider.test.ts",
              'import type { SourceCandidate, SourceDiscoveryBatch } from "@markorbit/contracts";',
              'import type { SourceCandidate } from "@markorbit/contracts";',
          )
          replace(
              "packages/worker-runtime/tests/expanding-website-discovery-provider.test.ts",
              "vi.fn(async (batch: SourceDiscoveryBatch) =>",
              "vi.fn(async () =>",
              expected=2,
          )
          PY

          pnpm exec prettier --write \
            apps/admin/src/server/__tests__/core-discovery-proposal-service.test.ts \
            apps/admin/src/server/__tests__/vault-import-execution-service.test.ts \
            apps/worker/src/prepare-adk-grounded-execution.test.ts \
            packages/contracts/src/worker-protocol-v1.ts \
            packages/persistence/src/conversion-runtime-transitions.ts \
            packages/persistence/src/raw-artifact-registry.ts \
            packages/persistence/tests/conversion-runtime-persistence.test.ts \
            packages/persistence/tests/foundational-action-execution-ledger.test.ts \
            packages/worker-runtime/src/cnipa-source-adapter-pagination.test.ts \
            packages/worker-runtime/src/foundational-remediation-queue.ts \
            packages/worker-runtime/src/github-acquirer.ts \
            packages/worker-runtime/tests/attachment-parent-lineage.test.ts \
            packages/worker-runtime/tests/conditional-http-change-watch.test.ts \
            packages/worker-runtime/tests/expanding-website-discovery-provider.test.ts
          pnpm lint
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/src/server/__tests__/core-discovery-proposal-service.test.ts \
            apps/admin/src/server/__tests__/vault-import-execution-service.test.ts \
            apps/worker/src/prepare-adk-grounded-execution.test.ts \
            packages/contracts/src/worker-protocol-v1.ts \
            packages/persistence/src/conversion-runtime-transitions.ts \
            packages/persistence/src/raw-artifact-registry.ts \
            packages/persistence/tests/conversion-runtime-persistence.test.ts \
            packages/persistence/tests/foundational-action-execution-ledger.test.ts \
            packages/worker-runtime/src/cnipa-source-adapter-pagination.test.ts \
            packages/worker-runtime/src/foundational-remediation-queue.ts \
            packages/worker-runtime/src/github-acquirer.ts \
            packages/worker-runtime/tests/attachment-parent-lineage.test.ts \
            packages/worker-runtime/tests/conditional-http-change-watch.test.ts \
            packages/worker-runtime/tests/expanding-website-discovery-provider.test.ts
          git commit -m "chore: remove unused lint symbols"
          git push origin HEAD:${{ github.head_ref }}
