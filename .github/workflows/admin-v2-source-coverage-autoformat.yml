name: Admin V2 Business Surface Autoformat

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix discovery category labels
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path("apps/admin/src/lib/admin-v2/discovery-intake-workbench.tsx")
          text = path.read_text()
          replacement = '''const labels: Partial<Record<SourceCategory, string>> = {
            OFFICIAL_AUTHORITY: "官方机构",
            OFFICIAL_GUIDANCE: "官方指南",
            LAW_FIRM: "律所 / 代理机构",
            NEWS: "新闻",
            RESEARCH: "研究资料",
            TECHNICAL: "技术资料",
            INTERNAL: "内部资料",
            USER_PROVIDED: "用户提供",
            OTHER: "其他",
          };'''
          updated, count = re.subn(
              r'const labels: Partial<Record<SourceCategory, string>> = \{[\s\S]*?\n\s*\};',
              replacement,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"expected one category label map, found {count}")
          path.write_text(updated)
          PY
          pnpm exec prettier --write apps/admin/src/lib/admin-v2/discovery-intake-workbench.tsx
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/lib/admin-v2/discovery-intake-workbench.tsx
          git commit -m "fix: use valid source category labels"
          git push origin HEAD:${{ github.head_ref }}
