name: PR 723 Source Coverage Format

on:
  push:
    branches: [issue-711-source-coverage-board]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-711-source-coverage-board
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format #711 files
        run: |
          pnpm exec prettier --write \
            apps/admin/src/components/source-coverage/source-coverage-board.tsx \
            apps/admin/src/lib/source-coverage-board-model.test.ts \
            apps/admin/src/lib/source-coverage-board-model.ts \
            apps/admin/src/server/source-coverage-board.ts
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/src/components/source-coverage/source-coverage-board.tsx \
            apps/admin/src/lib/source-coverage-board-model.test.ts \
            apps/admin/src/lib/source-coverage-board-model.ts \
            apps/admin/src/server/source-coverage-board.ts
          git commit -m "style: format source coverage board"
          git push origin HEAD:issue-711-source-coverage-board
