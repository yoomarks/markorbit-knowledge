name: K-EXT-D Format Once

on:
  push:
    branches:
      - codex/k-ext-d-scheduler-change-watch

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/k-ext-d-scheduler-change-watch
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format K-EXT-D files
        run: >-
          pnpm exec prettier --write
          apps/admin/src/app/api/worker/v1/claim/route.ts
          packages/persistence/package.json
          packages/persistence/src/collection-scheduler.ts
          packages/persistence/tests/collection-scheduler.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/src/app/api/worker/v1/claim/route.ts \
            packages/persistence/package.json \
            packages/persistence/src/collection-scheduler.ts \
            packages/persistence/tests/collection-scheduler.test.ts
          git commit -m "chore: format K-EXT-D scheduler"
          git push origin HEAD:codex/k-ext-d-scheduler-change-watch
