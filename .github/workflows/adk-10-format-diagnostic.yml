name: ADK-10 Format Diagnostic

on:
  pull_request:
    paths:
      - "packages/persistence/src/trademark-assignment-library-catalog.ts"
      - "packages/persistence/tests/trademark-assignment-library-catalog.test.ts"
      - ".github/workflows/adk-10-format-diagnostic.yml"

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write \
            packages/persistence/src/trademark-assignment-library-catalog.ts \
            packages/persistence/tests/trademark-assignment-library-catalog.test.ts
          git diff -- \
            packages/persistence/src/trademark-assignment-library-catalog.ts \
            packages/persistence/tests/trademark-assignment-library-catalog.test.ts
          exit 1
