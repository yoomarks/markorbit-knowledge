name: Agent R1-K11 Format

on:
  push:
    branches:
      - r1-k11-vault-origin-staging-verification

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r1-k11-vault-origin-staging-verification
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format K11 files
        run: |
          pnpm exec prettier --write \
            'apps/admin/src/app/api/workspaces/[id]/vault-origin-staging-finalizations/route.ts' \
            'apps/admin/src/app/api/workspaces/[id]/vault-origin-staging-verifications/route.ts' \
            apps/admin/src/components/vault/vault-origin-staging-verification-control.tsx \
            packages/persistence/src/vault-origin-staging-verification.test.ts \
            packages/persistence/src/vault-origin-staging-verification.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m 'chore(r1-k11): format Vault-origin verification'
          git push origin HEAD:r1-k11-vault-origin-staging-verification
