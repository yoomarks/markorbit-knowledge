name: Temporary Russia Source Coverage

on:
  push:
    branches:
      - agent/ru-rospatent-source-coverage-v1

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ru-rospatent-source-coverage-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply curated Rospatent coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'expected anchor not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          coverage_block = '''const ROSPATENT_RU: Authority = {
            jurisdiction: "RU",
            authorityName: "Federal Service for Intellectual Property (Rospatent)",
            languages: ["ru"],
            verificationEvidenceUri: "https://rospatent.gov.ru/ru",
          };

          export const ROSPATENT_RU_SOURCE_COVERAGE_TARGETS = [
            target(ROSPATENT_RU, {
              id: "ru-rospatent-trademark-portal",
              family: "PORTAL",
              displayName: "Rospatent Intellectual Property Portal",
              canonicalUri: "https://rospatent.gov.ru/ru",
              verificationEvidenceUri: "https://rospatent.gov.ru/ru",
              notes:
                "Official Rospatent portal and service surface for the Russian Federation; retained as the authority entrypoint while trademark-specific acquisition uses the dedicated service, register and rules targets below.",
            }),
            target(ROSPATENT_RU, {
              id: "ru-rospatent-trademark-filing-service",
              family: "FILING",
              displayName: "Rospatent Trademark Registration State Service",
              canonicalUri:
                "https://rospatent.gov.ru/ru/stateservices/gosudarstvennaya-registraciya-tovarnogo-znaka-znaka-obsluzhivaniya-kollektivnogo-znaka-i-vydacha-svidetelstv-na-tovarnyy-znak-znak-obsluzhivaniya-kollektivnyy-znak-ih-dublikatov",
              verificationEvidenceUri:
                "https://rospatent.gov.ru/ru/stateservices/gosudarstvennaya-registraciya-tovarnogo-znaka-znaka-obsluzhivaniya-kollektivnogo-znaka-i-vydacha-svidetelstv-na-tovarnyy-znak-znak-obsluzhivaniya-kollektivnyy-znak-ih-dublikatov",
              notes:
                "Current Rospatent state-service page covering trademark application submission, electronic filing routes, fee links and the registration workflow.",
            }),
            target(ROSPATENT_RU, {
              id: "ru-rospatent-trademark-register",
              family: "SEARCH",
              displayName: "Russian Federation Open Trademark and Service Mark Register",
              canonicalUri: "https://rospatent.gov.ru/opendata/7730176088-tz",
              changeSensitivity: "HIGH",
              verificationEvidenceUri: "https://rospatent.gov.ru/opendata/7730176088-tz",
              notes:
                "Official FIPS-owned open-data register for Russian trademarks and service marks. The dataset is updated monthly and exposes registration, application, priority, expiry and owner fields; the catalog targets the stable dataset passport rather than a dated CSV snapshot.",
            }),
            target(ROSPATENT_RU, {
              id: "ru-rospatent-trademark-fees",
              family: "FEES",
              displayName: "Rospatent Trademark and Patent Fee Tables",
              canonicalUri: "https://rospatent.gov.ru/ru/activities/dues/table",
              verificationEvidenceUri: "https://rospatent.gov.ru/ru/activities/dues/table",
              notes:
                "Current official table of legally significant actions and fees, including trademark and service-mark filing, examination, registration and related actions.",
            }),
            target(ROSPATENT_RU, {
              id: "ru-rospatent-trademark-filing-examination-rules",
              family: "EXAMINATION_MANUAL",
              displayName: "Russia Trademark Filing and Examination Rules – Order No. 482",
              canonicalUri:
                "https://rospatent.gov.ru/ru/documents/482-prikaz-minekonomrazvitiya-rossii-ot-20-07-2015-482",
              verificationEvidenceUri:
                "https://rospatent.gov.ru/ru/documents/482-prikaz-minekonomrazvitiya-rossii-ot-20-07-2015-482",
              notes:
                "Official consolidated rules for preparing, filing and examining trademark, service-mark and collective-mark registration documents, including amendments through 20 September 2024.",
            }),
            target(ROSPATENT_RU, {
              id: "ru-rospatent-civil-code-trademarks",
              family: "LEGAL_TEXTS",
              displayName: "Russian Civil Code Part Four – Trademark Provisions",
              canonicalUri:
                "https://rospatent.gov.ru/ru/documents/grazhdanskiy-kodeks-rossiyskoy-federacii-chast-chetvertaya",
              verificationEvidenceUri:
                "https://rospatent.gov.ru/ru/documents/grazhdanskiy-kodeks-rossiyskoy-federacii-chast-chetvertaya",
              notes:
                "Official Rospatent publication of Part Four of the Civil Code; Chapter 76 contains the core substantive trademark and service-mark provisions, including registrability, rights, challenges, publication and renewal.",
            }),
            target(ROSPATENT_RU, {
              id: "ru-rospatent-trademark-appeals",
              family: "PROCEEDINGS",
              displayName: "Rospatent Administrative Appeal Procedure",
              canonicalUri: "https://rospatent.gov.ru/ru/activities/appeal",
              verificationEvidenceUri: "https://rospatent.gov.ru/ru/activities/appeal",
              notes:
                "Official administrative and judicial appeal guidance linking the Patent Disputes Chamber objection procedure for decisions affecting trademarks and other IP rights.",
            }),
            target(ROSPATENT_RU, {
              id: "ru-rospatent-trademark-renewal",
              family: "MAINTENANCE",
              displayName: "Rospatent Trademark Renewal State Service",
              canonicalUri:
                "https://rospatent.gov.ru/ru/stateservices/prodlenie-sroka-deystviya-isklyuchitelnogo-prava-na-tovarnyy-znak",
              verificationEvidenceUri:
                "https://rospatent.gov.ru/ru/stateservices/prodlenie-sroka-deystviya-isklyuchitelnogo-prava-na-tovarnyy-znak",
              notes:
                "Current trademark-renewal service page covering the ten-year renewal term, filing window, six-month additional period, required documents and applicable fees.",
            }),
            target(ROSPATENT_RU, {
              id: "ru-rospatent-trademark-official-publications",
              family: "OFFICIAL_GAZETTE",
              displayName: "Rospatent Trademark Official Publications and Bulletins",
              canonicalUri: "https://rospatent.gov.ru/ru/sourses",
              coverageTier: "CHANGE_SIGNAL",
              fetchAttachmentsHint: true,
              expectedArtifactKinds: ["HTML", "MARKDOWN", "PDF"],
              verificationEvidenceUri: "https://rospatent.gov.ru/ru/sourses",
              notes:
                "Official Rospatent information-resources index linking FIPS official trademark bulletins, open registers and PDF official publications; retained as a change signal rather than a foundational retrieval target.",
            }),
          ] satisfies readonly SourceCoverageTarget[];

          '''
          replace_once(
              'packages/persistence/src/priority-national-source-coverage.ts',
              'const CIPO: Authority = {',
              coverage_block + 'const CIPO: Authority = {'
          )
          replace_once(
              'packages/persistence/src/priority-national-source-coverage.ts',
              '  ...EIPA_EG_SOURCE_COVERAGE_TARGETS,\n  ...CIPO_SOURCE_COVERAGE_TARGETS,',
              '  ...EIPA_EG_SOURCE_COVERAGE_TARGETS,\n  ...ROSPATENT_RU_SOURCE_COVERAGE_TARGETS,\n  ...CIPO_SOURCE_COVERAGE_TARGETS,'
          )

          probes = '''  {
            id: "ru-rospatent-trademark-portal-name",
            targetId: "ru-rospatent-trademark-portal",
            query: "Rospatent Federal Service Intellectual Property Russia trademark portal",
          },
          {
            id: "ru-rospatent-trademark-filing-service-name",
            targetId: "ru-rospatent-trademark-filing-service",
            query: "Rospatent trademark registration state service electronic filing application",
          },
          {
            id: "ru-rospatent-trademark-register-name",
            targetId: "ru-rospatent-trademark-register",
            query: "Russia open register trademarks service marks registration application owner expiry",
          },
          {
            id: "ru-rospatent-trademark-fees-name",
            targetId: "ru-rospatent-trademark-fees",
            query: "Rospatent trademark fees filing examination registration fee table",
          },
          {
            id: "ru-rospatent-trademark-filing-examination-rules-name",
            targetId: "ru-rospatent-trademark-filing-examination-rules",
            query: "Russia Order 482 trademark filing examination rules application documents",
          },
          {
            id: "ru-rospatent-civil-code-trademarks-name",
            targetId: "ru-rospatent-civil-code-trademarks",
            query: "Russia Civil Code Part Four Chapter 76 trademarks service marks registration rights",
          },
          {
            id: "ru-rospatent-trademark-appeals-name",
            targetId: "ru-rospatent-trademark-appeals",
            query: "Rospatent trademark appeal objections Patent Disputes Chamber administrative appeal",
          },
          {
            id: "ru-rospatent-trademark-renewal-name",
            targetId: "ru-rospatent-trademark-renewal",
            query: "Rospatent trademark renewal ten years six month additional period fees",
          },
          '''
          replace_once(
              'packages/persistence/src/retrieval-relevance-audit.ts',
              '] satisfies readonly RetrievalRelevanceProbe[];',
              probes + '] satisfies readonly RetrievalRelevanceProbe[];'
          )

          for anchor in [
              '  EIPA_EG_SOURCE_COVERAGE_TARGETS,\n  IPOS_SOURCE_COVERAGE_TARGETS,',
          ]:
              replace_once(
                  'packages/persistence/src/source-coverage-catalog.ts',
                  anchor,
                  '  EIPA_EG_SOURCE_COVERAGE_TARGETS,\n  ROSPATENT_RU_SOURCE_COVERAGE_TARGETS,\n  IPOS_SOURCE_COVERAGE_TARGETS,'
              )

          replace_once(
              'packages/persistence/tests/priority-national-source-coverage.test.ts',
              '  EIPA_EG_SOURCE_COVERAGE_TARGETS,\n  IPOS_SOURCE_COVERAGE_TARGETS,',
              '  EIPA_EG_SOURCE_COVERAGE_TARGETS,\n  ROSPATENT_RU_SOURCE_COVERAGE_TARGETS,\n  IPOS_SOURCE_COVERAGE_TARGETS,'
          )
          replace_once(
              'packages/persistence/tests/priority-national-source-coverage.test.ts',
              '  ["EG", EIPA_EG_SOURCE_COVERAGE_TARGETS, ["egypo.gov.eg", "wipo.int"]],\n  ["CA", CIPO_SOURCE_COVERAGE_TARGETS, ["canada.ca"]],',
              '  ["EG", EIPA_EG_SOURCE_COVERAGE_TARGETS, ["egypo.gov.eg", "wipo.int"]],\n  ["RU", ROSPATENT_RU_SOURCE_COVERAGE_TARGETS, ["rospatent.gov.ru"]],\n  ["CA", CIPO_SOURCE_COVERAGE_TARGETS, ["canada.ca"]],'
          )
          replace_once(
              'packages/persistence/tests/priority-national-source-coverage.test.ts',
              'ships explicit, official, unique coverage for seventy-eight priority national offices',
              'ships explicit, official, unique coverage for seventy-nine priority national offices'
          )
          replace_once(
              'packages/persistence/tests/priority-national-source-coverage.test.ts',
              'toHaveLength(630)', 'toHaveLength(639)'
          )
          replace_once(
              'packages/persistence/tests/priority-national-source-coverage.test.ts',
              '      630,\n    );', '      639,\n    );'
          )
          replace_once(
              'packages/persistence/tests/priority-national-source-coverage.test.ts',
              '    ).toBe(630);', '    ).toBe(639);'
          )

          replace_once(
              'packages/persistence/tests/retrieval-relevance-audit.test.ts',
              'expect(targets).toHaveLength(585);', 'expect(targets).toHaveLength(593);'
          )
          replace_once(
              'packages/persistence/tests/retrieval-relevance-audit.test.ts',
              'expect(FOUNDATIONAL_RETRIEVAL_RELEVANCE_PROBES).toHaveLength(585);',
              'expect(FOUNDATIONAL_RETRIEVAL_RELEVANCE_PROBES).toHaveLength(593);'
          )
          replace_once(
              'packages/persistence/tests/retrieval-relevance-audit.test.ts',
              '      585,\n    );', '      593,\n    );'
          )
          replace_once(
              'packages/persistence/tests/retrieval-relevance-audit.test.ts',
              '    expect(\n      listSourceCoverageTargets({ jurisdiction: "EG", coverageTier: "FOUNDATIONAL" }).every(\n        (target) => targetIds.has(target.id),\n      ),\n    ).toBe(true);\n  });',
              '    expect(\n      listSourceCoverageTargets({ jurisdiction: "EG", coverageTier: "FOUNDATIONAL" }).every(\n        (target) => targetIds.has(target.id),\n      ),\n    ).toBe(true);\n    expect(\n      listSourceCoverageTargets({ jurisdiction: "RU", coverageTier: "FOUNDATIONAL" }).every(\n        (target) => targetIds.has(target.id),\n      ),\n    ).toBe(true);\n  });'
          )

          replace_once(
              'packages/persistence/src/priority-trademark-jurisdictions.ts',
              '["RU", "Russian Federation", "EUROPE", "P0", "TARGET", "NATIONAL"]',
              '["RU", "Russian Federation", "EUROPE", "P0", "CURATED", "NATIONAL"]'
          )
          replace_once(
              'packages/persistence/tests/priority-trademark-jurisdictions.test.ts',
              'expect(curated).toHaveLength(79);', 'expect(curated).toHaveLength(80);'
          )
          replace_once(
              'packages/persistence/tests/priority-trademark-jurisdictions.test.ts',
              'expect(target).toHaveLength(41);', 'expect(target).toHaveLength(40);'
          )
          PY
      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            packages/persistence/src/priority-national-source-coverage.ts \
            packages/persistence/src/retrieval-relevance-audit.ts \
            packages/persistence/src/source-coverage-catalog.ts \
            packages/persistence/src/priority-trademark-jurisdictions.ts \
            packages/persistence/tests/priority-national-source-coverage.test.ts \
            packages/persistence/tests/retrieval-relevance-audit.test.ts \
            packages/persistence/tests/priority-trademark-jurisdictions.test.ts
      - name: Verify Russia coverage
        run: |
          pnpm --filter @markorbit/persistence test -- \
            tests/priority-national-source-coverage.test.ts \
            tests/retrieval-relevance-audit.test.ts \
            tests/priority-trademark-jurisdictions.test.ts
          pnpm typecheck
      - name: Commit verified changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/persistence/src/priority-national-source-coverage.ts \
            packages/persistence/src/retrieval-relevance-audit.ts \
            packages/persistence/src/source-coverage-catalog.ts \
            packages/persistence/src/priority-trademark-jurisdictions.ts \
            packages/persistence/tests/priority-national-source-coverage.test.ts \
            packages/persistence/tests/retrieval-relevance-audit.test.ts \
            packages/persistence/tests/priority-trademark-jurisdictions.test.ts
          git commit -m "feat: add Rospatent trademark source coverage"
          git push origin HEAD:agent/ru-rospatent-source-coverage-v1
