name: ADK Final Format

on:
  push:
    branches:
      - agent/adk-00-01-ai-distilled-acquisition

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adk-00-01-ai-distilled-acquisition
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/worker-runtime/src/ai-distilled-knowledge-acquirer.test.ts
      - name: Commit output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/worker-runtime/src/ai-distilled-knowledge-acquirer.test.ts
          git commit -m "style(adk): format final runtime test"
          git push origin HEAD:agent/adk-00-01-ai-distilled-acquisition
