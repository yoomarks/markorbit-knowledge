name: Issue 704 Retrieval Paging Patch

on:
  push:
    branches:
      - issue-hybrid-search-completeness
    paths:
      - .github/workflows/issue-704-retrieval-paging-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-hybrid-search-completeness
          fetch-depth: 0
      - name: Apply exact retrieval paging patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "packages/contracts/src/retrieval-v1.ts",
              "  authorityLevel?: AuthorityLevel;\n  limit?: number;\n",
              "  authorityLevel?: AuthorityLevel;\n  limit?: number;\n  offset?: number;\n",
          )

          replace_once(
              "packages/persistence/src/retrieval-index.ts",
              '''function normalizeLimit(value?: number): number {\n  if (value === undefined) return 20;\n  if (!Number.isSafeInteger(value) || value <= 0) {\n    throw new RegistryValidationError("retrieval limit must be a positive integer");\n  }\n  return Math.min(value, MAX_SEARCH_LIMIT);\n}\n''',
              '''function normalizeLimit(value?: number): number {\n  if (value === undefined) return 20;\n  if (!Number.isSafeInteger(value) || value <= 0) {\n    throw new RegistryValidationError("retrieval limit must be a positive integer");\n  }\n  return Math.min(value, MAX_SEARCH_LIMIT);\n}\n\nfunction normalizeOffset(value?: number): number {\n  if (value === undefined) return 0;\n  if (!Number.isSafeInteger(value) || value < 0) {\n    throw new RegistryValidationError("retrieval offset must be a non-negative integer");\n  }\n  return value;\n}\n''',
          )

          replace_once(
              "packages/persistence/src/retrieval-index.ts",
              "    const limit = normalizeLimit(request.limit);\n    const match = ftsQuery(query);\n",
              "    const limit = normalizeLimit(request.limit);\n    const offset = normalizeOffset(request.offset);\n    const match = ftsQuery(query);\n",
          )

          replace_once(
              "packages/persistence/src/retrieval-index.ts",
              '''         ORDER BY rank ASC, d.artifact_version DESC, c.ordinal ASC\n         LIMIT ?`,\n      )\n      .all(...values, limit) as Record<string, unknown>[];\n''',
              '''         ORDER BY rank ASC, d.artifact_version DESC, c.ordinal ASC\n         LIMIT ? OFFSET ?`,\n      )\n      .all(...values, limit, offset) as Record<string, unknown>[];\n''',
          )

          test_path = Path("packages/persistence/tests/retrieval-index.test.ts")
          test_text = test_path.read_text()
          anchor = '''  it("is idempotent for the same verified staging evidence and rejects digest drift", () => {'''
          if test_text.count(anchor) != 1:
              raise SystemExit("retrieval-index.test.ts: idempotency anchor missing or duplicated")
          paging_test = '''  it("pages through FTS hits beyond the 50-hit retrieval window without changing the exact total", () => {\n    const repository = new SqliteRetrievalIndexRepository(\n      new DatabaseSync(":memory:"),\n      () => new Date("2026-08-09T00:00:00.000Z"),\n    );\n    const body = Array.from(\n      { length: 75 },\n      (_, index) =>\n        `## Complete search section ${index}\\n\\nComplete search needle evidence for section ${index}.`,\n    ).join("\\n\\n");\n    indexVersion(repository, 1, body);\n\n    const first = repository.search({\n      workspaceId,\n      query: "complete search needle",\n      limit: 50,\n    });\n    const second = repository.search({\n      workspaceId,\n      query: "complete search needle",\n      limit: 50,\n      offset: 50,\n    });\n\n    expect(first.total).toBe(75);\n    expect(first.items).toHaveLength(50);\n    expect(second.total).toBe(75);\n    expect(second.items).toHaveLength(25);\n    expect(new Set(first.items.map((item) => item.chunk.chunkId)).size).toBe(50);\n    expect(second.items.every((item) => !first.items.some((firstItem) => firstItem.chunk.chunkId === item.chunk.chunkId))).toBe(true);\n  });\n\n'''
          test_path.write_text(test_text.replace(anchor, paging_test + anchor, 1))

          Path(".github/workflows/issue-704-retrieval-paging-patch.yml").unlink()
          PY

          git config user.name "markorbit-automation"
          git config user.email "actions@users.noreply.github.com"
          git add packages/contracts/src/retrieval-v1.ts packages/persistence/src/retrieval-index.ts packages/persistence/tests/retrieval-index.test.ts .github/workflows/issue-704-retrieval-paging-patch.yml
          git commit -m "fix: make retrieval FTS hits pageable (#704)"
          git push origin HEAD:issue-hybrid-search-completeness
