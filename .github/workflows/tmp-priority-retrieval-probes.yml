name: Temporary priority coverage retrieval probes

on:
  push:
    branches:
      - codex/priority-national-source-coverage-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/tmp/patch_priority_retrieval_probes.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/persistence/src/retrieval-relevance-audit.ts packages/persistence/tests/retrieval-relevance-audit.test.ts
      - run: pnpm --filter @markorbit/persistence exec vitest run tests/retrieval-relevance-audit.test.ts tests/priority-national-source-coverage.test.ts tests/source-coverage-catalog.test.ts
      - run: pnpm typecheck
      - name: Commit probes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/retrieval-relevance-audit.ts packages/persistence/tests/retrieval-relevance-audit.test.ts
          git commit -m "Retrieval: add smoke probes for priority national sources" || true
          git push
