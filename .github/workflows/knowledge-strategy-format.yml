name: Knowledge Strategy Autoformat

on:
  push:
    branches:
      - docs/knowledge-four-pillar-strategy
    paths:
      - .github/workflows/knowledge-strategy-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/knowledge-four-pillar-strategy
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format strategy documents
        run: >-
          pnpm exec prettier --write
          docs/architecture/CASE_DOSSIER_AND_EXPERT_SOURCE_ARCHITECTURE.md
          docs/architecture/KNOWLEDGE_CAPABILITY_SOURCE_BOUNDARIES.md
          docs/product/KNOWLEDGE_LONG_TERM_STRATEGY.md
          docs/product/MarkOrbit_Knowledge_vNext.md
          docs/project/CURRENT_STATE.md
          docs/project/KNOWLEDGE_STRATEGIC_REVIEW_2026-08-25.md
          docs/tasks/K-EXT-C-EMAIL-WORKER-PRODUCTION-INGESTION.md
          docs/tasks/KNOWLEDGE_STRATEGIC_EXECUTION_PLAN.md
          docs/tasks/MARKORBIT_CAPABILITY_MIGRATION_HANDOFF.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/CASE_DOSSIER_AND_EXPERT_SOURCE_ARCHITECTURE.md docs/architecture/KNOWLEDGE_CAPABILITY_SOURCE_BOUNDARIES.md docs/product/KNOWLEDGE_LONG_TERM_STRATEGY.md docs/product/MarkOrbit_Knowledge_vNext.md docs/project/CURRENT_STATE.md docs/project/KNOWLEDGE_STRATEGIC_REVIEW_2026-08-25.md docs/tasks/K-EXT-C-EMAIL-WORKER-PRODUCTION-INGESTION.md docs/tasks/KNOWLEDGE_STRATEGIC_EXECUTION_PLAN.md docs/tasks/MARKORBIT_CAPABILITY_MIGRATION_HANDOFF.md
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "chore: prettier Knowledge strategy documents"
          git push origin HEAD:docs/knowledge-four-pillar-strategy
