name: K-EXT-B Local Folder Worker

on:
  pull_request:
    paths:
      - ".github/workflows/k-ext-b-local-folder-worker.yml"
      - "workers/local_folder/**"
      - "apps/admin/src/server/local-folder-production-connector.ts"
      - "docs/tasks/K-EXT-B-LOCAL-FOLDER-WORKER-PRODUCTION-INGESTION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-folder-worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Worker
        run: python -m compileall -q workers/local_folder
      - name: Run Local Folder Worker tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s workers/local_folder/tests -p 'test_*.py' -v
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate repository gates
        run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test && pnpm build
