name: Temporary Phase2 USPTO Fee Prettier

on:
  push:
    branches:
      - phase2/uspto-official-fee-research-pilot

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2/uspto-official-fee-research-pilot
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 2 fee pilot tests
        run: >-
          pnpm exec prettier --write
          apps/worker/src/uspto-official-fee-pilot.test.ts
          apps/worker/src/uspto-public-corpus-discovery.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/worker/src/uspto-official-fee-pilot.test.ts apps/worker/src/uspto-public-corpus-discovery.test.ts
          git commit -m "style: format Phase 2 USPTO fee pilot"
          git push origin HEAD:phase2/uspto-official-fee-research-pilot
