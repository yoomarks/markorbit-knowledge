name: Agent R1-K03 Format Preview

on:
  push:
    branches:
      - r1-k03-ready-package-content-export-v1

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm prettier --write apps/admin/src/server/ready-package-content-export.ts docs/architecture/READY_PACKAGE_CONTENT_EXPORT_V1.md packages/contracts/src/ready-package-content-export-v1.ts packages/contracts/tests/ready-package-content-export-v1.test.ts apps/admin/src/server/__tests__/ready-package-content-export.test.ts
          git diff --no-ext-diff --unified=0 -- apps/admin/src/server/ready-package-content-export.ts docs/architecture/READY_PACKAGE_CONTENT_EXPORT_V1.md packages/contracts/src/ready-package-content-export-v1.ts packages/contracts/tests/ready-package-content-export-v1.test.ts apps/admin/src/server/__tests__/ready-package-content-export.test.ts
