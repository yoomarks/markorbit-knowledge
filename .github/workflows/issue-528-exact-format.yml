name: Issue 528 Exact Format

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'issue-528-kg-007-local-graph-view'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format KG-007 files
        run: >-
          pnpm exec prettier --write
          'apps/admin/src/app/api/knowledge/[id]/graph/route.ts'
          apps/admin/src/components/knowledge/content-local-graph.tsx
          apps/admin/src/server/knowledge-reader-graph.test.ts
          apps/admin/src/server/knowledge-reader-graph.ts
      - name: Commit format
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'apps/admin/src/app/api/knowledge/[id]/graph/route.ts' \
            apps/admin/src/components/knowledge/content-local-graph.tsx \
            apps/admin/src/server/knowledge-reader-graph.test.ts \
            apps/admin/src/server/knowledge-reader-graph.ts
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'style: format KG-007 local graph'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
