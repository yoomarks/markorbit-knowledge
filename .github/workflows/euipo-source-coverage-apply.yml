name: EUIPO Source Coverage Apply

on:
  push:
    branches:
      - codex/euipo-source-coverage-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/euipo-source-coverage-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate EUIPO catalog and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          contract = Path("packages/contracts/src/source-coverage-v1.ts")
          text = contract.read_text()
          needle = '  "TTAB_PROCEEDINGS",\n  "OFFICIAL_GAZETTE",'
          replacement = (
              '  "TTAB_PROCEEDINGS",\n'
              '  "PROCEEDINGS",\n'
              '  "APPEALS_AND_CASELAW",\n'
              '  "LEGAL_TEXTS",\n'
              '  "OFFICIAL_GAZETTE",'
          )
          if needle not in text:
              raise SystemExit("source coverage family insertion point not found")
          contract.write_text(text.replace(needle, replacement, 1))

          catalog = Path("packages/persistence/src/source-coverage-catalog.ts")
          text = catalog.read_text()
          import_needle = 'import { WIPO_SOURCE_COVERAGE_TARGETS } from "./wipo-source-coverage";'
          if import_needle not in text:
              raise SystemExit("WIPO catalog import not found")
          text = text.replace(
              import_needle,
              'import { EUIPO_SOURCE_COVERAGE_TARGETS } from "./euipo-source-coverage";\n' + import_needle,
              1,
          )
          tail_needle = '''export { WIPO_SOURCE_COVERAGE_TARGETS };
          export const SOURCE_COVERAGE_TARGETS = [
            ...US_SOURCE_COVERAGE_TARGETS,
            ...WIPO_SOURCE_COVERAGE_TARGETS,
          ] satisfies readonly SourceCoverageTarget[];'''
          tail_replacement = '''export { EUIPO_SOURCE_COVERAGE_TARGETS, WIPO_SOURCE_COVERAGE_TARGETS };
          export const SOURCE_COVERAGE_TARGETS = [
            ...US_SOURCE_COVERAGE_TARGETS,
            ...WIPO_SOURCE_COVERAGE_TARGETS,
            ...EUIPO_SOURCE_COVERAGE_TARGETS,
          ] satisfies readonly SourceCoverageTarget[];'''
          if tail_needle not in text:
              raise SystemExit("source coverage catalog tail not found")
          catalog.write_text(text.replace(tail_needle, tail_replacement, 1))

          us_test = Path("packages/persistence/tests/source-coverage-catalog.test.ts")
          text = us_test.read_text()
          test_needle = 'const targets = listSourceCoverageTargets({ family: "EXAMINATION_MANUAL" });'
          test_replacement = '''const targets = listSourceCoverageTargets({
              jurisdiction: "US",
              family: "EXAMINATION_MANUAL",
            });'''
          if test_needle not in text:
              raise SystemExit("US examination manual fixture not found")
          us_test.write_text(text.replace(test_needle, test_replacement, 1))
          PY

          pnpm exec prettier --write \
            packages/contracts/src/source-coverage-v1.ts \
            packages/persistence/src/source-coverage-catalog.ts \
            packages/persistence/src/euipo-source-coverage.ts \
            packages/persistence/tests/euipo-source-coverage.test.ts \
            packages/persistence/tests/source-coverage-catalog.test.ts \
            docs/architecture/M20_EUIPO_SOURCE_COVERAGE_MAP.md

          pnpm exec vitest run \
            packages/persistence/tests/euipo-source-coverage.test.ts \
            packages/persistence/tests/source-coverage-catalog.test.ts \
            packages/persistence/tests/wipo-source-coverage.test.ts

          rm .github/workflows/euipo-source-coverage-apply.yml
          git config user.name "markorbit-bot"
          git config user.email "markorbit-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate EUIPO source coverage catalog"
          git push origin HEAD:codex/euipo-source-coverage-v1
