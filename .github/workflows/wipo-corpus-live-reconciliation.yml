name: WIPO Corpus Live Reconciliation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/wipo-corpus-live-reconciliation.yml
      - apps/worker/src/wipo-public-corpus-discovery.ts
      - apps/worker/src/wipo-corpus-reconciliation.ts
      - apps/worker/src/reconcile-wipo-corpus.ts
      - apps/worker/src/live-acquisition-profile-evidence.ts
      - apps/worker/src/acquisition-learning-profiles.ts
      - packages/worker-runtime/src/acquisition-learning-profile.ts
      - apps/worker/package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: wipo-corpus-live-reconciliation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Reconcile live WIPO corpus
        id: reconcile
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/wipo-corpus-reconciliation"
          pnpm --filter @markorbit/worker reconcile:wipo-corpus \
            > "$RUNNER_TEMP/wipo-corpus-reconciliation/report.json"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          node -e '
            const fs = require("fs");
            const path = process.env.RUNNER_TEMP + "/wipo-corpus-reconciliation/report.json";
            const report = JSON.parse(fs.readFileSync(path, "utf8"));
            const learning = report.acquisitionLearning;
            if (learning?.profileId !== "toc-graph-html-v1") throw new Error(`Unexpected WIPO profile ${learning?.profileId}`);
            if (learning?.evidence?.playbookId !== "official-toc-graph" || learning?.evidence?.playbookRevision !== 1) {
              throw new Error("WIPO reconciliation did not reuse official-toc-graph@1");
            }
            if (!learning?.fingerprint?.discoverySurfaces?.includes("TOC")) throw new Error("WIPO fingerprint missing TOC surface");
            const boundaries = learning?.evidence?.boundaries;
            if (boundaries?.legalTruthVerified !== false || boundaries?.autoPromotionApplied !== false || boundaries?.collectionAuthorityGranted !== false) {
              throw new Error("WIPO canary crossed an acquisition-learning governance boundary");
            }
            const lines = [
              "## WIPO Corpus Live Reconciliation",
              "",
              `- Seeds: ${report.successfulSeedCount}/${report.seedCount} reachable`,
              `- Discovered links: ${report.discoveredLinkCount}`,
              `- Referenced assets: ${report.referencedAssetCount}`,
              `- Failed seeds: ${report.failedSeedCount}`,
              `- Measured bytes: ${report.totalFetchedBytes}`,
              `- Acquisition playbook: ${learning.evidence.playbookId}@${learning.evidence.playbookRevision}`,
              "",
              "### Integration chain",
              "",
              ...report.integrationChain.map((stage) => `- ${stage.domain}: ${stage.state} (links=${stage.discoveredLinkCount})`),
            ];
            fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n", { flag: "a" });
          '
          exit 0

      - name: Upload WIPO corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wipo-corpus-live-reconciliation-${{ github.run_id }}
          path: ${{ runner.temp }}/wipo-corpus-reconciliation/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce reconciliation result
        if: always()
        shell: bash
        run: exit "${{ steps.reconcile.outputs.exit_code }}"
