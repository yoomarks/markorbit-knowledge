name: Search UX V2 State Race Fix

on:
  push:
    branches: [issue-710-search-ux-v2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-710-search-ux-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preserve the latest URL state across debounced query updates
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/admin/src/components/knowledge/knowledge-hybrid-search-v2.tsx")
          lines = path.read_text().splitlines()
          state_anchor = "  const state = useMemo(() => readKnowledgeSearchState(searchParams), [searchParams]);"
          state_index = lines.index(state_anchor)
          lines[state_index + 1:state_index + 1] = [
              "  const latestQueryRef = useRef(searchParams.toString());",
              "  latestQueryRef.current = searchParams.toString();",
          ]
          query_line = "      const query = patchKnowledgeSearchQuery(searchParams.toString(), patch, resetOffset);"
          query_index = lines.index(query_line)
          lines[query_index] = "      const query = patchKnowledgeSearchQuery(latestQueryRef.current, patch, resetOffset);"
          lines.insert(query_index + 1, "      latestQueryRef.current = query;")
          deps_line = "    [pathname, router, searchParams],"
          lines[lines.index(deps_line)] = "    [pathname, router],"
          path.write_text("\n".join(lines) + "\n")
          PY
          pnpm exec prettier --write apps/admin/src/components/knowledge/knowledge-hybrid-search-v2.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/components/knowledge/knowledge-hybrid-search-v2.tsx
          git commit -m "fix: preserve latest Search URL state during debounce (#710)"
          git push origin HEAD:issue-710-search-ux-v2
