name: Temporary Priority 120 LATAM Caribbean Five

on:
  push:
    branches:
      - agent/priority-120-final-latam-caribbean-six-v1

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/priority-120-final-latam-caribbean-six-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply curated five-country coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f'expected anchor not found in {path}: {old[:180]!r}')
              p.write_text(text.replace(old, new, 1))

          block = '''const SENAPI_BO: Authority = {
