name: PR700 Preserve Worker Credential Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr700-preserve-worker-credential-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.number == 700 && github.head_ref == 'issue-697-admin-browser-acceptance'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preserve one-time Worker credential before detail navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:140]}')
              p.write_text(text.replace(old, new, count))

          path = 'apps/admin/src/components/workers/worker-editor.tsx'
          replace(
              path,
              '  const [oneTimeCredential, setOneTimeCredential] = useState<string | null>(null);',
              '  const [oneTimeCredential, setOneTimeCredential] = useState<string | null>(null);\n  const [createdWorkerId, setCreatedWorkerId] = useState<string | null>(null);\n  const activeWorkerId = workerId ?? createdWorkerId;',
          )
          replace(
              path,
              '      const response = await fetch(workerId ? `/api/workers/${workerId}` : "/api/workers", {\n        method: workerId ? "PATCH" : "POST",',
              '      const response = await fetch(\n        activeWorkerId ? `/api/workers/${activeWorkerId}` : "/api/workers",\n        {\n          method: activeWorkerId ? "PATCH" : "POST",',
          )
          replace(
              path,
              '          workerId\n            ? { ...workerPayload, expectedUpdatedAt: view?.worker.updatedAt }\n            : workerPayload,\n        ),\n      });',
              '          activeWorkerId\n            ? { ...workerPayload, expectedUpdatedAt: view?.worker.updatedAt }\n            : workerPayload,\n        ),\n      },\n      );',
          )
          replace(
              path,
              '      if (!workerId && "credential" in body) {\n        setOneTimeCredential(body.credential);\n        router.replace(`/workers/${body.view.worker.id}`);',
              '      if (!activeWorkerId && "credential" in body) {\n        setCreatedWorkerId(body.view.worker.id);\n        setOneTimeCredential(body.credential);',
          )
          replace(
              path,
              '              onClick={() => setOneTimeCredential(null)}',
              '              onClick={() => {\n                setOneTimeCredential(null);\n                if (createdWorkerId) router.replace(`/workers/${createdWorkerId}`);\n              }}',
          )

          path = 'apps/worker/src/run-admin-browser-acceptance.ts'
          replace(
              path,
              '  await page.waitForURL((url) => /^\\/workers\\/wrk_[0-9A-HJKMNP-TV-Z]{26}$/.test(url.pathname));\n  await page.getByText("一次性 Worker 凭证", { exact: true }).waitFor();\n  assert.equal(\n    await page.getByLabel("显示名称").inputValue(),\n    "Browser Acceptance Worker",\n    "saved Worker name must remain visible after navigation",\n  );',
              '  const credentialPanel = page.locator("section").filter({ hasText: "一次性 Worker 凭证" });\n  await credentialPanel.getByText("一次性 Worker 凭证", { exact: true }).waitFor();\n  const credential = (await credentialPanel.locator("code").textContent())?.trim();\n  assert.ok(credential && credential.length >= 20, "one-time Worker credential must be visibly rendered");\n  await page.getByRole("button", { name: "关闭凭证提示" }).click();\n  await page.waitForURL((url) => /^\\/workers\\/wrk_[0-9A-HJKMNP-TV-Z]{26}$/.test(url.pathname));\n  assert.equal(\n    await page.getByLabel("显示名称").inputValue(),\n    "Browser Acceptance Worker",\n    "saved Worker name must remain visible after credential handoff",\n  );',
          )
          PY
          pnpm exec prettier --write \
            apps/admin/src/components/workers/worker-editor.tsx \
            apps/worker/src/run-admin-browser-acceptance.ts
          pnpm --filter @markorbit/admin typecheck
          pnpm --filter @markorbit/worker typecheck
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/src/components/workers/worker-editor.tsx \
            apps/worker/src/run-admin-browser-acceptance.ts
          git commit -m "fix: preserve one-time Worker credential before navigation"
          git push origin HEAD:${{ github.head_ref }}