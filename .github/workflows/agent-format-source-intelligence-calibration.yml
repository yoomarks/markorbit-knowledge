name: Agent Format Source Intelligence Calibration

on:
  push:
    branches:
      - agent/source-intelligence-calibration-cohort-final2
    paths:
      - .github/workflows/agent-format-source-intelligence-calibration.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/source-intelligence-calibration-cohort-final2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          docs/validation/SOURCE_INTELLIGENCE_CALIBRATION_BASELINE_2026-08-08.md
          scripts/source-intelligence-calibration.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/SOURCE_INTELLIGENCE_CALIBRATION_BASELINE_2026-08-08.md scripts/source-intelligence-calibration.mjs
          git commit -m "style: format source intelligence calibration"
          git push origin HEAD:agent/source-intelligence-calibration-cohort-final2
