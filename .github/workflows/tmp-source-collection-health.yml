name: Temporary source collection health patch

on:
  push:
    branches:
      - codex/source-collection-health-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/source-collection-health-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply collection health changes
        shell: python
        run: |
          from pathlib import Path

          helper = Path("apps/admin/src/server/source-collection-health.ts")
          helper.write_text('''import type { DatabaseSync, SQLInputValue } from "node:sqlite";\nimport type { CollectionRunStatus } from "@markorbit/contracts";\nimport { RegistryValidationError } from "@markorbit/persistence";\n\nexport type SourceCollectionHealthState =\n  | "NEVER_RUN"\n  | "COLLECTING"\n  | "HEALTHY"\n  | "RETRYING"\n  | "FAILING"\n  | "CANCELLED";\n\nexport type SourceCollectionHealth = {\n  state: SourceCollectionHealthState;\n  latestRunStatus: CollectionRunStatus | null;\n  latestRunAt: string | null;\n  lastFailureAt: string | null;\n  consecutiveFailures: number;\n  failedRuns: number;\n};\n\nexport type SourceCollectionHealthRow = {\n  sourceId: string;\n  status: CollectionRunStatus;\n  updatedAt: string;\n  retrying: boolean;\n  jobFailureAt: string | null;\n};\n\nconst HISTORY_LIMIT = 20;\nconst MAX_SOURCES = 100;\n\nfunction emptyHealth(): SourceCollectionHealth {\n  return {\n    state: "NEVER_RUN",\n    latestRunStatus: null,\n    latestRunAt: null,\n    lastFailureAt: null,\n    consecutiveFailures: 0,\n    failedRuns: 0,\n  };\n}\n\nexport function summarizeSourceCollectionHealth(\n  rows: SourceCollectionHealthRow[],\n): SourceCollectionHealth {\n  if (rows.length === 0) return emptyHealth();\n  const latest = rows[0]!;\n  let state: SourceCollectionHealthState;\n  if (latest.retrying) state = "RETRYING";\n  else if (latest.status === "FAILED") state = "FAILING";\n  else if (latest.status === "COMPLETED") state = "HEALTHY";\n  else if (latest.status === "CANCELLED") state = "CANCELLED";\n  else state = "COLLECTING";\n\n  let consecutiveFailures = 0;\n  for (const row of rows) {\n    if (row.status !== "FAILED") break;\n    consecutiveFailures += 1;\n  }\n  const failedRuns = rows.filter((row) => row.status === "FAILED").length;\n  const lastFailureAt =\n    rows.find((row) => row.jobFailureAt !== null)?.jobFailureAt ??\n    rows.find((row) => row.status === "FAILED")?.updatedAt ??\n    null;\n\n  return {\n    state,\n    latestRunStatus: latest.status,\n    latestRunAt: latest.updatedAt,\n    lastFailureAt,\n    consecutiveFailures,\n    failedRuns,\n  };\n}\n\nexport function listSourceCollectionHealth(\n  database: DatabaseSync,\n  sourceIds: string[],\n  historyLimit = HISTORY_LIMIT,\n): Record<string, SourceCollectionHealth> {\n  const ids = [...new Set(sourceIds.map((id) => id.trim()).filter(Boolean))];\n  if (ids.length === 0) return {};\n  if (ids.length > MAX_SOURCES) {\n    throw new RegistryValidationError(`sourceIds must contain at most ${MAX_SOURCES} sources`);\n  }\n  if (!Number.isInteger(historyLimit) || historyLimit < 1 || historyLimit > 100) {\n    throw new RegistryValidationError("historyLimit must be an integer from 1 to 100");\n  }\n\n  const placeholders = ids.map(() => "?").join(", ");\n  const rows = database\n    .prepare(\n      `WITH ranked AS (\n         SELECT r.id, r.source_id, r.status, r.updated_at,\n                ROW_NUMBER() OVER (\n                  PARTITION BY r.source_id\n                  ORDER BY r.created_at DESC, r.id DESC\n                ) AS row_number\n         FROM collection_runs r\n         WHERE r.source_id IN (${placeholders})\n       )\n       SELECT ranked.source_id AS sourceId,\n              ranked.status,\n              ranked.updated_at AS updatedAt,\n              EXISTS(\n                SELECT 1 FROM jobs j\n                WHERE j.run_id = ranked.id\n                  AND (j.status = 'RETRY' OR (j.attempt > 1 AND j.status IN ('PENDING', 'LEASED', 'RUNNING')))\n              ) AS retrying,\n              (\n                SELECT MAX(j.updated_at) FROM jobs j\n                WHERE j.run_id = ranked.id\n                  AND j.status IN ('RETRY', 'FAILED', 'DEAD_LETTER')\n              ) AS jobFailureAt\n       FROM ranked\n       WHERE ranked.row_number <= ?\n       ORDER BY ranked.source_id ASC, ranked.row_number ASC`,\n    )\n    .all(...(ids as SQLInputValue[]), historyLimit) as Array<{\n    sourceId: string;\n    status: CollectionRunStatus;\n    updatedAt: string;\n    retrying: number;\n    jobFailureAt: string | null;\n  }>;\n\n  const grouped = new Map<string, SourceCollectionHealthRow[]>();\n  for (const id of ids) grouped.set(id, []);\n  for (const row of rows) {\n    grouped.get(row.sourceId)?.push({ ...row, retrying: row.retrying === 1 });\n  }\n  return Object.fromEntries(\n    ids.map((id) => [id, summarizeSourceCollectionHealth(grouped.get(id) ?? [])]),\n  );\n}\n''')

          test = Path("apps/admin/src/server/__tests__/source-collection-health.test.ts")
          test.write_text('''import { describe, expect, it } from "vitest";\nimport { summarizeSourceCollectionHealth } from "../source-collection-health";\n\ndescribe("source collection health", () => {\n  it("distinguishes never-run, healthy, collecting and cancelled sources", () => {\n    expect(summarizeSourceCollectionHealth([]).state).toBe("NEVER_RUN");\n    expect(\n      summarizeSourceCollectionHealth([\n        {\n          sourceId: "src_a",\n          status: "COMPLETED",\n          updatedAt: "2026-08-15T12:00:00.000Z",\n          retrying: false,\n          jobFailureAt: null,\n        },\n      ]).state,\n    ).toBe("HEALTHY");\n    expect(\n      summarizeSourceCollectionHealth([\n        {\n          sourceId: "src_a",\n          status: "RUNNING",\n          updatedAt: "2026-08-15T12:00:00.000Z",\n          retrying: false,\n          jobFailureAt: null,\n        },\n      ]).state,\n    ).toBe("COLLECTING");\n    expect(\n      summarizeSourceCollectionHealth([\n        {\n          sourceId: "src_a",\n          status: "CANCELLED",\n          updatedAt: "2026-08-15T12:00:00.000Z",\n          retrying: false,\n          jobFailureAt: null,\n        },\n      ]).state,\n    ).toBe("CANCELLED");\n  });\n\n  it("surfaces durable retry state before terminal failure", () => {\n    const health = summarizeSourceCollectionHealth([\n      {\n        sourceId: "src_a",\n        status: "PENDING",\n        updatedAt: "2026-08-15T12:00:10.000Z",\n        retrying: true,\n        jobFailureAt: "2026-08-15T12:00:09.000Z",\n      },\n      {\n        sourceId: "src_a",\n        status: "COMPLETED",\n        updatedAt: "2026-08-15T11:00:00.000Z",\n        retrying: false,\n        jobFailureAt: null,\n      },\n    ]);\n    expect(health).toMatchObject({\n      state: "RETRYING",\n      latestRunStatus: "PENDING",\n      lastFailureAt: "2026-08-15T12:00:09.000Z",\n      consecutiveFailures: 0,\n      failedRuns: 0,\n    });\n  });\n\n  it("aggregates consecutive and recent terminal failures", () => {\n    const health = summarizeSourceCollectionHealth([\n      {\n        sourceId: "src_a",\n        status: "FAILED",\n        updatedAt: "2026-08-15T12:00:00.000Z",\n        retrying: false,\n        jobFailureAt: "2026-08-15T11:59:59.000Z",\n      },\n      {\n        sourceId: "src_a",\n        status: "FAILED",\n        updatedAt: "2026-08-15T11:00:00.000Z",\n        retrying: false,\n        jobFailureAt: null,\n      },\n      {\n        sourceId: "src_a",\n        status: "COMPLETED",\n        updatedAt: "2026-08-15T10:00:00.000Z",\n        retrying: false,\n        jobFailureAt: null,\n      },\n      {\n        sourceId: "src_a",\n        status: "FAILED",\n        updatedAt: "2026-08-15T09:00:00.000Z",\n        retrying: false,\n        jobFailureAt: null,\n      },\n    ]);\n    expect(health).toMatchObject({\n      state: "FAILING",\n      consecutiveFailures: 2,\n      failedRuns: 3,\n      lastFailureAt: "2026-08-15T11:59:59.000Z",\n    });\n  });\n});\n''')

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new))

          route = "apps/admin/src/app/api/sources/route.ts"
          replace(
              route,
              '''import { apiError, readJson, requireRecord } from "@/server/api-errors";\nimport { getSourceAssessmentRepository, getSourceRepository } from "@/server/source-registry";\n''',
              '''import { apiError, readJson, requireRecord } from "@/server/api-errors";\nimport { listSourceCollectionHealth } from "@/server/source-collection-health";\nimport {\n  getRegistryDatabase,\n  getSourceAssessmentRepository,\n  getSourceRepository,\n} from "@/server/source-registry";\n''',
          )
          replace(
              route,
              '''  return {\n    ...result,\n    assessments: Object.fromEntries(\n''',
              '''  return {\n    ...result,\n    collectionHealth: listSourceCollectionHealth(\n      getRegistryDatabase(),\n      result.items.map((source) => source.id),\n    ),\n    assessments: Object.fromEntries(\n''',
          )

          ui = "apps/admin/src/components/sources/source-list.tsx"
          replace(
              ui,
              '''type SourceListPayload = SourceListResult & {\n  assessments?: Record<string, SourceValueSummary>;\n};\n''',
              '''type CollectionHealthState =\n  | "NEVER_RUN"\n  | "COLLECTING"\n  | "HEALTHY"\n  | "RETRYING"\n  | "FAILING"\n  | "CANCELLED";\n\ntype CollectionHealthSummary = {\n  state: CollectionHealthState;\n  latestRunStatus: string | null;\n  latestRunAt: string | null;\n  lastFailureAt: string | null;\n  consecutiveFailures: number;\n  failedRuns: number;\n};\n\ntype SourceListPayload = SourceListResult & {\n  assessments?: Record<string, SourceValueSummary>;\n  collectionHealth?: Record<string, CollectionHealthSummary>;\n};\n''',
          )
          replace(
              ui,
              '''function sourceValueTone(value: SourceValueSummary["sourceValue"]["priority"]): string {\n  if (value === "VERY_HIGH") return "bg-blue-600 text-white";\n  if (value === "HIGH") return "bg-blue-50 text-blue-700 ring-1 ring-inset ring-blue-200";\n  if (value === "MEDIUM") return "bg-amber-50 text-amber-700 ring-1 ring-inset ring-amber-200";\n  return "bg-slate-100 text-slate-600 ring-1 ring-inset ring-slate-200";\n}\n\nfunction StatusBadge''',
              '''function sourceValueTone(value: SourceValueSummary["sourceValue"]["priority"]): string {\n  if (value === "VERY_HIGH") return "bg-blue-600 text-white";\n  if (value === "HIGH") return "bg-blue-50 text-blue-700 ring-1 ring-inset ring-blue-200";\n  if (value === "MEDIUM") return "bg-amber-50 text-amber-700 ring-1 ring-inset ring-amber-200";\n  return "bg-slate-100 text-slate-600 ring-1 ring-inset ring-slate-200";\n}\n\nfunction collectionHealthLabel(value: CollectionHealthState, zh: boolean): string {\n  const labels: Record<CollectionHealthState, [string, string]> = {\n    NEVER_RUN: ["未采集", "Never run"],\n    COLLECTING: ["采集中", "Collecting"],\n    HEALTHY: ["正常", "Healthy"],\n    RETRYING: ["重试中", "Retrying"],\n    FAILING: ["采集失败", "Failing"],\n    CANCELLED: ["已取消", "Cancelled"],\n  };\n  return labels[value][zh ? 0 : 1];\n}\n\nfunction collectionHealthTone(value: CollectionHealthState): string {\n  if (value === "HEALTHY") return "bg-emerald-50 text-emerald-700";\n  if (value === "RETRYING" || value === "COLLECTING") return "bg-amber-50 text-amber-800";\n  if (value === "FAILING") return "bg-rose-50 text-rose-700";\n  return "bg-slate-100 text-slate-600";\n}\n\nfunction StatusBadge''',
          )
          replace(
              ui,
              '''    sourceValue: zh ? "来源价值" : "Source value",\n    languages: zh ? "语言" : "Languages",\n''',
              '''    sourceValue: zh ? "来源价值" : "Source value",\n    collectionHealth: zh ? "采集健康" : "Collection health",\n    failureHistory: zh ? "近期失败" : "Recent failures",\n    languages: zh ? "语言" : "Languages",\n''',
          )
          replace(
              ui,
              '''                <th className="px-5 py-3 font-medium">{copy.sourceValue}</th>\n                <th className="px-5 py-3 font-medium">{copy.status}</th>\n''',
              '''                <th className="px-5 py-3 font-medium">{copy.sourceValue}</th>\n                <th className="px-5 py-3 font-medium">{copy.collectionHealth}</th>\n                <th className="px-5 py-3 font-medium">{copy.status}</th>\n''',
          )
          replace(
              ui,
              '''              {result?.items.map((source) => {\n                const assessment = result.assessments?.[source.id];\n                return (\n''',
              '''              {result?.items.map((source) => {\n                const assessment = result.assessments?.[source.id];\n                const collectionHealth = result.collectionHealth?.[source.id];\n                return (\n''',
          )
          insert_after = '''                    <td className="px-5 py-4">\n                      {assessment ? (\n                        <div title={assessment.sourceValue.summary}>\n                          <span\n                            className={`inline-flex rounded-full px-2.5 py-1 text-xs font-semibold ${sourceValueTone(assessment.sourceValue.priority)}`}\n                          >\n                            {sourceValueLabel(assessment.sourceValue.priority, zh)} ·{" "}\n                            {assessment.sourceValue.score}\n                          </span>\n                          <p className="mt-1 text-[10px] text-slate-400">\n                            {new Date(assessment.assessedAt).toLocaleDateString(locale)}\n                          </p>\n                        </div>\n                      ) : (\n                        <span className="text-xs text-slate-400">{copy.notAssessed}</span>\n                      )}\n                    </td>\n'''
          health_cell = insert_after + '''                    <td className="px-5 py-4">\n                      {collectionHealth ? (\n                        <div\n                          title={\n                            collectionHealth.lastFailureAt\n                              ? `${copy.failureHistory}: ${collectionHealth.failedRuns}`\n                              : undefined\n                          }\n                        >\n                          <span\n                            className={`inline-flex rounded-full px-2.5 py-1 text-xs font-medium ${collectionHealthTone(collectionHealth.state)}`}\n                          >\n                            {collectionHealthLabel(collectionHealth.state, zh)}\n                          </span>\n                          {collectionHealth.state === "FAILING" ? (\n                            <p className="mt-1 text-[10px] text-rose-500">\n                              {zh\n                                ? `连续失败 ${collectionHealth.consecutiveFailures} 次`\n                                : `${collectionHealth.consecutiveFailures} consecutive failures`}\n                            </p>\n                          ) : collectionHealth.latestRunAt ? (\n                            <p className="mt-1 text-[10px] text-slate-400">\n                              {new Date(collectionHealth.latestRunAt).toLocaleString(locale)}\n                            </p>\n                          ) : null}\n                        </div>\n                      ) : (\n                        <span className="text-xs text-slate-400">—</span>\n                      )}\n                    </td>\n'''
          replace(ui, insert_after, health_cell)
      - name: Format changed files
        run: pnpm exec prettier --write apps/admin/src/server/source-collection-health.ts apps/admin/src/server/__tests__/source-collection-health.test.ts apps/admin/src/app/api/sources/route.ts apps/admin/src/components/sources/source-list.tsx
      - name: Targeted checks
        run: |
          pnpm --filter @markorbit/admin test -- source-collection-health.test.ts
          pnpm --filter @markorbit/admin typecheck
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/admin/src/server/source-collection-health.ts apps/admin/src/server/__tests__/source-collection-health.test.ts apps/admin/src/app/api/sources/route.ts apps/admin/src/components/sources/source-list.tsx
          git commit -m "Sources: surface collection health and failures"
          git push origin HEAD:codex/source-collection-health-v1
