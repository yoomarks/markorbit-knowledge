name: CNIPA Phase 3 Credential Guard Fix

on:
  push:
    branches:
      - feat/cnipa-live-acceptance-harness

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cnipa-live-acceptance-harness
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tighten credential-like field rejection and remove helper workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/worker/src/cnipa-live-acceptance.ts')
          text = p.read_text()
          old = '''const SENSITIVE_FIELD =\n  /(?:^|[-_.])(authorization|cookie|token|secret|password|passwd|credential|auth|api[-_.]?key|access[-_.]?key)(?:$|[-_.])/i;'''
          new = '''const SENSITIVE_FIELD =\n  /(authorization|cookie|token|secret|password|passwd|credential|api[-_.]?key|access[-_.]?key)/i;\nconst AUTH_FIELD = /(?:^|[-_.])auth(?:$|[-_.])/i;'''
          if old not in text:
              raise SystemExit('expected SENSITIVE_FIELD block not found')
          text = text.replace(old, new, 1)
          old_condition = '!FIELD_NAME_PATTERN.test(value) || SENSITIVE_FIELD.test(value)'
          new_condition = '!FIELD_NAME_PATTERN.test(value) || SENSITIVE_FIELD.test(value) || AUTH_FIELD.test(value)'
          if old_condition not in text:
              raise SystemExit('expected fieldName condition not found')
          text = text.replace(old_condition, new_condition, 1)
          p.write_text(text)
          PY
          pnpm exec prettier --write apps/worker/src/cnipa-live-acceptance.ts
          rm .github/workflows/cnipa-phase3-credential-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/cnipa-live-acceptance.ts .github/workflows/cnipa-phase3-credential-fix.yml
          git commit -m "fix: reject embedded CNIPA credential-like fields"
          git push origin HEAD:feat/cnipa-live-acceptance-harness
