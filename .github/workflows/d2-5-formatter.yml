name: D2.5 Temporary Formatter

on:
  push:
    branches:
      - codex/d2-5-dual-axis-real-source-calibration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d2-5-dual-axis-real-source-calibration
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format D2.5 files
        run: |
          pnpm exec prettier --write \
            packages/worker-runtime/src/source-intelligence-evaluator.ts \
            scripts/source-intelligence-d2-5-calibration.mjs \
            packages/worker-runtime/tests/source-intelligence-d2-5.test.ts \
            docs/architecture/SOURCE_INTELLIGENCE_D2_5_REAL_SOURCE_CALIBRATION.md \
            .github/workflows/source-intelligence-d2-5-calibration.yml \
            .github/workflows/d2-5-formatter.yml
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/worker-runtime/src/source-intelligence-evaluator.ts \
            scripts/source-intelligence-d2-5-calibration.mjs \
            packages/worker-runtime/tests/source-intelligence-d2-5.test.ts \
            docs/architecture/SOURCE_INTELLIGENCE_D2_5_REAL_SOURCE_CALIBRATION.md \
            .github/workflows/source-intelligence-d2-5-calibration.yml \
            .github/workflows/d2-5-formatter.yml
          git commit -m "style: format D2.5 calibration correction"
          git push origin HEAD:codex/d2-5-dual-axis-real-source-calibration
