name: M12 WIPO Integration

on:
  push:
    branches:
      - feature/m12-wipo-source-supply

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'M12 apply WIPO source supply integration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m12-wipo-source-supply
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/m12-wipo-patch.py
      - run: >-
          pnpm exec prettier --write
          packages/persistence/src/source-coverage-catalog.ts
          packages/persistence/src/wipo-source-coverage.ts
          apps/worker/src/source-coverage-bootstrap.ts
          apps/worker/src/source-coverage-operations.ts
          apps/worker/src/source-supply-conversion.ts
          apps/worker/src/bootstrap-source-coverage.ts
      - run: pnpm typecheck
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/source-coverage-catalog.ts packages/persistence/src/wipo-source-coverage.ts apps/worker/src/source-coverage-bootstrap.ts apps/worker/src/source-coverage-operations.ts apps/worker/src/source-supply-conversion.ts apps/worker/src/bootstrap-source-coverage.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "M12 apply WIPO source supply integration"
          git push
