name: Agent Sync Discovery Lock

on:
  push:
    branches:
      - agent/discovery-review-production-loop

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/discovery-review-production-loop
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - name: Commit lockfile and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/admin/src/server/discovery-service.ts apps/admin/src/server/__tests__/discovery-service.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync discovery dependency lockfile"
          git push origin HEAD:agent/discovery-review-production-loop
