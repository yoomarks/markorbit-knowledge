name: M3.1 Formatter

on:
  push:
    branches:
      - feature/m3-canonical-document-pipeline
    paths:
      - .github/workflows/m3-1-formatter.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-canonical-document-pipeline
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M3.1 files
        run: |
          pnpm exec prettier --write \
            packages/contracts/tests/canonical-markdown-v1.test.ts \
            packages/persistence/tests/obsidian-vault-projection.test.ts \
            packages/worker-runtime/tests/production-markdown-staging.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/contracts/tests/canonical-markdown-v1.test.ts \
            packages/persistence/tests/obsidian-vault-projection.test.ts \
            packages/worker-runtime/tests/production-markdown-staging.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: format M3.1 canonical pipeline"
          git push origin HEAD:feature/m3-canonical-document-pipeline
