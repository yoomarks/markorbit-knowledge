name: D2.18 Formatter

on:
  push:
    branches:
      - codex/d2-18-historical-policy-comparison
    paths:
      - .github/workflows/d2-18-formatter.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d2-18-historical-policy-comparison
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format D2.18 files
        run: |
          pnpm exec prettier --write \
            apps/admin/src/components/sources/source-intelligence-policy-comparison.tsx \
            packages/worker-runtime/src/source-intelligence-historical-policy-comparison.ts \
            packages/worker-runtime/tests/source-intelligence-historical-policy-comparison.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/src/components/sources/source-intelligence-policy-comparison.tsx \
            packages/worker-runtime/src/source-intelligence-historical-policy-comparison.ts \
            packages/worker-runtime/tests/source-intelligence-historical-policy-comparison.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: format D2.18 historical policy comparison"
          git push origin HEAD:codex/d2-18-historical-policy-comparison
