name: ADK Live Harness One-Time Format

on:
  push:
    branches:
      - agent/adk-live-pilot-harness

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adk-live-pilot-harness
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/worker/src/adk-live-pilot-acceptance.test.ts apps/worker/src/adk-live-pilot-acceptance.ts apps/worker/src/run-adk-live-pilot.ts
      - name: Commit output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/adk-live-pilot-acceptance.test.ts apps/worker/src/adk-live-pilot-acceptance.ts apps/worker/src/run-adk-live-pilot.ts
          git commit -m "style(adk): format live pilot harness"
          git push origin HEAD:agent/adk-live-pilot-harness
