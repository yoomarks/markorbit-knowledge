name: Agent Prettier Debug

on:
  push:
    branches:
      - agent/discovery-page-value-http-e2e-v1

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target and print diff
        run: |
          pnpm exec prettier apps/admin/src/server/__tests__/discovery-page-value-http.e2e.test.ts --write
          git diff -- apps/admin/src/server/__tests__/discovery-page-value-http.e2e.test.ts
          test -z "$(git status --short apps/admin/src/server/__tests__/discovery-page-value-http.e2e.test.ts)"
