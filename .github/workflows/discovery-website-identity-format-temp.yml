name: Temporary Discovery Website Identity Format

on:
  push:
    branches: [codex/discovery-website-identity-v1]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/discovery-website-identity-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write apps/admin/src/app/api/discovery/batch/route.ts apps/admin/src/server/discovery-import-parser.ts apps/admin/src/server/discovery-service.ts apps/admin/src/server/discovery-source-graph.ts apps/admin/src/server/__tests__/discovery-batch-intake.test.ts
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/app/api/discovery/batch/route.ts apps/admin/src/server/discovery-import-parser.ts apps/admin/src/server/discovery-service.ts apps/admin/src/server/discovery-source-graph.ts apps/admin/src/server/__tests__/discovery-batch-intake.test.ts
          git commit -m "style(discovery): format website identity changes"
          git push origin HEAD:codex/discovery-website-identity-v1
