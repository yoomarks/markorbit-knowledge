name: Patch Batch Intake

on:
  push:
    branches:
      - codex/discovery-batch-intake-metadata-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/discovery-batch-intake-metadata-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply batch intake patch
        run: |
          python scripts/patch-batch-intake.py
          pnpm exec prettier --write apps/admin/src/server/discovery-service.ts apps/admin/src/app/api/discovery/batch/route.ts apps/admin/src/server/__tests__/discovery-batch-intake.test.ts apps/admin/src/lib/admin-v2/discovery-intake-workbench.tsx apps/admin/src/lib/intake-i18n.ts
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/discovery-service.ts apps/admin/src/app/api/discovery/batch/route.ts apps/admin/src/server/__tests__/discovery-batch-intake.test.ts apps/admin/src/lib/admin-v2/discovery-intake-workbench.tsx apps/admin/src/lib/intake-i18n.ts
          git commit -m "feat: wire governed batch discovery intake"
          git push origin HEAD:codex/discovery-batch-intake-metadata-v1
