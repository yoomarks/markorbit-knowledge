name: Temporary IP Australia Acquisition Learning Prettier

on:
  pull_request:
    branches: [main]

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier \
            apps/worker/src/main.ts \
            apps/worker/src/ip-australia-manual-artifact-acquirer.ts \
            apps/worker/src/ip-australia-manual-artifact-acquirer.test.ts \
            apps/worker/src/ip-australia-manual-acquisition-learning.ts \
            apps/worker/src/ip-australia-manual-acquisition-learning.test.ts \
            apps/worker/src/verify-ip-australia-acquisition-learning.ts \
            packages/worker-runtime/src/controlled-collection-worker-runtime.ts \
            packages/worker-runtime/src/http-acquisition-intelligence-client.ts \
            packages/worker-runtime/src/index.ts \
            packages/worker-runtime/tests/controlled-collection-completion-observer.test.ts \
            packages/worker-runtime/tests/http-acquisition-intelligence-client.test.ts \
            --write
          git diff -- \
            apps/worker/src/main.ts \
            apps/worker/src/ip-australia-manual-artifact-acquirer.ts \
            apps/worker/src/ip-australia-manual-artifact-acquirer.test.ts \
            apps/worker/src/ip-australia-manual-acquisition-learning.ts \
            apps/worker/src/ip-australia-manual-acquisition-learning.test.ts \
            apps/worker/src/verify-ip-australia-acquisition-learning.ts \
            packages/worker-runtime/src/controlled-collection-worker-runtime.ts \
            packages/worker-runtime/src/http-acquisition-intelligence-client.ts \
            packages/worker-runtime/src/index.ts \
            packages/worker-runtime/tests/controlled-collection-completion-observer.test.ts \
            packages/worker-runtime/tests/http-acquisition-intelligence-client.test.ts
