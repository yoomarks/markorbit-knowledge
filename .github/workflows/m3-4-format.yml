name: M3.4 Format

on:
  push:
    branches:
      - feature/m3-4-change-feed-version-diff

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'M3.4 apply prettier') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-4-change-feed-version-diff
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          packages/persistence/src/document-change-feed.ts
          packages/persistence/tests/document-change-feed.test.ts
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/persistence/src/document-change-feed.ts \
            packages/persistence/tests/document-change-feed.test.ts
          git commit -m "M3.4 apply prettier"
          git push
