name: Agent R1-K12 README

on:
  push:
    branches:
      - r1-k12-canonical-downstream-document

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r1-k12-canonical-downstream-document
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update README and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()

          old = "- dedicated Vault-origin Staging Verification V1 that verifies only the immutable K10 CAS copy, blocks spoofed `markorbit.*` provenance, persists immutable verification evidence and separately finalizes each imported document as VERIFIED or BLOCKED;\n- Vault admin controls for binding, filesystem-root readiness, explicit export, read-only inspection, reviewed import intent, explicit import execution and Vault-origin verification/finalization without exposing the deployment absolute path;"
          new = "- dedicated Vault-origin Staging Verification V1 that verifies only the immutable K10 CAS copy, blocks spoofed `markorbit.*` provenance, persists immutable verification evidence and separately finalizes each imported document as VERIFIED or BLOCKED;\n- provenance-preserving Canonical Downstream Document V1 that promotes only K11 VERIFIED Vault-origin content while freezing the K08 inspection → K09 review → K10 execution → K11 verification/finalization chain without fabricating conversion provenance;\n- Vault admin controls for binding, filesystem-root readiness, explicit export, read-only inspection, reviewed import intent, explicit import execution, Vault-origin verification/finalization and explicit canonical downstream promotion without exposing the deployment absolute path;"
          if old not in text:
              raise SystemExit('README capability block not found')
          text = text.replace(old, new, 1)

          old = "Production web acquisition now exists for bounded HTML/Markdown collection. An operator can explicitly export one verified READY Staging document through its ACTIVE Workspace Vault binding with durable crash-recovery evidence, inspect bound Vault Markdown without mutation, record a reviewed import intent for an observed untracked candidate, explicitly execute that exact reviewed candidate into dedicated `IMPORTED_UNVERIFIED` Vault-origin Staging after live size/SHA-256 revalidation, and then verify/finalize the immutable Staging CAS copy without rereading the Vault. Arbitrary PDF/attachment acquisition, converter execution, automatic scheduling, provenance-preserving promotion of VERIFIED Vault-origin content into existing READY/ReadyPackage workflows, automatic conflict merge and two-way synchronization, and MarkOrbit Core semantic logic are not implemented yet. No automatic Vault synchronization is authorized."
          new = "Production web acquisition now exists for bounded HTML/Markdown collection. An operator can explicitly export one verified READY Staging document through its ACTIVE Workspace Vault binding with durable crash-recovery evidence, inspect bound Vault Markdown without mutation, record a reviewed import intent for an observed untracked candidate, explicitly execute that exact reviewed candidate into dedicated `IMPORTED_UNVERIFIED` Vault-origin Staging after live size/SHA-256 revalidation, verify/finalize the immutable Staging CAS copy without rereading the Vault, and explicitly promote a K11 VERIFIED document into a provenance-preserving Canonical Downstream Document. Arbitrary PDF/attachment acquisition, converter execution, automatic scheduling, Vault-origin ReadyPackage/Core delivery, automatic conflict merge and two-way synchronization, and MarkOrbit Core semantic logic are not implemented yet. ReadyPackage V1 and Content Export V1 remain conversion-origin contracts; K12 does not fabricate Source, RawArtifact, ConversionRun, Worker or Converter identities to force Vault-origin content through them. No automatic Vault synchronization is authorized."
          if old not in text:
              raise SystemExit('README status paragraph not found')
          text = text.replace(old, new, 1)

          old = "- [Obsidian Vault-origin Staging Verification V1](docs/architecture/OBSIDIAN_VAULT_ORIGIN_STAGING_VERIFICATION_V1.md)\n- [Persistence and Source Registry]"
          new = "- [Obsidian Vault-origin Staging Verification V1](docs/architecture/OBSIDIAN_VAULT_ORIGIN_STAGING_VERIFICATION_V1.md)\n- [Canonical Downstream Document V1](docs/architecture/CANONICAL_DOWNSTREAM_DOCUMENT_V1.md)\n- [Persistence and Source Registry]"
          if old not in text:
              raise SystemExit('README documentation block not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          rm .github/workflows/agent-r1-k12-readme.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'docs(r1-k12): update canonical downstream capability'
          git push origin HEAD:r1-k12-canonical-downstream-document
