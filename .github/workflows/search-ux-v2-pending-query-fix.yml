name: Search UX V2 Pending Query Fix

on:
  push:
    branches: [issue-710-search-ux-v2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-710-search-ux-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preserve pending query without render-time ref writes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/admin/src/components/knowledge/knowledge-hybrid-search-v2.tsx")
          text = path.read_text()
          if "const pendingQueryRef = useRef<string | null>(null);" not in text:
              text = text.replace(
                  "  const latestQueryRef = useRef(searchParams.toString());\n  latestQueryRef.current = searchParams.toString();\n  const queryTimerRef = useRef<number | null>(null);",
                  "  const pendingQueryRef = useRef<string | null>(null);\n  const queryTimerRef = useRef<number | null>(null);",
                  1,
              )
              text = text.replace(
                  '''  const replaceSearchState = useCallback(\n    (patch: Partial<KnowledgeSearchState>, resetOffset = true) => {\n      const query = patchKnowledgeSearchQuery(latestQueryRef.current, patch, resetOffset);\n      latestQueryRef.current = query;\n      router.replace(query ? `${pathname}?${query}` : pathname, { scroll: false });\n    },\n    [pathname, router],\n  );''',
                  '''  const replaceSearchState = useCallback(\n    (patch: Partial<KnowledgeSearchState>, resetOffset = true) => {\n      const pendingQuery = pendingQueryRef.current;\n      const effectivePatch =\n        pendingQuery !== null && patch.q === undefined ? { ...patch, q: pendingQuery } : patch;\n      if (pendingQuery !== null) {\n        if (queryTimerRef.current !== null) window.clearTimeout(queryTimerRef.current);\n        queryTimerRef.current = null;\n        pendingQueryRef.current = null;\n      }\n      const query = patchKnowledgeSearchQuery(\n        searchParams.toString(),\n        effectivePatch,\n        resetOffset,\n      );\n      router.replace(query ? `${pathname}?${query}` : pathname, { scroll: false });\n    },\n    [pathname, router, searchParams],\n  );''',
                  1,
              )
              text = text.replace(
                  '''  const scheduleQueryUpdate = useCallback(\n    (value: string) => {\n      if (queryTimerRef.current !== null) window.clearTimeout(queryTimerRef.current);\n      queryTimerRef.current = window.setTimeout(() => {\n        replaceSearchState({ q: value.trim() });\n      }, 250);\n    },\n    [replaceSearchState],\n  );''',
                  '''  const scheduleQueryUpdate = useCallback(\n    (value: string) => {\n      const nextQuery = value.trim();\n      pendingQueryRef.current = nextQuery;\n      if (queryTimerRef.current !== null) window.clearTimeout(queryTimerRef.current);\n      queryTimerRef.current = window.setTimeout(() => {\n        pendingQueryRef.current = null;\n        queryTimerRef.current = null;\n        replaceSearchState({ q: nextQuery });\n      }, 250);\n    },\n    [replaceSearchState],\n  );''',
                  1,
              )
              path.write_text(text)
          PY
          pnpm exec prettier --write apps/admin/src/components/knowledge/knowledge-hybrid-search-v2.tsx
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/components/knowledge/knowledge-hybrid-search-v2.tsx
          git commit -m "fix: preserve pending Search query across facet changes (#710)"
          git push origin HEAD:issue-710-search-ux-v2
