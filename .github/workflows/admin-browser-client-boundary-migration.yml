name: Admin Browser Client Boundary Migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply asserted migration
        run: |
          node scripts/apply-admin-browser-client-boundary.mjs
          pnpm exec prettier --write \
            apps/admin/src/components/overview/overview-workbench.tsx \
            apps/admin/src/components/sources/source-intelligence-manual-sla.tsx \
            apps/admin/src/components/sources/source-intelligence-policy-scopes.tsx \
            apps/admin/src/components/sources/source-intelligence-review-ownership.tsx \
            apps/admin/src/components/sources/source-intelligence-review-queue.tsx \
            apps/admin/src/lib/admin-v2/source-smart-review-ui.tsx
      - name: Commit migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/src/components/overview/overview-workbench.tsx \
            apps/admin/src/components/sources/source-intelligence-manual-sla.tsx \
            apps/admin/src/components/sources/source-intelligence-policy-scopes.tsx \
            apps/admin/src/components/sources/source-intelligence-review-ownership.tsx \
            apps/admin/src/components/sources/source-intelligence-review-queue.tsx \
            apps/admin/src/lib/admin-v2/source-smart-review-ui.tsx
          git commit -m "fix: secure admin browser mutation clients"
          git push origin HEAD:${{ github.head_ref }}
