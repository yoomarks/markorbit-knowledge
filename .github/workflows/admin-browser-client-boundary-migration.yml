name: Admin Browser Client Boundary Migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply asserted migration
        run: |
          node scripts/apply-admin-browser-client-boundary.mjs
          pnpm exec prettier --write \
            apps/admin/src/app/api/discovery/collection-authorization/route.ts \
            apps/admin/src/app/api/source-coverage/activation-wave/route.ts \
            apps/admin/src/app/api/source-intelligence/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/assignment-health/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/health/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/manual-sla/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/ownership/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/policy-audit/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/policy-audit/export/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/policy-audit/query/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/policy-comparison/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/policy-resolution/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/policy-scopes/route.ts \
            apps/admin/src/components/overview/overview-workbench.tsx \
            apps/admin/src/components/sources/radar-collection-authorization.tsx \
            apps/admin/src/components/sources/radar-review-evidence.tsx \
            apps/admin/src/components/sources/representative-activation-wave.tsx \
            apps/admin/src/components/sources/source-assessment-panel.tsx \
            apps/admin/src/components/sources/source-detail-workbench.tsx \
            apps/admin/src/components/sources/source-editor.tsx \
            apps/admin/src/components/sources/source-graph-panel.tsx \
            apps/admin/src/components/sources/source-intelligence-manual-sla.tsx \
            apps/admin/src/components/sources/source-intelligence-policy-scopes.tsx \
            apps/admin/src/components/sources/source-intelligence-review-ownership.tsx \
            apps/admin/src/components/sources/source-intelligence-review-queue.tsx \
            apps/admin/src/components/sources/source-intelligence-workbench.tsx \
            apps/admin/src/components/sources/source-plans-panel.tsx \
            apps/admin/src/components/sources/source-related-recommendations.tsx \
            apps/admin/src/lib/admin-v2/source-smart-review-ui.tsx \
            apps/admin/src/server/admin-browser-api-route-boundary.test.ts \
            apps/admin/src/server/source-intelligence-browser-access.ts
      - name: Commit migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/src/app/api/discovery/collection-authorization/route.ts \
            apps/admin/src/app/api/source-coverage/activation-wave/route.ts \
            apps/admin/src/app/api/source-intelligence/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/assignment-health/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/health/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/manual-sla/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/ownership/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/policy-audit/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/policy-audit/export/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/policy-audit/query/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/policy-comparison/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/policy-resolution/route.ts \
            apps/admin/src/app/api/source-intelligence/reviews/policy-scopes/route.ts \
            apps/admin/src/components/overview/overview-workbench.tsx \
            apps/admin/src/components/sources/radar-collection-authorization.tsx \
            apps/admin/src/components/sources/radar-review-evidence.tsx \
            apps/admin/src/components/sources/representative-activation-wave.tsx \
            apps/admin/src/components/sources/source-assessment-panel.tsx \
            apps/admin/src/components/sources/source-detail-workbench.tsx \
            apps/admin/src/components/sources/source-editor.tsx \
            apps/admin/src/components/sources/source-graph-panel.tsx \
            apps/admin/src/components/sources/source-intelligence-manual-sla.tsx \
            apps/admin/src/components/sources/source-intelligence-policy-scopes.tsx \
            apps/admin/src/components/sources/source-intelligence-review-ownership.tsx \
            apps/admin/src/components/sources/source-intelligence-review-queue.tsx \
            apps/admin/src/components/sources/source-intelligence-workbench.tsx \
            apps/admin/src/components/sources/source-plans-panel.tsx \
            apps/admin/src/components/sources/source-related-recommendations.tsx \
            apps/admin/src/lib/admin-v2/source-smart-review-ui.tsx \
            apps/admin/src/server/admin-browser-api-route-boundary.test.ts \
            apps/admin/src/server/source-intelligence-browser-access.ts
          git commit -m "fix: secure source intelligence browser boundary"
          git push origin HEAD:${{ github.head_ref }}
