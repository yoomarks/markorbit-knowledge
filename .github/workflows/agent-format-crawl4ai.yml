name: Agent Format Crawl4AI

on:
  push:
    branches:
      - agent/crawl4ai-production-acquirer

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crawl4ai-production-acquirer
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/worker-runtime/src/crawl4ai-subprocess-acquirer.ts packages/worker-runtime/tests/crawl4ai-subprocess-acquirer.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/worker-runtime/src/crawl4ai-subprocess-acquirer.ts packages/worker-runtime/tests/crawl4ai-subprocess-acquirer.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format Crawl4AI production acquirer"
          git push origin HEAD:agent/crawl4ai-production-acquirer
