name: Temporary 565 Formatter

on:
  push:
    branches:
      - fix/561-governed-reevaluation-event
    paths:
      - .github/workflows/tmp-format-565.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/561-governed-reevaluation-event
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/admin/src/server/acquisition-recurring-regression.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/acquisition-recurring-regression.ts
          git commit -m "style: format recurring reevaluation evidence"
          git push origin HEAD:fix/561-governed-reevaluation-event
