name: Agent R1-K12 Type Fix

on:
  push:
    branches:
      - r1-k12-canonical-downstream-document

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r1-k12-canonical-downstream-document
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Narrow passing verification outcome and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/persistence/src/canonical-downstream-document.ts')
          text = path.read_text()
          old = '''function frozenEvidence(input: PromoteCanonicalVaultImportInput) {\n  return {'''
          new = '''function passingVerificationOutcome(\n  value: VaultOriginStagingVerificationEvidenceV1["outcome"],\n): "PASS" | "PASS_WITH_WARNINGS" {\n  if (value === "PASS" || value === "PASS_WITH_WARNINGS") return value;\n  throw new RegistryConflictError(\n    "CANONICAL_DOWNSTREAM_VERIFICATION_INVALID",\n    "Canonical promotion requires passing verification bound to the exact Staging bytes",\n  );\n}\n\nfunction frozenEvidence(input: PromoteCanonicalVaultImportInput) {\n  const verificationOutcome = passingVerificationOutcome(input.verification.outcome);\n  return {'''
          if old not in text:
              raise SystemExit('frozenEvidence marker not found')
          text = text.replace(old, new, 1)
          old = '      verificationOutcome: input.verification.outcome,'
          new = '      verificationOutcome,'
          if old not in text:
              raise SystemExit('verificationOutcome assignment not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          pnpm exec prettier --write packages/persistence/src/canonical-downstream-document.ts
          rm .github/workflows/agent-r1-k12-typefix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix(r1-k12): narrow passing verification outcome'
          git push origin HEAD:r1-k12-canonical-downstream-document
