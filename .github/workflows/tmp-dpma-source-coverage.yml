name: Temporary DPMA source coverage verification

on:
  push:
    branches:
      - codex/dpma-source-coverage-v1

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize helper assertion literals
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/tmp/patch_dpma_source_coverage.py')
          text = path.read_text(encoding='utf-8')
          needle = "if 'jurisdiction: \"DE\", coverageTier: \"FOUNDATIONAL\"' not in relevance_tests:"
          replacement = "sg_assertion = sg_assertion.replace('\\\\n', '\\n')\nde_assertion = de_assertion.replace('\\\\n', '\\n')\n" + needle
          if "sg_assertion = sg_assertion.replace" not in text:
              if needle not in text:
                  raise SystemExit('relevance assertion normalization anchor not found')
              text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - run: python .github/tmp/patch_dpma_source_coverage.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/persistence/src/priority-national-source-coverage.ts packages/persistence/src/source-coverage-catalog.ts packages/persistence/tests/priority-national-source-coverage.test.ts packages/persistence/src/retrieval-relevance-audit.ts packages/persistence/tests/retrieval-relevance-audit.test.ts
      - run: pnpm --filter @markorbit/persistence exec vitest run tests/priority-national-source-coverage.test.ts tests/source-coverage-catalog.test.ts tests/retrieval-relevance-audit.test.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/priority-national-source-coverage.ts packages/persistence/src/source-coverage-catalog.ts packages/persistence/tests/priority-national-source-coverage.test.ts packages/persistence/src/retrieval-relevance-audit.ts packages/persistence/tests/retrieval-relevance-audit.test.ts
          git commit -m "Sources: add German DPMA trademark coverage" || true
          git push
