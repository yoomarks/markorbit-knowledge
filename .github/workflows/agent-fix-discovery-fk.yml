name: Agent Fix Discovery FK

on:
  push:
    branches:
      - agent/discovery-review-production-loop

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/discovery-review-production-loop
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove cross-registry foreign keys
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/persistence/src/source-discovery-registry.ts')
          text = path.read_text()
          old = '''        collection_plan_id TEXT,\n        FOREIGN KEY (first_batch_id) REFERENCES discovery_batches(batch_id),\n        FOREIGN KEY (last_batch_id) REFERENCES discovery_batches(batch_id),\n        FOREIGN KEY (accepted_source_id) REFERENCES source_definitions(id),\n        FOREIGN KEY (collection_plan_id) REFERENCES collection_plans(id)\n'''
          new = '''        collection_plan_id TEXT,\n        FOREIGN KEY (first_batch_id) REFERENCES discovery_batches(batch_id),\n        FOREIGN KEY (last_batch_id) REFERENCES discovery_batches(batch_id)\n'''
          if old not in text:
              raise SystemExit('target discovery foreign-key block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm format
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/source-discovery-registry.ts
          git commit -m "fix: keep discovery review links registry-local"
          git push origin HEAD:agent/discovery-review-production-loop
