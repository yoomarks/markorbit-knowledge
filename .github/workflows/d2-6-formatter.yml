name: D2.6 Formatter

on:
  push:
    branches:
      - codex/d2-6-dual-axis-operator-presentation
    paths:
      - .github/workflows/d2-6-formatter.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d2-6-dual-axis-operator-presentation
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format D2.6 files
        run: |
          pnpm exec prettier --write \
            apps/admin/src/app/intelligence/page.tsx \
            apps/admin/src/components/sources/source-intelligence-panel.tsx \
            apps/admin/src/components/sources/source-intelligence-workbench.tsx \
            apps/admin/src/lib/source-intelligence-presentation.ts \
            apps/admin/src/lib/source-intelligence-presentation.test.ts \
            docs/architecture/SOURCE_INTELLIGENCE_D2_6_OPERATOR_PRESENTATION.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/app/intelligence/page.tsx apps/admin/src/components/sources/source-intelligence-panel.tsx apps/admin/src/components/sources/source-intelligence-workbench.tsx apps/admin/src/lib/source-intelligence-presentation.ts apps/admin/src/lib/source-intelligence-presentation.test.ts docs/architecture/SOURCE_INTELLIGENCE_D2_6_OPERATOR_PRESENTATION.md
          git diff --cached --quiet && exit 0
          git commit -m "style: format D2.6 dual-axis presentation"
          git push origin HEAD:codex/d2-6-dual-axis-operator-presentation
