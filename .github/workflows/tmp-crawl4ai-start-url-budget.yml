name: Temporary Crawl4AI start URL budget verification

on:
  push:
    branches:
      - codex/crawl4ai-start-url-budget-v1

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/tmp/patch_crawl4ai_start_url_budget.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m unittest discover -s workers/crawl4ai/tests -p 'test_*.py'
      - run: pnpm exec prettier --write packages/worker-runtime/src/crawl4ai-subprocess-acquirer.ts packages/worker-runtime/tests/crawl4ai-start-url-budget.test.ts
      - run: pnpm --filter @markorbit/worker-runtime exec vitest run tests/crawl4ai-start-url-budget.test.ts tests/crawl4ai-subprocess-acquirer.test.ts
      - run: pnpm typecheck
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/worker-runtime/src/crawl4ai-subprocess-acquirer.ts packages/worker-runtime/tests/crawl4ai-start-url-budget.test.ts workers/crawl4ai/acquire.py workers/crawl4ai/tests/test_start_url_budget.py
          git commit -m "Worker: align Crawl4AI start URL budget" || true
          git push
