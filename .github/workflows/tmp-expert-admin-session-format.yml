name: Temporary Expert Admin Session Format

on:
  push:
    branches:
      - expert/admin-session-bridge

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expert/admin-session-bridge
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier and remove temporary workflow
        shell: bash
        run: |
          pnpm exec prettier --write \
            apps/admin/src/server/admin-browser-session.ts \
            apps/admin/src/server/expert-api-access.test.ts
          git rm .github/workflows/tmp-expert-admin-session-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/admin-browser-session.ts apps/admin/src/server/expert-api-access.test.ts
          git commit -m "style: format Expert Admin session bridge"
          git push origin HEAD:expert/admin-session-bridge
