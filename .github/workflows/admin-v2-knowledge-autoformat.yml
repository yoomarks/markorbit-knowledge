name: Admin V2 Knowledge Autoformat

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier
        run: |
          pnpm exec prettier --write apps/admin/src/app/api/knowledge/[id]/route.ts apps/admin/src/app/api/knowledge/route.ts apps/admin/src/components/knowledge/knowledge-browser.tsx
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/app/api/knowledge/[id]/route.ts apps/admin/src/app/api/knowledge/route.ts apps/admin/src/components/knowledge/knowledge-browser.tsx
          git commit -m "style: format knowledge browser"
          git push origin HEAD:${{ github.head_ref }}
