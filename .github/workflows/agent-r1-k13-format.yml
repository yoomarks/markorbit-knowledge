name: Agent R1-K13 Format

on:
  push:
    branches:
      - r1-k13-ready-package-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r1-k13-ready-package-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format K13 files
        run: |
          pnpm exec prettier --write \
            packages/contracts/src/ready-package-v2.ts \
            packages/contracts/src/ready-package-content-export-v2.ts \
            packages/contracts/src/index.ts \
            packages/persistence/package.json \
            packages/persistence/src/ready-package-v2-registry.ts \
            packages/persistence/src/ready-package-v2-registry.test.ts \
            apps/admin/src/server/ready-package-content-export-v2.ts \
            apps/admin/src/server/ready-package-v2-service.ts \
            apps/admin/src/server/__tests__/ready-package-content-export-v2.test.ts \
            'apps/admin/src/app/api/workspaces/[id]/ready-packages-v2/route.ts' \
            'apps/admin/src/app/api/workspaces/[id]/ready-packages-v2/[readyPackageId]/content-export/route.ts' \
            apps/admin/src/components/vault/ready-package-v2-control.tsx \
            apps/admin/src/components/vault/vault-workbench.tsx \
            docs/architecture/READY_PACKAGE_V2.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m 'chore(r1-k13): format ReadyPackage V2'
          git push origin HEAD:r1-k13-ready-package-v2
