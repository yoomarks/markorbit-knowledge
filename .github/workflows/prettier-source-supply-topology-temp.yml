name: Temporary Source Supply Topology Prettier

on:
  push:
    branches:
      - agent/source-supply-topology-intelligence-v1

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/source-supply-topology-intelligence-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write \
            packages/persistence/src/source-compatibility-supply-health.ts \
            packages/persistence/src/source-operational-supply-health.test.ts
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/persistence/src/source-compatibility-supply-health.ts \
            packages/persistence/src/source-operational-supply-health.test.ts
          git commit -m "style: format source supply topology"
          git push origin HEAD:agent/source-supply-topology-intelligence-v1
