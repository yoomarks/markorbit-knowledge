name: Temporary Uzbekistan Source Coverage

on:
  push:
    branches:
      - agent/uz-justice-trademark-source-coverage-v1

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uz-justice-trademark-source-coverage-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply curated Uzbekistan coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'expected anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          block = '''const MOJ_UZ: Authority = {
            jurisdiction: "UZ",
            authorityName: "Ministry of Justice of the Republic of Uzbekistan – Intellectual Property",
            languages: ["uz", "ru"],
            verificationEvidenceUri: "https://im.adliya.uz/",
          };

          export const MOJ_UZ_SOURCE_COVERAGE_TARGETS = [
            target(MOJ_UZ, {
              id: "uz-justice-intellectual-property-portal",
              family: "PORTAL",
              displayName: "Uzbekistan Ministry of Justice Intellectual Property Portal",
              canonicalUri: "https://im.adliya.uz/",
              verificationEvidenceUri: "https://im.adliya.uz/",
              notes:
                "Official Ministry of Justice intellectual-property portal. WIPO's current Uzbekistan office profile identifies the Ministry of Justice as the competent industrial-property administration and this portal as its IP web surface.",
            }),
            target(MOJ_UZ, {
              id: "uz-justice-trademark-registration-service",
              family: "FILING",
              displayName: "Uzbekistan Unified Public Services Trademark Registration",
              canonicalUri: "https://my.gov.uz/ru/service/803",
              verificationEvidenceUri: "https://my.gov.uz/ru/service/803",
              notes:
                "Current Unified Interactive Public Services Portal service for trademark registration. The service identifies the Ministry of Justice as provider and describes filing, examination by the Intellectual Property Center, registration, publication and fee-payment stages.",
            }),
            target(MOJ_UZ, {
              id: "uz-justice-trademark-registration-request",
              family: "FILING",
              displayName: "Uzbekistan Trademark Registration Applicant Service",
              canonicalUri: "https://my.gov.uz/ru/service/291",
              verificationEvidenceUri: "https://my.gov.uz/ru/service/291",
              notes:
                "Separate Ministry of Justice public-service route for submitting a trademark registration request in the applicant's name; retained as an operational filing surface distinct from the full registration workflow page.",
            }),
            target(MOJ_UZ, {
              id: "uz-justice-state-duty-rates",
              family: "FEES",
              displayName: "Uzbekistan State Duty Rates",
              canonicalUri: "https://my.gov.uz/ru/static/tax-rates",
              verificationEvidenceUri: "https://my.gov.uz/ru/static/tax-rates",
              notes:
                "Current Unified Public Services state-duty rates surface referenced alongside public services for legally significant actions, including the trademark-registration workflow; retained as the current government fee-reference surface rather than copying fee amounts into the catalog.",
            }),
            target(MOJ_UZ, {
              id: "uz-trademark-law-current",
              family: "LEGAL_TEXTS",
              displayName: "Uzbekistan Law on Trademarks, Service Marks and Appellations of Origin",
              canonicalUri: "https://www.wipo.int/wipolex/en/legislation/details/22560",
              verificationEvidenceUri: "https://www.wipo.int/wipolex/en/legislation/details/22560",
              notes:
                "WIPO Lex current version of Law No. 267-II of 30 August 2001, amended through Law No. LRU-908 of 15 February 2024; covers trademark protection, registration, rights, use, transfer, cancellation and enforcement.",
            }),
            target(MOJ_UZ, {
              id: "uz-trademark-filing-examination-rules",
              family: "EXAMINATION_MANUAL",
              displayName: "Uzbekistan Trademark Filing and Examination Rules",
              canonicalUri: "https://www.wipo.int/wipolex/en/legislation/details/17914",
              verificationEvidenceUri: "https://www.wipo.int/wipolex/en/legislation/details/17914",
              notes:
                "WIPO Lex version of the Rules on Drafting, Filing and Examination of Applications for Registration of Trademarks and Service Marks, registered as No. 1988 and amended through 2017.",
            }),
          ] satisfies readonly SourceCoverageTarget[];

          '''

          replace_once(
              'packages/persistence/src/priority-national-source-coverage.ts',
              'const CIPO: Authority = {',
              block + 'const CIPO: Authority = {'
          )
          replace_once(
              'packages/persistence/src/priority-national-source-coverage.ts',
              '  ...ROSPATENT_RU_SOURCE_COVERAGE_TARGETS,\n  ...CIPO_SOURCE_COVERAGE_TARGETS,',
              '  ...ROSPATENT_RU_SOURCE_COVERAGE_TARGETS,\n  ...MOJ_UZ_SOURCE_COVERAGE_TARGETS,\n  ...CIPO_SOURCE_COVERAGE_TARGETS,'
          )

          probes = '''  {
            id: "uz-justice-intellectual-property-portal-name",
            targetId: "uz-justice-intellectual-property-portal",
            query: "Uzbekistan Ministry Justice intellectual property trademark portal",
          },
          {
            id: "uz-justice-trademark-registration-service-name",
            targetId: "uz-justice-trademark-registration-service",
            query: "Uzbekistan trademark registration public service Ministry Justice filing examination",
          },
          {
            id: "uz-justice-trademark-registration-request-name",
            targetId: "uz-justice-trademark-registration-request",
            query: "Uzbekistan trademark registration applicant service Ministry Justice",
          },
          {
            id: "uz-justice-state-duty-rates-name",
            targetId: "uz-justice-state-duty-rates",
            query: "Uzbekistan state duty rates trademark registration fee Ministry Justice",
          },
          {
            id: "uz-trademark-law-current-name",
            targetId: "uz-trademark-law-current",
            query: "Uzbekistan Law 267-II trademarks service marks appellations origin 2024",
          },
          {
            id: "uz-trademark-filing-examination-rules-name",
            targetId: "uz-trademark-filing-examination-rules",
            query: "Uzbekistan trademark filing examination rules registration number 1988",
          },
          '''
          replace_once(
              'packages/persistence/src/retrieval-relevance-audit.ts',
              '] satisfies readonly RetrievalRelevanceProbe[];',
              probes + '] satisfies readonly RetrievalRelevanceProbe[];'
          )

          replace_once(
              'packages/persistence/src/source-coverage-catalog.ts',
              '  ROSPATENT_RU_SOURCE_COVERAGE_TARGETS,\n  IPOS_SOURCE_COVERAGE_TARGETS,',
              '  ROSPATENT_RU_SOURCE_COVERAGE_TARGETS,\n  MOJ_UZ_SOURCE_COVERAGE_TARGETS,\n  IPOS_SOURCE_COVERAGE_TARGETS,'
          )

          replace_once(
              'packages/persistence/tests/priority-national-source-coverage.test.ts',
              '  ROSPATENT_RU_SOURCE_COVERAGE_TARGETS,\n  IPOS_SOURCE_COVERAGE_TARGETS,',
              '  ROSPATENT_RU_SOURCE_COVERAGE_TARGETS,\n  MOJ_UZ_SOURCE_COVERAGE_TARGETS,\n  IPOS_SOURCE_COVERAGE_TARGETS,'
          )
          replace_once(
              'packages/persistence/tests/priority-national-source-coverage.test.ts',
              '  ["RU", ROSPATENT_RU_SOURCE_COVERAGE_TARGETS, ["rospatent.gov.ru"]],\n  ["CA", CIPO_SOURCE_COVERAGE_TARGETS, ["canada.ca"]],',
              '  ["RU", ROSPATENT_RU_SOURCE_COVERAGE_TARGETS, ["rospatent.gov.ru"]],\n  ["UZ", MOJ_UZ_SOURCE_COVERAGE_TARGETS, ["adliya.uz", "my.gov.uz", "wipo.int"]],\n  ["CA", CIPO_SOURCE_COVERAGE_TARGETS, ["canada.ca"]],'
          )
          replace_once(
              'packages/persistence/tests/priority-national-source-coverage.test.ts',
              'ships explicit, official, unique coverage for seventy-nine priority national offices',
              'ships explicit, official, unique coverage for eighty priority national offices'
          )
          replace_once('packages/persistence/tests/priority-national-source-coverage.test.ts', 'toHaveLength(639)', 'toHaveLength(645)')
          replace_once('packages/persistence/tests/priority-national-source-coverage.test.ts', '      639,\n    );', '      645,\n    );')
          replace_once('packages/persistence/tests/priority-national-source-coverage.test.ts', '    ).toBe(639);', '    ).toBe(645);')

          replace_once('packages/persistence/tests/retrieval-relevance-audit.test.ts', 'expect(targets).toHaveLength(593);', 'expect(targets).toHaveLength(599);')
          replace_once('packages/persistence/tests/retrieval-relevance-audit.test.ts', 'expect(FOUNDATIONAL_RETRIEVAL_RELEVANCE_PROBES).toHaveLength(593);', 'expect(FOUNDATIONAL_RETRIEVAL_RELEVANCE_PROBES).toHaveLength(599);')
          replace_once('packages/persistence/tests/retrieval-relevance-audit.test.ts', '      593,\n    );', '      599,\n    );')
          replace_once(
              'packages/persistence/tests/retrieval-relevance-audit.test.ts',
              '    expect(\n      listSourceCoverageTargets({ jurisdiction: "RU", coverageTier: "FOUNDATIONAL" }).every(\n        (target) => targetIds.has(target.id),\n      ),\n    ).toBe(true);\n  });',
              '    expect(\n      listSourceCoverageTargets({ jurisdiction: "RU", coverageTier: "FOUNDATIONAL" }).every(\n        (target) => targetIds.has(target.id),\n      ),\n    ).toBe(true);\n    expect(\n      listSourceCoverageTargets({ jurisdiction: "UZ", coverageTier: "FOUNDATIONAL" }).every(\n        (target) => targetIds.has(target.id),\n      ),\n    ).toBe(true);\n  });'
          )

          replace_once(
              'packages/persistence/src/priority-trademark-jurisdictions.ts',
              '["UZ", "Uzbekistan", "ASIA_PACIFIC", "P2", "TARGET", "NATIONAL"]',
              '["UZ", "Uzbekistan", "ASIA_PACIFIC", "P2", "CURATED", "NATIONAL"]'
          )
          replace_once('packages/persistence/tests/priority-trademark-jurisdictions.test.ts', 'expect(curated).toHaveLength(80);', 'expect(curated).toHaveLength(81);')
          replace_once('packages/persistence/tests/priority-trademark-jurisdictions.test.ts', 'expect(target).toHaveLength(40);', 'expect(target).toHaveLength(39);')
          PY
      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            packages/persistence/src/priority-national-source-coverage.ts \
            packages/persistence/src/retrieval-relevance-audit.ts \
            packages/persistence/src/source-coverage-catalog.ts \
            packages/persistence/src/priority-trademark-jurisdictions.ts \
            packages/persistence/tests/priority-national-source-coverage.test.ts \
            packages/persistence/tests/retrieval-relevance-audit.test.ts \
            packages/persistence/tests/priority-trademark-jurisdictions.test.ts
      - name: Verify Uzbekistan coverage
        run: |
          pnpm --filter @markorbit/persistence test -- \
            tests/priority-national-source-coverage.test.ts \
            tests/retrieval-relevance-audit.test.ts \
            tests/priority-trademark-jurisdictions.test.ts
          pnpm typecheck
      - name: Commit verified changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/persistence/src/priority-national-source-coverage.ts \
            packages/persistence/src/retrieval-relevance-audit.ts \
            packages/persistence/src/source-coverage-catalog.ts \
            packages/persistence/src/priority-trademark-jurisdictions.ts \
            packages/persistence/tests/priority-national-source-coverage.test.ts \
            packages/persistence/tests/retrieval-relevance-audit.test.ts \
            packages/persistence/tests/priority-trademark-jurisdictions.test.ts
          git commit -m "feat: add Uzbekistan trademark source coverage"
          git push origin HEAD:agent/uz-justice-trademark-source-coverage-v1
