name: Agent Source Intelligence Calibration Live

on:
  push:
    branches:
      - agent/source-intelligence-calibration-cohort-final2
    paths:
      - .github/workflows/agent-source-intelligence-calibration-live.yml

permissions:
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MARKORBIT_CONTROL_PLANE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/source-intelligence-calibration-cohort-final2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Configure isolated registry
        run: |
          echo "MARKORBIT_KNOWLEDGE_DB_PATH=$RUNNER_TEMP/markorbit-calibration-live.sqlite" >> "$GITHUB_ENV"
          echo "MARKORBIT_ARTIFACT_STORE_PATH=$RUNNER_TEMP/markorbit-calibration-live-artifacts" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markorbit/admin build
      - name: Start isolated control plane
        run: |
          pnpm --filter @markorbit/admin start > "$RUNNER_TEMP/admin.log" 2>&1 &
          echo "ADMIN_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail "$MARKORBIT_CONTROL_PLANE_URL/api/discovery" > /dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/admin.log"
          exit 1
      - name: Run complete real cohort
        run: |
          node scripts/source-intelligence-calibration.mjs \
            --base-url "$MARKORBIT_CONTROL_PLANE_URL" \
            --limit 12 \
            --min-success 6 \
            --output "$RUNNER_TEMP/source-intelligence-calibration.json"
      - name: Show calibration summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/source-intelligence-calibration.json" ]; then
            node -e 'const r=require(process.env.RUNNER_TEMP+"/source-intelligence-calibration.json"); console.log(JSON.stringify(r.summary,null,2))'
          fi
      - name: Stop local process
        if: always()
        run: |
          if [ -n "${ADMIN_PID:-}" ]; then kill "$ADMIN_PID" 2>/dev/null || true; fi
      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-source-intelligence-calibration-live
          path: |
            ${{ runner.temp }}/source-intelligence-calibration.json
            ${{ runner.temp }}/admin.log
          if-no-files-found: ignore
          retention-days: 7
