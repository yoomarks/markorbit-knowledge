name: Search UX V2 Autoformat

on:
  push:
    branches: [issue-710-search-ux-v2]

permissions:
  contents: write

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-710-search-ux-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Search UX V2 component
        run: |
          pnpm exec prettier --write apps/admin/src/components/knowledge/knowledge-hybrid-search-v2.tsx
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/components/knowledge/knowledge-hybrid-search-v2.tsx
          git commit -m "style: format Search UX V2 lint fix"
          git push origin HEAD:issue-710-search-ux-v2
