name: Apply Rejected Candidate Recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply recovery implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_str, old, new):
              path = Path(path_str)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path_str}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1))

          discovery = "packages/persistence/src/source-discovery-registry.ts"
          replace(
              discovery,
              'const MIGRATION_ID = "1000_vnext_discovery_review_registry";\n',
              'const MIGRATION_ID = "1000_vnext_discovery_review_registry";\nconst REVIEW_HISTORY_MIGRATION_ID = "1001_source_candidate_review_history";\n',
          )
          replace(
              discovery,
              '''export type CandidateReview = {\n  decision: CandidateReviewDecision;\n  reviewedAt: string;\n  reviewer?: string;\n  note?: string;\n  acceptedSourceId?: string;\n  collectionPlanId?: string;\n};\n\nexport type SourceCandidateRecord = {''',
              '''export type CandidateReview = {\n  decision: CandidateReviewDecision;\n  reviewedAt: string;\n  reviewer?: string;\n  note?: string;\n  acceptedSourceId?: string;\n  collectionPlanId?: string;\n};\n\nexport type CandidateReviewEventAction = "REVIEWED" | "REOPENED";\n\nexport type CandidateReviewEvent = {\n  eventId: string;\n  candidateId: string;\n  action: CandidateReviewEventAction;\n  occurredAt: string;\n  decision?: CandidateReviewDecision;\n  reviewer?: string;\n  note?: string;\n  acceptedSourceId?: string;\n  collectionPlanId?: string;\n};\n\nexport type ReopenCandidateInput = {\n  reviewer?: string;\n  note?: string;\n};\n\nexport type SourceCandidateRecord = {''',
          )
          replace(
              discovery,
              '''  listCandidates(filters?: SourceCandidateListFilters): SourceCandidateListResult;\n  reviewCandidate(candidateId: string, input: ReviewCandidateInput): SourceCandidateRecord;\n}''',
              '''  listCandidates(filters?: SourceCandidateListFilters): SourceCandidateListResult;\n  reviewCandidate(candidateId: string, input: ReviewCandidateInput): SourceCandidateRecord;\n  reopenCandidate(candidateId: string, input?: ReopenCandidateInput): SourceCandidateRecord;\n  listReviewEvents(candidateId: string): CandidateReviewEvent[];\n}''',
          )
          replace(
              discovery,
              '''function ensureDiscoveryMigration(database: DatabaseSync): void {''',
              '''function parseReviewEvent(row: Record<string, unknown>): CandidateReviewEvent {\n  const decision = row.decision\n    ? (String(row.decision) as CandidateReviewDecision)\n    : undefined;\n  return {\n    eventId: String(row.event_id),\n    candidateId: String(row.candidate_id),\n    action: String(row.action) as CandidateReviewEventAction,\n    occurredAt: String(row.occurred_at),\n    ...(decision ? { decision } : {}),\n    ...(row.reviewer ? { reviewer: String(row.reviewer) } : {}),\n    ...(row.note ? { note: String(row.note) } : {}),\n    ...(row.accepted_source_id ? { acceptedSourceId: String(row.accepted_source_id) } : {}),\n    ...(row.collection_plan_id ? { collectionPlanId: String(row.collection_plan_id) } : {}),\n  };\n}\n\nfunction ensureDiscoveryMigration(database: DatabaseSync): void {''',
          )
          replace(
              discovery,
              '''export class SqliteSourceDiscoveryRepository implements SourceDiscoveryRepository {\n  constructor(\n    private readonly database: DatabaseSync,\n    private readonly clock: () => Date = () => new Date(),\n  ) {\n    ensureDiscoveryMigration(database);\n  }''',
              '''function ensureReviewHistoryMigration(database: DatabaseSync): void {\n  const applied = database\n    .prepare("SELECT id FROM schema_migrations WHERE id = ?")\n    .get(REVIEW_HISTORY_MIGRATION_ID);\n  if (applied) return;\n\n  database.exec("BEGIN IMMEDIATE;");\n  try {\n    database.exec(`\n      CREATE TABLE IF NOT EXISTS source_candidate_review_events (\n        event_id TEXT PRIMARY KEY,\n        candidate_id TEXT NOT NULL,\n        action TEXT NOT NULL,\n        decision TEXT,\n        occurred_at TEXT NOT NULL,\n        reviewer TEXT,\n        note TEXT,\n        accepted_source_id TEXT,\n        collection_plan_id TEXT,\n        FOREIGN KEY (candidate_id) REFERENCES source_candidates(candidate_id)\n      ) STRICT;\n\n      CREATE INDEX IF NOT EXISTS idx_source_candidate_review_events_candidate\n        ON source_candidate_review_events(candidate_id, occurred_at, event_id);\n    `);\n    database\n      .prepare("INSERT INTO schema_migrations (id, applied_at) VALUES (?, ?)")\n      .run(REVIEW_HISTORY_MIGRATION_ID, new Date().toISOString());\n    database.exec("COMMIT;");\n  } catch (error) {\n    database.exec("ROLLBACK;");\n    throw error;\n  }\n}\n\nexport class SqliteSourceDiscoveryRepository implements SourceDiscoveryRepository {\n  constructor(\n    private readonly database: DatabaseSync,\n    private readonly clock: () => Date = () => new Date(),\n  ) {\n    ensureDiscoveryMigration(database);\n    ensureReviewHistoryMigration(database);\n  }''',
          )
          replace(
              discovery,
              '''  reviewCandidate(candidateId: string, input: ReviewCandidateInput): SourceCandidateRecord {''',
              '''  listReviewEvents(candidateId: string): CandidateReviewEvent[] {\n    if (!this.getCandidate(candidateId)) throw new SourceCandidateNotFoundError(candidateId);\n    return this.database\n      .prepare(\n        `SELECT * FROM source_candidate_review_events\n         WHERE candidate_id = ? ORDER BY occurred_at, event_id`,\n      )\n      .all(candidateId)\n      .map((row) => parseReviewEvent(row as Record<string, unknown>));\n  }\n\n  reopenCandidate(candidateId: string, input: ReopenCandidateInput = {}): SourceCandidateRecord {\n    const current = this.getCandidate(candidateId);\n    if (!current) throw new SourceCandidateNotFoundError(candidateId);\n    if (current.candidate.status !== "REJECTED") {\n      throw new RegistryConflictError(\n        "SOURCE_CANDIDATE_REOPEN_CONFLICT",\n        `Candidate ${candidateId} is ${current.candidate.status}; only REJECTED candidates can be restored to pending review`,\n      );\n    }\n\n    const reopenedAt = this.clock().toISOString();\n    const reviewer = input.reviewer?.trim() || undefined;\n    const note = input.note?.trim() || undefined;\n    const nextCandidate: SourceCandidate = { ...current.candidate, status: "DISCOVERED" };\n\n    this.database.exec("SAVEPOINT source_candidate_reopen;");\n    try {\n      if (this.listReviewEvents(candidateId).length === 0 && current.review) {\n        this.appendReviewEvent({\n          candidateId,\n          action: "REVIEWED",\n          occurredAt: current.review.reviewedAt,\n          decision: current.review.decision,\n          reviewer: current.review.reviewer,\n          note: current.review.note,\n          acceptedSourceId: current.review.acceptedSourceId,\n          collectionPlanId: current.review.collectionPlanId,\n        });\n      }\n      this.appendReviewEvent({\n        candidateId,\n        action: "REOPENED",\n        occurredAt: reopenedAt,\n        reviewer,\n        note,\n      });\n      this.database\n        .prepare(\n          `UPDATE source_candidates SET\n             status = 'DISCOVERED', document_json = ?, review_decision = NULL, reviewed_at = NULL,\n             reviewer = NULL, review_note = NULL, accepted_source_id = NULL, collection_plan_id = NULL\n           WHERE candidate_id = ?`,\n        )\n        .run(JSON.stringify(nextCandidate), candidateId);\n      this.database.exec("RELEASE SAVEPOINT source_candidate_reopen;");\n    } catch (error) {\n      this.database.exec("ROLLBACK TO SAVEPOINT source_candidate_reopen;");\n      this.database.exec("RELEASE SAVEPOINT source_candidate_reopen;");\n      throw error;\n    }\n\n    return { ...current, candidate: nextCandidate, review: undefined };\n  }\n\n  reviewCandidate(candidateId: string, input: ReviewCandidateInput): SourceCandidateRecord {''',
          )
          old_update = '''    this.database\n      .prepare(\n        `UPDATE source_candidates SET\n           status = ?, document_json = ?, review_decision = ?, reviewed_at = ?, reviewer = ?,\n           review_note = ?, accepted_source_id = ?, collection_plan_id = ?\n         WHERE candidate_id = ?`,\n      )\n      .run(\n        input.decision,\n        JSON.stringify(nextCandidate),\n        input.decision,\n        reviewedAt,\n        input.reviewer?.trim() || null,\n        input.note?.trim() || null,\n        input.acceptedSourceId ?? null,\n        input.collectionPlanId ?? null,\n        candidateId,\n      );\n\n    return {'''
          new_update = '''    this.database.exec("SAVEPOINT source_candidate_review;");\n    try {\n      this.database\n        .prepare(\n          `UPDATE source_candidates SET\n             status = ?, document_json = ?, review_decision = ?, reviewed_at = ?, reviewer = ?,\n             review_note = ?, accepted_source_id = ?, collection_plan_id = ?\n           WHERE candidate_id = ?`,\n        )\n        .run(\n          input.decision,\n          JSON.stringify(nextCandidate),\n          input.decision,\n          reviewedAt,\n          input.reviewer?.trim() || null,\n          input.note?.trim() || null,\n          input.acceptedSourceId ?? null,\n          input.collectionPlanId ?? null,\n          candidateId,\n        );\n      this.appendReviewEvent({\n        candidateId,\n        action: "REVIEWED",\n        occurredAt: reviewedAt,\n        decision: input.decision,\n        reviewer: input.reviewer?.trim() || undefined,\n        note: input.note?.trim() || undefined,\n        acceptedSourceId: input.acceptedSourceId,\n        collectionPlanId: input.collectionPlanId,\n      });\n      this.database.exec("RELEASE SAVEPOINT source_candidate_review;");\n    } catch (error) {\n      this.database.exec("ROLLBACK TO SAVEPOINT source_candidate_review;");\n      this.database.exec("RELEASE SAVEPOINT source_candidate_review;");\n      throw error;\n    }\n\n    return {'''
          replace(discovery, old_update, new_update)
          replace(
              discovery,
              '''  }\n}\n\nexport type DiscoveryRunInput = {''',
              '''  }\n\n  private appendReviewEvent(input: {\n    candidateId: string;\n    action: CandidateReviewEventAction;\n    occurredAt: string;\n    decision?: CandidateReviewDecision;\n    reviewer?: string;\n    note?: string;\n    acceptedSourceId?: string;\n    collectionPlanId?: string;\n  }): CandidateReviewEvent {\n    const event: CandidateReviewEvent = {\n      eventId: `rve_${randomUUID().replaceAll("-", "")}`,\n      candidateId: input.candidateId,\n      action: input.action,\n      occurredAt: input.occurredAt,\n      ...(input.decision ? { decision: input.decision } : {}),\n      ...(input.reviewer ? { reviewer: input.reviewer } : {}),\n      ...(input.note ? { note: input.note } : {}),\n      ...(input.acceptedSourceId ? { acceptedSourceId: input.acceptedSourceId } : {}),\n      ...(input.collectionPlanId ? { collectionPlanId: input.collectionPlanId } : {}),\n    };\n    this.database\n      .prepare(\n        `INSERT INTO source_candidate_review_events (\n           event_id, candidate_id, action, decision, occurred_at, reviewer, note,\n           accepted_source_id, collection_plan_id\n         ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)`,\n      )\n      .run(\n        event.eventId,\n        event.candidateId,\n        event.action,\n        event.decision ?? null,\n        event.occurredAt,\n        event.reviewer ?? null,\n        event.note ?? null,\n        event.acceptedSourceId ?? null,\n        event.collectionPlanId ?? null,\n      );\n    return event;\n  }\n}\n\nexport type DiscoveryRunInput = {''',
          )

          source_discovery = "packages/persistence/src/source-discovery.ts"
          replace(
              source_discovery,
              '''  type CandidateReviewDecision,\n  type CandidateReview,\n  type DiscoveryBatchRecord,''',
              '''  type CandidateReviewDecision,\n  type CandidateReview,\n  type CandidateReviewEvent,\n  type CandidateReviewEventAction,\n  type ReopenCandidateInput,\n  type DiscoveryBatchRecord,''',
          )
          replace(
              source_discovery,
              '''  CandidateReviewDecision,\n  CandidateReview,\n  DiscoveryBatchRecord,''',
              '''  CandidateReviewDecision,\n  CandidateReview,\n  CandidateReviewEvent,\n  CandidateReviewEventAction,\n  ReopenCandidateInput,\n  DiscoveryBatchRecord,''',
          )

          graph = "packages/persistence/src/source-graph-registry.ts"
          replace(
              graph,
              '''  reviewNode(nodeId: string, state: Exclude<SourceGraphReviewState, "OBSERVED">): SourceGraphNode;\n  snapshotBySourceId(sourceId: string): SourceGraphSnapshot | null;''',
              '''  reviewNode(nodeId: string, state: Exclude<SourceGraphReviewState, "OBSERVED">): SourceGraphNode;\n  reopenNode(nodeId: string): SourceGraphNode;\n  snapshotBySourceId(sourceId: string): SourceGraphSnapshot | null;''',
          )
          replace(
              graph,
              '''  snapshotBySourceId(sourceId: string): SourceGraphSnapshot | null {''',
              '''  reopenNode(nodeId: string): SourceGraphNode {\n    const current = this.getNode(nodeId);\n    if (!current) {\n      throw new RegistryConflictError(\n        "SOURCE_GRAPH_NODE_NOT_FOUND",\n        `Source Graph node ${nodeId} was not found`,\n      );\n    }\n    if (current.reviewState !== "REJECTED") {\n      throw new RegistryConflictError(\n        "SOURCE_GRAPH_NODE_REOPEN_CONFLICT",\n        `Source Graph node ${nodeId} is ${current.reviewState}; only REJECTED nodes can return to OBSERVED`,\n      );\n    }\n    const next: SourceGraphNode = { ...current, reviewState: "OBSERVED" };\n    if (!isSourceGraphNode(next)) {\n      throw new RegistryValidationError(\n        "Reopened Source Graph node violates Source Graph Protocol v1",\n      );\n    }\n    this.updateNode(next);\n    return next;\n  }\n\n  snapshotBySourceId(sourceId: string): SourceGraphSnapshot | null {''',
          )

          graph_service = "apps/admin/src/server/discovery-source-graph.ts"
          replace(
              graph_service,
              '''export function reviewCandidateGraphNode(\n  graph: SourceGraphRepository,''',
              '''export function reopenCandidateGraphNode(\n  graph: SourceGraphRepository,\n  profile: WebsiteSourceProfile,\n  candidate: SourceCandidate,\n): SourceGraphNode | null {\n  const identityKey = isWebsiteRootUri(candidate.locator, profile)\n    ? profile.canonicalOrigin\n    : canonicalCandidateUri(candidate.locator);\n  const node = graph.findNodeByIdentity(profile.id, "CANONICAL_URI", identityKey);\n  if (!node) return null;\n  return graph.reopenNode(node.id);\n}\n\nexport function reviewCandidateGraphNode(\n  graph: SourceGraphRepository,''',
          )

          service = "apps/admin/src/server/discovery-service.ts"
          replace(
              service,
              '''  ensureWebsiteSourceProfile,\n  reviewCandidateGraphNode,''',
              '''  ensureWebsiteSourceProfile,\n  reopenCandidateGraphNode,\n  reviewCandidateGraphNode,''',
          )
          replace(
              service,
              '''export type ReviewDiscoveryCandidateResult = {\n  candidate: SourceCandidateRecord;\n  source?: SourceDefinition;\n  plan?: CollectionPlan;\n};''',
              '''export type ReviewDiscoveryCandidateResult = {\n  candidate: SourceCandidateRecord;\n  source?: SourceDefinition;\n  plan?: CollectionPlan;\n};\n\nexport type ReopenDiscoveryCandidateInput = {\n  note?: string;\n  reviewer?: string;\n};''',
          )
          replace(
              service,
              '''  review(\n    candidateId: string,\n    input: ReviewDiscoveryCandidateInput,\n  ): ReviewDiscoveryCandidateResult {''',
              '''  reopen(\n    candidateId: string,\n    input: ReopenDiscoveryCandidateInput = {},\n  ): ReviewDiscoveryCandidateResult {\n    const current = this.dependencies.discovery.getCandidate(candidateId);\n    if (!current) {\n      return {\n        candidate: this.dependencies.discovery.reopenCandidate(candidateId, input),\n      };\n    }\n    if (current.candidate.status === "ACCEPTED") {\n      throw new RegistryConflictError(\n        "SOURCE_CANDIDATE_REOPEN_ACCEPTED",\n        `Accepted candidate ${candidateId} already owns a Source lifecycle and cannot be restored to pending review`,\n      );\n    }\n\n    const candidateOrigin = websiteOrigin(current.candidate.locator);\n    const profile = this.dependencies.graph.getProfileByCanonicalOrigin(\n      DEFAULT_WORKSPACE.id,\n      candidateOrigin,\n    );\n\n    return this.dependencies.transaction(() => {\n      const candidate = this.dependencies.discovery.reopenCandidate(candidateId, input);\n      if (profile) {\n        reopenCandidateGraphNode(this.dependencies.graph, profile, candidate.candidate);\n      }\n      return { candidate };\n    });\n  }\n\n  review(\n    candidateId: string,\n    input: ReviewDiscoveryCandidateInput,\n  ): ReviewDiscoveryCandidateResult {''',
          )

          i18n = "apps/admin/src/lib/intake-i18n.ts"
          replace(
              i18n,
              '''  rescan: "重新扫描",\n  rejectionReasonTitle:''',
              '''  rescan: "重新扫描",\n  restorePending: "恢复到待审批",\n  restoreSuccess: "候选已恢复到待审批，历史淘汰记录仍然保留。",\n  restoreError: "恢复候选失败",\n  rejectionReasonTitle:''',
          )
          replace(
              i18n,
              '''  rescan: "Rescan",\n  rejectionReasonTitle:''',
              '''  rescan: "Rescan",\n  restorePending: "Restore to pending",\n  restoreSuccess: "Candidate restored to pending review; prior rejection history was retained.",\n  restoreError: "Unable to restore candidate",\n  rejectionReasonTitle:''',
          )

          ui = "apps/admin/src/lib/admin-v2/source-smart-review-ui.tsx"
          replace(
              ui,
              '''  const [rescanningId, setRescanningId] = useState<string | null>(null);\n  const [message, setMessage] = useState<string | null>(null);''',
              '''  const [rescanningId, setRescanningId] = useState<string | null>(null);\n  const [restoringId, setRestoringId] = useState<string | null>(null);\n  const [message, setMessage] = useState<string | null>(null);''',
          )
          replace(
              ui,
              '''  function rejectionLabel(note: string | undefined): string | null {''',
              '''  async function restorePending(record: CandidateRecord) {\n    const candidateId = record.candidate.candidateId;\n    setRestoringId(candidateId);\n    setError(null);\n    setMessage(null);\n    try {\n      const response = await fetch("/api/discovery/reviews/reopen", {\n        method: "POST",\n        headers: { "content-type": "application/json" },\n        body: JSON.stringify({\n          candidateId,\n          reviewer: "admin-console",\n          note: "restore:manual",\n        }),\n      });\n      if (!response.ok) throw new Error(await responseError(response));\n      setTab("PENDING");\n      setMessage(t("restoreSuccess"));\n      await refresh();\n    } catch (restoreError) {\n      setError(restoreError instanceof Error ? restoreError.message : t("restoreError"));\n    } finally {\n      setRestoringId(null);\n    }\n  }\n\n  function rejectionLabel(note: string | undefined): string | null {''',
          )
          replace(
              ui,
              '''                        {tab === "REJECTED" ? (\n                          <button\n                            type="button"\n                            disabled={rescanningId === candidateId}\n                            onClick={() => void rescan(record)}\n                            className="inline-flex items-center gap-1.5 rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-medium text-slate-600 disabled:opacity-40"\n                          >\n                            {rescanningId === candidateId ? (\n                              <Loader2 size={14} className="animate-spin" />\n                            ) : (\n                              <RotateCcw size={14} />\n                            )}\n                            {t("rescan")}\n                          </button>\n                        ) : null}''',
              '''                        {tab === "REJECTED" ? (\n                          <>\n                            <button\n                              type="button"\n                              disabled={Boolean(restoringId) || Boolean(rescanningId)}\n                              onClick={() => void restorePending(record)}\n                              className="inline-flex items-center gap-1.5 rounded-lg bg-slate-950 px-3 py-1.5 text-xs font-semibold text-white disabled:opacity-40"\n                            >\n                              {restoringId === candidateId ? (\n                                <Loader2 size={14} className="animate-spin" />\n                              ) : (\n                                <RotateCcw size={14} />\n                              )}\n                              {t("restorePending")}\n                            </button>\n                            <button\n                              type="button"\n                              disabled={Boolean(restoringId) || Boolean(rescanningId)}\n                              onClick={() => void rescan(record)}\n                              className="inline-flex items-center gap-1.5 rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-medium text-slate-600 disabled:opacity-40"\n                            >\n                              {rescanningId === candidateId ? (\n                                <Loader2 size={14} className="animate-spin" />\n                              ) : (\n                                <RefreshCw size={14} />\n                              )}\n                              {t("rescan")}\n                            </button>\n                          </>\n                        ) : null}''',
          )

          test = "packages/persistence/tests/source-discovery-registry.test.ts"
          replace(
              test,
              '''    expect(remembered?.batchId).toBe("disc_rediscovered");\n\n    expect(\n      repository.reviewCandidate("cand_test", {\n        decision: "REJECTED",\n        reviewer: "operator-1",\n      }).candidate.status,\n    ).toBe("REJECTED");\n    expect(() =>\n      repository.reviewCandidate("cand_test", {\n        decision: "ACCEPTED",\n        acceptedSourceId: "src_missing",\n        collectionPlanId: "pln_missing",\n      }),\n    ).toThrow(/already REJECTED/);''',
              '''    expect(remembered?.batchId).toBe("disc_rediscovered");\n    expect(repository.listReviewEvents("cand_test")).toMatchObject([\n      { action: "REVIEWED", decision: "REJECTED", note: rejectionNote },\n    ]);\n\n    expect(\n      repository.reviewCandidate("cand_test", {\n        decision: "REJECTED",\n        reviewer: "operator-1",\n      }).candidate.status,\n    ).toBe("REJECTED");\n    expect(repository.listReviewEvents("cand_test")).toHaveLength(1);\n    expect(() =>\n      repository.reviewCandidate("cand_test", {\n        decision: "ACCEPTED",\n        acceptedSourceId: "src_missing",\n        collectionPlanId: "pln_missing",\n      }),\n    ).toThrow(/already REJECTED/);\n\n    now = "2026-08-08T01:05:00.000Z";\n    const reopened = repository.reopenCandidate("cand_test", {\n      reviewer: "operator-2",\n      note: "restore:manual",\n    });\n    expect(reopened.candidate.status).toBe("DISCOVERED");\n    expect(reopened.review).toBeUndefined();\n    expect(repository.listCandidates().summary.DISCOVERED).toBe(1);\n    expect(repository.listReviewEvents("cand_test")).toMatchObject([\n      { action: "REVIEWED", decision: "REJECTED", note: rejectionNote },\n      { action: "REOPENED", reviewer: "operator-2", note: "restore:manual" },\n    ]);\n\n    now = "2026-08-08T01:06:00.000Z";\n    repository.reviewCandidate("cand_test", {\n      decision: "REJECTED",\n      reviewer: "operator-3",\n      note: "reason:NOT_NEEDED",\n    });\n    expect(repository.listReviewEvents("cand_test")).toHaveLength(3);''',
          )
          replace(
              test,
              '''    database.close();\n  });\n});''',
              '''    database.close();\n  });\n\n  it("does not reopen an accepted candidate that already owns source lifecycle objects", () => {\n    const database = openRegistryDatabase(":memory:");\n    const repository = new SqliteSourceDiscoveryRepository(\n      database,\n      () => new Date("2026-08-08T02:00:00.000Z"),\n    );\n    const seed = repository.createSeed({ locator: "https://example.com/" });\n    repository.createBatch({\n      batchId: "disc_accepted",\n      seeds: [{ seedId: seed.seedId, locator: seed.locator }],\n      createdAt: "2026-08-08T01:59:00.000Z",\n    });\n    repository.completeBatch("disc_accepted", [\n      {\n        candidateId: "cand_accepted",\n        locator: "https://example.com/accepted",\n        discoveredAt: "2026-08-08T01:59:30.000Z",\n        status: "DISCOVERED",\n      },\n    ]);\n    repository.reviewCandidate("cand_accepted", {\n      decision: "ACCEPTED",\n      acceptedSourceId: "src_test",\n      collectionPlanId: "pln_test",\n    });\n\n    expect(() => repository.reopenCandidate("cand_accepted")).toThrow(/only REJECTED/);\n    expect(repository.listReviewEvents("cand_accepted")).toHaveLength(1);\n    database.close();\n  });\n});''',
          )

          graph_test = "packages/persistence/tests/source-graph-registry.test.ts"
          replace(
              graph_test,
              '''  it("rejects cross-source nodes and dangling or cross-profile edges", () => {''',
              '''  it("allows an explicit rejected node recovery without allowing retained nodes to reopen", () => {\n    const { graph } = repository();\n    graph.createProfile(profile(), root());\n    graph.ingestObservationBatch(batch());\n    graph.reviewNode(PAGE_ID, "REJECTED");\n    expect(graph.reopenNode(PAGE_ID).reviewState).toBe("OBSERVED");\n    graph.reviewNode(PAGE_ID, "RETAINED");\n    expect(() => graph.reopenNode(PAGE_ID)).toThrow(RegistryConflictError);\n  });\n\n  it("rejects cross-source nodes and dangling or cross-profile edges", () => {''',
          )
          PY
          pnpm exec prettier --write \
            packages/persistence/src/source-discovery-registry.ts \
            packages/persistence/src/source-discovery.ts \
            packages/persistence/src/source-graph-registry.ts \
            apps/admin/src/server/discovery-source-graph.ts \
            apps/admin/src/server/discovery-service.ts \
            apps/admin/src/lib/intake-i18n.ts \
            apps/admin/src/lib/admin-v2/source-smart-review-ui.tsx \
            packages/persistence/tests/source-discovery-registry.test.ts \
            packages/persistence/tests/source-graph-registry.test.ts
          git rm .github/workflows/apply-rejected-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Admin V2: restore rejected candidates with audit history"
          git push origin HEAD:${{ github.head_ref }}
