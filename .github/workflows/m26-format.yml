name: M26 Format

on:
  push:
    branches:
      - m26-foundational-collection-outcome-feedback

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m26-foundational-collection-outcome-feedback
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M26 files
        run: |
          pnpm exec prettier --write \
            packages/worker-runtime/package.json \
            packages/worker-runtime/src/foundational-collection-outcome.ts \
            packages/worker-runtime/src/__tests__/foundational-collection-outcome.test.ts \
            apps/admin/src/server/foundational-collection-outcomes.ts \
            apps/admin/src/server/foundational-collection-outcomes.test.ts \
            apps/admin/src/server/foundational-action-executions.ts \
            apps/admin/src/app/api/foundational/collection-outcomes/route.ts \
            apps/admin/src/components/foundational/foundational-operator-state.ts \
            apps/admin/src/components/foundational/foundational-operator-state.test.ts \
            apps/admin/src/components/foundational/foundational-operator-workbench.tsx \
            apps/admin/src/components/foundational/foundational-operator-panel.tsx \
            docs/architecture/M26_FOUNDATIONAL_COLLECTION_OUTCOME_FEEDBACK.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages apps docs
          git commit -m "M26 format collection outcome feedback"
          git push
