name: Phase 3 Docs Autoformat

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 3 docs
        run: |
          pnpm exec prettier --write README.md NEXT_TASKS.md
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md NEXT_TASKS.md
          git commit -m "style: format Phase 3 docs"
          git push
