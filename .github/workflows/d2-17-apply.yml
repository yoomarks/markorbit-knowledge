name: D2.17 Apply

on:
  push:
    branches:
      - codex/d2-17-historical-policy-resolution
    paths:
      - .github/workflows/d2-17-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d2-17-historical-policy-resolution
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply D2.17
        run: |
          python - <<'PY'
          from pathlib import Path

          def write(path, content):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content)

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing anchor in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          write('packages/contracts/src/source-intelligence-historical-policy-resolution-v2.ts', r'''import type {
