name: Temporary controlled worker retry patch

on:
  push:
    branches:
      - codex/controlled-worker-retry-backoff-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/controlled-worker-retry-backoff-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply durable retry changes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new))

          path = "packages/persistence/src/controlled-worker-execution.ts"
          replace(
              path,
              '''import { RegistryConflictError, RegistryError, RegistryValidationError } from "./index";\nimport {\n''',
              '''import { RegistryConflictError, RegistryError, RegistryValidationError } from "./index";\nimport { generateJobId } from "./execution-ledger";\nimport {\n''',
          )
          replace(
              path,
              '''    private readonly clock: () => Date = () => new Date(),\n    private readonly attemptIdFactory: () => string = () => generateExecutionAttemptId(),\n    private readonly eventIdFactory: () => string = () => generateExecutionEventId(),\n  ) {\n''',
              '''    private readonly clock: () => Date = () => new Date(),\n    private readonly attemptIdFactory: () => string = () => generateExecutionAttemptId(),\n    private readonly eventIdFactory: () => string = () => generateExecutionEventId(),\n    private readonly jobIdFactory: () => string = () => generateJobId(),\n  ) {\n''',
          )
          old_terminal = '''      this.updateAttempt(nextAttempt);\n      this.insertEvent(event);\n      this.updateJob(job, target, now);\n      this.updateRun(run, target, now);\n      this.closeLease(\n        lease,\n        "RELEASED",\n        completing ? "EXECUTION_COMPLETED" : "EXECUTION_FAILED",\n        now,\n      );\n'''
          new_terminal = '''      this.updateAttempt(nextAttempt);\n      this.insertEvent(event);\n      let leaseReason = completing ? "EXECUTION_COMPLETED" : "EXECUTION_FAILED";\n      if (completing) {\n        this.updateJob(job, "COMPLETED", now);\n        this.updateRun(run, "COMPLETED", now);\n      } else if (terminal.failure.retryable && job.attempt < job.maxAttempts) {\n        this.updateJob(job, "RETRY", now);\n        this.insertRetryJob(job, now);\n        this.updateRun(run, "PENDING", now);\n        leaseReason = "EXECUTION_RETRY_SCHEDULED";\n      } else if (terminal.failure.retryable) {\n        this.updateJob(job, "DEAD_LETTER", now);\n        this.updateRun(run, "FAILED", now);\n        leaseReason = "EXECUTION_RETRY_EXHAUSTED";\n      } else {\n        this.updateJob(job, "FAILED", now);\n        this.updateRun(run, "FAILED", now);\n      }\n      this.closeLease(lease, "RELEASED", leaseReason, now);\n'''
          replace(path, old_terminal, new_terminal)
          insert_before = '''  private updateJob(job: Job, status: JobStatus, timestamp: string): void {\n'''
          insert_method = '''  private insertRetryJob(job: Job, timestamp: string): Job {\n    const backoffMs = job.planSnapshot.policy.retry.backoffSeconds * 1_000;\n    const retryJob: Job = {\n      ...clone(job),\n      id: this.jobIdFactory(),\n      status: "PENDING",\n      attempt: job.attempt + 1,\n      availableAt: new Date(Date.parse(timestamp) + backoffMs).toISOString(),\n      createdAt: timestamp,\n      updatedAt: timestamp,\n    };\n    if (!isJob(retryJob)) {\n      throw new RegistryValidationError("Retry Job does not satisfy Execution Contract v1");\n    }\n    this.database\n      .prepare(\n        `INSERT INTO jobs (\n           id, run_id, workspace_id, source_id, plan_id, connector_id, connector_version,\n           job_type, status, attempt, available_at, document_json, created_at, updated_at\n         ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,\n      )\n      .run(\n        retryJob.id,\n        retryJob.runId,\n        retryJob.workspaceId,\n        retryJob.sourceId,\n        retryJob.planId,\n        retryJob.connector.connectorId,\n        retryJob.connector.version,\n        retryJob.jobType,\n        retryJob.status,\n        retryJob.attempt,\n        retryJob.availableAt,\n        JSON.stringify(retryJob),\n        retryJob.createdAt,\n        retryJob.updatedAt,\n      );\n    return retryJob;\n  }\n\n'''
          replace(path, insert_before, insert_method + insert_before)

          test_path = "packages/persistence/tests/controlled-worker-execution.test.ts"
          replace(
              test_path,
              '''function createEnvironment(database = new DatabaseSync(":memory:")) {\n''',
              '''function createEnvironment(\n  database = new DatabaseSync(":memory:"),\n  retryPolicy = { maxAttempts: 3, backoffSeconds: 10 },\n) {\n''',
          )
          replace(
              test_path,
              '''      retry: { maxAttempts: 3, backoffSeconds: 10 },\n''',
              '''      retry: retryPolicy,\n''',
          )
          test = Path(test_path)
          text = test.read_text()
          anchor = '''  it("rejects skips, reversals and conflicting key reuse", () => {\n'''
          cases = '''  it("schedules retryable failures with durable backoff before the next claim", () => {\n    const env = createEnvironment();\n    start(env);\n    const failed = env.executions.fail(\n      env.worker.view.worker.id,\n      env.worker.credential,\n      env.claim.lease!.id,\n      env.claim.leaseToken!,\n      {\n        idempotencyKey: "retryable-failure",\n        code: "UPSTREAM_TEMPORARY_FAILURE",\n        message: "The upstream source is temporarily unavailable.",\n        retryable: true,\n      },\n    );\n\n    expect(failed.attempt.status).toBe("FAILED");\n    const waiting = env.runs.getById(env.record.run.id);\n    expect(waiting?.run.status).toBe("PENDING");\n    expect(waiting?.jobs.map((job) => [job.attempt, job.status])).toEqual([\n      [1, "RETRY"],\n      [2, "PENDING"],\n    ]);\n    expect(waiting?.jobs[1]?.availableAt).toBe("2026-07-16T08:00:10.000Z");\n    expect(env.workers.listLeases({ status: "RELEASED" }).items[0]?.closeReason).toBe(\n      "EXECUTION_RETRY_SCHEDULED",\n    );\n\n    expect(env.workers.claim(env.worker.view.worker.id, env.worker.credential).job).toBeNull();\n    env.advance(9_999);\n    expect(env.workers.claim(env.worker.view.worker.id, env.worker.credential).job).toBeNull();\n    env.advance(1);\n    const retryClaim = env.workers.claim(env.worker.view.worker.id, env.worker.credential);\n    expect(retryClaim.job?.attempt).toBe(2);\n    expect(retryClaim.job?.status).toBe("LEASED");\n\n    env.database.close();\n  });\n\n  it("dead-letters retryable failures after maxAttempts instead of looping forever", () => {\n    const env = createEnvironment(new DatabaseSync(":memory:"), {\n      maxAttempts: 1,\n      backoffSeconds: 10,\n    });\n    start(env);\n    env.executions.fail(\n      env.worker.view.worker.id,\n      env.worker.credential,\n      env.claim.lease!.id,\n      env.claim.leaseToken!,\n      {\n        idempotencyKey: "retry-exhausted",\n        code: "UPSTREAM_TEMPORARY_FAILURE",\n        message: "The upstream source remains unavailable.",\n        retryable: true,\n      },\n    );\n\n    const exhausted = env.runs.getById(env.record.run.id);\n    expect(exhausted?.run.status).toBe("FAILED");\n    expect(exhausted?.jobs).toHaveLength(1);\n    expect(exhausted?.jobs[0]?.status).toBe("DEAD_LETTER");\n    expect(env.workers.listLeases({ status: "RELEASED" }).items[0]?.closeReason).toBe(\n      "EXECUTION_RETRY_EXHAUSTED",\n    );\n\n    env.database.close();\n  });\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit("controlled worker test anchor mismatch")
          test.write_text(text.replace(anchor, cases + anchor))
      - name: Format changed files
        run: pnpm exec prettier --write packages/persistence/src/controlled-worker-execution.ts packages/persistence/tests/controlled-worker-execution.test.ts
      - name: Targeted checks
        run: |
          pnpm --filter @markorbit/persistence test -- controlled-worker-execution.test.ts
          pnpm --filter @markorbit/persistence typecheck
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/persistence/src/controlled-worker-execution.ts packages/persistence/tests/controlled-worker-execution.test.ts
          git commit -m "Worker: persist retry backoff for controlled execution"
          git push origin HEAD:codex/controlled-worker-retry-backoff-v1
