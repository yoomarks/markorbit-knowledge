name: Temporary Phase2 USPTO Fee Live Prettier

on:
  push:
    branches:
      - phase2/uspto-official-fee-live-evidence

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2/uspto-official-fee-live-evidence
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/admin/src/server/uspto-official-fee-live-evidence.e2e.ts
          apps/worker/src/bootstrap-uspto.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/admin/src/server/uspto-official-fee-live-evidence.e2e.ts apps/worker/src/bootstrap-uspto.ts
          git commit -m "style: format Phase 2 fee live evidence"
          git push origin HEAD:phase2/uspto-official-fee-live-evidence
