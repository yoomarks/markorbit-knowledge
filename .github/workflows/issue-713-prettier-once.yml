name: Issue 713 Prettier Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-once:
    if: github.head_ref == 'issue-713-progressive-disclosure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target and remove one-shot workflow
        run: |
          pnpm exec prettier --write apps/admin/src/components/knowledge/knowledge-hybrid-search-v2.tsx
          rm .github/workflows/issue-713-prettier-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/components/knowledge/knowledge-hybrid-search-v2.tsx .github/workflows/issue-713-prettier-once.yml
          git commit -m "style: format Knowledge search progressive disclosure (#713)"
          git push origin HEAD:${{ github.head_ref }}
