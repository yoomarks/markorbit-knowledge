name: M12 Format

on:
  push:
    branches:
      - feature/m12-wipo-source-supply

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'M12 format WIPO supply test') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m12-wipo-source-supply
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/worker/tests/wipo-source-supply.test.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/tests/wipo-source-supply.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "M12 format WIPO supply test"
          git push
