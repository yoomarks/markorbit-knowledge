name: Agent R1-K14 Reliability Fix

on:
  push:
    branches:
      - r1-k14-ready-package-v2-delivery-foundation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r1-k14-ready-package-v2-delivery-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch strict result evidence validation and sanitized view
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('packages/persistence/src/ready-package-v2-delivery-submission.ts')
          s = p.read_text()
          old = '''  if (!value || Number.isNaN(Date.parse(value.recordedAt))) {
            throw new RegistryConflictError(
              "READY_PACKAGE_V2_DELIVERY_RESULT_EVIDENCE_INVALID",
              "Persisted ReadyPackage V2 delivery result evidence is invalid",
            );
          }
          assertReadyPackageV2DeliveryResultV1(value);'''
          new = '''  if (!value || Number.isNaN(Date.parse(value.recordedAt))) {
            throw new RegistryConflictError(
              "READY_PACKAGE_V2_DELIVERY_RESULT_EVIDENCE_INVALID",
              "Persisted ReadyPackage V2 delivery result evidence is invalid",
            );
          }
          const result: ReadyPackageV2DeliveryResultV1 = {
            protocolVersion: value.protocolVersion,
            objectType: value.objectType,
            deliveryId: value.deliveryId,
            readyPackageId: value.readyPackageId,
            status: value.status,
            requestSha256: value.requestSha256,
          };
          assertReadyPackageV2DeliveryResultV1(result);'''
          if old not in s:
              raise SystemExit('result evidence snippet not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('apps/admin/src/server/ready-package-v2-delivery-service.ts')
          s = p.read_text()
          old = '''export function readyPackageV2DeliverySubmissionView(
            submission: ReadyPackageV2DeliverySubmission,
          ): ReadyPackageV2DeliverySubmissionView {
            const { requestJson: _requestJson, idempotencyKey: _idempotencyKey, ...view } = submission;
            return view;
          }'''
          new = '''export function readyPackageV2DeliverySubmissionView(
            submission: ReadyPackageV2DeliverySubmission,
          ): ReadyPackageV2DeliverySubmissionView {
            return {
              submissionId: submission.submissionId,
              workspaceId: submission.workspaceId,
              readyPackageId: submission.readyPackageId,
              readyPackageDigest: submission.readyPackageDigest,
              coreWorkspaceId: submission.coreWorkspaceId,
              requestSha256: submission.requestSha256,
              contentExportSha256: submission.contentExportSha256,
              state: submission.state,
              transportAttempts: submission.transportAttempts,
              ...(submission.lastTransportAttemptedAt
                ? { lastTransportAttemptedAt: submission.lastTransportAttemptedAt }
                : {}),
              ...(submission.transportResult ? { transportResult: submission.transportResult } : {}),
              ...(submission.result ? { result: submission.result } : {}),
              createdAt: submission.createdAt,
              updatedAt: submission.updatedAt,
            };
          }'''
          if old not in s:
              raise SystemExit('sanitized view snippet not found')
          p.write_text(s.replace(old, new, 1))
          PY
          pnpm exec prettier --write \
            packages/persistence/src/ready-package-v2-delivery-submission.ts \
            apps/admin/src/server/ready-package-v2-delivery-service.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/persistence/src/ready-package-v2-delivery-submission.ts apps/admin/src/server/ready-package-v2-delivery-service.ts
          git commit -m 'fix(r1-k14): validate durable V2 result evidence'
          git push origin HEAD:r1-k14-ready-package-v2-delivery-foundation
