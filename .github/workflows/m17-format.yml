name: M17 Format

on:
  push:
    branches:
      - m17-controlled-retrieval-remediation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m17-controlled-retrieval-remediation
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/admin/src/app/api/retrieval/remediation/executions/route.ts
          packages/persistence/src/retrieval-remediation-execution.ts
          packages/persistence/tests/retrieval-remediation-execution.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/app/api/retrieval/remediation/executions/route.ts packages/persistence/src/retrieval-remediation-execution.ts packages/persistence/tests/retrieval-remediation-execution.test.ts
          git commit -m "chore: format M17 controlled remediation"
          git push origin HEAD:m17-controlled-retrieval-remediation
