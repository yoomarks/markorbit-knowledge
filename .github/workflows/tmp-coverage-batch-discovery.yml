name: Temporary coverage batch Discovery verification

on:
  push:
    branches:
      - codex/coverage-batch-discovery-intake-v1

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/tmp/patch_coverage_batch_ui.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/persistence/src/source-coverage-discovery-intake.ts packages/persistence/tests/source-coverage-discovery-intake.test.ts apps/admin/src/app/api/source-coverage/discovery/route.ts apps/admin/src/components/sources/source-country-coverage.tsx
      - run: pnpm --filter @markorbit/persistence exec vitest run tests/source-coverage-discovery-intake.test.ts
      - run: pnpm typecheck
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/source-coverage-discovery-intake.ts packages/persistence/tests/source-coverage-discovery-intake.test.ts apps/admin/src/app/api/source-coverage/discovery/route.ts apps/admin/src/components/sources/source-country-coverage.tsx
          git commit -m "Coverage: batch missing targets into Discovery review" || true
          git push
