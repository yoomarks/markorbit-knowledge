name: PR700 Search Locator Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr700-search-locator-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.number == 700 && github.head_ref == 'issue-697-admin-browser-acceptance'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch Knowledge search locator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/worker/src/run-admin-browser-acceptance.ts')
          text = path.read_text()
          old = '''  const search = page.locator('input[type="text"]').first();'''
          new = '''  const search = page.getByRole("textbox", { name: /Search|搜索/ });'''
          if old not in text:
              raise SystemExit('generic Knowledge search locator not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/worker/src/run-admin-browser-acceptance.ts
          pnpm --filter @markorbit/worker typecheck
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/run-admin-browser-acceptance.ts
          git commit -m "fix: locate Knowledge search by accessible name"
          git push origin HEAD:${{ github.head_ref }}
