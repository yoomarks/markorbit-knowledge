name: Apply HTTP validator correctness patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/http-validator-correctness-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply focused correctness edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}")
              p.write_text(text.replace(old, new, 1))

          def insert_before_last(path: str, marker: str, addition: str) -> None:
              p = Path(path)
              text = p.read_text()
              index = text.rfind(marker)
              if index < 0:
                  raise SystemExit(f"final marker missing in {path}")
              p.write_text(text[:index] + addition + text[index:])

          rss = "packages/worker-runtime/src/rss-acquirer.ts"
          replace_once(
              rss,
              '''  type ArtifactBackedExecutionContext,\n  CollectionAcquisitionError,\n  type CollectionArtifactAcquirer,\n''',
              '''  type ArtifactBackedExecutionContext,\n  CollectionAcquisitionError,\n  CollectionNotModifiedSignal,\n  type CollectionArtifactAcquirer,\n''',
          )
          replace_once(
              rss,
              '''function normalizeTransportError(error: unknown): never {\n  if (error instanceof CollectionAcquisitionError) {\n''',
              '''function normalizeTransportError(error: unknown): never {\n  if (error instanceof CollectionNotModifiedSignal) throw error;\n  if (error instanceof CollectionAcquisitionError) {\n''',
          )

          conditional = "packages/worker-runtime/src/conditional-http-change-watch.ts"
          replace_once(
              conditional,
              '''    if (response.statusCode === 304 && conditional) {\n      throw new CollectionNotModifiedSignal(\n        canonicalUri,\n        "HTTP conditional request confirmed the remote representation is unchanged",\n      );\n    }\n''',
              '''    if (response.statusCode === 304 && conditional) {\n      try {\n        await validators.write(context, canonicalUri, {\n          etag: responseHeader(response, "etag") ?? etag,\n          lastModified: responseHeader(response, "last-modified") ?? lastModified,\n        });\n      } catch {\n        // The remote 304 is authoritative for this request. A checkpoint refresh\n        // failure must not turn a no-change observation into acquisition failure.\n      }\n      throw new CollectionNotModifiedSignal(\n        canonicalUri,\n        "HTTP conditional request confirmed the remote representation is unchanged",\n      );\n    }\n''',
          )
          replace_once(
              conditional,
              '''      if (next.etag || next.lastModified) {\n        try {\n          await validators.write(context, canonicalUri, next);\n        } catch {\n          // Persisting validators is also an optimization. Preserve acquired evidence.\n        }\n      }\n''',
              '''      if (next.etag || next.lastModified || checkpoint) {\n        try {\n          await validators.write(context, canonicalUri, next);\n        } catch {\n          // Persisting or clearing validators is an optimization. Preserve acquired evidence.\n        }\n      }\n''',
          )
          replace_once(
              conditional,
              '''  async write(\n    context: ArtifactBackedExecutionContext,\n    canonicalUri: string,\n    checkpoint: HttpValidatorCheckpoint,\n  ): Promise<void> {\n    await this.request(context, {\n      operation: "WRITE",\n      canonicalUri,\n      etag: checkpoint.etag,\n      lastModified: checkpoint.lastModified,\n      observedAt: new Date().toISOString(),\n    });\n  }\n''',
              '''  async write(\n    context: ArtifactBackedExecutionContext,\n    canonicalUri: string,\n    checkpoint: HttpValidatorCheckpoint,\n  ): Promise<void> {\n    if (!checkpoint.etag && !checkpoint.lastModified) {\n      await this.request(context, { operation: "CLEAR", canonicalUri });\n      return;\n    }\n    await this.request(context, {\n      operation: "WRITE",\n      canonicalUri,\n      etag: checkpoint.etag,\n      lastModified: checkpoint.lastModified,\n      observedAt: new Date().toISOString(),\n    });\n  }\n''',
          )

          server = "apps/admin/src/server/http-validator-checkpoint.ts"
          replace_once(
              server,
              '''  write(input: WriteHttpValidatorCheckpointInput): HttpValidatorCheckpoint {\n''',
              '''  clear(input: HttpValidatorCheckpointAuth & { canonicalUri: string }): boolean {\n    const scope = this.sourceScopeForLease(input);\n    const canonicalUri = canonicalHttpUri(input.canonicalUri);\n    const result = this.database\n      .prepare(\n        `DELETE FROM http_validator_checkpoints\n         WHERE workspace_id = ? AND source_id = ? AND canonical_uri = ?`,\n      )\n      .run(scope.workspaceId, scope.sourceId, canonicalUri);\n    return Number(result.changes) > 0;\n  }\n\n  write(input: WriteHttpValidatorCheckpointInput): HttpValidatorCheckpoint {\n''',
          )
          replace_once(
              server,
              '''export function writeHttpValidatorCheckpoint(\n  input: WriteHttpValidatorCheckpointInput,\n): HttpValidatorCheckpoint {\n  return repository().write(input);\n}\n''',
              '''export function writeHttpValidatorCheckpoint(\n  input: WriteHttpValidatorCheckpointInput,\n): HttpValidatorCheckpoint {\n  return repository().write(input);\n}\n\nexport function clearHttpValidatorCheckpoint(\n  input: HttpValidatorCheckpointAuth & { canonicalUri: string },\n): boolean {\n  return repository().clear(input);\n}\n''',
          )

          route = "apps/admin/src/app/api/worker/v1/http-validators/route.ts"
          replace_once(
              route,
              '''import {\n  readHttpValidatorCheckpoint,\n  writeHttpValidatorCheckpoint,\n} from "@/server/http-validator-checkpoint";\n''',
              '''import {\n  clearHttpValidatorCheckpoint,\n  readHttpValidatorCheckpoint,\n  writeHttpValidatorCheckpoint,\n} from "@/server/http-validator-checkpoint";\n''',
          )
          replace_once(
              route,
              '''    if (body.operation === "WRITE") {\n''',
              '''    if (body.operation === "CLEAR") {\n      return NextResponse.json({ cleared: clearHttpValidatorCheckpoint(auth) });\n    }\n    if (body.operation === "WRITE") {\n''',
          )
          replace_once(
              route,
              '''    throw new RegistryValidationError("operation must be READ or WRITE");\n''',
              '''    throw new RegistryValidationError("operation must be READ, WRITE or CLEAR");\n''',
          )

          insert_before_last(
              "packages/worker-runtime/tests/conditional-http-change-watch.test.ts",
              "\n});\n",
              '''\n  it("clears a stale validator checkpoint when a successful response stops advertising validators", async () => {\n    const write = vi.fn(async () => {});\n    const validators: HttpValidatorClient = {\n      async read() {\n        return { etag: '\"old\"', lastModified: null };\n      },\n      write,\n    };\n    const base: ApiTransport = vi.fn(async () => ({\n      statusCode: 200,\n      headers: {},\n      body: new TextEncoder().encode('{"ok":true}'),\n    }));\n    const conditional = createConditionalHttpChangeWatch(base, validators);\n    const acquirer = conditional.wrap({\n      executor: { executorId: "fixture", version: "1.0.0", mode: "FIXTURE" },\n      async acquire() {\n        await conditional.transport(request);\n        return [];\n      },\n    });\n\n    await acquirer.acquire(context());\n\n    expect(write).toHaveBeenCalledWith(expect.anything(), "https://example.com/feed?b=2&a=1", {\n      etag: null,\n      lastModified: null,\n    });\n  });\n''',
          )

          insert_before_last(
              "packages/worker-runtime/tests/http-validator-control-plane-client.test.ts",
              "\n});\n",
              '''\n  it("uses authenticated CLEAR when both validators are absent", async () => {\n    const fetcher = vi.fn(async (_url: string | URL | Request, init?: RequestInit) => {\n      expect(JSON.parse(String(init?.body))).toEqual({\n        workerId: "wrk_fixture",\n        leaseId: "lse_fixture",\n        operation: "CLEAR",\n        canonicalUri: "https://example.com/feed",\n      });\n      return new Response(JSON.stringify({ cleared: true }), {\n        status: 200,\n        headers: { "content-type": "application/json" },\n      });\n    });\n    const client = new HttpValidatorControlPlaneClient(\n      "https://control.example.test/",\n      "wrk_fixture",\n      "worker-secret",\n      fetcher as typeof fetch,\n    );\n\n    await client.write(context, "https://example.com/feed", { etag: null, lastModified: null });\n    expect(fetcher).toHaveBeenCalledTimes(1);\n  });\n''',
          )

          insert_before_last(
              "apps/admin/src/server/__tests__/http-validator-checkpoint.test.ts",
              "\n});\n",
              '''\n  it("clears a stale checkpoint under the same authenticated lease scope", () => {\n    const env = fixture();\n    try {\n      env.repository.write({\n        ...env.auth,\n        canonicalUri: "https://example.com/feed",\n        etag: '\"old\"',\n      });\n      expect(\n        env.repository.clear({ ...env.auth, canonicalUri: "https://example.com/feed#fragment" }),\n      ).toBe(true);\n      expect(\n        env.repository.read({ ...env.auth, canonicalUri: "https://example.com/feed" }),\n      ).toBeNull();\n      expect(\n        env.repository.clear({ ...env.auth, canonicalUri: "https://example.com/feed" }),\n      ).toBe(false);\n    } finally {\n      env.database.close();\n    }\n  });\n''',
          )

          Path(".github/workflows/http-validator-correctness-patch.yml").unlink()
          PY

      - name: Format changed files
        run: pnpm exec prettier --write packages/worker-runtime/src/rss-acquirer.ts packages/worker-runtime/src/conditional-http-change-watch.ts packages/worker-runtime/tests/conditional-http-change-watch.test.ts packages/worker-runtime/tests/http-validator-control-plane-client.test.ts packages/worker-runtime/tests/rss-conditional-http-change-watch.test.ts apps/admin/src/server/http-validator-checkpoint.ts apps/admin/src/server/__tests__/http-validator-checkpoint.test.ts apps/admin/src/app/api/worker/v1/http-validators/route.ts

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "markorbit-ci"
          git config user.email "ci@markorbit.invalid"
          git add -A
          git commit -m "fix(worker): preserve RSS 304 and clear stale validators"
          git push origin HEAD:agent/http-validator-correctness-v1
