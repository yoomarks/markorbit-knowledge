name: Temporary 567 Formatter

on:
  push:
    branches:
      - source-intelligence/566-durable-regression-ledger
    paths:
      - .github/workflows/tmp-format-567.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-intelligence/566-durable-regression-ledger
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 3 files
        run: >-
          pnpm exec prettier --write
          packages/contracts/src/index.ts
          packages/persistence/package.json
          packages/persistence/src/acquisition-recurring-regression-ledger.test.ts
          packages/persistence/src/acquisition-recurring-regression-ledger.ts
          scripts/acquisition-recurring-regression-ledger-canary.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/index.ts packages/persistence/package.json packages/persistence/src/acquisition-recurring-regression-ledger.test.ts packages/persistence/src/acquisition-recurring-regression-ledger.ts scripts/acquisition-recurring-regression-ledger-canary.ts
          git commit -m "style: format source intelligence phase 3"
          git push origin HEAD:source-intelligence/566-durable-regression-ledger
