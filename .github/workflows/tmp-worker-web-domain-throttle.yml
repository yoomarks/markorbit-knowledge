name: Temporary worker web domain throttle patch

on:
  push:
    branches:
      - codex/worker-web-domain-throttle-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/worker-web-domain-throttle-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply web domain throttle changes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new))

          path = "packages/persistence/src/worker-registry.ts"
          replace(
              path,
              '''export const DEFAULT_LEASE_DURATION_MS = 120_000;\nexport const DEFAULT_MAX_LEASE_LIFETIME_MS = 900_000;\n\nexport type WorkerProtocolOptions = {\n''',
              '''export const DEFAULT_LEASE_DURATION_MS = 120_000;\nexport const DEFAULT_MAX_LEASE_LIFETIME_MS = 900_000;\nexport const DEFAULT_MAX_CONCURRENT_WEB_LEASES_PER_DOMAIN = 2;\n\nexport type WorkerProtocolOptions = {\n''',
          )
          replace(
              path,
              '''  leaseDurationMs?: number;\n  maxLeaseLifetimeMs?: number;\n};\n''',
              '''  leaseDurationMs?: number;\n  maxLeaseLifetimeMs?: number;\n  maxConcurrentWebLeasesPerDomain?: number;\n};\n''',
          )
          replace(
              path,
              '''function boundedDuration(value: number | undefined, fallback: number, field: string): number {\n  const resolved = value ?? fallback;\n  if (!Number.isInteger(resolved) || resolved < 1_000 || resolved > 86_400_000) {\n    throw new RegistryValidationError(`${field} must be between 1000 and 86400000 milliseconds`);\n  }\n  return resolved;\n}\n\nfunction parseWorker(value: unknown): WorkerDefinition {\n''',
              '''function boundedDuration(value: number | undefined, fallback: number, field: string): number {\n  const resolved = value ?? fallback;\n  if (!Number.isInteger(resolved) || resolved < 1_000 || resolved > 86_400_000) {\n    throw new RegistryValidationError(`${field} must be between 1000 and 86400000 milliseconds`);\n  }\n  return resolved;\n}\n\nfunction boundedConcurrency(value: number | undefined): number {\n  const resolved = value ?? DEFAULT_MAX_CONCURRENT_WEB_LEASES_PER_DOMAIN;\n  if (!Number.isInteger(resolved) || resolved < 1 || resolved > 32) {\n    throw new RegistryValidationError(\n      "maxConcurrentWebLeasesPerDomain must be an integer from 1 to 32",\n    );\n  }\n  return resolved;\n}\n\nfunction webDomainKey(job: Job): string | null {\n  if (job.sourceSnapshot.sourceType !== "WEB") return null;\n  const locators = [\n    job.sourceSnapshot.canonicalUri,\n    ...job.sourceSnapshot.entrypoints.map((entrypoint) => entrypoint.uri),\n  ];\n  for (const locator of locators) {\n    if (!locator) continue;\n    try {\n      const url = new URL(locator);\n      if (url.protocol !== "http:" && url.protocol !== "https:") continue;\n      const hostname = url.hostname.toLowerCase();\n      return hostname.startsWith("www.") ? hostname.slice(4) : hostname;\n    } catch {\n      // A non-web locator must not block unrelated work.\n    }\n  }\n  return null;\n}\n\nfunction parseWorker(value: unknown): WorkerDefinition {\n''',
          )
          replace(
              path,
              '''  private readonly leaseDurationMs: number;\n  private readonly maxLeaseLifetimeMs: number;\n\n  constructor(\n''',
              '''  private readonly leaseDurationMs: number;\n  private readonly maxLeaseLifetimeMs: number;\n  private readonly maxConcurrentWebLeasesPerDomain: number;\n\n  constructor(\n''',
          )
          replace(
              path,
              '''    this.maxLeaseLifetimeMs = boundedDuration(\n      options.maxLeaseLifetimeMs,\n      DEFAULT_MAX_LEASE_LIFETIME_MS,\n      "maxLeaseLifetimeMs",\n    );\n    if (this.maxLeaseLifetimeMs < this.leaseDurationMs) {\n''',
              '''    this.maxLeaseLifetimeMs = boundedDuration(\n      options.maxLeaseLifetimeMs,\n      DEFAULT_MAX_LEASE_LIFETIME_MS,\n      "maxLeaseLifetimeMs",\n    );\n    this.maxConcurrentWebLeasesPerDomain = boundedConcurrency(\n      options.maxConcurrentWebLeasesPerDomain,\n    );\n    if (this.maxLeaseLifetimeMs < this.leaseDurationMs) {\n''',
          )
          replace(
              path,
              '''      const job = candidates.find(\n        (candidate) =>\n          candidate.workspaceId === worker.workspaceId && workerCanRun(worker, candidate),\n      );\n''',
              '''      const job = candidates.find(\n        (candidate) =>\n          candidate.workspaceId === worker.workspaceId &&\n          workerCanRun(worker, candidate) &&\n          this.webDomainQuotaAllows(candidate, now),\n      );\n''',
          )
          anchor = '''  renewLease(workerId: string, credential: string, leaseId: string, leaseToken: string): JobLease {\n'''
          method = '''  private webDomainQuotaAllows(job: Job, now: Date): boolean {\n    const domain = webDomainKey(job);\n    if (!domain) return true;\n\n    const windowStart = new Date(now.getTime() - 60_000).toISOString();\n    const rows = this.database\n      .prepare(\n        `SELECT l.status, l.acquired_at, j.document_json\n         FROM job_leases l\n         JOIN jobs j ON j.id = l.job_id\n         WHERE l.status = 'ACTIVE' OR l.acquired_at >= ?`,\n      )\n      .all(windowStart) as Array<{\n      status: JobLeaseStatus;\n      acquired_at: string;\n      document_json: string;\n    }>;\n\n    let active = 0;\n    let recent = 0;\n    let effectiveRateLimit = job.planSnapshot.policy.rateLimitPerMinute;\n    for (const row of rows) {\n      const leasedJob = parseJob(row.document_json);\n      if (webDomainKey(leasedJob) !== domain) continue;\n      effectiveRateLimit = Math.min(\n        effectiveRateLimit,\n        leasedJob.planSnapshot.policy.rateLimitPerMinute,\n      );\n      if (row.status === "ACTIVE") active += 1;\n      if (row.acquired_at >= windowStart) recent += 1;\n    }\n\n    return (\n      active < this.maxConcurrentWebLeasesPerDomain && recent < effectiveRateLimit\n    );\n  }\n\n'''
          replace(path, anchor, method + anchor)

          test_path = "packages/persistence/tests/worker-registry.test.ts"
          replace(
              test_path,
              '''  type CreateWorkerInput,\n} from "../src/worker-registry";\n''',
              '''  type CreateWorkerInput,\n  type WorkerProtocolOptions,\n} from "../src/worker-registry";\n''',
          )
          replace(
              test_path,
              '''function environment(database = new DatabaseSync(":memory:")) {\n''',
              '''function environment(\n  database = new DatabaseSync(":memory:"),\n  workerOptions: WorkerProtocolOptions = {},\n) {\n''',
          )
          replace(
              test_path,
              '''      maxLeaseLifetimeMs: 10_000,\n    },\n''',
              '''      maxLeaseLifetimeMs: 10_000,\n      ...workerOptions,\n    },\n''',
          )
          test = Path(test_path)
          text = test.read_text()
          anchor = '''  it("renews and releases only with owning credential and lease token", () => {\n'''
          cases = '''  it("shares a durable web-domain concurrency gate across Workers and www aliases", () => {\n    const env = environment(new DatabaseSync(":memory:"), {\n      maxConcurrentWebLeasesPerDomain: 1,\n    });\n    const firstSource = env.sources.create(sourceInput());\n    const firstPlan = env.plans.create(planInput(firstSource.id, { name: "First USPTO plan" }));\n    env.runs.dispatchManual({ planId: firstPlan.plan.id });\n    const aliasSource = env.sources.create(\n      sourceInput({\n        name: "USPTO Patents",\n        slug: "uspto-patents",\n        canonicalUri: "https://uspto.gov/patents",\n        entrypoints: [{ uri: "https://uspto.gov/patents" }],\n      }),\n    );\n    const aliasPlan = env.plans.create(planInput(aliasSource.id, { name: "Alias USPTO plan" }));\n    env.runs.dispatchManual({ planId: aliasPlan.plan.id });\n    const otherSource = env.sources.create(\n      sourceInput({\n        name: "WIPO News",\n        slug: "wipo-news",\n        canonicalUri: "https://www.wipo.int/pressroom/en/",\n        entrypoints: [{ uri: "https://www.wipo.int/pressroom/en/" }],\n      }),\n    );\n    const otherPlan = env.plans.create(planInput(otherSource.id, { name: "WIPO plan" }));\n    env.runs.dispatchManual({ planId: otherPlan.plan.id });\n\n    const firstWorker = env.workers.create(workerInput({ displayName: "Worker A" }));\n    const secondWorker = env.workers.create(workerInput({ displayName: "Worker B" }));\n    heartbeat(env, firstWorker.view.worker.id, firstWorker.credential);\n    heartbeat(env, secondWorker.view.worker.id, secondWorker.credential);\n\n    const firstClaim = env.workers.claim(firstWorker.view.worker.id, firstWorker.credential);\n    expect(firstClaim.job?.sourceId).toBe(firstSource.id);\n    const secondClaim = env.workers.claim(secondWorker.view.worker.id, secondWorker.credential);\n    expect(secondClaim.job?.sourceId).toBe(otherSource.id);\n    expect(env.runs.getById(aliasPlan.plan.sourceId)).toBeNull();\n    expect(env.runs.list({ sourceId: aliasSource.id }).items[0]?.jobs[0]?.status).toBe("PENDING");\n\n    env.database.close();\n  });\n\n  it("enforces the strictest rolling per-minute web-domain rate limit across Workers", () => {\n    const env = environment(new DatabaseSync(":memory:"), {\n      maxConcurrentWebLeasesPerDomain: 10,\n    });\n    const locators = [\n      ["Rate A", "rate-a", "https://www.uspto.gov/a", 2],\n      ["Rate B", "rate-b", "https://uspto.gov/b", 2],\n      ["Rate C", "rate-c", "https://www.uspto.gov/c", 100],\n    ] as const;\n    for (const [name, slug, locator, rateLimitPerMinute] of locators) {\n      const source = env.sources.create(\n        sourceInput({\n          name,\n          slug,\n          canonicalUri: locator,\n          entrypoints: [{ uri: locator }],\n        }),\n      );\n      const plan = env.plans.create(\n        planInput(source.id, {\n          name: `${name} plan`,\n          policy: {\n            ...planInput(source.id).policy,\n            rateLimitPerMinute,\n          },\n        }),\n      );\n      env.runs.dispatchManual({ planId: plan.plan.id });\n    }\n\n    const workers = ["Worker A", "Worker B", "Worker C"].map((displayName) =>\n      env.workers.create(workerInput({ displayName })),\n    );\n    for (const worker of workers) {\n      heartbeat(env, worker.view.worker.id, worker.credential);\n    }\n\n    expect(env.workers.claim(workers[0]!.view.worker.id, workers[0]!.credential).job).not.toBeNull();\n    expect(env.workers.claim(workers[1]!.view.worker.id, workers[1]!.credential).job).not.toBeNull();\n    expect(env.workers.claim(workers[2]!.view.worker.id, workers[2]!.credential).job).toBeNull();\n\n    env.advance(60_001);\n    heartbeat(env, workers[2]!.view.worker.id, workers[2]!.credential);\n    expect(env.workers.claim(workers[2]!.view.worker.id, workers[2]!.credential).job).not.toBeNull();\n\n    env.database.close();\n  });\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit("worker-registry test anchor mismatch")
          test.write_text(text.replace(anchor, cases + anchor))
      - name: Format changed files
        run: pnpm exec prettier --write packages/persistence/src/worker-registry.ts packages/persistence/tests/worker-registry.test.ts
      - name: Targeted checks
        run: |
          pnpm --filter @markorbit/persistence test -- worker-registry.test.ts
          pnpm --filter @markorbit/persistence typecheck
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/persistence/src/worker-registry.ts packages/persistence/tests/worker-registry.test.ts
          git commit -m "Worker: throttle web domains across workers"
          git push origin HEAD:codex/worker-web-domain-throttle-v1
