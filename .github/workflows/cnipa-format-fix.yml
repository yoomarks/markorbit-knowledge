name: CNIPA One Shot Format Fix

on:
  push:
    branches:
      - feat/cnipa-authenticated-judgment-mvp
    paths:
      - .github/workflows/cnipa-format-fix.yml

permissions:
  contents: write

jobs:
  format-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cnipa-authenticated-judgment-mvp

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format CNIPA phase 1 files and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            docs/operations/CNIPA_AUTHENTICATED_JUDGMENTS.md \
            packages/worker-runtime/src/cnipa-source-adapter.test.ts \
            packages/worker-runtime/src/cnipa-source-adapter.ts \
            packages/worker-runtime/src/cnipa-trademark-judgment.ts
          rm .github/workflows/cnipa-format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/CNIPA_AUTHENTICATED_JUDGMENTS.md \
            packages/worker-runtime/src/cnipa-source-adapter.test.ts \
            packages/worker-runtime/src/cnipa-source-adapter.ts \
            packages/worker-runtime/src/cnipa-trademark-judgment.ts \
            .github/workflows/cnipa-format-fix.yml
          git commit -m "style: format CNIPA phase 1 contracts"
          git push origin HEAD:feat/cnipa-authenticated-judgment-mvp
