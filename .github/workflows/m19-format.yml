name: M19 Format

on:
  push:
    branches:
      - m19-foundational-relevance-gate

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m19-foundational-relevance-gate
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/worker/src/source-foundational-readiness.ts
          apps/worker/tests/source-foundational-readiness.test.ts
          docs/architecture/M19_FOUNDATIONAL_RELEVANCE_GATE.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/source-foundational-readiness.ts apps/worker/tests/source-foundational-readiness.test.ts docs/architecture/M19_FOUNDATIONAL_RELEVANCE_GATE.md
          git commit -m "chore: format M19 relevance gate"
          git push origin HEAD:m19-foundational-relevance-gate
