name: Temporary source health format

on:
  push:
    branches:
      - codex/source-collection-health-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/source-collection-health-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format integration test
        run: pnpm exec prettier --write apps/admin/src/server/__tests__/source-collection-health.test.ts
      - name: Commit format fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/__tests__/source-collection-health.test.ts
          git commit -m "style: format source collection health test"
          git push origin HEAD:codex/source-collection-health-v1
