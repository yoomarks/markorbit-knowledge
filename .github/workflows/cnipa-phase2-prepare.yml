name: CNIPA Phase 2 Prepare

on:
  push:
    branches:
      - feat/cnipa-authenticated-runtime

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cnipa-authenticated-runtime
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Refresh lockfile and format Phase 2 files
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            packages/worker-runtime/src/cnipa-source-adapter.ts \
            packages/worker-runtime/src/cnipa-configurable-response-decoder.ts \
            packages/worker-runtime/src/cnipa-artifact-acquirer.ts \
            packages/worker-runtime/src/cnipa-source-adapter-pagination.test.ts \
            packages/worker-runtime/src/cnipa-configurable-response-decoder.test.ts \
            packages/worker-runtime/src/cnipa-artifact-acquirer.test.ts \
            packages/worker-runtime/package.json \
            apps/worker/src/cnipa-playwright-session-executor.ts \
            apps/worker/src/cnipa-playwright-session-executor.test.ts \
            apps/worker/src/cnipa-session-login.ts \
            apps/worker/src/config.ts \
            apps/worker/src/cnipa-config.test.ts \
            apps/worker/src/main.ts \
            apps/worker/package.json \
            docs/operations/CNIPA_AUTHENTICATED_JUDGMENTS.md
          rm .github/workflows/cnipa-phase2-prepare.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml \
            packages/worker-runtime/src/cnipa-source-adapter.ts \
            packages/worker-runtime/src/cnipa-configurable-response-decoder.ts \
            packages/worker-runtime/src/cnipa-artifact-acquirer.ts \
            packages/worker-runtime/src/cnipa-source-adapter-pagination.test.ts \
            packages/worker-runtime/src/cnipa-configurable-response-decoder.test.ts \
            packages/worker-runtime/src/cnipa-artifact-acquirer.test.ts \
            packages/worker-runtime/package.json \
            apps/worker/src/cnipa-playwright-session-executor.ts \
            apps/worker/src/cnipa-playwright-session-executor.test.ts \
            apps/worker/src/cnipa-session-login.ts \
            apps/worker/src/config.ts \
            apps/worker/src/cnipa-config.test.ts \
            apps/worker/src/main.ts \
            apps/worker/package.json \
            docs/operations/CNIPA_AUTHENTICATED_JUDGMENTS.md \
            .github/workflows/cnipa-phase2-prepare.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: prepare CNIPA Phase 2 runtime"
          git push origin HEAD:feat/cnipa-authenticated-runtime
