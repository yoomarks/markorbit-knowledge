name: Temporary UAE MoET source coverage verification

on:
  push:
    branches:
      - codex/ae-moet-source-coverage-v1

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize and apply UAE MoET patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/tmp/patch_ae_moet_source_coverage.py')
          s = p.read_text()
          s = s.replace('+] satisfies readonly SourceCoverageTarget[];', '] satisfies readonly SourceCoverageTarget[];')
          faq = 'https://www.moet.gov.ae/en/search-results?_com_liferay_portal_search_web_search_results_portlet_SearchResultsPortlet_INSTANCE_axqn_assetEntryId=200540&_com_liferay_portal_search_web_search_results_portlet_SearchResultsPortlet_INSTANCE_axqn_mvcPath=%2Fview_content.jsp&_com_liferay_portal_search_web_search_results_portlet_SearchResultsPortlet_INSTANCE_axqn_type=content&p_l_back_url=%2Fen%2Fsearch-results%3Fq%3D%26start%3D12&p_p_id=com_liferay_portal_search_web_search_results_portlet_SearchResultsPortlet_INSTANCE_axqn&p_p_lifecycle=0&p_p_mode=view&p_p_state=maximized'
          s = s.replace('https://www.moet.gov.ae/en/trademark-services', faq)
          s = s.replace('Current trademark service surface', 'Official trademark FAQ explaining Nice Classification')
          s = s.replace('https://www.moet.gov.ae/en/our-publications', 'https://www.moet.gov.ae/en/publications1')
          p.write_text(s)
          PY
          python .github/tmp/patch_ae_moet_source_coverage.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          packages/persistence/src/priority-national-source-coverage.ts
          packages/persistence/src/source-coverage-catalog.ts
          packages/persistence/tests/priority-national-source-coverage.test.ts
          packages/persistence/src/retrieval-relevance-audit.ts
          packages/persistence/tests/retrieval-relevance-audit.test.ts
      - run: >-
          pnpm --filter @markorbit/persistence exec vitest run
          tests/priority-national-source-coverage.test.ts
          tests/source-coverage-catalog.test.ts
          tests/retrieval-relevance-audit.test.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/persistence/src/priority-national-source-coverage.ts \
            packages/persistence/src/source-coverage-catalog.ts \
            packages/persistence/tests/priority-national-source-coverage.test.ts \
            packages/persistence/src/retrieval-relevance-audit.ts \
            packages/persistence/tests/retrieval-relevance-audit.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: add UAE MoET trademark source coverage"
          git push
