name: Temporary K-CAP-AI-004 Prettier

on:
  push:
    branches:
      - k-cap-ai-004-managed-ai-knowledge-bridge

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          packages/worker-runtime/src/managed-ai-knowledge-adapter.ts
          packages/worker-runtime/src/managed-ai-knowledge-adapter.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/worker-runtime/src/managed-ai-knowledge-adapter.ts packages/worker-runtime/src/managed-ai-knowledge-adapter.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "CI: format K-CAP-AI-004 bridge"
          git push
