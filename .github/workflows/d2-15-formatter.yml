name: D2.15 Formatter

on:
  push:
    branches:
      - codex/d2-15-policy-audit-history
    paths:
      - .github/workflows/d2-15-formatter.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d2-15-policy-audit-history
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format D2.15 files
        run: |
          pnpm exec prettier --write \
            apps/admin/src/components/sources/source-intelligence-policy-audit.tsx \
            packages/persistence/src/source-intelligence-manual-sla-registry.ts \
            packages/persistence/src/source-intelligence-policy-scope-registry.ts \
            packages/persistence/tests/source-intelligence-policy-audit-registry.test.ts \
            packages/worker-runtime/src/index.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/src/components/sources/source-intelligence-policy-audit.tsx \
            packages/persistence/src/source-intelligence-manual-sla-registry.ts \
            packages/persistence/src/source-intelligence-policy-scope-registry.ts \
            packages/persistence/tests/source-intelligence-policy-audit-registry.test.ts \
            packages/worker-runtime/src/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: format D2.15 policy audit"
          git push origin HEAD:codex/d2-15-policy-audit-history
