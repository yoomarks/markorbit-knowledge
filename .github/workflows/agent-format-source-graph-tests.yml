name: Agent Format Source Graph Tests

on:
  push:
    branches:
      - agent/source-graph-persistence-migration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/source-graph-persistence-migration
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/admin/src/server/__tests__/discovery-service.test.ts
          apps/admin/src/server/__tests__/source-graph-compatibility.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/__tests__/discovery-service.test.ts apps/admin/src/server/__tests__/source-graph-compatibility.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: format source graph tests"
          git push origin HEAD:agent/source-graph-persistence-migration
