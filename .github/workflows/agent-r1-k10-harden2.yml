name: Agent R1-K10 Harden2

on:
  push:
    branches:
      - r1-k10-vault-import-execution

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r1-k10-vault-import-execution
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Apply hardening
        run: |
          python .github/k10_harden.py
          pnpm exec prettier --write packages/persistence/src/vault-import-execution-registry.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/persistence/src/vault-import-execution-registry.ts
          git commit -m "fix(r1-k10): harden Vault-origin staging replay"
          git push origin HEAD:r1-k10-vault-import-execution
