name: Agent Format D2.4 Dual Axis

on:
  push:
    branches:
      - agent/source-intelligence-dual-axis-v2
    paths:
      - .github/workflows/agent-format-d24-dual-axis.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/source-intelligence-dual-axis-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format D2.4 files
        run: >-
          pnpm exec prettier --write
          apps/admin/src/server/source-intelligence-service.ts
          docs/architecture/SOURCE_INTELLIGENCE_DUAL_AXIS_V2.md
          packages/contracts/src/source-intelligence-v2.ts
          packages/worker-runtime/src/source-intelligence-evaluator.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/source-intelligence-service.ts docs/architecture/SOURCE_INTELLIGENCE_DUAL_AXIS_V2.md packages/contracts/src/source-intelligence-v2.ts packages/worker-runtime/src/source-intelligence-evaluator.ts
          git commit -m "style: format D2.4 dual-axis files"
          git push origin HEAD:agent/source-intelligence-dual-axis-v2
