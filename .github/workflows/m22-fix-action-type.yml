name: M22 Fix Action Type

on:
  push:
    branches:
      - m22-foundational-readiness-workbench

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m22-foundational-readiness-workbench
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add explicit remediation action type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/admin/src/components/foundational/foundational-remediation-console.tsx")
          text = path.read_text()
          text = text.replace(
              'type QueueItem = Snapshot["remediationQueue"]["items"][number];',
              'type QueueItem = Snapshot["remediationQueue"]["items"][number];\ntype QueueAction = QueueItem["actions"][number];',
              1,
          )
          text = text.replace(
              'item.actions.map((action) => (',
              'item.actions.map((action: QueueAction) => (',
              1,
          )
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/admin/src/components/foundational/foundational-remediation-console.tsx
      - name: Commit typing fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/components/foundational/foundational-remediation-console.tsx
          git commit -m "M22 type remediation queue actions explicitly"
          git push origin HEAD:m22-foundational-readiness-workbench
