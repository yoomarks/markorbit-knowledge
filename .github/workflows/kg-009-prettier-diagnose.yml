name: KG-009 Prettier Diagnose

on:
  pull_request:
    paths:
      - "apps/admin/src/server/knowledge-relationship-auth.test.ts"
      - ".github/workflows/kg-009-prettier-diagnose.yml"

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier output
        run: |
          pnpm exec prettier apps/admin/src/server/knowledge-relationship-auth.test.ts --write
          echo '---KG009_FORMATTED_BEGIN---'
          cat apps/admin/src/server/knowledge-relationship-auth.test.ts
          echo '---KG009_FORMATTED_END---'
