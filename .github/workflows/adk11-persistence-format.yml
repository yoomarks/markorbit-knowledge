name: ADK-11 Persistence Format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier output
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            packages/persistence/src/ai-source-pack-registry.ts \
            packages/persistence/src/ai-source-pack-registry.test.ts \
            packages/persistence/package.json \
            docs/architecture/ADK_11_SOURCE_GROUNDED_ASSIGNMENTS.md
          if git diff --quiet -- \
            packages/persistence/src/ai-source-pack-registry.ts \
            packages/persistence/src/ai-source-pack-registry.test.ts \
            packages/persistence/package.json \
            docs/architecture/ADK_11_SOURCE_GROUNDED_ASSIGNMENTS.md; then
            echo "ADK-11 persistence files already match Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/persistence/src/ai-source-pack-registry.ts \
            packages/persistence/src/ai-source-pack-registry.test.ts \
            packages/persistence/package.json \
            docs/architecture/ADK_11_SOURCE_GROUNDED_ASSIGNMENTS.md
          git commit -m "style: apply exact Prettier output for ADK-11 persistence"
          git push origin HEAD:${{ github.head_ref }}
