name: Agent Format Raw Artifact Doc

on:
  push:
    branches:
      - agent/raw-artifact-source-graph-extraction

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/raw-artifact-source-graph-extraction
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/architecture/RAW_ARTIFACT_SOURCE_GRAPH_EXTRACTION_V1.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-format-raw-artifact-doc.yml
          git add docs/architecture/RAW_ARTIFACT_SOURCE_GRAPH_EXTRACTION_V1.md
          git commit -m "chore: format raw artifact extraction architecture doc"
          git push origin HEAD:agent/raw-artifact-source-graph-extraction
