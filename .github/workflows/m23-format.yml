name: M23 Format

on:
  push:
    branches:
      - m23-foundational-action-intents

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m23-foundational-action-intents
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M23 files
        run: |
          pnpm exec prettier --write \
            packages/worker-runtime/src/foundational-action-intent.ts \
            packages/worker-runtime/tests/foundational-action-intent.test.ts \
            packages/worker-runtime/package.json \
            packages/persistence/src/foundational-action-intent-ledger.ts \
            packages/persistence/tests/foundational-action-intent-ledger.test.ts \
            packages/persistence/package.json \
            apps/admin/src/server/foundational-action-intents.ts \
            apps/admin/src/server/foundational-action-intents.test.ts \
            apps/admin/src/app/api/foundational/action-intents/route.ts \
            'apps/admin/src/app/api/foundational/action-intents/[intentId]/route.ts' \
            docs/architecture/M23_FOUNDATIONAL_ACTION_INTENTS.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages apps docs
          git commit -m "M23 format foundational action intents"
          git push
