name: M24 Format

on:
  push:
    branches:
      - m24-controlled-foundational-collection-dispatch

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m24-controlled-foundational-collection-dispatch
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M24 files
        run: |
          pnpm exec prettier --write \
            packages/worker-runtime/src/foundational-action-execution.ts \
            packages/worker-runtime/tests/foundational-action-execution.test.ts \
            packages/worker-runtime/package.json \
            packages/persistence/src/foundational-action-execution-ledger.ts \
            packages/persistence/tests/foundational-action-execution-ledger.test.ts \
            packages/persistence/package.json \
            apps/admin/src/server/foundational-action-executions.ts \
            apps/admin/src/server/foundational-action-executions.test.ts \
            'apps/admin/src/app/api/foundational/action-intents/[intentId]/execute/route.ts' \
            apps/admin/src/app/api/foundational/action-executions/route.ts \
            docs/architecture/M24_CONTROLLED_FOUNDATIONAL_COLLECTION_DISPATCH.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages apps docs
          git commit -m "M24 format controlled foundational collection dispatch"
          git push
