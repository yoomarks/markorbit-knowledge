name: IP Australia Acquisition Learning Live

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ip-australia-acquisition-learning-live.yml
      - apps/admin/src/server/acquisition-intelligence-worker-intake.ts
      - apps/admin/src/app/api/worker/v1/acquisition-intelligence/**
      - apps/worker/src/ip-australia-manual-artifact-acquirer.ts
      - apps/worker/src/ip-australia-manual-inventory.ts
      - apps/worker/src/ip-australia-manual-article-fidelity.ts
      - apps/worker/src/ip-australia-manual-acquisition-learning.ts
      - apps/worker/src/ip-australia-manual-acquisition-learning.test.ts
      - apps/worker/src/verify-ip-australia-acquisition-learning.ts
      - apps/worker/src/main.ts
      - apps/worker/package.json
      - packages/contracts/src/acquisition-intelligence-*.ts
      - packages/persistence/src/acquisition-intelligence-registry.ts
      - packages/worker-runtime/src/controlled-collection-worker-runtime.ts
      - packages/worker-runtime/src/http-acquisition-intelligence-client.ts
      - packages/worker-runtime/src/http-controlled-collection-client.ts
      - packages/worker-runtime/tests/controlled-collection-completion-observer.test.ts
      - packages/worker-runtime/tests/http-acquisition-intelligence-client.test.ts
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: ip-australia-acquisition-learning-live-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  acquisition-learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MARKORBIT_CONTROL_PLANE_URL: http://127.0.0.1:3000
      MARKORBIT_ARTIFACT_MAX_BYTES: "16777216"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure isolated evidence stores
        run: |
          echo "MARKORBIT_KNOWLEDGE_DB_PATH=$RUNNER_TEMP/ip-au-acquisition-learning.sqlite" >> "$GITHUB_ENV"
          echo "MARKORBIT_ARTIFACT_STORE_PATH=$RUNNER_TEMP/ip-au-acquisition-learning-artifacts" >> "$GITHUB_ENV"
          echo "MARKORBIT_STAGING_STORE_PATH=$RUNNER_TEMP/ip-au-acquisition-learning-staging" >> "$GITHUB_ENV"
          echo "MARKORBIT_REPOSITORY_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @markorbit/admin build
          pnpm --filter @markorbit/worker build

      - name: Resolve authoritative Manual inventory baseline
        run: |
          pnpm --filter @markorbit/worker inventory:ip-australia-manual > "$RUNNER_TEMP/ip-au-inventory.json"
          node <<'NODE'
          const fs=require('node:fs');
          const report=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/ip-au-inventory.json','utf8'));
          const expected=Number(report.totalUniqueManualPageCount);
          if(!Number.isSafeInteger(expected)||expected<=0)throw new Error(`Invalid Manual inventory count ${report.totalUniqueManualPageCount}`);
          if(report.failedUpdateHistoryPageCount!==0||report.currentNavigationPageCount<=0)throw new Error('Authoritative Manual inventory is incomplete');
          fs.appendFileSync(process.env.GITHUB_ENV,`MARKORBIT_IP_AU_EXPECTED_COUNT=${expected}\n`);
          NODE

      - name: Start isolated control plane
        run: |
          pnpm --filter @markorbit/admin start > "$RUNNER_TEMP/admin.log" 2>&1 &
          echo "ADMIN_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail "$MARKORBIT_CONTROL_PLANE_URL/api/connectors" >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/admin.log"
          exit 1

      - name: Register IP Australia connector
        run: |
          cat > "$RUNNER_TEMP/connector.json" <<'JSON'
          {"connectorId":"ip-australia-manual-http","displayName":"IP Australia Trade Marks Manual HTTP","version":"1.0.0","sourceTypes":["WEB"],"runtime":"NODE","capabilities":["COLLECT","WATCH"],"supportedJobTypes":["WEB_CRAWL","PAGE_UPDATE_CHECK"],"configurationSchema":{"type":"object","properties":{}},"secretSchema":{"type":"object","properties":{}},"outputArtifactKinds":["HTML"],"healthCheck":{"mode":"WORKER_PROBE","timeoutSeconds":30},"status":"ACTIVE","extensions":{"x-markorbit-source-specific-adapter":"ip-australia-trade-marks-manual"}}
          JSON
          curl --silent --show-error --fail-with-body -X POST "$MARKORBIT_CONTROL_PLANE_URL/api/connectors" -H 'content-type: application/json' --data-binary "@$RUNNER_TEMP/connector.json" >/dev/null

      - name: Create governed Source
        run: |
          cat > "$RUNNER_TEMP/source.json" <<'JSON'
          {"name":"IP Australia Trade Marks Manual","slug":"ip-australia-trade-marks-manual-acquisition-learning-live","sourceType":"WEB","category":"OFFICIAL_GUIDANCE","authorityLevel":"PRIMARY_OFFICIAL","status":"ACTIVE","jurisdictions":["AU"],"languages":["en"],"connector":{"connectorId":"ip-australia-manual-http","version":"1.0.0"},"canonicalUri":"https://manuals.ipaustralia.gov.au/trademark","entrypoints":[{"uri":"https://manuals.ipaustralia.gov.au/trademark","label":"Trade Marks Manual"}],"tags":["ip-australia","trademark","manual","acquisition-learning-live"]}
          JSON
          curl --silent --show-error --fail-with-body -X POST "$MARKORBIT_CONTROL_PLANE_URL/api/sources" -H 'content-type: application/json' --data-binary "@$RUNNER_TEMP/source.json" > "$RUNNER_TEMP/source-create.json"
          node <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/source-create.json','utf8'));
          if(!d?.source?.id)throw new Error('Source creation did not return an id');
          fs.appendFileSync(process.env.GITHUB_ENV,`MARKORBIT_IP_AU_SOURCE_ID=${d.source.id}\n`);
          NODE

      - name: Create full governed collection plan
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/plan.json',JSON.stringify({sourceId:process.env.MARKORBIT_IP_AU_SOURCE_ID,name:'IP Australia Acquisition Learning Live',status:'ACTIVE',schedule:{mode:'MANUAL'},priority:'HIGH',policy:{includePatterns:['https://manuals.ipaustralia.gov.au/trademark*'],excludePatterns:[],maxDepth:1,maxItems:700,renderJavascript:false,fetchAttachments:false,respectRobots:true,rateLimitPerMinute:120,timeoutSeconds:60,retry:{maxAttempts:1,backoffSeconds:15},locale:'en-AU'},output:{artifactKinds:['HTML']},extensions:{'x-markorbit-acceptance':'ip-australia-acquisition-learning-live-v1'}}));
          NODE
          curl --silent --show-error --fail-with-body -X POST "$MARKORBIT_CONTROL_PLANE_URL/api/plans" -H 'content-type: application/json' --data-binary "@$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/plan-create.json"
          node <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/plan-create.json','utf8'));
          const plan=d?.plan?.plan;
          if(!plan?.id||plan.status!=='ACTIVE')throw new Error('Active plan creation failed');
          fs.appendFileSync(process.env.GITHUB_ENV,`MARKORBIT_IP_AU_PLAN_ID=${plan.id}\n`);
          NODE

      - name: Register production Worker
        run: |
          cat > "$RUNNER_TEMP/worker.json" <<'JSON'
          {"displayName":"IP Australia Acquisition Learning Live Worker","desiredState":"ACTIVE","runtime":{"runtimeId":"node-worker","version":"1.0.0"},"supportedJobTypes":["WEB_CRAWL","PAGE_UPDATE_CHECK"],"connectorBindings":[{"connectorId":"ip-australia-manual-http","version":"1.0.0","capabilities":["COLLECT","WATCH"]}],"maxConcurrency":1,"labels":["production","ip-australia","manual","acquisition-learning-live"]}
          JSON
          curl --silent --show-error --fail-with-body -X POST "$MARKORBIT_CONTROL_PLANE_URL/api/workers" -H 'content-type: application/json' --data-binary "@$RUNNER_TEMP/worker.json" > "$RUNNER_TEMP/worker-create.secret.json"
          node <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/worker-create.secret.json','utf8'));
          if(!d?.view?.worker?.id||!d?.credential)throw new Error('Worker registration failed');
          process.stdout.write(`::add-mask::${d.credential}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV,`MARKORBIT_WORKER_ID=${d.view.worker.id}\nMARKORBIT_WORKER_CREDENTIAL=${d.credential}\n`);
          NODE
          rm -f "$RUNNER_TEMP/worker-create.secret.json"

      - name: Dispatch full collection
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/dispatch-request.json',JSON.stringify({planId:process.env.MARKORBIT_IP_AU_PLAN_ID,requestedBy:{actorType:'SYSTEM',actorId:'github-actions-acquisition-learning-live'}}));
          NODE
          curl --silent --show-error --fail-with-body -X POST "$MARKORBIT_CONTROL_PLANE_URL/api/runs" -H 'content-type: application/json' -H 'Idempotency-Key: ip-au-acquisition-learning-live' --data-binary "@$RUNNER_TEMP/dispatch-request.json" > "$RUNNER_TEMP/dispatch.json"
          node <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/dispatch.json','utf8'));
          if(!d?.record?.run?.id)throw new Error('Dispatch did not return run id');
          fs.appendFileSync(process.env.GITHUB_ENV,`MARKORBIT_COLLECTION_RUN_ID=${d.record.run.id}\n`);
          NODE

      - name: Start production collection Worker with learning enabled
        env:
          NODE_ENV: test
          MARKORBIT_COLLECTION_PROVIDER: ip-australia-manual
          MARKORBIT_WORKER_POLL_INTERVAL_MS: "500"
          MARKORBIT_WORKER_KEEPALIVE_INTERVAL_MS: "15000"
          MARKORBIT_WORKER_MAX_COLLECTION_RUNTIME_MS: "840000"
        run: |
          pnpm --filter @markorbit/worker start > "$RUNNER_TEMP/worker.log" 2>&1 &
          echo "WORKER_PID=$!" >> "$GITHUB_ENV"

      - name: Verify collection matches authoritative inventory
        run: |
          for attempt in $(seq 1 180); do
            curl --silent --show-error --fail "$MARKORBIT_CONTROL_PLANE_URL/api/runs/$MARKORBIT_COLLECTION_RUN_ID" > "$RUNNER_TEMP/collection-run.json"
            status=$(node -e "const d=require('$RUNNER_TEMP/collection-run.json');process.stdout.write(d.run.run.status)")
            if [ "$status" = COMPLETED ]; then break; fi
            if [ "$status" = FAILED ] || [ "$status" = CANCELLED ]; then cat "$RUNNER_TEMP/collection-run.json"; cat "$RUNNER_TEMP/worker.log"; exit 1; fi
            sleep 5
          done
          node -e "const d=require('$RUNNER_TEMP/collection-run.json');if(d.run.run.status!=='COMPLETED')throw new Error('Collection run did not finish')"
          curl --silent --show-error --fail "$MARKORBIT_CONTROL_PLANE_URL/api/artifacts?sourceId=$MARKORBIT_IP_AU_SOURCE_ID&runId=$MARKORBIT_COLLECTION_RUN_ID&artifactKind=HTML&limit=100" > "$RUNNER_TEMP/collection-artifacts.json"
          node -e "const d=require('$RUNNER_TEMP/collection-artifacts.json');const expected=Number(process.env.MARKORBIT_IP_AU_EXPECTED_COUNT);if(d.total!==expected)throw new Error('Expected '+expected+' RawArtifacts from authoritative inventory, got '+d.total)"

      - name: Wait for automatic acquisition learning intake
        run: |
          for attempt in $(seq 1 60); do
            if node <<'NODE'
          const {DatabaseSync}=require('node:sqlite');
          const db=new DatabaseSync(process.env.MARKORBIT_KNOWLEDGE_DB_PATH,{readOnly:true});
          try {
            const table=db.prepare("SELECT name FROM sqlite_master WHERE type='table' AND name='acquisition_run_evidence'").get();
            if(!table)process.exit(1);
            const row=db.prepare('SELECT run_id FROM acquisition_run_evidence WHERE run_id=?').get(process.env.MARKORBIT_COLLECTION_RUN_ID);
            process.exit(row?0:1);
          } finally { db.close(); }
          NODE
            then break; fi
            sleep 1
          done
          grep -q 'worker.acquisition.learning.recorded' "$RUNNER_TEMP/worker.log" || { cat "$RUNNER_TEMP/worker.log"; exit 1; }

      - name: Verify persisted production lessons and playbook history
        run: |
          set -o pipefail
          pnpm --filter @markorbit/worker verify:ip-australia-acquisition-learning | tee "$RUNNER_TEMP/acquisition-learning-verification.log"

      - name: Write evidence summary
        if: always()
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const artifactsPath=process.env.RUNNER_TEMP+'/collection-artifacts.json';
          const inventoryPath=process.env.RUNNER_TEMP+'/ip-au-inventory.json';
          const verificationPath=process.env.RUNNER_TEMP+'/acquisition-learning-verification.log';
          const lines=['## IP Australia Acquisition Learning Live',''];
          if(fs.existsSync(inventoryPath)){
            const inventory=JSON.parse(fs.readFileSync(inventoryPath,'utf8'));
            lines.push(`- Authoritative inventory baseline: ${inventory.totalUniqueManualPageCount}`);
          }
          if(fs.existsSync(artifactsPath)){
            const artifacts=JSON.parse(fs.readFileSync(artifactsPath,'utf8'));
            lines.push(`- Immutable HTML RawArtifacts: ${artifacts.total}`);
          }
          if(fs.existsSync(verificationPath))lines.push('- Governed acquisition learning verifier: executed (see uploaded evidence log)');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE

      - name: Stop isolated processes
        if: always()
        run: |
          if [ -n "${WORKER_PID:-}" ]; then kill "$WORKER_PID" 2>/dev/null || true; fi
          if [ -n "${ADMIN_PID:-}" ]; then kill "$ADMIN_PID" 2>/dev/null || true; fi

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ip-australia-acquisition-learning-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ip-au-inventory.json
            ${{ runner.temp }}/source-create.json
            ${{ runner.temp }}/plan-create.json
            ${{ runner.temp }}/collection-run.json
            ${{ runner.temp }}/collection-artifacts.json
            ${{ runner.temp }}/acquisition-learning-verification.log
            ${{ runner.temp }}/worker.log
            ${{ runner.temp }}/admin.log
          if-no-files-found: warn
          retention-days: 30
