name: Agent Review Handoff Format

on:
  push:
    branches:
      - codex/review-knowledge-main-repo-handoff-2026-08-12

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/review-knowledge-main-repo-handoff-2026-08-12
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format review handoff
        run: |
          pnpm exec prettier --write docs/review/MARKORBIT_KNOWLEDGE_DEEP_REVIEW_AND_MAIN_REPO_HANDOFF_2026-08-12.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/review/MARKORBIT_KNOWLEDGE_DEEP_REVIEW_AND_MAIN_REPO_HANDOFF_2026-08-12.md
          git diff --cached --quiet && exit 0
          git commit -m 'style(review): format Knowledge deep review handoff'
          git push origin HEAD:codex/review-knowledge-main-repo-handoff-2026-08-12
