name: Change Evidence Prettier Fix

on:
  push:
    branches:
      - agent/change-evidence-v1-clean
    paths:
      - .github/workflows/change-evidence-prettier-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/change-evidence-v1-clean
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Change Evidence files
        run: >-
          pnpm exec prettier --write
          packages/contracts/src/change-evidence-v1.ts
          packages/persistence/src/document-change-evidence.ts
          packages/persistence/src/document-change-evidence.test.ts
          packages/persistence/src/document-change-evidence-metadata.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/change-evidence-v1.ts \
            packages/persistence/src/document-change-evidence.ts \
            packages/persistence/src/document-change-evidence.test.ts \
            packages/persistence/src/document-change-evidence-metadata.test.ts
          git commit -m "format Change Evidence V1"
          git push origin HEAD:agent/change-evidence-v1-clean
