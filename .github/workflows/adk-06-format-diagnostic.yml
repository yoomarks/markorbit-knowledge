name: ADK-06 Format Diagnostic

on:
  pull_request:
    paths:
      - "apps/worker/src/prepare-adk-live-pilot-runtime.ts"
      - "apps/worker/src/prepare-adk-live-pilot-runtime.test.ts"
      - ".github/workflows/adk-06-format-diagnostic.yml"

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write \
            apps/worker/src/prepare-adk-live-pilot-runtime.ts \
            apps/worker/src/prepare-adk-live-pilot-runtime.test.ts
          git diff -- \
            apps/worker/src/prepare-adk-live-pilot-runtime.ts \
            apps/worker/src/prepare-adk-live-pilot-runtime.test.ts
          exit 1
