name: Temporary Supply Evidence Maturity Prettier

on:
  pull_request:
    branches:
      - agent/source-supply-topology-intelligence-v1
    paths:
      - apps/admin/src/server/__tests__/source-supply-evidence-maturity.test.ts
      - .github/workflows/prettier-source-supply-evidence-temp.yml

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write \
            apps/admin/src/server/__tests__/source-supply-evidence-maturity.test.ts
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/__tests__/source-supply-evidence-maturity.test.ts
          git commit -m "style: format supply evidence maturity test"
          git push origin HEAD:${{ github.head_ref }}
