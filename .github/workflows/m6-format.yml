name: M6 Format

on:
  push:
    branches:
      - agent/us-foundational-source-bootstrap

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'M6 format coverage bootstrap') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/us-foundational-source-bootstrap
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/worker/src/bootstrap-source-coverage.ts apps/worker/src/source-coverage-bootstrap.ts apps/worker/src/verify-source-coverage.ts apps/worker/tests/source-coverage-bootstrap.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/bootstrap-source-coverage.ts apps/worker/src/source-coverage-bootstrap.ts apps/worker/src/verify-source-coverage.ts apps/worker/tests/source-coverage-bootstrap.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "M6 format coverage bootstrap"
          git push
