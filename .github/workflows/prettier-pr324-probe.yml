name: Prettier PR324 Probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/production-validation-audit-fixes
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format audit files
        run: pnpm exec prettier --write packages/persistence/src/production-validation-discovery-intake.ts packages/persistence/src/production-validation-execution-status.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/production-validation-discovery-intake.ts packages/persistence/src/production-validation-execution-status.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: format production validation audit fixes"
          git push origin HEAD:codex/production-validation-audit-fixes
