name: Temporary change watch incremental patch

on:
  push:
    branches:
      - codex/change-watch-incremental-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/tmp/patch_change_watch_incremental.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/persistence/src/raw-artifact-registry.ts packages/worker-runtime/src/artifact-backed-collection-executor.ts packages/worker-runtime/src/http-controlled-collection-client.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/raw-artifact-registry.ts packages/worker-runtime/src/artifact-backed-collection-executor.ts packages/worker-runtime/src/http-controlled-collection-client.ts
          git commit -m "Collection: compare change-watch artifact identities"
          git push
