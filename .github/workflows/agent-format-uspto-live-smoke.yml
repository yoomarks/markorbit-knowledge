name: Agent Format USPTO Live Smoke

on:
  push:
    branches:
      - agent/uspto-golden-source-live-smoke

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uspto-golden-source-live-smoke
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/worker/src/verify-uspto-golden-source.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/verify-uspto-golden-source.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format USPTO golden source verifier"
          git push origin HEAD:agent/uspto-golden-source-live-smoke
