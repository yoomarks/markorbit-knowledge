name: PR700 Runner Type Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr700-runner-type-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.number == 700 && github.head_ref == 'issue-697-admin-browser-acceptance'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch Playwright Core type usage
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/worker/src/run-admin-browser-acceptance.ts')
          text = path.read_text()
          old = 'async function waitForKnowledgeRefresh(page: Page, action: () => Promise<void>): Promise<void> {'
          new = 'async function waitForKnowledgeRefresh(page: Page, action: () => Promise<unknown>): Promise<void> {'
          if old not in text:
              raise SystemExit('waitForKnowledgeRefresh signature not found')
          text = text.replace(old, new, 1)
          old = '  await page.getByDisplayValue("Browser Acceptance Worker").waitFor();'
          new = '''  assert.equal(\n    await page.getByLabel("显示名称").inputValue(),\n    "Browser Acceptance Worker",\n    "saved Worker name must remain visible after navigation",\n  );'''
          if old not in text:
              raise SystemExit('getByDisplayValue assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/worker/src/run-admin-browser-acceptance.ts
          pnpm --filter @markorbit/worker typecheck
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/run-admin-browser-acceptance.ts
          git commit -m "fix: align browser runner with playwright-core types"
          git push origin HEAD:${{ github.head_ref }}
