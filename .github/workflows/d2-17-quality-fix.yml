name: D2.17 Replay Hardening

on:
  push:
    branches:
      - codex/d2-17-historical-policy-resolution
    paths:
      - .github/workflows/d2-17-quality-fix.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d2-17-historical-policy-resolution
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Harden replay boundary and per-source trace
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing anchor in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          contract = 'packages/contracts/src/source-intelligence-historical-policy-resolution-v2.ts'
          replace(
              contract,
              '    | "EVENT_WINDOW_TRUNCATED"\n    | "AMBIGUOUS_SAME_TIMESTAMP";',
              '    | "EVENT_WINDOW_TRUNCATED"\n    | "AMBIGUOUS_CHECKPOINT_BOUNDARY"\n    | "AMBIGUOUS_SAME_TIMESTAMP";',
          )

          runtime = 'packages/worker-runtime/src/source-intelligence-historical-policy-resolution.ts'
          replace(
              runtime,
              '''function relevantTrace(\n  sourceId: string,\n  checkpoint: SourceIntelligencePolicyResolutionCheckpointV2,\n  events: SourceIntelligencePolicyAuditEventV2[],\n  policy: SourceIntelligenceHistoricalEffectivePolicyV2,\n  complete: boolean,\n): SourceIntelligenceHistoricalPolicyTraceStepV2[] {''',
              '''function relevantTrace(\n  sourceId: string,\n  checkpoint: SourceIntelligencePolicyResolutionCheckpointV2,\n  events: SourceIntelligencePolicyAuditEventV2[],\n  policy: SourceIntelligenceHistoricalEffectivePolicyV2,\n  complete: boolean,\n  asOf: string,\n): SourceIntelligenceHistoricalPolicyTraceStepV2[] {''',
          )
          replace(
              runtime,
              '''  steps.push({\n    kind: "PRECEDENCE",\n    occurredAt:\n      policy.scope === "COHORT"\n        ? (events.at(-1)?.occurredAt ?? checkpoint.checkpointAt)\n        : checkpoint.checkpointAt,''',
              '''  steps.push({\n    kind: "PRECEDENCE",\n    occurredAt: asOf,''',
          )
          replace(
              runtime,
              '''      return time <= asOfTime && (!completeFromCheckpoint || time > checkpointTime);\n    })\n    .sort(chronological);\n  const ambiguous = ambiguousSameTimestamp(allEvents);\n\n  const items: SourceIntelligenceHistoricalPolicyResolutionItemV2[] = sourceIds.map((sourceId) => {\n    const state = completeFromCheckpoint ? checkpointState(input.checkpoint) : emptyState();''',
              '''      return time <= asOfTime && (!completeFromCheckpoint || time >= checkpointTime);\n    })\n    .sort(chronological);\n\n  const items: SourceIntelligenceHistoricalPolicyResolutionItemV2[] = sourceIds.map((sourceId) => {\n    const sourceCohortIds = new Set([\n      ...input.checkpoint.memberships\n        .filter((membership) => membership.sourceId === sourceId)\n        .map((membership) => membership.cohortId),\n      ...allEvents\n        .filter((event) => event.scope === "MEMBERSHIP" && event.sourceId === sourceId)\n        .map((event) => event.cohortId)\n        .filter((cohortId): cohortId is string => Boolean(cohortId)),\n    ]);\n    const relevantEvents = allEvents.filter((event) => {\n      if (event.scope === "GLOBAL_POLICY") return true;\n      if (event.scope === "MEMBERSHIP") return event.sourceId === sourceId;\n      return Boolean(event.cohortId && sourceCohortIds.has(event.cohortId));\n    });\n    const boundaryAmbiguous =\n      completeFromCheckpoint &&\n      relevantEvents.some((event) => Date.parse(event.occurredAt) === checkpointTime);\n    const ambiguous = ambiguousSameTimestamp(relevantEvents);\n    const state = completeFromCheckpoint ? checkpointState(input.checkpoint) : emptyState();''',
          )
          replace(
              runtime,
              '''    const snapshotBackfillEventIds = allEvents\n      .filter((event) => event.action === "SNAPSHOT_BACKFILL")''',
              '''    const snapshotBackfillEventIds = relevantEvents\n      .filter((event) => event.action === "SNAPSHOT_BACKFILL")''',
          )
          replace(
              runtime,
              '''    } else if (ambiguous) {\n      status = "UNKNOWN";\n      completeness = "AMBIGUOUS_SAME_TIMESTAMP";''',
              '''    } else if (boundaryAmbiguous) {\n      status = "UNKNOWN";\n      completeness = "AMBIGUOUS_CHECKPOINT_BOUNDARY";\n      unknownReasons.push(\n        "A relevant mutation shares the immutable checkpoint timestamp; millisecond timestamps cannot prove whether it preceded or followed the checkpoint snapshot.",\n      );\n    } else if (ambiguous) {\n      status = "UNKNOWN";\n      completeness = "AMBIGUOUS_SAME_TIMESTAMP";''',
          )
          replace(
              runtime,
              '''        allEvents,\n        observedPolicy,\n        completeFromCheckpoint,\n      ),\n      unknownReasons,\n      appliedEventIds: allEvents.map((event) => event.eventId),''',
              '''        relevantEvents,\n        observedPolicy,\n        completeFromCheckpoint,\n        input.asOf,\n      ),\n      unknownReasons,\n      appliedEventIds: relevantEvents.map((event) => event.eventId),''',
          )

          test = Path('packages/worker-runtime/tests/source-intelligence-historical-policy-resolution.test.ts')
          text = test.read_text()
          insertion = r'''

  it("marks an equal-timestamp checkpoint mutation UNKNOWN instead of guessing order", () => {
    const result = buildSourceIntelligenceHistoricalPolicyResolutionV2({
      sourceIds: ["src_a"],
      asOf: "2026-08-09T03:30:00.000Z",
      checkpoint,
      globalPolicyEvents: [],
      cohortEvents: [],
      membershipEvents: [event({ occurredAt: checkpoint.checkpointAt })],
      generatedAt: "2026-08-09T05:00:00.000Z",
    });
    expect(result.items[0]?.status).toBe("UNKNOWN");
    expect(result.items[0]?.completeness).toBe("AMBIGUOUS_CHECKPOINT_BOUNDARY");
  });

  it("isolates same-timestamp ambiguity to the Source whose direct membership changed", () => {
    const result = buildSourceIntelligenceHistoricalPolicyResolutionV2({
      sourceIds: ["src_a", "src_b"],
      asOf: "2026-08-09T04:30:00.000Z",
      checkpoint,
      globalPolicyEvents: [],
      cohortEvents: [],
      membershipEvents: [
        event({ eventId: "sima_a", occurredAt: "2026-08-09T04:00:00.000Z" }),
        event({
          eventId: "sima_b",
          action: "MEMBERSHIP_ADDED",
          occurredAt: "2026-08-09T04:00:00.000Z",
          changes: [{ field: "membershipPresent", before: false, after: true }],
        }),
      ],
      generatedAt: "2026-08-09T05:00:00.000Z",
    });
    expect(result.items.find((item) => item.sourceId === "src_a")?.status).toBe("UNKNOWN");
    expect(result.items.find((item) => item.sourceId === "src_b")?.status).toBe("RESOLVED");
  });
'''
          anchor = '\n  it("returns UNKNOWN for ambiguous same-timestamp mutations", () => {'
          if anchor not in text:
              raise SystemExit('test insertion anchor missing')
          test.write_text(text.replace(anchor, insertion + anchor, 1))
          PY
          pnpm exec prettier --write \
            packages/contracts/src/source-intelligence-historical-policy-resolution-v2.ts \
            packages/worker-runtime/src/source-intelligence-historical-policy-resolution.ts \
            packages/worker-runtime/tests/source-intelligence-historical-policy-resolution.test.ts
          pnpm --filter @markorbit/worker-runtime test -- source-intelligence-historical-policy-resolution.test.ts
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/contracts/src/source-intelligence-historical-policy-resolution-v2.ts \
            packages/worker-runtime/src/source-intelligence-historical-policy-resolution.ts \
            packages/worker-runtime/tests/source-intelligence-historical-policy-resolution.test.ts
          git commit -m "fix: harden D2.17 replay completeness"
          git push origin HEAD:codex/d2-17-historical-policy-resolution
