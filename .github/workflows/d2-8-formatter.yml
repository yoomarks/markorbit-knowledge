name: D2.8 Formatter

on:
  push:
    branches:
      - codex/d2-8-cross-source-change-summary
    paths:
      - .github/workflows/d2-8-formatter.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d2-8-cross-source-change-summary
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format D2.8 files
        run: |
          pnpm exec prettier --write \
            apps/admin/src/app/api/source-intelligence/route.ts \
            apps/admin/src/components/sources/source-intelligence-observation-summary.tsx \
            packages/worker-runtime/src/source-intelligence-cross-source-observation.ts \
            packages/worker-runtime/tests/source-intelligence-cross-source-observation.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/src/app/api/source-intelligence/route.ts \
            apps/admin/src/components/sources/source-intelligence-observation-summary.tsx \
            packages/worker-runtime/src/source-intelligence-cross-source-observation.ts \
            packages/worker-runtime/tests/source-intelligence-cross-source-observation.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: format D2.8 cross-source observations"
          git push origin HEAD:codex/d2-8-cross-source-change-summary
