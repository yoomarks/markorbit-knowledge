name: Temporary Fix VE ET Workflow

on:
  push:
    branches:
      - agent/priority-120-tranche-ve-et-v1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/priority-120-tranche-ve-et-v1
      - name: Fix replace helper ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/temp-priority-120-ve-et.yml')
          text = path.read_text()
          old = '''          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'expected anchor not found in {path}: {old[:180]!r}')
              p.write_text(text.replace(old, new, 1))
'''
          new = '''          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f'expected anchor not found in {path}: {old[:180]!r}')
              p.write_text(text.replace(old, new, 1))
'''
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('replace_once helper block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temp-priority-120-ve-et.yml
          git commit -m "ci: fix VE ET export patch guard"
          git push origin HEAD:agent/priority-120-tranche-ve-et-v1
