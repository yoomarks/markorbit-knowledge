name: M8 Format

on:
  push:
    branches:
      - agent/us-foundational-supply-operations

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'M8 format foundational supply') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/us-foundational-supply-operations
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/worker/src/source-coverage-operations.ts apps/worker/tests/source-coverage-operations.test.ts docs/architecture/M8_US_FOUNDATIONAL_SUPPLY_OPERATIONS.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/source-coverage-operations.ts apps/worker/tests/source-coverage-operations.test.ts docs/architecture/M8_US_FOUNDATIONAL_SUPPLY_OPERATIONS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "M8 format foundational supply"
          git push
