name: PR 483 Prettier Preview

on:
  pull_request:
    paths:
      - ".github/workflows/pr483-prettier-preview.yml"
      - "packages/worker-runtime/src/markreg-case-source-resolver.ts"
      - "packages/worker-runtime/src/markreg-case-source-resolver.test.ts"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Print canonical resolver
        run: |
          echo '=== RESOLVER START ==='
          pnpm exec prettier packages/worker-runtime/src/markreg-case-source-resolver.ts
          echo '=== RESOLVER END ==='
      - name: Print canonical resolver test
        run: |
          echo '=== TEST START ==='
          pnpm exec prettier packages/worker-runtime/src/markreg-case-source-resolver.test.ts
          echo '=== TEST END ==='
