name: M12 One-shot Format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'm12-us-foundational-readiness'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m12-us-foundational-readiness
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/worker/src/source-foundational-readiness.ts
          apps/worker/tests/source-foundational-readiness.test.ts
          docs/architecture/M12_US_FOUNDATIONAL_READINESS.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/source-foundational-readiness.ts apps/worker/tests/source-foundational-readiness.test.ts docs/architecture/M12_US_FOUNDATIONAL_READINESS.md
          git commit -m "M12 format foundational readiness"
          git push origin HEAD:m12-us-foundational-readiness
