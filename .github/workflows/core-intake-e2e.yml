name: Core Intake E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/core-intake-e2e.yml"
      - "package.json"
      - "apps/admin/vitest.e2e.config.ts"
      - "apps/admin/src/server/core-intake-http-transport.ts"
      - "apps/admin/src/server/core-content-http-transport.ts"
      - "apps/admin/src/server/ready-package-core-intake-submit.ts"
      - "apps/admin/src/server/ready-package-core-content-submit.ts"
      - "apps/admin/src/app/api/ready-packages/**/core-content/**"
      - "apps/admin/src/server/e2e/**"
      - "packages/contracts/src/ready-package-content-export-v1.ts"
      - "packages/persistence/src/ready-package-core-intake-submission.ts"
      - "packages/worker-runtime/src/**"

permissions:
  contents: read

env:
  CORE_REF: 86f4f666bdf0c621c9832115a2018a6d29ad0d5a
  CORE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/markorbit_core_e2e
  CORE_INTERNAL_SECRET: markorbit-core-intake-e2e-secret-32-bytes
  CORE_WORKSPACE_ID: 01900000-0000-7000-8000-830000000001

jobs:
  core-ref-freshness:
    runs-on: ubuntu-24.04
    steps:
      - name: Require pinned Core ref to match current main
        shell: bash
        run: |
          current_core_ref="$(git ls-remote https://github.com/yoomarks/markorbit.git refs/heads/main | awk '{print $1}')"
          if [ -z "$current_core_ref" ]; then
            echo "::error::Unable to resolve yoomarks/markorbit main SHA."
            exit 1
          fi

          echo "Current Core main: $current_core_ref"
          echo "Pinned Core ref:    $CORE_REF"
          if [ "$current_core_ref" != "$CORE_REF" ]; then
            echo "::error::Core Intake acceptance pin is stale. Audit current Core main, update CORE_REF, and rerun the real Core Intake E2E before treating the boundary as current."
            exit 1
          fi

  real-core-intake:
    needs: core-ref-freshness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: markorbit_core_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d markorbit_core_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout Knowledge
        uses: actions/checkout@v4
      - name: Checkout pinned Core receiver
        uses: actions/checkout@v4
        with:
          repository: yoomarks/markorbit
          ref: ${{ env.CORE_REF }}
          path: .e2e/markorbit-core
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Knowledge dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Core dependencies
        working-directory: .e2e/markorbit-core
        run: pnpm install --frozen-lockfile
      - name: Build Core receiver dependencies
        working-directory: .e2e/markorbit-core
        run: pnpm build:identity-postgres-deps
      - name: Bootstrap Core database and workspace
        working-directory: .e2e/markorbit-core
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ env.CORE_DATABASE_URL }}
          DB_MIGRATION_NAMESPACE: core
          DB_APPLICATION_NAME: knowledge-core-intake-e2e-bootstrap
          MARKORBIT_E2E_CORE_WORKSPACE_ID: ${{ env.CORE_WORKSPACE_ID }}
        run: |
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import {
            ManagedDatabase,
            loadMigrationsForOwner,
            migrate,
            parseDatabaseConfig,
          } from './packages/persistence/dist/index.js';
          import { PostgresWorkspaceRepository } from './services/core/dist/index.js';

          const config = parseDatabaseConfig(process.env);
          const database = new ManagedDatabase(config);
          await database.start();
          try {
            const migrations = await loadMigrationsForOwner(
              path.resolve('infrastructure/persistence/migrations'),
              path.resolve('infrastructure/persistence/migration-owners.json'),
              '@markorbit/core-service',
            );
            await migrate(database.getPool(), config.migrationNamespace, migrations);
            const workspaces = new PostgresWorkspaceRepository(database.getPool());
            const workspaceId = process.env.MARKORBIT_E2E_CORE_WORKSPACE_ID;
            if (!workspaceId) throw new Error('MARKORBIT_E2E_CORE_WORKSPACE_ID is required');
            if (!(await workspaces.findById(workspaceId))) {
              await workspaces.create({
                workspaceId,
                name: 'Knowledge Core Intake E2E',
                slug: 'knowledge-core-intake-e2e',
              });
            }
          } finally {
            await database.close();
          }
          NODE
      - name: Start real Core receiver
        working-directory: .e2e/markorbit-core
        env:
          NODE_ENV: test
          PORT: 4101
          DATABASE_URL: ${{ env.CORE_DATABASE_URL }}
          DB_MIGRATION_NAMESPACE: core
          DB_APPLICATION_NAME: knowledge-core-intake-e2e-runtime
          MO_INTERNAL_SERVICE_SECRET: ${{ env.CORE_INTERNAL_SECRET }}
          MARKORBIT_E2E_CORE_WORKSPACE_ID: ${{ env.CORE_WORKSPACE_ID }}
        run: |
          pnpm --filter @markorbit/core-service start > "$RUNNER_TEMP/core-intake-e2e-core.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/core-intake-e2e-core.pid"
          for attempt in $(seq 1 30); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "x-markorbit-internal-authorization: $MO_INTERNAL_SERVICE_SECRET" \
              "http://127.0.0.1:4101/internal/identity/workspaces/$MARKORBIT_E2E_CORE_WORKSPACE_ID" || true)
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/core-intake-e2e-core.log"
          exit 1
      - name: Run Knowledge to Core E2E
        env:
          MARKORBIT_CORE_INTAKE_URL: http://127.0.0.1:4101/internal/knowledge/ready-packages/intakes
          MARKORBIT_CORE_INTERNAL_SECRET: ${{ env.CORE_INTERNAL_SECRET }}
          MARKORBIT_E2E_CORE_WORKSPACE_ID: ${{ env.CORE_WORKSPACE_ID }}
        run: pnpm test:e2e:core-intake
      - name: Assert Core PostgreSQL content acceptance
        working-directory: .e2e/markorbit-core
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ env.CORE_DATABASE_URL }}
          DB_MIGRATION_NAMESPACE: core
          DB_APPLICATION_NAME: knowledge-core-content-e2e-assert
        run: |
          node --input-type=module <<'NODE'
          import { ManagedDatabase, parseDatabaseConfig } from './packages/persistence/dist/index.js';

          const database = new ManagedDatabase(parseDatabaseConfig(process.env));
          await database.start();
          try {
            const result = await database.getPool().query(
              `SELECT i.status, c.ready_package_id, c.staging_markdown
               FROM knowledge_intakes i
               JOIN knowledge_intake_contents c USING(intake_id)
               WHERE c.ready_package_id=$1`,
              ['rdp_01H00000000000000000000001'],
            );
            if (result.rowCount !== 1) {
              throw new Error(`expected one Core content row, got ${result.rowCount}`);
            }
            const row = result.rows[0];
            if (row.status !== 'ACCEPTED') {
              throw new Error(`expected ACCEPTED, got ${row.status}`);
            }
            if (row.staging_markdown !== '# Real Core E2E\n\nFrozen canonical content.\n') {
              throw new Error('Core PostgreSQL staging Markdown does not match the frozen export');
            }
          } finally {
            await database.close();
          }
          NODE
      - name: Core receiver log
        if: always()
        run: cat "$RUNNER_TEMP/core-intake-e2e-core.log" || true
      - name: Stop Core receiver
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/core-intake-e2e-core.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/core-intake-e2e-core.pid")" || true
          fi
