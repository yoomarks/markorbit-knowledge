name: Issue 705 Format Read Model Test

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-705-format-test.yml
      - packages/persistence/tests/knowledge-query-read-model.test.ts

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'issue-unified-knowledge-query-read-model'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-unified-knowledge-query-read-model
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format read-model test
        run: pnpm exec prettier --write packages/persistence/tests/knowledge-query-read-model.test.ts
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet; then
            echo "Read-model test already formatted"
            exit 0
          fi
          git add packages/persistence/tests/knowledge-query-read-model.test.ts
          git commit -m "style: apply repository Prettier to read-model test"
          git push origin HEAD:issue-unified-knowledge-query-read-model
