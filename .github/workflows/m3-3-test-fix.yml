name: M3.3 Test Fix

on:
  push:
    branches:
      - feature/m3-3-retrieval-foundation

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'M3.3 fix error-code assertion') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m3-3-retrieval-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix retrieval error-code assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/persistence/tests/retrieval-index.test.ts')
          text = path.read_text()
          old = '''    expect(() =>
      repository.indexVerified({
        ...input,
        contentSha256: "f".repeat(64),
      }),
    ).toThrow("RETRIEVAL_CONTENT_DIGEST_MISMATCH");'''
          new = '''    try {
      repository.indexVerified({
        ...input,
        contentSha256: "f".repeat(64),
      });
      throw new Error("expected digest mismatch");
    } catch (error) {
      expect(error).toMatchObject({ code: "RETRIEVAL_CONTENT_DIGEST_MISMATCH" });
    }'''
          if old not in text:
              raise SystemExit('assertion pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write packages/persistence/tests/retrieval-index.test.ts
      - run: pnpm --filter @markorbit/persistence test -- retrieval-index.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/tests/retrieval-index.test.ts
          git commit -m "M3.3 fix error-code assertion"
          git push
