name: Temporary IP India source coverage verification

on:
  push:
    branches:
      - codex/ipindia-source-coverage-v1

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/tmp/patch_ipindia_source_coverage.py
      - name: Update canonical URI cardinality assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/persistence/tests/priority-national-source-coverage.test.ts')
          text = path.read_text(encoding='utf-8')
          old = '    ).toBe(47);'
          new = '    ).toBe(56);'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('canonical URI cardinality assertion not found')
          path.write_text(text, encoding='utf-8')
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/persistence/src/priority-national-source-coverage.ts packages/persistence/src/source-coverage-catalog.ts packages/persistence/tests/priority-national-source-coverage.test.ts packages/persistence/src/retrieval-relevance-audit.ts packages/persistence/tests/retrieval-relevance-audit.test.ts
      - run: pnpm --filter @markorbit/persistence exec vitest run tests/priority-national-source-coverage.test.ts tests/source-coverage-catalog.test.ts tests/retrieval-relevance-audit.test.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/priority-national-source-coverage.ts packages/persistence/src/source-coverage-catalog.ts packages/persistence/tests/priority-national-source-coverage.test.ts packages/persistence/src/retrieval-relevance-audit.ts packages/persistence/tests/retrieval-relevance-audit.test.ts
          git commit -m "Sources: add India IP India trademark coverage" || true
          git push
