name: Temporary targeted claim governance verification

on:
  push:
    branches:
      - codex/targeted-claim-domain-governance-v1

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/tmp/patch_targeted_claim_domain_governance.py
      - run: python .github/tmp/fix_safe_worker_targeted_claim.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/persistence/src/worker-registry.ts packages/persistence/src/safe-worker-registry.ts packages/persistence/src/targeted-worker-claim.ts packages/persistence/tests/worker-registry.test.ts
      - run: pnpm --filter @markorbit/persistence exec vitest run tests/worker-registry.test.ts tests/safe-worker-registry.test.ts
      - run: pnpm typecheck
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/worker-registry.ts packages/persistence/src/safe-worker-registry.ts packages/persistence/src/targeted-worker-claim.ts packages/persistence/tests/worker-registry.test.ts
          git commit -m "Workers: align targeted claims with domain governance" || true
          git push
