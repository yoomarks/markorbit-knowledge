name: D2.16 Apply

on:
  push:
    branches:
      - codex/d2-16-audit-query-export
    paths:
      - .github/workflows/d2-16-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d2-16-audit-query-export
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply D2.16 integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              'packages/worker-runtime/src/index.ts',
              'export * from "./source-intelligence-policy-audit";\n',
              'export * from "./source-intelligence-policy-audit";\nexport * from "./source-intelligence-policy-audit-query";\n',
          )

          replace(
              'packages/persistence/src/source-intelligence-manual-sla-registry.ts',
              '  type SourceIntelligencePolicyAuditEventV2,\n',
              '  type SourceIntelligencePolicyAuditAction,\n  type SourceIntelligencePolicyAuditEventV2,\n',
          )
          replace(
              'packages/persistence/src/source-intelligence-manual-sla-registry.ts',
              'const MAX_EVENT_LIMIT = 500;\n',
              'const MAX_EVENT_LIMIT = 500;\nconst MAX_POLICY_AUDIT_EVENT_LIMIT = 5001;\nconst MAX_POLICY_AUDIT_FILTER_VALUES = 100;\n',
          )
          replace(
              'packages/persistence/src/source-intelligence-manual-sla-registry.ts',
              '''export type SourceIntelligencePolicyAuditEventFilters = {\n  limit?: number;\n  offset?: number;\n};''',
              '''export type SourceIntelligencePolicyAuditEventFilters = {\n  actorLabels?: string[];\n  actions?: SourceIntelligencePolicyAuditAction[];\n  occurredFromInclusive?: string;\n  occurredToExclusive?: string;\n  before?: { occurredAt: string; eventId: string };\n  limit?: number;\n  offset?: number;\n};''',
          )
          replace(
              'packages/persistence/src/source-intelligence-manual-sla-registry.ts',
              '''function normalizeEventOffset(value: number | undefined): number {\n  if (value === undefined) return 0;\n  if (!Number.isInteger(value) || value < 0) {\n    throw new RegistryValidationError("event offset must be a non-negative integer");\n  }\n  return value;\n}\n''',
              '''function normalizeEventOffset(value: number | undefined): number {\n  if (value === undefined) return 0;\n  if (!Number.isInteger(value) || value < 0) {\n    throw new RegistryValidationError("event offset must be a non-negative integer");\n  }\n  return value;\n}\n\nfunction normalizePolicyAuditEventLimit(value: number | undefined): number {\n  if (value === undefined) return 100;\n  if (!Number.isInteger(value) || value <= 0 || value > MAX_POLICY_AUDIT_EVENT_LIMIT) {\n    throw new RegistryValidationError(\n      `policy audit event limit must be an integer between 1 and ${MAX_POLICY_AUDIT_EVENT_LIMIT}`,\n    );\n  }\n  return value;\n}\n\nfunction normalizeAuditValues(values: string[] | undefined, field: string): string[] {\n  const normalized = [...new Set((values ?? []).map((value) => value.trim()).filter(Boolean))];\n  if (normalized.length > MAX_POLICY_AUDIT_FILTER_VALUES) {\n    throw new RegistryValidationError(\n      `At most ${MAX_POLICY_AUDIT_FILTER_VALUES} ${field} may be queried at once`,\n    );\n  }\n  return normalized;\n}\n''',
          )
          old_manual = '''  listPolicyAuditEvents(\n    filters: SourceIntelligencePolicyAuditEventFilters = {},\n  ): SourceIntelligencePolicyAuditEventV2[] {\n    const limit = normalizeEventLimit(filters.limit);\n    const offset = normalizeEventOffset(filters.offset);\n    return this.database\n      .prepare(\n        `SELECT * FROM source_intelligence_manual_sla_policy_events\n         ORDER BY occurred_at DESC, event_id DESC\n         LIMIT ? OFFSET ?`,\n      )\n      .all(limit, offset)\n      .map((row) => parsePolicyAuditEvent(row as Record<string, unknown>));\n  }'''
          new_manual = '''  listPolicyAuditEvents(\n    filters: SourceIntelligencePolicyAuditEventFilters = {},\n  ): SourceIntelligencePolicyAuditEventV2[] {\n    const actorLabels = normalizeAuditValues(filters.actorLabels, "actor labels");\n    const actions = normalizeAuditValues(filters.actions, "actions");\n    const limit = normalizePolicyAuditEventLimit(filters.limit);\n    const offset = normalizeEventOffset(filters.offset);\n    const clauses: string[] = [];\n    const values: SQLInputValue[] = [];\n    if (actorLabels.length) {\n      clauses.push(`actor_label IN (${actorLabels.map(() => "?").join(", ")})`);\n      values.push(...actorLabels);\n    }\n    if (actions.length) {\n      clauses.push(`action IN (${actions.map(() => "?").join(", ")})`);\n      values.push(...actions);\n    }\n    if (filters.occurredFromInclusive) {\n      clauses.push("occurred_at >= ?");\n      values.push(filters.occurredFromInclusive);\n    }\n    if (filters.occurredToExclusive) {\n      clauses.push("occurred_at < ?");\n      values.push(filters.occurredToExclusive);\n    }\n    if (filters.before) {\n      clauses.push("(occurred_at < ? OR (occurred_at = ? AND event_id < ?))");\n      values.push(filters.before.occurredAt, filters.before.occurredAt, filters.before.eventId);\n    }\n    const where = clauses.length ? `WHERE ${clauses.join(" AND ")}` : "";\n    return this.database\n      .prepare(\n        `SELECT * FROM source_intelligence_manual_sla_policy_events\n         ${where}\n         ORDER BY occurred_at DESC, event_id DESC\n         LIMIT ? OFFSET ?`,\n      )\n      .all(...values, limit, offset)\n      .map((row) => parsePolicyAuditEvent(row as Record<string, unknown>));\n  }'''
          replace('packages/persistence/src/source-intelligence-manual-sla-registry.ts', old_manual, new_manual)

          replace(
              'packages/persistence/src/source-intelligence-policy-scope-registry.ts',
              '  type SourceIntelligencePolicyAuditChangeV2,\n',
              '  type SourceIntelligencePolicyAuditAction,\n  type SourceIntelligencePolicyAuditChangeV2,\n',
          )
          replace(
              'packages/persistence/src/source-intelligence-policy-scope-registry.ts',
              'const MAX_EVENT_LIMIT = 500;\n',
              'const MAX_EVENT_LIMIT = 5001;\n',
          )
          replace(
              'packages/persistence/src/source-intelligence-policy-scope-registry.ts',
              '''export type SourceIntelligencePolicyAuditEventFilters = {\n  sourceIds?: string[];\n  cohortIds?: string[];\n  limit?: number;\n  offset?: number;\n};''',
              '''export type SourceIntelligencePolicyAuditEventFilters = {\n  sourceIds?: string[];\n  cohortIds?: string[];\n  actorLabels?: string[];\n  actions?: SourceIntelligencePolicyAuditAction[];\n  occurredFromInclusive?: string;\n  occurredToExclusive?: string;\n  before?: { occurredAt: string; eventId: string };\n  limit?: number;\n  offset?: number;\n};''',
          )
          old_cohort = '''  listCohortAuditEvents(\n    filters: SourceIntelligencePolicyAuditEventFilters = {},\n  ): SourceIntelligencePolicyAuditEventV2[] {\n    const cohortIds = normalizedValues(filters.cohortIds, "cohort ids").map(normalizedCohortId);\n    const limit = normalizeEventLimit(filters.limit);\n    const offset = normalizeEventOffset(filters.offset);\n    const values: SQLInputValue[] = [];\n    const where = cohortIds.length\n      ? `WHERE cohort_id IN (${cohortIds.map(() => "?").join(", ")})`\n      : "";\n    values.push(...cohortIds);\n    return this.database\n      .prepare(\n        `SELECT * FROM source_intelligence_policy_cohort_events\n         ${where}\n         ORDER BY occurred_at DESC, event_id DESC\n         LIMIT ? OFFSET ?`,\n      )\n      .all(...values, limit, offset)\n      .map((row) => parseCohortAuditEvent(row as Record<string, unknown>));\n  }'''
          new_cohort = '''  listCohortAuditEvents(\n    filters: SourceIntelligencePolicyAuditEventFilters = {},\n  ): SourceIntelligencePolicyAuditEventV2[] {\n    const cohortIds = normalizedValues(filters.cohortIds, "cohort ids").map(normalizedCohortId);\n    const actorLabels = normalizedValues(filters.actorLabels, "actor labels");\n    const actions = normalizedValues(filters.actions, "actions");\n    const limit = normalizeEventLimit(filters.limit);\n    const offset = normalizeEventOffset(filters.offset);\n    const clauses: string[] = [];\n    const values: SQLInputValue[] = [];\n    if (cohortIds.length) {\n      clauses.push(`cohort_id IN (${cohortIds.map(() => "?").join(", ")})`);\n      values.push(...cohortIds);\n    }\n    if (actorLabels.length) {\n      clauses.push(`actor_label IN (${actorLabels.map(() => "?").join(", ")})`);\n      values.push(...actorLabels);\n    }\n    if (actions.length) {\n      clauses.push(`action IN (${actions.map(() => "?").join(", ")})`);\n      values.push(...actions);\n    }\n    if (filters.occurredFromInclusive) {\n      clauses.push("occurred_at >= ?");\n      values.push(filters.occurredFromInclusive);\n    }\n    if (filters.occurredToExclusive) {\n      clauses.push("occurred_at < ?");\n      values.push(filters.occurredToExclusive);\n    }\n    if (filters.before) {\n      clauses.push("(occurred_at < ? OR (occurred_at = ? AND event_id < ?))");\n      values.push(filters.before.occurredAt, filters.before.occurredAt, filters.before.eventId);\n    }\n    const where = clauses.length ? `WHERE ${clauses.join(" AND ")}` : "";\n    return this.database\n      .prepare(\n        `SELECT * FROM source_intelligence_policy_cohort_events\n         ${where}\n         ORDER BY occurred_at DESC, event_id DESC\n         LIMIT ? OFFSET ?`,\n      )\n      .all(...values, limit, offset)\n      .map((row) => parseCohortAuditEvent(row as Record<string, unknown>));\n  }'''
          replace('packages/persistence/src/source-intelligence-policy-scope-registry.ts', old_cohort, new_cohort)

          old_membership = '''  listMembershipAuditEvents(\n    filters: SourceIntelligencePolicyAuditEventFilters = {},\n  ): SourceIntelligencePolicyAuditEventV2[] {\n    const sourceIds = normalizedValues(filters.sourceIds, "source ids");\n    const cohortIds = normalizedValues(filters.cohortIds, "cohort ids").map(normalizedCohortId);\n    const limit = normalizeEventLimit(filters.limit);\n    const offset = normalizeEventOffset(filters.offset);\n    const clauses: string[] = [];\n    const values: SQLInputValue[] = [];\n    if (sourceIds.length) {\n      clauses.push(`source_id IN (${sourceIds.map(() => "?").join(", ")})`);\n      values.push(...sourceIds);\n    }\n    if (cohortIds.length) {\n      clauses.push(`cohort_id IN (${cohortIds.map(() => "?").join(", ")})`);\n      values.push(...cohortIds);\n    }\n    const where = clauses.length ? `WHERE ${clauses.join(" AND ")}` : "";\n    return this.database\n      .prepare(\n        `SELECT * FROM source_intelligence_policy_membership_events\n         ${where}\n         ORDER BY occurred_at DESC, event_id DESC\n         LIMIT ? OFFSET ?`,\n      )\n      .all(...values, limit, offset)\n      .map((row) => parseMembershipAuditEvent(row as Record<string, unknown>));\n  }'''
          new_membership = '''  listMembershipAuditEvents(\n    filters: SourceIntelligencePolicyAuditEventFilters = {},\n  ): SourceIntelligencePolicyAuditEventV2[] {\n    const sourceIds = normalizedValues(filters.sourceIds, "source ids");\n    const cohortIds = normalizedValues(filters.cohortIds, "cohort ids").map(normalizedCohortId);\n    const actorLabels = normalizedValues(filters.actorLabels, "actor labels");\n    const actions = normalizedValues(filters.actions, "actions");\n    const limit = normalizeEventLimit(filters.limit);\n    const offset = normalizeEventOffset(filters.offset);\n    const clauses: string[] = [];\n    const values: SQLInputValue[] = [];\n    if (sourceIds.length) {\n      clauses.push(`source_id IN (${sourceIds.map(() => "?").join(", ")})`);\n      values.push(...sourceIds);\n    }\n    if (cohortIds.length) {\n      clauses.push(`cohort_id IN (${cohortIds.map(() => "?").join(", ")})`);\n      values.push(...cohortIds);\n    }\n    if (actorLabels.length) {\n      clauses.push(`actor_label IN (${actorLabels.map(() => "?").join(", ")})`);\n      values.push(...actorLabels);\n    }\n    if (actions.length) {\n      clauses.push(`action IN (${actions.map(() => "?").join(", ")})`);\n      values.push(...actions);\n    }\n    if (filters.occurredFromInclusive) {\n      clauses.push("occurred_at >= ?");\n      values.push(filters.occurredFromInclusive);\n    }\n    if (filters.occurredToExclusive) {\n      clauses.push("occurred_at < ?");\n      values.push(filters.occurredToExclusive);\n    }\n    if (filters.before) {\n      clauses.push("(occurred_at < ? OR (occurred_at = ? AND event_id < ?))");\n      values.push(filters.before.occurredAt, filters.before.occurredAt, filters.before.eventId);\n    }\n    const where = clauses.length ? `WHERE ${clauses.join(" AND ")}` : "";\n    return this.database\n      .prepare(\n        `SELECT * FROM source_intelligence_policy_membership_events\n         ${where}\n         ORDER BY occurred_at DESC, event_id DESC\n         LIMIT ? OFFSET ?`,\n      )\n      .all(...values, limit, offset)\n      .map((row) => parseMembershipAuditEvent(row as Record<string, unknown>));\n  }'''
          replace('packages/persistence/src/source-intelligence-policy-scope-registry.ts', old_membership, new_membership)

          replace(
              'apps/admin/src/server/source-intelligence-review-service.ts',
              '  SourceIntelligencePolicyAuditHistoryV2,\n',
              '''  SOURCE_INTELLIGENCE_POLICY_AUDIT_EXPORT_MAX_EVENTS,\n  type SourceIntelligencePolicyAuditAction,\n  SourceIntelligencePolicyAuditHistoryV2,\n  type SourceIntelligencePolicyAuditExportV2,\n  type SourceIntelligencePolicyAuditQueryFiltersV2,\n  type SourceIntelligencePolicyAuditQueryResultV2,\n  type SourceIntelligencePolicyAuditScope,\n''',
          )
          replace(
              'apps/admin/src/server/source-intelligence-review-service.ts',
              '  buildSourceIntelligencePolicyAuditHistoryV2,\n',
              '''  buildSourceIntelligencePolicyAuditExportV2,\n  buildSourceIntelligencePolicyAuditHistoryV2,\n  buildSourceIntelligencePolicyAuditQueryResultV2,\n  decodeSourceIntelligencePolicyAuditCursorV2,\n  normalizeSourceIntelligencePolicyAuditFiltersV2,\n  normalizeSourceIntelligencePolicyAuditQueryV2,\n''',
          )
          insert_types_after = '''export type PolicyCohortMembershipInput = {\n  cohortId: string;\n  sourceId: string;\n  action: "ADDED" | "REMOVED";\n  actor: string;\n  expectedPresent: boolean;\n};\n'''
          add_types = insert_types_after + '''\nexport type PolicyAuditFilterInput = {\n  scopes?: SourceIntelligencePolicyAuditScope[];\n  actions?: SourceIntelligencePolicyAuditAction[];\n  actorLabels?: string[];\n  sourceIds?: string[];\n  cohortIds?: string[];\n  occurredFromInclusive?: string | null;\n  occurredToExclusive?: string | null;\n};\n\nexport type PolicyAuditQueryInput = PolicyAuditFilterInput & {\n  pageSize?: number;\n  cursor?: string | null;\n};\n'''
          replace('apps/admin/src/server/source-intelligence-review-service.ts', insert_types_after, add_types)

          helper_anchor = '''function boundedInteger(\n  value: number | undefined,\n  fallback: number,\n  minimum: number,\n  maximum: number,\n  field: string,\n): number {\n  if (value === undefined) return fallback;\n  if (!Number.isInteger(value) || value < minimum || value > maximum) {\n    throw new RegistryValidationError(\n      `${field} must be an integer between ${minimum} and ${maximum}`,\n    );\n  }\n  return value;\n}\n'''
          helper_new = helper_anchor + '''\nfunction auditValidation<T>(builder: () => T): T {\n  try {\n    return builder();\n  } catch (error) {\n    throw new RegistryValidationError(\n      error instanceof Error ? error.message : "Invalid D2.16 policy audit query",\n    );\n  }\n}\n'''
          replace('apps/admin/src/server/source-intelligence-review-service.ts', helper_anchor, helper_new)

          audit_method_anchor = '''  policyAudit(\n    sourceIds: string[] = [],\n    eventLimit = DEFAULT_POLICY_AUDIT_EVENT_LIMIT,\n  ): SourceIntelligencePolicyAuditHistoryV2 {\n    const ids = normalizeOptionalSourceIds(sourceIds);\n    const limit = boundedInteger(\n      eventLimit,\n      DEFAULT_POLICY_AUDIT_EVENT_LIMIT,\n      1,\n      MAX_POLICY_AUDIT_EVENT_LIMIT,\n      "eventLimit",\n    );\n    return buildSourceIntelligencePolicyAuditHistoryV2({\n      globalPolicyEvents: this.dependencies.manualSla.listPolicyAuditEvents({ limit }),\n      cohortEvents: this.dependencies.policyScope.listCohortAuditEvents({ limit }),\n      membershipEvents: this.dependencies.policyScope.listMembershipAuditEvents({\n        ...(ids.length ? { sourceIds: ids } : {}),\n        limit,\n      }),\n      generatedAt: this.now(),\n      limit,\n    });\n  }\n'''
          audit_methods = audit_method_anchor + '''\n  policyAuditQuery(input: PolicyAuditQueryInput = {}): SourceIntelligencePolicyAuditQueryResultV2 {\n    const query = auditValidation(() => normalizeSourceIntelligencePolicyAuditQueryV2(input));\n    const before = query.cursor\n      ? auditValidation(() => decodeSourceIntelligencePolicyAuditCursorV2(query.cursor!))\n      : undefined;\n    const streamLimit = query.pageSize + 1;\n    const common = {\n      ...(query.actorLabels.length ? { actorLabels: query.actorLabels } : {}),\n      ...(query.actions.length ? { actions: query.actions } : {}),\n      ...(query.occurredFromInclusive\n        ? { occurredFromInclusive: query.occurredFromInclusive }\n        : {}),\n      ...(query.occurredToExclusive ? { occurredToExclusive: query.occurredToExclusive } : {}),\n      ...(before ? { before } : {}),\n      limit: streamLimit,\n    };\n    const scopeAllowed = (scope: SourceIntelligencePolicyAuditScope) =>\n      query.scopes.length === 0 || query.scopes.includes(scope);\n    const events = [\n      ...(scopeAllowed("GLOBAL_POLICY") && !query.sourceIds.length && !query.cohortIds.length\n        ? this.dependencies.manualSla.listPolicyAuditEvents(common)\n        : []),\n      ...(scopeAllowed("COHORT") && !query.sourceIds.length\n        ? this.dependencies.policyScope.listCohortAuditEvents({\n            ...common,\n            ...(query.cohortIds.length ? { cohortIds: query.cohortIds } : {}),\n          })\n        : []),\n      ...(scopeAllowed("MEMBERSHIP")\n        ? this.dependencies.policyScope.listMembershipAuditEvents({\n            ...common,\n            ...(query.sourceIds.length ? { sourceIds: query.sourceIds } : {}),\n            ...(query.cohortIds.length ? { cohortIds: query.cohortIds } : {}),\n          })\n        : []),\n    ];\n    return buildSourceIntelligencePolicyAuditQueryResultV2({\n      events,\n      query,\n      generatedAt: this.now(),\n    });\n  }\n\n  policyAuditExport(input: PolicyAuditFilterInput = {}): SourceIntelligencePolicyAuditExportV2 {\n    const filters: SourceIntelligencePolicyAuditQueryFiltersV2 = auditValidation(() =>\n      normalizeSourceIntelligencePolicyAuditFiltersV2(input),\n    );\n    const streamLimit = SOURCE_INTELLIGENCE_POLICY_AUDIT_EXPORT_MAX_EVENTS + 1;\n    const common = {\n      ...(filters.actorLabels.length ? { actorLabels: filters.actorLabels } : {}),\n      ...(filters.actions.length ? { actions: filters.actions } : {}),\n      ...(filters.occurredFromInclusive\n        ? { occurredFromInclusive: filters.occurredFromInclusive }\n        : {}),\n      ...(filters.occurredToExclusive ? { occurredToExclusive: filters.occurredToExclusive } : {}),\n      limit: streamLimit,\n    };\n    const scopeAllowed = (scope: SourceIntelligencePolicyAuditScope) =>\n      filters.scopes.length === 0 || filters.scopes.includes(scope);\n    const events = [\n      ...(scopeAllowed("GLOBAL_POLICY") && !filters.sourceIds.length && !filters.cohortIds.length\n        ? this.dependencies.manualSla.listPolicyAuditEvents(common)\n        : []),\n      ...(scopeAllowed("COHORT") && !filters.sourceIds.length\n        ? this.dependencies.policyScope.listCohortAuditEvents({\n            ...common,\n            ...(filters.cohortIds.length ? { cohortIds: filters.cohortIds } : {}),\n          })\n        : []),\n      ...(scopeAllowed("MEMBERSHIP")\n        ? this.dependencies.policyScope.listMembershipAuditEvents({\n            ...common,\n            ...(filters.sourceIds.length ? { sourceIds: filters.sourceIds } : {}),\n            ...(filters.cohortIds.length ? { cohortIds: filters.cohortIds } : {}),\n          })\n        : []),\n    ];\n    return buildSourceIntelligencePolicyAuditExportV2({ events, filters });\n  }\n'''
          replace('apps/admin/src/server/source-intelligence-review-service.ts', audit_method_anchor, audit_methods)

          replace(
              'apps/admin/src/app/[section]/page.tsx',
              'import { SourceIntelligencePolicyAudit } from "@/components/sources/source-intelligence-policy-audit";\n',
              'import { SourceIntelligencePolicyAudit } from "@/components/sources/source-intelligence-policy-audit";\nimport { SourceIntelligencePolicyAuditQuery } from "@/components/sources/source-intelligence-policy-audit-query";\n',
          )
          replace(
              'apps/admin/src/app/[section]/page.tsx',
              'description="先用 D2.15 Policy Audit & Change History 查看人工 policy 变更，再用 D2.14 Policy Scope & Cohorts 显式定义不同 Source 的 workflow policy；D2.13 继续计算 Manual SLA 与人工升级，后续面板提供运营与证据上下文，所有状态都不构成自动执行授权。"',
              'description="先用 D2.16 Audit Query & Export 对 D2.15 append-only policy audit 做显式筛选、keyset 分页与确定性导出，再查看 D2.15 原始历史和 D2.14 policy scope；所有查询与导出都保持只读，不构成自动执行授权。"',
          )
          replace(
              'apps/admin/src/app/[section]/page.tsx',
              '      <div className="space-y-6">\n        <SourceIntelligencePolicyAudit />\n',
              '      <div className="space-y-6">\n        <SourceIntelligencePolicyAuditQuery />\n        <SourceIntelligencePolicyAudit />\n',
          )
          PY
          pnpm exec prettier --write \
            packages/worker-runtime/src/index.ts \
            packages/persistence/src/source-intelligence-manual-sla-registry.ts \
            packages/persistence/src/source-intelligence-policy-scope-registry.ts \
            apps/admin/src/server/source-intelligence-review-service.ts \
            apps/admin/src/app/[section]/page.tsx
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/worker-runtime/src/index.ts \
            packages/persistence/src/source-intelligence-manual-sla-registry.ts \
            packages/persistence/src/source-intelligence-policy-scope-registry.ts \
            apps/admin/src/server/source-intelligence-review-service.ts \
            apps/admin/src/app/[section]/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate D2.16 audit query and export"
          git push origin HEAD:codex/d2-16-audit-query-export
