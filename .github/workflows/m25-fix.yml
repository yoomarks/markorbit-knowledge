name: M25 Fix

on:
  push:
    branches:
      - m25-foundational-operator-workbench

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m25-foundational-operator-workbench
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replace impure client nonce generation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/admin/src/components/foundational/foundational-operator-workbench.tsx")
          text = path.read_text()
          old = '''  async function requestApproval(targetId: string) {
    const nonce = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
    const idempotencyKey = operatorIntentIdempotencyKey({
'''
          new = '''  async function requestApproval(targetId: string) {
    const previousIntent = latestIntentForAction(
      intents,
      targetId,
      "DISPATCH_GOVERNED_COLLECTION",
    );
    const nonce = previousIntent
      ? `${previousIntent.intentId}:${previousIntent.updatedAt}`
      : "first";
    const idempotencyKey = operatorIntentIdempotencyKey({
'''
          if old not in text:
              raise SystemExit("expected requestApproval nonce block not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format changed file
        run: pnpm exec prettier --write apps/admin/src/components/foundational/foundational-operator-workbench.tsx
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/admin/src/components/foundational/foundational-operator-workbench.tsx
          git commit -m "M25 use deterministic intent nonce"
          git push
