name: Temporary Fix Myanmar Search

on:
  push:
    branches:
      - agent/priority-120-tranche-mn-kh-la-mm-bn-v1

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/priority-120-tranche-mn-kh-la-mm-bn-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replace placeholder lookup with IPD search
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('packages/persistence/src/priority-national-source-coverage.ts')
          text = source.read_text()
          marker = 'id: "mm-ipd-trademark-forms"'
          marker_pos = text.find(marker)
          if marker_pos < 0:
              raise SystemExit('Myanmar placeholder search target not found')
          start = text.rfind('  target(IPD_MM, {', 0, marker_pos)
          end = text.find('  }),', marker_pos)
          if start < 0 or end < 0:
              raise SystemExit('Myanmar placeholder target boundaries not found')
          end += len('  }),')
          replacement = '''  target(IPD_MM, {
            id: "mm-ipd-ip-search",
            family: "SEARCH",
            displayName: "Myanmar IPD Intellectual Property Search",
            canonicalUri: "https://ipd.gov.mm/ip-search",
            mode: "MIXED",
            renderJavascriptHint: true,
            expectedArtifactKinds: ["HTML", "JSON"],
            verificationEvidenceUri: "https://ipd.gov.mm/",
            notes:
              "Official IP Search endpoint linked directly from the 2026 IPD homepage; retained as the national search gateway instead of treating a forms page as a search source.",
          }),'''
          source.write_text(text[:start] + replacement + text[end:])

          probes = Path('packages/persistence/src/retrieval-relevance-audit.ts')
          ptext = probes.read_text()
          replacements = {
              'id: "mm-ipd-trademark-forms-name"': 'id: "mm-ipd-ip-search-name"',
              'targetId: "mm-ipd-trademark-forms"': 'targetId: "mm-ipd-ip-search"',
              'query: "Myanmar IPD trademark forms registry workflow"': 'query: "Myanmar IPD intellectual property trademark search"',
          }
          for old, new in replacements.items():
              if old not in ptext:
                  raise SystemExit(f'Myanmar relevance probe field not found: {old}')
              ptext = ptext.replace(old, new, 1)
          probes.write_text(ptext)
          PY
          pnpm exec prettier --write \
            packages/persistence/src/priority-national-source-coverage.ts \
            packages/persistence/src/retrieval-relevance-audit.ts
      - name: Verify
        run: |
          pnpm --filter @markorbit/persistence test -- \
            tests/priority-national-source-coverage.test.ts \
            tests/retrieval-relevance-audit.test.ts \
            tests/priority-trademark-jurisdictions.test.ts
          pnpm typecheck
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/persistence/src/priority-national-source-coverage.ts \
            packages/persistence/src/retrieval-relevance-audit.ts
          git commit -m "fix: use Myanmar IPD search endpoint"
          git push origin HEAD:agent/priority-120-tranche-mn-kh-la-mm-bn-v1
