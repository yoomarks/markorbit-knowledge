name: API Connector Final Hardening Once

on:
  push:
    branches:
      - codex/connector-api-v1

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/connector-api-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Harden IPv6 literal handling and document binding scope
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('packages/worker-runtime/src/api-acquirer.ts')
          text = api.read_text()
          old = '''function normalizeBinding(bindingId: string, value: unknown): ApiEndpointBinding {
          '''
          new = '''function normalizedEndpointHostname(url: URL): string {
            const hostname = url.hostname;
            return hostname.startsWith("[") && hostname.endsWith("]")
              ? hostname.slice(1, -1)
              : hostname;
          }

          function normalizeBinding(bindingId: string, value: unknown): ApiEndpointBinding {
          '''
          if old not in text:
            raise SystemExit('api insertion anchor missing')
          text = text.replace(old, new, 1)

          old = '''  if (url.hostname.toLowerCase() === "localhost" || url.hostname.toLowerCase().endsWith(".localhost")) {
            throw new Error(`API endpoint binding ${bindingId} cannot target localhost`);
          }
          return { baseUrl: url.origin, auth: normalizeAuth(container.auth) };
          '''
          new = '''  const hostname = normalizedEndpointHostname(url).toLowerCase();
          if (hostname === "localhost" || hostname.endsWith(".localhost")) {
            throw new Error(`API endpoint binding ${bindingId} cannot target localhost`);
          }
          return { baseUrl: url.origin, auth: normalizeAuth(container.auth) };
          '''
          if old not in text:
            raise SystemExit('binding hostname anchor missing')
          text = text.replace(old, new, 1)

          old = '''    const endpoint = new URL(binding.baseUrl);
            let resolved: ApiResolvedAddress[];
            try {
              resolved = await this.resolver(endpoint.hostname);
          '''
          new = '''    const endpoint = new URL(binding.baseUrl);
            const endpointHostname = normalizedEndpointHostname(endpoint);
            let resolved: ApiResolvedAddress[];
            try {
              resolved = await this.resolver(endpointHostname);
          '''
          if old not in text:
            raise SystemExit('resolver hostname anchor missing')
          text = text.replace(old, new, 1)

          old = '''        hostname: endpoint.hostname,
                resolvedAddress: selected.address,
                family: selected.family,
                port: endpoint.port ? Number(endpoint.port) : 443,
                ...(isIP(endpoint.hostname) ? {} : { servername: endpoint.hostname }),
          '''
          new = '''        hostname: endpointHostname,
                resolvedAddress: selected.address,
                family: selected.family,
                port: endpoint.port ? Number(endpoint.port) : 443,
                ...(isIP(endpointHostname) ? {} : { servername: endpointHostname }),
          '''
          if old not in text:
            raise SystemExit('transport hostname anchor missing')
          text = text.replace(old, new, 1)
          api.write_text(text)

          tests = Path('packages/worker-runtime/tests/api-acquirer.test.ts')
          text = tests.read_text()
          anchor = '''  it("fails closed when DNS returns a mixed public/private answer set", async () => {
          '''
          addition = '''  it("rejects a private IPv6 literal before transport", async () => {
            const transport = vi.fn(async () => response());
            const acquirer = new ApiArtifactAcquirer({
              environment: {
                MARKORBIT_API_ENDPOINT_BINDINGS: JSON.stringify({
                  "public-api": { baseUrl: "https://[::1]", auth: { kind: "NONE" } },
                }),
              },
              transport,
            });
            const error = await acquisitionError(acquirer.acquire(context()));
            expect(error.code).toBe("API_NETWORK_TARGET_REJECTED");
            expect(transport).not.toHaveBeenCalled();
          });

          '''
          if anchor not in text:
            raise SystemExit('test insertion anchor missing')
          text = text.replace(anchor, addition + anchor, 1)
          tests.write_text(text)

          doc = Path('docs/operations/API_CONNECTOR_V1.md')
          text = doc.read_text()
          anchor = '''Do not copy endpoint credentials into Source `connectorConfig`, CollectionPlan extensions, shell history committed to the repository, or operator notes stored in Knowledge.

          ## Source connectorConfig
          '''
          replacement = '''Do not copy endpoint credentials into Source `connectorConfig`, CollectionPlan extensions, shell history committed to the repository, or operator notes stored in Knowledge.

          ### Worker binding scope

          V1 uses the shared connector identity `api-worker@1.0.0`. Every active Worker registered for that connector must therefore be provisioned with the complete `MARKORBIT_API_ENDPOINT_BINDINGS` set for the API Sources it is expected to service. A Worker that claims a Job whose binding is absent fails closed with `API_BINDING_UNAVAILABLE`; it never substitutes another origin or credential.

          For v1, prefer one governed API Worker pool with a consistent binding map. If future deployments require independently scoped API Worker pools, add an explicit routing/connector-scope design instead of weakening the fail-closed binding check.

          ## Source connectorConfig
          '''
          if anchor not in text:
            raise SystemExit('doc insertion anchor missing')
          doc.write_text(text.replace(anchor, replacement, 1))
          PY
      - name: Format final permanent files
        run: >-
          pnpm exec prettier --write
          .env.example
          README.md
          apps/worker/package.json
          apps/worker/src/bootstrap-api.ts
          apps/worker/src/config.ts
          apps/worker/src/main.ts
          apps/worker/tests/config.test.ts
          docs/operations/API_CONNECTOR_V1.md
          packages/worker-runtime/src/api-acquirer.ts
          packages/worker-runtime/src/index.ts
          packages/worker-runtime/tests/api-acquirer.test.ts
      - name: Run focused API Connector checks
        run: |
          pnpm --filter @markorbit/worker-runtime test -- tests/api-acquirer.test.ts
          pnpm --filter @markorbit/worker test -- tests/config.test.ts
          pnpm --filter @markorbit/worker-runtime typecheck
          pnpm --filter @markorbit/worker typecheck
      - name: Commit final hardening
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .env.example README.md apps/worker packages/worker-runtime/src/api-acquirer.ts packages/worker-runtime/src/index.ts packages/worker-runtime/tests/api-acquirer.test.ts docs/operations/API_CONNECTOR_V1.md
          git commit -m 'fix(api-connector): harden final network and worker boundaries'
          git push origin HEAD:codex/connector-api-v1
