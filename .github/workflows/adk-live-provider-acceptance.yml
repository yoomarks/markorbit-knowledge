name: ADK-06 Live Provider Acceptance

on:
  workflow_dispatch:
    inputs:
      approval_ref:
        description: "Explicit approval reference for the real 3x2 provider run"
        required: true
        type: string
      confirm_live_provider_calls:
        description: "Authorize real DeepSeek and OpenAI provider calls"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: adk-06-live-provider-acceptance
  cancel-in-progress: false

jobs:
  live-acceptance:
    if: ${{ inputs.confirm_live_provider_calls == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUNTIME_ROOT: ${{ github.workspace }}/.adk-live
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      APPROVAL_REF: ${{ inputs.approval_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Fail closed unless both provider secrets exist
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEEPSEEK_API_KEY:-}" ]]; then
            echo "::error::Repository secret DEEPSEEK_API_KEY is not configured."
            exit 1
          fi
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::Repository secret OPENAI_API_KEY is not configured."
            exit 1
          fi
          if [[ -z "${APPROVAL_REF// }" ]]; then
            echo "::error::approval_ref must be non-empty."
            exit 1
          fi

      - name: Freeze explicit 3x2 live plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNTIME_ROOT"
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const root = process.env.RUNTIME_ROOT;
          const approvalRef = process.env.APPROVAL_REF;
          const plan = {
            protocolVersion: "1.0",
            objectType: "AI_PRODUCTION_PILOT_PLAN",
            pilotId: "app_us_trademark_live_acceptance",
            assignmentIds: [
              "kas_us_trademark_filing",
              "kas_us_trademark_section_8",
              "kas_us_trademark_ttab",
            ],
            providers: ["DEEPSEEK", "OPENAI"],
            approvalRef,
            liveProviderCallsAuthorized: true,
            boundaries: {
              compareProviderQuality: false,
              legalTruthVerified: false,
              candidateAutoActivation: false,
            },
            createdAt: new Date().toISOString(),
          };
          fs.writeFileSync(path.join(root, "plan.json"), `${JSON.stringify(plan, null, 2)}\n`, {
            encoding: "utf8",
            flag: "wx",
            mode: 0o600,
          });
          NODE

      - name: Prepare authenticated RawArtifact runtime
        env:
          MARKORBIT_ADK_LIVE_DB_PATH: ${{ github.workspace }}/.adk-live/live.sqlite
          MARKORBIT_ADK_LIVE_STORAGE_ROOT: ${{ github.workspace }}/.adk-live/artifacts
          MARKORBIT_ADK_LIVE_PLAN_PATH: ${{ github.workspace }}/.adk-live/plan.json
          MARKORBIT_ADK_LIVE_RUNTIME_SECRET_PATH: ${{ github.workspace }}/.adk-live/runtime-secret.json
          MARKORBIT_ADK_LIVE_PREPARATION_RECEIPT_PATH: ${{ github.workspace }}/.adk-live/preparation-receipt.json
        run: pnpm --filter @markorbit/worker adk:pilot:prepare

      - name: Execute real DeepSeek plus OpenAI acceptance
        env:
          MARKORBIT_ADK_LIVE_RUNTIME_SECRET_PATH: ${{ github.workspace }}/.adk-live/runtime-secret.json
          MARKORBIT_ADK_LIVE_RECEIPT_PATH: ${{ github.workspace }}/.adk-live/acceptance.json
        run: pnpm --filter @markorbit/worker adk:pilot:live

      - name: Verify 6 of 6 acceptance and 12 durable RawArtifacts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const root = process.env.RUNTIME_ROOT;
          const acceptance = JSON.parse(fs.readFileSync(path.join(root, "acceptance.json"), "utf8"));
          const expectedAssignments = [
            "kas_us_trademark_filing",
            "kas_us_trademark_section_8",
            "kas_us_trademark_ttab",
          ];
          const receiptIds = acceptance.execution?.artifactReceiptIds ?? [];
          if (
            acceptance.accepted !== true ||
            acceptance.approvalRef !== process.env.APPROVAL_REF ||
            JSON.stringify(acceptance.assignmentIds) !== JSON.stringify(expectedAssignments) ||
            JSON.stringify(acceptance.providers) !== JSON.stringify(["DEEPSEEK", "OPENAI"]) ||
            acceptance.receipts?.length !== 6 ||
            acceptance.receipts.some((receipt) => receipt.status !== "EXECUTED") ||
            acceptance.lineage?.length !== 6 ||
            receiptIds.length !== 12 ||
            new Set(receiptIds).size !== 12
          ) {
            throw new Error("ADK-06 live acceptance evidence is incomplete");
          }

          const metadata = {
            objectType: "ADK_LIVE_PROVIDER_WORKFLOW_EVIDENCE",
            protocolVersion: "1.0",
            repository: process.env.GITHUB_REPOSITORY,
            commitSha: process.env.GITHUB_SHA,
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            issue: 405,
            pilotId: acceptance.pilotId,
            approvalRef: acceptance.approvalRef,
            assignmentIds: acceptance.assignmentIds,
            providers: acceptance.providers,
            executedCells: acceptance.receipts.length,
            rawArtifactLineageRecords: acceptance.lineage.length,
            finalizedArtifactReceipts: receiptIds.length,
            executionAttemptId: acceptance.execution.executionAttemptId,
            accepted: true,
            recordedAt: new Date().toISOString(),
          };
          fs.writeFileSync(
            path.join(root, "workflow-metadata.json"),
            `${JSON.stringify(metadata, null, 2)}\n`,
            { encoding: "utf8", flag: "wx", mode: 0o600 },
          );
          NODE

      - name: Remove transient Worker and lease secret material
        if: always()
        shell: bash
        run: rm -f "$RUNTIME_ROOT/runtime-secret.json"

      - name: Upload durable live acceptance evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adk-06-live-acceptance-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            .adk-live/plan.json
            .adk-live/preparation-receipt.json
            .adk-live/acceptance.json
            .adk-live/workflow-metadata.json
            .adk-live/live.sqlite
            .adk-live/artifacts/**
