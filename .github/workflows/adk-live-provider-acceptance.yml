name: ADK-06 Live Provider Acceptance

on:
  workflow_dispatch:
    inputs:
      approval_ref:
        description: "Exact frozen approval reference for the real 3x2 provider run"
        required: true
        default: "github:yoomarks/markorbit-knowledge#405"
        type: string
      expected_commit_sha:
        description: "Exact main commit SHA authorized for this live acceptance"
        required: true
        type: string
      confirm_live_provider_calls:
        description: "Authorize real DeepSeek and OpenAI provider calls"
        required: true
        default: false
        type: boolean
      resume_run_id:
        description: "Optional prior ADK-06 workflow run id whose encrypted partial runtime should be resumed"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: adk-06-live-provider-acceptance
  cancel-in-progress: false

jobs:
  live-acceptance:
    if: ${{ inputs.confirm_live_provider_calls == true }}
    environment: adk-live
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUNTIME_ROOT: ${{ github.workspace }}/.adk-live
      EVIDENCE_ROOT: ${{ github.workspace }}/adk-live-evidence
      CANONICAL_PLAN: ${{ github.workspace }}/config/adk-live-pilot-us-trademark-3x2.json
      APPROVAL_REF: ${{ inputs.approval_ref }}
      EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Fail closed unless main, exact commit and frozen approval match
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::ADK-06 live acceptance must be dispatched from main."
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_commit_sha must be a full lowercase Git commit SHA."
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$EXPECTED_COMMIT_SHA" ]]; then
            echo "::error::main moved after authorization; refusing to run paid ADK-06 provider calls."
            exit 1
          fi
          if [[ -n "$RESUME_RUN_ID" && ! "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::resume_run_id must be an Actions run id containing digits only."
            exit 1
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const plan = JSON.parse(fs.readFileSync(process.env.CANONICAL_PLAN, "utf8"));
          if (process.env.APPROVAL_REF !== plan.approvalRef) {
            throw new Error("approval_ref does not match the frozen canonical plan");
          }
          if (
            plan.liveProviderCallsAuthorized !== true ||
            JSON.stringify(plan.assignmentIds) !==
              JSON.stringify([
                "kas_us_trademark_filing",
                "kas_us_trademark_section_8",
                "kas_us_trademark_ttab",
              ]) ||
            JSON.stringify(plan.providers) !== JSON.stringify(["DEEPSEEK", "OPENAI"])
          ) {
            throw new Error("canonical ADK-06 live plan no longer matches the frozen 3x2 authority");
          }
          NODE

      - name: Enforce DeepSeek off-peak window before secrets are exposed
        run: >-
          pnpm --filter @markorbit/worker exec tsx -e
          'import { assertDeepSeekOffPeakExecutionWindow } from
          "@markorbit/worker-runtime/ai-distilled-knowledge-acquirer";
          assertDeepSeekOffPeakExecutionWindow(new Date());'

      - name: Fail closed unless provider and evidence secrets exist
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADK_LIVE_EVIDENCE_PASSPHRASE: ${{ secrets.ADK_LIVE_EVIDENCE_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${DEEPSEEK_API_KEY:-}" ]]; then
            echo "::error::Repository secret DEEPSEEK_API_KEY is not configured."
            exit 1
          fi
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::Repository secret OPENAI_API_KEY is not configured."
            exit 1
          fi
          if [[ ${#ADK_LIVE_EVIDENCE_PASSPHRASE} -lt 32 ]]; then
            echo "::error::Repository secret ADK_LIVE_EVIDENCE_PASSPHRASE must contain at least 32 characters."
            exit 1
          fi

      - name: Create runtime directories
        shell: bash
        run: mkdir -p "$RUNTIME_ROOT" "$EVIDENCE_ROOT"

      - name: Restore prior encrypted partial runtime
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: adk-06-live-acceptance-encrypted-${{ inputs.resume_run_id }}
          path: ${{ runner.temp }}/adk-live-resume
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Decrypt and validate resumed runtime
        if: ${{ inputs.resume_run_id != '' }}
        shell: bash
        env:
          ADK_LIVE_EVIDENCE_PASSPHRASE: ${{ secrets.ADK_LIVE_EVIDENCE_PASSPHRASE }}
        run: |
          set -euo pipefail
          ENCRYPTED_PATH="$RUNNER_TEMP/adk-live-resume/adk-06-live-evidence.aesgcm"
          MANIFEST_PATH="$RUNNER_TEMP/adk-live-resume/evidence-manifest.json"
          TAR_PATH="$RUNNER_TEMP/adk-06-live-resume.tar.gz"
          INPUT_PATH="$ENCRYPTED_PATH" MANIFEST_PATH="$MANIFEST_PATH" OUTPUT_PATH="$TAR_PATH" node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const passphrase = process.env.ADK_LIVE_EVIDENCE_PASSPHRASE;
          if (!passphrase || passphrase.length < 32) throw new Error("evidence passphrase is unavailable");
          const envelope = fs.readFileSync(process.env.INPUT_PATH);
          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST_PATH, "utf8"));
          const encryptedSha256 = crypto.createHash("sha256").update(envelope).digest("hex");
          if (manifest.encryptedSha256 !== encryptedSha256) {
            throw new Error("encrypted resume evidence does not match its manifest");
          }
          if (envelope.subarray(0, 8).toString("utf8") !== "MOADKAE1") {
            throw new Error("invalid encrypted evidence envelope");
          }
          const salt = envelope.subarray(8, 24);
          const iv = envelope.subarray(24, 36);
          const tag = envelope.subarray(36, 52);
          const ciphertext = envelope.subarray(52);
          const key = crypto.scryptSync(passphrase, salt, 32);
          const decipher = crypto.createDecipheriv("aes-256-gcm", key, iv);
          decipher.setAuthTag(tag);
          const plaintext = Buffer.concat([decipher.update(ciphertext), decipher.final()]);
          fs.writeFileSync(process.env.OUTPUT_PATH, plaintext, { flag: "wx", mode: 0o600 });
          NODE
          tar -C "$RUNTIME_ROOT" -xzf "$TAR_PATH"
          rm -f "$TAR_PATH"
          cmp --silent "$CANONICAL_PLAN" "$RUNTIME_ROOT/plan.json"
          for required in live.sqlite runtime-secret.json live-checkpoint.json preparation-receipt.json; do
            if [[ ! -e "$RUNTIME_ROOT/$required" ]]; then
              echo "::error::Resumed evidence is missing $required."
              exit 1
            fi
          done
          RUNTIME_ROOT="$RUNTIME_ROOT" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const secretPath = path.join(process.env.RUNTIME_ROOT, "runtime-secret.json");
          const secret = JSON.parse(fs.readFileSync(secretPath, "utf8"));
          secret.databasePath = path.join(process.env.RUNTIME_ROOT, "live.sqlite");
          secret.storageRoot = path.join(process.env.RUNTIME_ROOT, "artifacts");
          secret.planPath = path.join(process.env.RUNTIME_ROOT, "plan.json");
          fs.writeFileSync(secretPath, `${JSON.stringify(secret, null, 2)}\n`, {
            encoding: "utf8",
            mode: 0o600,
          });
          NODE
          rm -f "$RUNTIME_ROOT/acceptance.json" "$RUNTIME_ROOT/workflow-metadata.json"

      - name: Copy frozen plan into fresh runtime
        if: ${{ inputs.resume_run_id == '' }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$CANONICAL_PLAN" "$RUNTIME_ROOT/plan.json"
          chmod 600 "$RUNTIME_ROOT/plan.json"
          cmp --silent "$CANONICAL_PLAN" "$RUNTIME_ROOT/plan.json"

      - name: Prepare authenticated RawArtifact runtime
        if: ${{ inputs.resume_run_id == '' }}
        env:
          MARKORBIT_ADK_LIVE_DB_PATH: ${{ github.workspace }}/.adk-live/live.sqlite
          MARKORBIT_ADK_LIVE_STORAGE_ROOT: ${{ github.workspace }}/.adk-live/artifacts
          MARKORBIT_ADK_LIVE_PLAN_PATH: ${{ github.workspace }}/.adk-live/plan.json
          MARKORBIT_ADK_LIVE_RUNTIME_SECRET_PATH: ${{ github.workspace }}/.adk-live/runtime-secret.json
          MARKORBIT_ADK_LIVE_PREPARATION_RECEIPT_PATH: ${{ github.workspace }}/.adk-live/preparation-receipt.json
        run: pnpm --filter @markorbit/worker adk:pilot:prepare

      - name: Execute real DeepSeek Flash plus OpenAI acceptance
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MARKORBIT_ADK_LIVE_RUNTIME_SECRET_PATH: ${{ github.workspace }}/.adk-live/runtime-secret.json
          MARKORBIT_ADK_LIVE_CHECKPOINT_PATH: ${{ github.workspace }}/.adk-live/live-checkpoint.json
          MARKORBIT_ADK_LIVE_RECEIPT_PATH: ${{ github.workspace }}/.adk-live/acceptance.json
        run: pnpm --filter @markorbit/worker adk:pilot:live

      - name: Verify 6 of 6 acceptance and 12 durable RawArtifacts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const root = process.env.RUNTIME_ROOT;
          const acceptance = JSON.parse(fs.readFileSync(path.join(root, "acceptance.json"), "utf8"));
          const checkpoint = JSON.parse(fs.readFileSync(path.join(root, "live-checkpoint.json"), "utf8"));
          const expectedAssignments = [
            "kas_us_trademark_filing",
            "kas_us_trademark_section_8",
            "kas_us_trademark_ttab",
          ];
          const receiptIds = acceptance.execution?.artifactReceiptIds ?? [];
          if (
            acceptance.accepted !== true ||
            acceptance.approvalRef !== process.env.APPROVAL_REF ||
            JSON.stringify(acceptance.assignmentIds) !== JSON.stringify(expectedAssignments) ||
            JSON.stringify(acceptance.providers) !== JSON.stringify(["DEEPSEEK", "OPENAI"]) ||
            acceptance.receipts?.length !== 6 ||
            acceptance.receipts.some((receipt) => receipt.status !== "EXECUTED") ||
            acceptance.lineage?.length !== 6 ||
            receiptIds.length !== 12 ||
            new Set(receiptIds).size !== 12 ||
            checkpoint.cells?.length !== 6 ||
            checkpoint.inFlight !== undefined ||
            checkpoint.runId !== acceptance.runId
          ) {
            throw new Error("ADK-06 live acceptance evidence is incomplete");
          }
          NODE

      - name: Write resumable workflow evidence metadata
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNTIME_ROOT/live-checkpoint.json" ]]; then
            exit 0
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = process.env.RUNTIME_ROOT;
          const checkpoint = JSON.parse(fs.readFileSync(path.join(root, "live-checkpoint.json"), "utf8"));
          const acceptancePath = path.join(root, "acceptance.json");
          const acceptance = fs.existsSync(acceptancePath)
            ? JSON.parse(fs.readFileSync(acceptancePath, "utf8"))
            : null;
          const metadata = {
            objectType: "ADK_LIVE_PROVIDER_WORKFLOW_EVIDENCE",
            protocolVersion: "1.2",
            repository: process.env.GITHUB_REPOSITORY,
            commitSha: process.env.GITHUB_SHA,
            expectedCommitSha: process.env.EXPECTED_COMMIT_SHA,
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            resumedFromRunId: process.env.RESUME_RUN_ID || null,
            issue: 405,
            pilotId: checkpoint.pilotId,
            approvalRef: checkpoint.approvalRef,
            assignmentIds: checkpoint.assignmentIds,
            providers: checkpoint.providers,
            runId: checkpoint.runId,
            durableCells: checkpoint.cells?.length ?? 0,
            inFlight: checkpoint.inFlight ?? null,
            finalizedArtifactReceipts:
              checkpoint.cells?.flatMap((cell) => [cell.rawProviderReceiptId, cell.markdownReceiptId])
                .length ?? 0,
            accepted: acceptance?.accepted === true,
            executionAttemptId: acceptance?.execution?.executionAttemptId ?? null,
            recordedAt: new Date().toISOString(),
          };
          fs.writeFileSync(
            path.join(root, "workflow-metadata.json"),
            `${JSON.stringify(metadata, null, 2)}\n`,
            { encoding: "utf8", flag: "wx", mode: 0o600 },
          );
          NODE

      - name: Encrypt durable or partial live evidence
        if: ${{ always() }}
        shell: bash
        env:
          ADK_LIVE_EVIDENCE_PASSPHRASE: ${{ secrets.ADK_LIVE_EVIDENCE_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNTIME_ROOT/live.sqlite" || ! -f "$RUNTIME_ROOT/live-checkpoint.json" ]]; then
            exit 0
          fi
          TAR_PATH="$RUNNER_TEMP/adk-06-live-evidence.tar.gz"
          ENCRYPTED_PATH="$EVIDENCE_ROOT/adk-06-live-evidence.aesgcm"
          files=(
            plan.json
            preparation-receipt.json
            runtime-secret.json
            live-checkpoint.json
            workflow-metadata.json
            live.sqlite
            artifacts
          )
          if [[ -f "$RUNTIME_ROOT/acceptance.json" ]]; then
            files+=(acceptance.json)
          fi
          tar -C "$RUNTIME_ROOT" -czf "$TAR_PATH" "${files[@]}"
          INPUT_PATH="$TAR_PATH" OUTPUT_PATH="$ENCRYPTED_PATH" node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const passphrase = process.env.ADK_LIVE_EVIDENCE_PASSPHRASE;
          if (!passphrase || passphrase.length < 32) throw new Error("evidence passphrase is unavailable");
          const plaintext = fs.readFileSync(process.env.INPUT_PATH);
          const salt = crypto.randomBytes(16);
          const iv = crypto.randomBytes(12);
          const key = crypto.scryptSync(passphrase, salt, 32);
          const cipher = crypto.createCipheriv("aes-256-gcm", key, iv);
          const ciphertext = Buffer.concat([cipher.update(plaintext), cipher.final()]);
          const tag = cipher.getAuthTag();
          const envelope = Buffer.concat([Buffer.from("MOADKAE1"), salt, iv, tag, ciphertext]);
          fs.writeFileSync(process.env.OUTPUT_PATH, envelope, { flag: "wx", mode: 0o600 });
          NODE
          INPUT_PATH="$ENCRYPTED_PATH" EXPECTED_PATH="$TAR_PATH" node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const passphrase = process.env.ADK_LIVE_EVIDENCE_PASSPHRASE;
          const envelope = fs.readFileSync(process.env.INPUT_PATH);
          if (envelope.subarray(0, 8).toString("utf8") !== "MOADKAE1") {
            throw new Error("invalid encrypted evidence envelope");
          }
          const salt = envelope.subarray(8, 24);
          const iv = envelope.subarray(24, 36);
          const tag = envelope.subarray(36, 52);
          const ciphertext = envelope.subarray(52);
          const key = crypto.scryptSync(passphrase, salt, 32);
          const decipher = crypto.createDecipheriv("aes-256-gcm", key, iv);
          decipher.setAuthTag(tag);
          const plaintext = Buffer.concat([decipher.update(ciphertext), decipher.final()]);
          const expected = fs.readFileSync(process.env.EXPECTED_PATH);
          if (
            !crypto.timingSafeEqual(
              crypto.createHash("sha256").update(plaintext).digest(),
              crypto.createHash("sha256").update(expected).digest(),
            )
          ) {
            throw new Error("encrypted evidence round-trip verification failed");
          }
          NODE
          INPUT_PATH="$ENCRYPTED_PATH" METADATA_PATH="$RUNTIME_ROOT/workflow-metadata.json" OUTPUT_PATH="$EVIDENCE_ROOT/evidence-manifest.json" node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");

          const encrypted = fs.readFileSync(process.env.INPUT_PATH);
          const metadata = JSON.parse(fs.readFileSync(process.env.METADATA_PATH, "utf8"));
          const manifest = {
            objectType: "ADK_LIVE_PROVIDER_ENCRYPTED_EVIDENCE_MANIFEST",
            protocolVersion: "1.2",
            repository: process.env.GITHUB_REPOSITORY,
            commitSha: process.env.GITHUB_SHA,
            expectedCommitSha: process.env.EXPECTED_COMMIT_SHA,
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            resumedFromRunId: process.env.RESUME_RUN_ID || null,
            issue: 405,
            runId: metadata.runId,
            durableCells: metadata.durableCells,
            inFlightRequiresReconciliation: metadata.inFlight !== null,
            accepted: metadata.accepted,
            cipher: "AES-256-GCM",
            kdf: "scrypt",
            envelopeVersion: "MOADKAE1",
            encryptedSha256: crypto.createHash("sha256").update(encrypted).digest("hex"),
            encryptedSizeBytes: encrypted.byteLength,
            recordedAt: new Date().toISOString(),
          };
          fs.writeFileSync(process.env.OUTPUT_PATH, `${JSON.stringify(manifest, null, 2)}\n`, {
            encoding: "utf8",
            flag: "wx",
            mode: 0o644,
          });
          NODE

      - name: Remove plaintext and transient secret material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf "$RUNTIME_ROOT"
          rm -rf "$RUNNER_TEMP/adk-live-resume"
          rm -f "$RUNNER_TEMP/adk-06-live-evidence.tar.gz" "$RUNNER_TEMP/adk-06-live-resume.tar.gz"

      - name: Upload encrypted durable live evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: adk-06-live-acceptance-encrypted-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: ignore
          path: |
            adk-live-evidence/adk-06-live-evidence.aesgcm
            adk-live-evidence/evidence-manifest.json
