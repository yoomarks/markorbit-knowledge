name: Agent Format PR12
on:
  push:
    branches: [agent/uspto-production-staging-ready-package]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uspto-production-staging-ready-package
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/admin/src/app/api/ready-packages/[id]/core-intake/route.ts
          apps/admin/src/app/api/ready-packages/[id]/route.ts
          apps/admin/src/app/api/worker/v1/conversion/run/[id]/route.ts
          apps/admin/src/server/production-conversion-worker-service.ts
          apps/admin/src/server/raw-artifact-conversion-authorization.ts
          apps/worker/src/bootstrap-uspto-conversion.ts
          docs/architecture/PRODUCTION_MARKDOWN_STAGING_READY_PACKAGE_V1.md
          packages/persistence/src/ready-package-registry.ts
          packages/worker-runtime/src/http-production-conversion-client.ts
          packages/worker-runtime/src/production-conversion-worker-runtime.ts
          packages/worker-runtime/src/production-markdown-staging.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add .
            git commit -m "chore: format production conversion increment"
            git push origin HEAD:agent/uspto-production-staging-ready-package
          fi
