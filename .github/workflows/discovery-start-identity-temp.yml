name: Temporary Discovery Start Identity Patch

on:
  push:
    branches: [codex/discovery-start-website-identity-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/discovery-start-website-identity-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply discovery start identity patch
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path("apps/admin/src/server/discovery-service.ts")
          text = service_path.read_text()

          marker = "\nfunction websiteSourceSlug(locator: string, identity: string): string {"
          helper = '''

          function findWebsiteSourceByIdentity(
            sources: SourceRepository,
            identity: string,
          ): SourceDefinition | null {
            let offset = 0;
            while (true) {
              const page = sources.list({ sourceType: "WEB", limit: 100, offset });
              const source =
                page.items.find(
                  (item) =>
                    item.status !== "ARCHIVED" &&
                    sourceWebsiteIdentities(item).includes(identity),
                ) ?? null;
              if (source) return source;
              offset += page.items.length;
              if (page.items.length === 0 || offset >= page.total) return null;
            }
          }
          '''
          text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              '''
          function belongsToOrigin(locator: string, origin: string): boolean {
            return websiteOrigin(locator) === origin;
          }
          ''',
              "",
              1,
          )

          text = text.replace(
              "      const seedOrigin = websiteOrigin(seed.locator);",
              '''      const seedOrigin = websiteOrigin(seed.locator);
              const seedIdentity = websiteIdentity(seed.locator);''',
              1,
          )
          text = text.replace(
              "        intake && belongsToOrigin(candidate.locator, seedOrigin)",
              "        intake && websiteIdentity(candidate.locator) === seedIdentity",
              1,
          )
          text = text.replace(
              '''      const profile = this.dependencies.graph.getProfileByCanonicalOrigin(
                DEFAULT_WORKSPACE.id,
                seedOrigin,
              );''',
              '''      const exactProfile = this.dependencies.graph.getProfileByCanonicalOrigin(
                DEFAULT_WORKSPACE.id,
                seedOrigin,
              );
              const identitySource = exactProfile
                ? null
                : findWebsiteSourceByIdentity(this.dependencies.sources, seedIdentity);
              const profile =
                exactProfile ??
                (identitySource
                  ? this.dependencies.graph.getProfileBySourceId(identitySource.id)
                  : null);''',
              1,
          )
          text = text.replace(
              '''          const graphCandidates = candidates.filter((candidate) =>
                    belongsToOrigin(candidate.locator, seedOrigin),
                  );''',
              '''          const graphCandidates = candidates.filter(
                    (candidate) => websiteIdentity(candidate.locator) === seedIdentity,
                  );''',
              1,
          )

          old_scan = '''    let identitySource: SourceDefinition | null = null;
              let sourceOffset = 0;
              while (!identitySource) {
                const page = this.dependencies.sources.list({
                  sourceType: "WEB",
                  limit: 100,
                  offset: sourceOffset,
                });
                identitySource =
                  page.items.find(
                    (source) =>
                      source.status !== "ARCHIVED" &&
                      sourceWebsiteIdentities(source).includes(candidateIdentity),
                  ) ?? null;
                sourceOffset += page.items.length;
                if (identitySource || page.items.length === 0 || sourceOffset >= page.total) break;
              }'''
          text = text.replace(
              old_scan,
              '''    const identitySource = findWebsiteSourceByIdentity(
                this.dependencies.sources,
                candidateIdentity,
              );''',
              1,
          )
          service_path.write_text(text)

          test_path = Path("apps/admin/src/server/__tests__/discovery-service.test.ts")
          test = test_path.read_text()
          test = test.replace(
              '''    const graph = new SqliteSourceGraphRepository(database);
              const service = new DiscoveryWorkflowService({''',
              '''    const graph = new SqliteSourceGraphRepository(database);
              let discoveryRun = 0;
              const service = new DiscoveryWorkflowService({''',
              1,
          )
          test = test.replace(
              '''        async discover(batch: SourceDiscoveryBatch) {
                    return [''',
              '''        async discover(batch: SourceDiscoveryBatch) {
                    discoveryRun += 1;
                    if (discoveryRun > 1) {
                      return [
                        {
                          candidateId: "cand_444444444444444444444444",
                          locator: "https://www.example.com/new-guidance",
                          title: "New guidance",
                          discoveredAt: "2026-08-08T02:00:00.000Z",
                          status: "DISCOVERED" as const,
                          discoveredFrom: batch.seeds[0]?.locator,
                          discoveryMethod: "HTML_LINK" as const,
                          depth: 1,
                          metadata: { kind: "PAGE" },
                        },
                      ];
                    }
                    return [''',
              1,
          )
          insertion = '''

              const repeat = await service.start({
                locator: "https://www.example.com/refresh",
                maxDepth: 1,
                maxCandidates: 10,
                intake: {
                  category: "OFFICIAL_GUIDANCE",
                  authorityLevel: "PRIMARY_OFFICIAL",
                  jurisdictions: ["US"],
                  languages: ["en"],
                  note: "Alias refresh",
                  tags: ["official"],
                },
              });
              expect(repeat.candidates[0]?.metadata?.operatorIntakeDefaults).toMatchObject({
                category: "OFFICIAL_GUIDANCE",
                authorityLevel: "PRIMARY_OFFICIAL",
                jurisdictions: ["US"],
                languages: ["en"],
              });
              const refreshedNode = profile
                ? graph.findNodeByIdentity(
                    profile.id,
                    "CANONICAL_URI",
                    "https://www.example.com/new-guidance",
                  )
                : null;
              expect(refreshedNode).not.toBeNull();
              expect(sources.list({ sourceType: "WEB", limit: 100 }).total).toBe(1);
          '''
          test = test.replace("\n    database.close();\n  });", insertion + "\n    database.close();\n  });", 1)
          test_path.write_text(test)
          PY
          pnpm exec prettier --write apps/admin/src/server/discovery-service.ts apps/admin/src/server/__tests__/discovery-service.test.ts
          git diff --check
          test -n "$(git status --porcelain apps/admin/src/server/discovery-service.ts apps/admin/src/server/__tests__/discovery-service.test.ts)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/discovery-service.ts apps/admin/src/server/__tests__/discovery-service.test.ts
          git commit -m "fix(discovery): carry website identity through discovery start"
          git push origin HEAD:codex/discovery-start-website-identity-v1
