name: K-CASE-008 Cross-Repo Live Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/k-case-008-cross-repo-live.yml"
      - ".github/workflows/markreg-core-contract-drift.yml"
      - "apps/admin/vitest.e2e.config.ts"
      - "apps/admin/src/app/api/internal/case-candidates/**"
      - "apps/admin/src/server/case-candidate-intake.ts"
      - "apps/admin/src/server/case-dossier-assembly-service.ts"
      - "apps/admin/src/server/case-dossier-privacy-service.ts"
      - "apps/admin/src/server/case-evidence-collection-service.ts"
      - "apps/admin/src/server/case-live-acceptance-service.ts"
      - "apps/admin/src/server/case-producer-auth.ts"
      - "apps/admin/src/server/markreg-case-source-resolver.ts"
      - "apps/admin/src/server/e2e/k-case-008-real-markreg.e2e.ts"
      - "packages/contracts/src/case-*.ts"
      - "packages/persistence/src/case-*.ts"
      - "packages/worker-runtime/src/markreg-case-evidence-collector.ts"

permissions:
  contents: read

env:
  CORE_REF: 6a33f3d9f0a68102cd08a538944af2e3f50ac549
  MARKREG_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/markorbit_kcase008
  MARKREG_MIGRATION_NAMESPACE: markreg_kcase008
  MO_INTERNAL_SERVICE_SECRET: markorbit-k-case-008-shared-secret-0001
  MARKREG_URL: http://127.0.0.1:4105
  KNOWLEDGE_URL: http://127.0.0.1:3100
  MARKORBIT_KCASE_WORKSPACE_ID: 77777777-7777-4777-8777-777777777777
  MARKORBIT_KCASE_FORMAL_MATTER_ID: formal-matter_kcase008live

jobs:
  core-ref-freshness:
    runs-on: ubuntu-24.04
    steps:
      - name: Require exact audited Core main
        shell: bash
        run: |
          current_core_ref="$(git ls-remote https://github.com/yoomarks/markorbit.git refs/heads/main | awk '{print $1}')"
          test -n "$current_core_ref"
          echo "Current Core main: $current_core_ref"
          echo "Pinned Core ref:    $CORE_REF"
          if [ "$current_core_ref" != "$CORE_REF" ]; then
            echo "::error::K-CASE-008 Core pin is stale; audit the new main before rerunning LIVE acceptance."
            exit 1
          fi

  k-case-008-live:
    needs: core-ref-freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: markorbit_kcase008
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d markorbit_kcase008"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout Knowledge
        uses: actions/checkout@v4
      - name: Checkout exact Core producer
        uses: actions/checkout@v4
        with:
          repository: yoomarks/markorbit
          ref: ${{ env.CORE_REF }}
          path: .e2e/markorbit-core
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Knowledge dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Core dependencies
        working-directory: .e2e/markorbit-core
        run: pnpm install --frozen-lockfile
      - name: Build Knowledge Admin dependency closure
        run: pnpm --filter @markorbit/admin... build
      - name: Build Core MarkReg dependency closure
        working-directory: .e2e/markorbit-core
        run: pnpm exec turbo run build --filter=@markorbit/markreg-service...
      - name: Bootstrap durable MarkReg Formal Matter and principals
        working-directory: .e2e/markorbit-core
        env:
          DATABASE_URL: ${{ env.MARKREG_DATABASE_URL }}
          DB_MIGRATION_NAMESPACE: ${{ env.MARKREG_MIGRATION_NAMESPACE }}
          DB_APPLICATION_NAME: k-case-008-bootstrap
          KCASE_BOOTSTRAP_PATH: ${{ runner.temp }}/kcase-bootstrap.json
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          import path from 'node:path';
          import {
            ManagedDatabase,
            loadMigrationsForOwner,
            migrate,
            parseDatabaseConfig,
          } from './packages/persistence/dist/index.js';
          import { encodeInternalWorkspacePrincipal } from './packages/contracts/dist/index.js';
          import {
            PostgresFormalMatterRepository,
            canonicalFormalMatterSnapshot,
          } from './services/markreg/dist/index.js';

          const workspaceId = process.env.MARKORBIT_KCASE_WORKSPACE_ID;
          const formalMatterId = process.env.MARKORBIT_KCASE_FORMAL_MATTER_ID;
          const outputPath = process.env.KCASE_BOOTSTRAP_PATH;
          if (!workspaceId || !formalMatterId || !outputPath) throw new Error('K-CASE bootstrap env is incomplete');

          const database = new ManagedDatabase(parseDatabaseConfig(process.env));
          await database.start();
          try {
            const migrations = await loadMigrationsForOwner(
              path.resolve('infrastructure/persistence/migrations'),
              path.resolve('infrastructure/persistence/migration-owners.json'),
              '@markorbit/markreg-service',
            );
            await migrate(database.getPool(), process.env.DB_MIGRATION_NAMESPACE, migrations);

            const sourceSnapshot = {
              schemaVersion: 1,
              customerConfirmation: { id: 'confirmation_kcase008live', version: 1, status: 'CONFIRMED' },
              quote: { id: 'quote_kcase008live', version: 'quote-v1', currency: 'USD', totalMinor: 29900 },
              matterDraft: {
                id: 'matter-draft_kcase008live',
                version: 1,
                status: 'READY_FOR_PROFESSIONAL_REVIEW',
                readiness: {
                  evaluatedAt: '2026-08-26T07:30:00.000Z',
                  readyForProfessionalReview: true,
                  checks: [],
                },
              },
              preparation: {
                applicantName: 'Orbit Live Acceptance Ltd',
                trademark: 'ORBIT LIVE',
                classes: [9],
                documentReferences: [],
              },
            };
            const snapshotSha256 = createHash('sha256')
              .update(canonicalFormalMatterSnapshot(sourceSnapshot), 'utf8')
              .digest('hex');
            const matter = {
              schemaVersion: 1,
              formalMatterId,
              workspaceId,
              kind: 'TRADEMARK_REGISTRATION',
              status: 'OPEN',
              version: 1,
              sourceCustomerConfirmationId: 'confirmation_kcase008live',
              sourceCustomerConfirmationVersion: 1,
              sourceMatterDraftId: 'matter-draft_kcase008live',
              sourceMatterDraftVersion: 1,
              sourceQuoteId: 'quote_kcase008live',
              sourceQuoteVersion: 'quote-v1',
              sourceSnapshot,
              snapshotSchemaVersion: 1,
              snapshotSha256,
              createdByUserId: 'user_kcase008_operator',
              createdAt: '2026-08-26T07:30:00.000Z',
              updatedAt: '2026-08-26T07:30:00.000Z',
            };
            const repo = new PostgresFormalMatterRepository(database, database.getPool());
            await repo.createAtomically(
              matter,
              'k-case-008-formal-matter-create',
              createHash('sha256').update(JSON.stringify(matter)).digest('hex'),
              {
                workspaceId,
                formalMatterId,
                action: 'FORMAL_MATTER_CREATED',
                actorId: 'user_kcase008_operator',
                createdAt: matter.createdAt,
              },
            );

            const principal = {
              kind: 'WORKSPACE',
              sessionId: 'session_kcase008_live',
              userId: 'user_kcase008_operator',
              workspaceId,
              membershipId: 'membership_kcase008_operator',
              role: 'WORKSPACE_ADMIN',
              permissions: ['matter:read', 'matter:promote-knowledge'],
              sessionExpiresAt: '2030-01-01T00:00:00.000Z',
            };
            const wrongPrincipal = {
              ...principal,
              sessionId: 'session_kcase008_wrong_workspace',
              workspaceId: '88888888-8888-4888-8888-888888888888',
              membershipId: 'membership_kcase008_wrong_workspace',
            };
            writeFileSync(
              outputPath,
              JSON.stringify({
                workspaceId,
                formalMatterId,
                snapshotSha256,
                principal: encodeInternalWorkspacePrincipal(principal),
                wrongPrincipal: encodeInternalWorkspacePrincipal(wrongPrincipal),
              }),
            );
          } finally {
            await database.close();
          }
          NODE
          echo "MARKORBIT_KCASE_PRINCIPAL=$(jq -r .principal "$KCASE_BOOTSTRAP_PATH")" >> "$GITHUB_ENV"
          echo "MARKORBIT_KCASE_WRONG_PRINCIPAL=$(jq -r .wrongPrincipal "$KCASE_BOOTSTRAP_PATH")" >> "$GITHUB_ENV"
      - name: Start real Knowledge Admin receiver
        env:
          PORT: 3100
          MARKORBIT_REPOSITORY_ROOT: ${{ github.workspace }}
          MARKORBIT_KNOWLEDGE_DB_PATH: ${{ runner.temp }}/kcase-knowledge.sqlite
        run: |
          pnpm --filter @markorbit/admin start > "$RUNNER_TEMP/kcase-knowledge.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/kcase-knowledge.pid"
          for attempt in $(seq 1 40); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' "$KNOWLEDGE_URL/api/internal/case-candidates" || true)
            if [ "$status" = "405" ]; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/kcase-knowledge.log"
          exit 1
      - name: Start real MarkReg producer and trusted source surface
        working-directory: .e2e/markorbit-core
        env:
          PORT: 4105
          DATABASE_URL: ${{ env.MARKREG_DATABASE_URL }}
          DB_MIGRATION_NAMESPACE: ${{ env.MARKREG_MIGRATION_NAMESPACE }}
          DB_APPLICATION_NAME: k-case-008-markreg-runtime
          MO_KNOWLEDGE_CASE_PROMOTION_ENABLED: "1"
          EXECUTION_URL: http://127.0.0.1:4198
          LITE_URL: http://127.0.0.1:4199
        run: |
          pnpm --filter @markorbit/markreg-service start > "$RUNNER_TEMP/kcase-markreg.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/kcase-markreg.pid"
          for attempt in $(seq 1 40); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "x-markorbit-internal-authorization: $MO_INTERNAL_SERVICE_SECRET" \
              -H "x-markorbit-principal: $MARKORBIT_KCASE_PRINCIPAL" \
              -H "x-markorbit-workspace-id: $MARKORBIT_KCASE_WORKSPACE_ID" \
              "$MARKREG_URL/v1/formal-matters/$MARKORBIT_KCASE_FORMAL_MATTER_ID" || true)
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/kcase-markreg.log"
          exit 1
      - name: Prove fail-closed auth, real promotion and durable replay
        shell: bash
        run: |
          promotion_url="$MARKREG_URL/v1/formal-matters/$MARKORBIT_KCASE_FORMAL_MATTER_ID/knowledge-case-promotions"
          body='{"classification":"CONFIDENTIAL","operatorCaseValueNote":"K-CASE-008 exact-head cross-repository LIVE acceptance"}'
          result_path="$RUNNER_TEMP/kcase-promotion.json"

          unauthorized=$(curl -sS -o "$RUNNER_TEMP/kcase-unauthorized.json" -w '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            -H 'x-markorbit-internal-authorization: invalid-secret' \
            -H "x-markorbit-principal: $MARKORBIT_KCASE_PRINCIPAL" \
            -H 'idempotency-key: k-case-008-unauthorized' \
            --data "$body" "$promotion_url")
          test "$unauthorized" = "401"

          cross_workspace=$(curl -sS -o "$RUNNER_TEMP/kcase-cross-workspace.json" -w '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            -H "x-markorbit-internal-authorization: $MO_INTERNAL_SERVICE_SECRET" \
            -H "x-markorbit-principal: $MARKORBIT_KCASE_WRONG_PRINCIPAL" \
            -H 'idempotency-key: k-case-008-cross-workspace' \
            --data "$body" "$promotion_url")
          test "$cross_workspace" = "404"

          first=$(curl -sS -o "$result_path" -w '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            -H "x-markorbit-internal-authorization: $MO_INTERNAL_SERVICE_SECRET" \
            -H "x-markorbit-principal: $MARKORBIT_KCASE_PRINCIPAL" \
            -H 'idempotency-key: k-case-008-live-0001' \
            --data "$body" "$promotion_url")
          if [ "$first" != "202" ]; then
            cat "$result_path"
            exit 1
          fi
          jq -e '.delivery == {state:"ACCEPTED",replayed:false}' "$result_path"
          jq -e '.producerPromotionRef | test("^markreg:case-promotion:v1:[0-9a-f]{64}$")' "$result_path"
          jq -e --arg matter "$MARKORBIT_KCASE_FORMAL_MATTER_ID" '.candidate.sourceMatterId == $matter' "$result_path"
          jq -e --arg workspace "$MARKORBIT_KCASE_WORKSPACE_ID" '.candidate.accessScope.sourceWorkspaceId == $workspace' "$result_path"

          replay_path="$RUNNER_TEMP/kcase-promotion-replay.json"
          replay=$(curl -sS -o "$replay_path" -w '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            -H "x-markorbit-internal-authorization: $MO_INTERNAL_SERVICE_SECRET" \
            -H "x-markorbit-principal: $MARKORBIT_KCASE_PRINCIPAL" \
            -H 'idempotency-key: k-case-008-live-0001' \
            --data "$body" "$promotion_url")
          test "$replay" = "200"
          jq -e '.delivery == {state:"ACCEPTED",replayed:true}' "$replay_path"
          test "$(jq -r .producerPromotionRef "$result_path")" = "$(jq -r .producerPromotionRef "$replay_path")"
          test "$(jq -c .candidate "$result_path")" = "$(jq -c .candidate "$replay_path")"

          echo "MARKORBIT_KCASE_PROMOTION_RESULT_PATH=$result_path" >> "$GITHUB_ENV"
      - name: Run K-CASE-008 LIVE service acceptance over default HTTP
        env:
          MARKORBIT_REPOSITORY_ROOT: ${{ github.workspace }}
          MARKORBIT_KNOWLEDGE_DB_PATH: ${{ runner.temp }}/kcase-knowledge.sqlite
        run: >-
          pnpm --filter @markorbit/admin exec vitest run
          --config vitest.e2e.config.ts
          src/server/e2e/k-case-008-real-markreg.e2e.ts
      - name: Assert one durable completed producer action
        working-directory: .e2e/markorbit-core
        env:
          DATABASE_URL: ${{ env.MARKREG_DATABASE_URL }}
          DB_MIGRATION_NAMESPACE: ${{ env.MARKREG_MIGRATION_NAMESPACE }}
          DB_APPLICATION_NAME: k-case-008-durable-assert
        run: |
          node --input-type=module <<'NODE'
          import { ManagedDatabase, parseDatabaseConfig } from './packages/persistence/dist/index.js';
          const database = new ManagedDatabase(parseDatabaseConfig(process.env));
          await database.start();
          try {
            const result = await database.getPool().query(
              `SELECT p.state,
                      count(*) OVER ()::int AS promotion_count,
                      (SELECT count(*)::int FROM markreg_knowledge_case_promotion_commands) AS command_count
                 FROM markreg_knowledge_case_promotions p`,
            );
            if (result.rowCount !== 1) throw new Error(`expected one promotion row, got ${result.rowCount}`);
            const row = result.rows[0];
            if (row.state !== 'COMPLETED' || row.promotion_count !== 1 || row.command_count !== 1) {
              throw new Error(`unexpected durable promotion state: ${JSON.stringify(row)}`);
            }
          } finally {
            await database.close();
          }
          NODE
      - name: Knowledge log
        if: always()
        run: cat "$RUNNER_TEMP/kcase-knowledge.log" || true
      - name: MarkReg log
        if: always()
        run: cat "$RUNNER_TEMP/kcase-markreg.log" || true
      - name: Stop acceptance services
        if: always()
        run: |
          for pidfile in "$RUNNER_TEMP/kcase-knowledge.pid" "$RUNNER_TEMP/kcase-markreg.pid"; do
            if [ -f "$pidfile" ]; then kill "$(cat "$pidfile")" || true; fi
          done
