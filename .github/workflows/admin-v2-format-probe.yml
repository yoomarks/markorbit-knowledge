name: Admin V2 Format Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write apps/admin/src/components/sources/source-file-import.tsx apps/admin/src/server/manual-upload-ingestion.ts
          git diff -- apps/admin/src/components/sources/source-file-import.tsx apps/admin/src/server/manual-upload-ingestion.ts
