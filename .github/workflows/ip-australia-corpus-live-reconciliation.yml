name: IP Australia Corpus Live Reconciliation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ip-australia-corpus-live-reconciliation.yml
      - apps/worker/src/ip-australia-trademark-corpus-discovery.ts
      - apps/worker/src/ip-australia-corpus-reconciliation.ts
      - apps/worker/src/reconcile-ip-australia-corpus.ts
      - apps/worker/src/ip-australia-golden-corpus.ts
      - apps/worker/package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: ip-australia-corpus-live-reconciliation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Reconcile live IP Australia corpus
        id: reconcile
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/ip-australia-corpus-reconciliation"
          pnpm --filter @markorbit/worker reconcile:ip-australia-corpus \
            > "$RUNNER_TEMP/ip-australia-corpus-reconciliation/report.json"
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          node -e '
            const fs = require("fs");
            const path = process.env.RUNNER_TEMP + "/ip-australia-corpus-reconciliation/report.json";
            const report = JSON.parse(fs.readFileSync(path, "utf8"));
            const lines = [
              "## IP Australia Corpus Live Reconciliation",
              "",
              `- Seeds: ${report.successfulSeedCount}/${report.seedCount} reachable`,
              `- Discovered links: ${report.discoveredLinkCount}`,
              `- Referenced assets: ${report.referencedAssetCount}`,
              `- Failed seeds: ${report.failedSeedCount}`,
              `- Journey gaps: ${report.journeyGapCount}`,
              "",
              "### Journey integrity",
              "",
              ...report.journey.map((stage) => `- ${stage.domain}: ${stage.state} (links=${stage.discoveredLinkCount})`),
            ];
            fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n", { flag: "a" });
          '
          exit 0

      - name: Upload IP Australia corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ip-australia-corpus-live-reconciliation-${{ github.run_id }}
          path: ${{ runner.temp }}/ip-australia-corpus-reconciliation/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce reconciliation result
        if: always()
        shell: bash
        run: exit "${{ steps.reconcile.outputs.exit_code }}"
