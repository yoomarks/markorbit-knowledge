name: ADK-11 Format Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-diagnostic:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            packages/contracts/src/ai-source-pack-v1.ts \
            packages/contracts/src/ai-source-pack-v1.test.ts
          git diff -- \
            packages/contracts/src/ai-source-pack-v1.ts \
            packages/contracts/src/ai-source-pack-v1.test.ts
          test -z "$(git status --porcelain -- packages/contracts/src/ai-source-pack-v1.ts packages/contracts/src/ai-source-pack-v1.test.ts)"
