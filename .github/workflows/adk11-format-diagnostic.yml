name: ADK-11 Format Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-diagnostic:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit exact Prettier output
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            packages/contracts/src/ai-source-pack-v1.ts \
            packages/contracts/src/ai-source-pack-v1.test.ts
          if git diff --quiet -- \
            packages/contracts/src/ai-source-pack-v1.ts \
            packages/contracts/src/ai-source-pack-v1.test.ts; then
            echo "ADK-11 files already match Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/contracts/src/ai-source-pack-v1.ts \
            packages/contracts/src/ai-source-pack-v1.test.ts
          git commit -m "style: apply exact Prettier output for ADK-11"
          git push origin HEAD:${{ github.head_ref }}
