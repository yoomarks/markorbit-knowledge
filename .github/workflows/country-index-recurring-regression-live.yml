name: Country Index Recurring Regression Live

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/country-index-recurring-regression-live.yml
      - apps/admin/src/server/acquisition-recurring-regression.ts
      - apps/admin/src/server/acquisition-recurring-regression.test.ts
      - scripts/acquisition-recurring-regression-canary.ts
      - apps/worker/src/country-index-public-inventory.ts
      - apps/worker/src/discover-country-index-public.ts
      - apps/worker/src/live-acquisition-learning-persistence.ts
      - apps/worker/src/live-acquisition-profile-evidence.ts
      - apps/worker/src/acquisition-learning-profiles.ts
      - packages/worker-runtime/src/acquisition-learning-profile.ts
      - packages/persistence/src/acquisition-intelligence-registry.ts
      - packages/persistence/src/acquisition-learning-loop.ts
      - apps/worker/package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  recurring-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure isolated learning registry
        run: echo "MARKORBIT_KNOWLEDGE_DB_PATH=$RUNNER_TEMP/country-index-recurring-regression.sqlite" >> "$GITHUB_ENV"

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Run real baseline country-index acquisition
        run: |
          mkdir -p "$RUNNER_TEMP/country-index-regression"
          pnpm --filter @markorbit/worker discover:country-index \
            > "$RUNNER_TEMP/country-index-regression/baseline.json"

      - name: Run real current country-index acquisition
        run: |
          pnpm --filter @markorbit/worker discover:country-index \
            > "$RUNNER_TEMP/country-index-regression/current.json"

      - name: Compare recurring acquisition evidence
        run: |
          pnpm exec tsx scripts/acquisition-recurring-regression-canary.ts \
            --baseline "$RUNNER_TEMP/country-index-regression/baseline.json" \
            --current "$RUNNER_TEMP/country-index-regression/current.json" \
            --output "$RUNNER_TEMP/country-index-regression/regression.json"

      - name: Verify persisted two-run evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { DatabaseSync } = require('node:sqlite');
          const baseline = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/country-index-regression/baseline.json', 'utf8'));
          const current = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/country-index-regression/current.json', 'utf8'));
          const regression = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/country-index-regression/regression.json', 'utf8'));
          const baselineRunId = baseline.acquisitionLearning?.evidence?.runId;
          const currentRunId = current.acquisitionLearning?.evidence?.runId;
          if (!baselineRunId || !currentRunId || baselineRunId === currentRunId) {
            throw new Error('Recurring canary did not produce two distinct acquisition runs');
          }
          if (regression.baselineRunId !== baselineRunId || regression.currentRunId !== currentRunId) {
            throw new Error('Regression evidence is not bound to both real run identities');
          }
          if (!['UNCHANGED', 'EXPECTED_CHANGE'].includes(regression.state)) {
            throw new Error(`Unexpected recurring canary state: ${regression.state}`);
          }
          if (regression.boundaries?.autoPromotionApplied !== false || regression.boundaries?.collectionAuthorityGranted !== false) {
            throw new Error('Recurring regression crossed an acquisition governance boundary');
          }
          const database = new DatabaseSync(process.env.MARKORBIT_KNOWLEDGE_DB_PATH, { readOnly: true });
          try {
            const rows = database.prepare(
              'SELECT run_id, source_id, playbook_id, playbook_revision, outcome FROM acquisition_run_evidence WHERE run_id IN (?, ?) ORDER BY run_id'
            ).all(baselineRunId, currentRunId);
            if (rows.length !== 2 || rows.some((row) => row.playbook_id !== 'official-jurisdiction-index' || row.playbook_revision !== 1 || row.outcome !== 'SUCCESS')) {
              throw new Error(`Persisted recurring evidence is invalid: ${JSON.stringify(rows)}`);
            }
          } finally {
            database.close();
          }
          NODE

      - name: Upload recurring regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: country-index-recurring-regression-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/country-index-regression/baseline.json
            ${{ runner.temp }}/country-index-regression/current.json
            ${{ runner.temp }}/country-index-regression/regression.json
            ${{ runner.temp }}/country-index-recurring-regression.sqlite
          if-no-files-found: warn
          retention-days: 30
