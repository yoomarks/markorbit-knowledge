name: M9 Format

on:
  push:
    branches:
      - agent/acquisition-conversion-handoff

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'M9 format acquisition handoff') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/acquisition-conversion-handoff
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/admin/src/app/api/worker/v1/artifacts/sessions/[id]/finalize/route.ts
          apps/admin/src/server/raw-artifact-auto-conversion.ts
          apps/admin/src/server/raw-artifact-conversion-authorization.ts
          apps/worker/src/bootstrap-source-coverage.ts
          apps/worker/src/source-supply-conversion.ts
          apps/worker/tests/source-supply-conversion.test.ts
          docs/architecture/M9_ACQUISITION_CONVERSION_HANDOFF.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/app/api/worker/v1/artifacts/sessions/[id]/finalize/route.ts apps/admin/src/server/raw-artifact-auto-conversion.ts apps/admin/src/server/raw-artifact-conversion-authorization.ts apps/worker/src/bootstrap-source-coverage.ts apps/worker/src/source-supply-conversion.ts apps/worker/tests/source-supply-conversion.test.ts docs/architecture/M9_ACQUISITION_CONVERSION_HANDOFF.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "M9 format acquisition handoff"
          git push
