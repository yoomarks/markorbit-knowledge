name: Temporary Retrieval 562 Formatter

on:
  push:
    branches:
      - retrieval/562-multisource-measurement
    paths:
      - .github/workflows/tmp-format-562.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: retrieval/562-multisource-measurement
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format retrieval Phase 2 files
        run: >-
          pnpm exec prettier --write
          apps/admin/src/server/knowledge-retrieval-evaluation-runner.test.ts
          apps/admin/src/server/knowledge-retrieval-evaluation.ts
          apps/admin/src/server/knowledge-retrieval-phase2-corpus.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/knowledge-retrieval-evaluation-runner.test.ts apps/admin/src/server/knowledge-retrieval-evaluation.ts apps/admin/src/server/knowledge-retrieval-phase2-corpus.ts
          git commit -m "style: format retrieval phase2 measurement"
          git push origin HEAD:retrieval/562-multisource-measurement
