name: Format change-watch efficiency files

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/change-watch-efficiency-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/admin/src/components/sources/source-change-watch-efficiency.tsx apps/admin/src/server/__tests__/source-change-watch-efficiency.test.ts
      - name: Commit formatted files and remove helper
        shell: bash
        run: |
          rm .github/workflows/change-watch-efficiency-format.yml
          git config user.name "markorbit-ci"
          git config user.email "ci@markorbit.invalid"
          git add -A
          git commit -m "style: format change-watch efficiency"
          git push origin HEAD:agent/change-watch-efficiency-v1
