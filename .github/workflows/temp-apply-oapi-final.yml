name: Temporary Apply OAPI Final

on:
  push:
    branches:
      - agent/priority-120-oapi-ci-cm-sn-v1

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/priority-120-oapi-ci-cm-sn-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply OAPI regional integration patch
        run: python .github/scripts/temp_apply_oapi_final.py
      - name: Format production and tests
        run: |
          pnpm exec prettier --write \
            packages/persistence/src/priority-regional-source-coverage.ts \
            packages/persistence/src/source-coverage-catalog.ts \
            packages/persistence/src/priority-trademark-jurisdictions.ts \
            packages/persistence/src/retrieval-relevance-audit.ts \
            packages/persistence/tests/priority-regional-source-coverage.test.ts \
            packages/persistence/tests/priority-trademark-jurisdictions.test.ts \
            packages/persistence/tests/retrieval-relevance-audit.test.ts
      - name: Verify final 120 jurisdiction coverage
        run: |
          pnpm --filter @markorbit/persistence test -- \
            tests/priority-regional-source-coverage.test.ts \
            tests/priority-trademark-jurisdictions.test.ts \
            tests/retrieval-relevance-audit.test.ts \
            tests/source-coverage-catalog.test.ts \
            tests/priority-national-source-coverage.test.ts
          pnpm typecheck
          pnpm lint
      - name: Commit integrated production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/persistence/src/priority-regional-source-coverage.ts \
            packages/persistence/src/source-coverage-catalog.ts \
            packages/persistence/src/priority-trademark-jurisdictions.ts \
            packages/persistence/src/retrieval-relevance-audit.ts \
            packages/persistence/tests/priority-regional-source-coverage.test.ts \
            packages/persistence/tests/priority-trademark-jurisdictions.test.ts \
            packages/persistence/tests/retrieval-relevance-audit.test.ts
          git commit -m "feat: complete OAPI regional trademark coverage"
          git push origin HEAD:agent/priority-120-oapi-ci-cm-sn-v1
