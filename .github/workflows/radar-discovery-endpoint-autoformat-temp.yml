name: Radar Discovery Endpoint Autoformat Temp

on:
  push:
    branches: [agent/radar-discovery-intake-v1]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/radar-discovery-intake-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Radar endpoint identity files
        run: |
          pnpm exec prettier --write packages/persistence/src/radar-source-discovery-intake.ts packages/persistence/tests/radar-source-discovery-intake.test.ts
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/radar-source-discovery-intake.ts packages/persistence/tests/radar-source-discovery-intake.test.ts
          git commit -m "style: format Radar endpoint identity"
          git push origin HEAD:agent/radar-discovery-intake-v1
