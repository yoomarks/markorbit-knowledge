name: M21 Format

on:
  push:
    branches:
      - m21-foundational-remediation-queue-api

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m21-foundational-remediation-queue-api
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          packages/worker-runtime/src/foundational-readiness.ts
          packages/worker-runtime/src/foundational-remediation-queue.ts
          packages/worker-runtime/package.json
          apps/worker/src/source-foundational-readiness.ts
          apps/worker/src/foundational-remediation-queue.ts
          apps/admin/src/server/foundational-remediation-queue.ts
          apps/admin/src/app/api/foundational/remediation-queue/route.ts
          apps/admin/src/server/__tests__/foundational-remediation-queue.test.ts
          docs/architecture/M21_FOUNDATIONAL_REMEDIATION_QUEUE_API.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/worker-runtime/src/foundational-readiness.ts packages/worker-runtime/src/foundational-remediation-queue.ts packages/worker-runtime/package.json apps/worker/src/source-foundational-readiness.ts apps/worker/src/foundational-remediation-queue.ts apps/admin/src/server/foundational-remediation-queue.ts apps/admin/src/app/api/foundational/remediation-queue/route.ts apps/admin/src/server/__tests__/foundational-remediation-queue.test.ts docs/architecture/M21_FOUNDATIONAL_REMEDIATION_QUEUE_API.md
          git commit -m "chore: format M21 remediation queue API"
          git push origin HEAD:m21-foundational-remediation-queue-api
