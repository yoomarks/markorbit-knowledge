name: Temporary optimize web domain throttle

on:
  push:
    branches:
      - codex/worker-web-domain-throttle-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/worker-web-domain-throttle-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Optimize domain quota lookup
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new))

          path = "packages/persistence/src/worker-registry.ts"
          replace(
              path,
              '''function webDomainKey(job: Job): string | null {\n''',
              '''type WebDomainLeaseState = {\n  active: number;\n  recent: number;\n  minRateLimit: number;\n};\n\nfunction webDomainKey(job: Job): string | null {\n''',
          )
          replace(
              path,
              '''      const job = candidates.find(\n        (candidate) =>\n          candidate.workspaceId === worker.workspaceId &&\n          workerCanRun(worker, candidate) &&\n          this.webDomainQuotaAllows(candidate, now),\n      );\n''',
              '''      const webDomainLeaseState = this.webDomainLeaseState(now);\n      const job = candidates.find(\n        (candidate) =>\n          candidate.workspaceId === worker.workspaceId &&\n          workerCanRun(worker, candidate) &&\n          this.webDomainQuotaAllows(candidate, webDomainLeaseState),\n      );\n''',
          )
          old_method = '''  private webDomainQuotaAllows(job: Job, now: Date): boolean {\n    const domain = webDomainKey(job);\n    if (!domain) return true;\n\n    const windowStart = new Date(now.getTime() - 60_000).toISOString();\n    const rows = this.database\n      .prepare(\n        `SELECT l.status, l.acquired_at, j.document_json\n         FROM job_leases l\n         JOIN jobs j ON j.id = l.job_id\n         WHERE l.status = 'ACTIVE' OR l.acquired_at >= ?`,\n      )\n      .all(windowStart) as Array<{\n      status: JobLeaseStatus;\n      acquired_at: string;\n      document_json: string;\n    }>;\n\n    let active = 0;\n    let recent = 0;\n    let effectiveRateLimit = job.planSnapshot.policy.rateLimitPerMinute;\n    for (const row of rows) {\n      const leasedJob = parseJob(row.document_json);\n      if (webDomainKey(leasedJob) !== domain) continue;\n      effectiveRateLimit = Math.min(\n        effectiveRateLimit,\n        leasedJob.planSnapshot.policy.rateLimitPerMinute,\n      );\n      if (row.status === "ACTIVE") active += 1;\n      if (row.acquired_at >= windowStart) recent += 1;\n    }\n\n    return active < this.maxConcurrentWebLeasesPerDomain && recent < effectiveRateLimit;\n  }\n'''
          new_method = '''  private webDomainLeaseState(now: Date): Map<string, WebDomainLeaseState> {\n    const windowStart = new Date(now.getTime() - 60_000).toISOString();\n    const rows = this.database\n      .prepare(\n        `SELECT l.status, l.acquired_at, j.document_json\n         FROM job_leases l\n         JOIN jobs j ON j.id = l.job_id\n         WHERE l.status = 'ACTIVE' OR l.acquired_at >= ?`,\n      )\n      .all(windowStart) as Array<{\n      status: JobLeaseStatus;\n      acquired_at: string;\n      document_json: string;\n    }>;\n    const state = new Map<string, WebDomainLeaseState>();\n    for (const row of rows) {\n      const leasedJob = parseJob(row.document_json);\n      const domain = webDomainKey(leasedJob);\n      if (!domain) continue;\n      const current = state.get(domain) ?? {\n        active: 0,\n        recent: 0,\n        minRateLimit: Number.POSITIVE_INFINITY,\n      };\n      current.minRateLimit = Math.min(\n        current.minRateLimit,\n        leasedJob.planSnapshot.policy.rateLimitPerMinute,\n      );\n      if (row.status === "ACTIVE") current.active += 1;\n      if (row.acquired_at >= windowStart) current.recent += 1;\n      state.set(domain, current);\n    }\n    return state;\n  }\n\n  private webDomainQuotaAllows(\n    job: Job,\n    state: Map<string, WebDomainLeaseState>,\n  ): boolean {\n    const domain = webDomainKey(job);\n    if (!domain) return true;\n    const current = state.get(domain);\n    if (!current) return true;\n    const effectiveRateLimit = Math.min(\n      job.planSnapshot.policy.rateLimitPerMinute,\n      current.minRateLimit,\n    );\n    return (\n      current.active < this.maxConcurrentWebLeasesPerDomain &&\n      current.recent < effectiveRateLimit\n    );\n  }\n'''
          replace(path, old_method, new_method)

          test_path = "packages/persistence/tests/worker-registry.test.ts"
          test = Path(test_path)
          text = test.read_text()
          text = text.replace('''    expect(env.runs.getById(aliasPlan.plan.sourceId)).toBeNull();\n''', '')
          test.write_text(text)
      - name: Format changed files
        run: pnpm exec prettier --write packages/persistence/src/worker-registry.ts packages/persistence/tests/worker-registry.test.ts
      - name: Targeted checks
        run: |
          pnpm --filter @markorbit/persistence test -- worker-registry.test.ts
          pnpm --filter @markorbit/persistence typecheck
      - name: Commit optimization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/persistence/src/worker-registry.ts packages/persistence/tests/worker-registry.test.ts
          git commit -m "Worker: snapshot web domain quota once per claim"
          git push origin HEAD:codex/worker-web-domain-throttle-v1
