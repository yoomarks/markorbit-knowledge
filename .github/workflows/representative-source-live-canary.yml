name: Representative Source Live Canary

on:
  workflow_dispatch:
    inputs:
      jurisdiction:
        description: Optional representative jurisdiction code (for example CN, JP, KR, NL, CI)
        required: false
        type: string
      strict:
        description: Fail the workflow if any selected live canary fails
        required: true
        default: true
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/representative-source-live-canary.yml
      - apps/worker/src/run-representative-live-canaries.ts
      - apps/worker/package.json
      - packages/persistence/src/representative-source-live-canaries.ts
      - packages/persistence/src/representative-source-live-canaries.test.ts
      - packages/persistence/package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: representative-source-live-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe-pr:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        jurisdiction: [CN, US, IN, JP, KR, GB, CA, AU, BR, AE, NL, CI]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MARKORBIT_CRAWL4AI_PYTHON: python
      MARKORBIT_LIVE_CANARY_TIMEOUT_SECONDS: "75"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure canary paths
        run: |
          echo "MARKORBIT_CRAWL4AI_SCRIPT=$GITHUB_WORKSPACE/workers/crawl4ai/acquire.py" >> "$GITHUB_ENV"
          echo "MARKORBIT_LIVE_CANARY_OUTPUT_DIR=$RUNNER_TEMP/representative-live-canary" >> "$GITHUB_ENV"

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install production Crawl4AI runtime
        run: |
          python -m pip install --disable-pip-version-check -r workers/crawl4ai/requirements.txt
          crawl4ai-setup
          crawl4ai-doctor

      - name: Observe ${{ matrix.jurisdiction }} external source
        shell: bash
        run: |
          pnpm --filter @markorbit/worker canary:representative -- \
            "--output-dir=$MARKORBIT_LIVE_CANARY_OUTPUT_DIR" \
            "--jurisdiction=${{ matrix.jurisdiction }}"
          if [ -f "$MARKORBIT_LIVE_CANARY_OUTPUT_DIR/summary.md" ]; then
            cat "$MARKORBIT_LIVE_CANARY_OUTPUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized canary observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: representative-source-live-canary-${{ matrix.jurisdiction }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/representative-live-canary/summary.json
            ${{ runner.temp }}/representative-live-canary/summary.md
          if-no-files-found: warn
          retention-days: 14

  observe-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MARKORBIT_CRAWL4AI_PYTHON: python
      MARKORBIT_LIVE_CANARY_TIMEOUT_SECONDS: "75"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure canary paths
        run: |
          echo "MARKORBIT_CRAWL4AI_SCRIPT=$GITHUB_WORKSPACE/workers/crawl4ai/acquire.py" >> "$GITHUB_ENV"
          echo "MARKORBIT_LIVE_CANARY_OUTPUT_DIR=$RUNNER_TEMP/representative-live-canary" >> "$GITHUB_ENV"

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install production Crawl4AI runtime
        run: |
          python -m pip install --disable-pip-version-check -r workers/crawl4ai/requirements.txt
          crawl4ai-setup
          crawl4ai-doctor

      - name: Run strict operator canaries
        shell: bash
        run: |
          set +e
          args=("--output-dir=$MARKORBIT_LIVE_CANARY_OUTPUT_DIR")
          if [ -n "${{ inputs.jurisdiction }}" ]; then
            args+=("--jurisdiction=${{ inputs.jurisdiction }}")
          fi
          if [ "${{ inputs.strict }}" = "true" ]; then
            args+=("--strict")
          fi
          pnpm --filter @markorbit/worker canary:representative -- "${args[@]}"
          status=$?
          if [ -f "$MARKORBIT_LIVE_CANARY_OUTPUT_DIR/summary.md" ]; then
            cat "$MARKORBIT_LIVE_CANARY_OUTPUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload sanitized canary observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: representative-source-live-canary-manual-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/representative-live-canary/summary.json
            ${{ runner.temp }}/representative-live-canary/summary.md
          if-no-files-found: warn
          retention-days: 14
