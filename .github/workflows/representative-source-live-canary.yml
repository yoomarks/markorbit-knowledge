name: Representative Source Live Canary

on:
  workflow_dispatch:
    inputs:
      jurisdiction:
        description: Optional representative jurisdiction code (for example CN, JP, KR, EU, CI)
        required: false
        type: string
      strict:
        description: Fail the workflow if any selected live canary fails
        required: true
        default: true
        type: boolean
  pull_request:
    branches: [main]
    # Keep this list limited to code or dependency changes that can alter the live
    # observation path. Generic persistence export-manifest edits are covered by
    # Validate and must not fan out into external canaries.
    paths:
      - .github/workflows/representative-source-live-canary.yml
      - apps/worker/src/run-representative-live-canaries.ts
      - apps/worker/package.json
      - scripts/stamp-live-canary-provenance.mjs
      - packages/persistence/src/representative-source-activation.ts
      - packages/persistence/src/representative-source-live-canaries.ts
      - packages/persistence/src/representative-source-live-canaries.test.ts
      - packages/persistence/src/source-coverage-catalog.ts
      - packages/persistence/src/priority-national-source-coverage.ts
      - packages/persistence/src/priority-national-source-coverage-builder.ts
      - packages/persistence/src/euipo-source-coverage.ts
      - packages/persistence/src/priority-regional-source-coverage.ts
      - pnpm-lock.yaml

permissions:
  contents: read

# Each run gets an independent group. A job re-run shares the same run_id and therefore
# cannot cancel the original run. New PR commits create a new auditable observation run.
concurrency:
  group: representative-source-live-canary-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  observe-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # One governed runtime installation is reused for all representative jurisdictions.
    # The runner records each jurisdiction independently and continues after site-level
    # failures, so real coverage remains twelve jurisdictions without twelve setup jobs.
    timeout-minutes: 90
    env:
      MARKORBIT_CRAWL4AI_PYTHON: python
      MARKORBIT_LIVE_CANARY_TIMEOUT_SECONDS: "75"
      MARKORBIT_LIVE_CANARY_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      MARKORBIT_LIVE_CANARY_SOURCE_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure canary paths
        run: |
          echo "MARKORBIT_CRAWL4AI_SCRIPT=$GITHUB_WORKSPACE/workers/crawl4ai/acquire.py" >> "$GITHUB_ENV"
          echo "MARKORBIT_LIVE_CANARY_OUTPUT_DIR=$RUNNER_TEMP/representative-live-canary" >> "$GITHUB_ENV"

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install production Crawl4AI runtime
        run: |
          python -m pip install --disable-pip-version-check -r workers/crawl4ai/requirements.txt
          crawl4ai-setup
          crawl4ai-doctor

      - name: Observe representative external sources
        shell: bash
        run: |
          pnpm --filter @markorbit/worker canary:representative -- \
            "--output-dir=$MARKORBIT_LIVE_CANARY_OUTPUT_DIR"
          if [ -f "$MARKORBIT_LIVE_CANARY_OUTPUT_DIR/summary.md" ]; then
            cat "$MARKORBIT_LIVE_CANARY_OUTPUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stamp canary evidence provenance
        run: |
          node scripts/stamp-live-canary-provenance.mjs \
            "--summary=$MARKORBIT_LIVE_CANARY_OUTPUT_DIR/summary.json"

      - name: Upload sanitized canary observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: representative-source-live-canary-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/representative-live-canary/summary.json
            ${{ runner.temp }}/representative-live-canary/summary.md
          if-no-files-found: warn
          retention-days: 14

  observe-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MARKORBIT_CRAWL4AI_PYTHON: python
      MARKORBIT_LIVE_CANARY_TIMEOUT_SECONDS: "75"
      MARKORBIT_LIVE_CANARY_SOURCE_SHA: ${{ github.sha }}
      MARKORBIT_LIVE_CANARY_SOURCE_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure canary paths
        run: |
          echo "MARKORBIT_CRAWL4AI_SCRIPT=$GITHUB_WORKSPACE/workers/crawl4ai/acquire.py" >> "$GITHUB_ENV"
          echo "MARKORBIT_LIVE_CANARY_OUTPUT_DIR=$RUNNER_TEMP/representative-live-canary" >> "$GITHUB_ENV"

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install production Crawl4AI runtime
        run: |
          python -m pip install --disable-pip-version-check -r workers/crawl4ai/requirements.txt
          crawl4ai-setup
          crawl4ai-doctor

      - name: Run strict operator canaries
        shell: bash
        run: |
          set +e
          args=("--output-dir=$MARKORBIT_LIVE_CANARY_OUTPUT_DIR")
          if [ -n "${{ inputs.jurisdiction }}" ]; then
            args+=("--jurisdiction=${{ inputs.jurisdiction }}")
          fi
          if [ "${{ inputs.strict }}" = "true" ]; then
            args+=("--strict")
          fi
          pnpm --filter @markorbit/worker canary:representative -- "${args[@]}"
          status=$?
          if [ -f "$MARKORBIT_LIVE_CANARY_OUTPUT_DIR/summary.md" ]; then
            cat "$MARKORBIT_LIVE_CANARY_OUTPUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Stamp canary evidence provenance
        if: always()
        run: |
          if [ -f "$MARKORBIT_LIVE_CANARY_OUTPUT_DIR/summary.json" ]; then
            node scripts/stamp-live-canary-provenance.mjs \
              "--summary=$MARKORBIT_LIVE_CANARY_OUTPUT_DIR/summary.json"
          fi

      - name: Upload sanitized canary observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: representative-source-live-canary-manual-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/representative-live-canary/summary.json
            ${{ runner.temp }}/representative-live-canary/summary.md
          if-no-files-found: warn
          retention-days: 14
