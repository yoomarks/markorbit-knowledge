name: Temporary Discovery Start Identity Fix

on:
  push:
    branches: [codex/discovery-start-website-identity-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/discovery-start-website-identity-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Finish start identity wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("apps/admin/src/server/discovery-service.ts")
          lines = p.read_text().splitlines()

          completed = next(i for i, line in enumerate(lines) if "const completed = this.dependencies.discovery.completeBatch" in line)
          profile_start = next(i for i in range(completed + 1, len(lines)) if "const profile = this.dependencies.graph.getProfileByCanonicalOrigin(" in lines[i])
          profile_end = next(i for i in range(profile_start + 1, len(lines)) if lines[i].strip() == ");")
          indent = lines[profile_start][: len(lines[profile_start]) - len(lines[profile_start].lstrip())]
          replacement = [
              f"{indent}const exactProfile = this.dependencies.graph.getProfileByCanonicalOrigin(",
              f"{indent}  DEFAULT_WORKSPACE.id,",
              f"{indent}  seedOrigin,",
              f"{indent});",
              f"{indent}const identitySource = exactProfile",
              f"{indent}  ? null",
              f"{indent}  : findWebsiteSourceByIdentity(this.dependencies.sources, seedIdentity);",
              f"{indent}const profile =",
              f"{indent}  exactProfile ??",
              f"{indent}  (identitySource",
              f"{indent}    ? this.dependencies.graph.getProfileBySourceId(identitySource.id)",
              f"{indent}    : null);",
          ]
          lines[profile_start:profile_end + 1] = replacement

          graph_start = next(i for i in range(profile_start, len(lines)) if "const graphCandidates = candidates.filter" in lines[i])
          graph_end = next(i for i in range(graph_start + 1, len(lines)) if lines[i].strip() == ");")
          indent = lines[graph_start][: len(lines[graph_start]) - len(lines[graph_start].lstrip())]
          lines[graph_start:graph_end + 1] = [
              f"{indent}const graphCandidates = candidates.filter(",
              f"{indent}  (candidate) => websiteIdentity(candidate.locator) === seedIdentity,",
              f"{indent});",
          ]
          p.write_text("\n".join(lines) + "\n")
          PY
          pnpm exec prettier --write apps/admin/src/server/discovery-service.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/discovery-service.ts
          git commit -m "fix(discovery): resolve existing graphs by website identity"
          git push origin HEAD:codex/discovery-start-website-identity-v1
