name: Agent Format Source Intelligence

on:
  push:
    branches:
      - agent/source-intelligence-d2
    paths:
      - .github/workflows/agent-format-source-intelligence.yml
      - apps/admin/src/server/__tests__/source-intelligence-service.test.ts
      - apps/admin/src/server/source-intelligence-service.ts
      - packages/contracts/src/source-intelligence-v1.ts
      - packages/persistence/src/source-intelligence-registry.ts
      - packages/persistence/tests/source-intelligence-registry.test.ts
      - packages/worker-runtime/src/source-intelligence-evaluator.ts
      - packages/worker-runtime/tests/source-intelligence-evaluator.test.ts

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/source-intelligence-d2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/admin/src/server/__tests__/source-intelligence-service.test.ts
          apps/admin/src/server/source-intelligence-service.ts
          packages/contracts/src/source-intelligence-v1.ts
          packages/persistence/src/source-intelligence-registry.ts
          packages/persistence/tests/source-intelligence-registry.test.ts
          packages/worker-runtime/src/source-intelligence-evaluator.ts
          packages/worker-runtime/tests/source-intelligence-evaluator.test.ts
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/admin/src/server/__tests__/source-intelligence-service.test.ts \
            apps/admin/src/server/source-intelligence-service.ts \
            packages/contracts/src/source-intelligence-v1.ts \
            packages/persistence/src/source-intelligence-registry.ts \
            packages/persistence/tests/source-intelligence-registry.test.ts \
            packages/worker-runtime/src/source-intelligence-evaluator.ts \
            packages/worker-runtime/tests/source-intelligence-evaluator.test.ts
          git commit -m "chore: format source intelligence increment"
          git push origin HEAD:agent/source-intelligence-d2
