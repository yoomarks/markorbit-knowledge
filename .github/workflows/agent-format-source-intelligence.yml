name: Agent Format Source Intelligence

on:
  push:
    branches:
      - agent/source-intelligence-operator-ui
    paths:
      - .github/workflows/agent-format-source-intelligence.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/source-intelligence-operator-ui
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/admin/src/components/sources/source-intelligence-panel.tsx
          apps/admin/src/components/sources/source-intelligence-workbench.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/components/sources/source-intelligence-panel.tsx apps/admin/src/components/sources/source-intelligence-workbench.tsx
          git commit -m "style: format source intelligence lint fixes"
          git push origin HEAD:agent/source-intelligence-operator-ui
