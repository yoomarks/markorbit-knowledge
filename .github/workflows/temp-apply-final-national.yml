name: Temporary Apply Final National

on:
  push:
    branches:
      - agent/priority-120-final-national-cu-tz-ao-mz-zm-zw-cd-v1

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/priority-120-final-national-cu-tz-ao-mz-zm-zw-cd-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply final national coverage patch
        run: python .github/scripts/temp_apply_final_national.py
      - name: Format production patch
        run: |
          pnpm exec prettier --write \
            packages/persistence/src/priority-national-source-coverage.ts \
            packages/persistence/src/priority-trademark-jurisdictions.ts \
            packages/persistence/src/retrieval-relevance-audit.ts \
            packages/persistence/src/source-coverage-catalog.ts \
            packages/persistence/tests/priority-national-source-coverage.test.ts \
            packages/persistence/tests/priority-trademark-jurisdictions.test.ts \
            packages/persistence/tests/retrieval-relevance-audit.test.ts
      - name: Verify production patch
        run: |
          pnpm --filter @markorbit/persistence test -- \
            tests/priority-national-source-coverage.test.ts \
            tests/retrieval-relevance-audit.test.ts \
            tests/priority-trademark-jurisdictions.test.ts \
            tests/source-coverage-catalog.test.ts
          pnpm typecheck
          pnpm lint
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/persistence/src/priority-national-source-coverage.ts \
            packages/persistence/src/priority-trademark-jurisdictions.ts \
            packages/persistence/src/retrieval-relevance-audit.ts \
            packages/persistence/src/source-coverage-catalog.ts \
            packages/persistence/tests/priority-national-source-coverage.test.ts \
            packages/persistence/tests/priority-trademark-jurisdictions.test.ts \
            packages/persistence/tests/retrieval-relevance-audit.test.ts
          git commit -m "feat: add final seven national trademark source sets"
          git push origin HEAD:agent/priority-120-final-national-cu-tz-ao-mz-zm-zw-cd-v1
