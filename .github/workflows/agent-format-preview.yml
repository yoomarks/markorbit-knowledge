name: Agent Format Preview

on:
  push:
    branches:
      - agent/r1-k01-core-workspace-auth

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm prettier --write \
            'apps/admin/src/app/api/ready-packages/[id]/core-intake/route.ts' \
            apps/admin/src/server/__tests__/configured-core-intake-transport.test.ts \
            apps/admin/src/server/__tests__/core-intake-http-transport.test.ts \
            apps/admin/src/server/core-intake-http-transport.ts \
            packages/persistence/src/core-workspace-binding.ts
          git diff --no-ext-diff --unified=200 -- \
            'apps/admin/src/app/api/ready-packages/[id]/core-intake/route.ts' \
            apps/admin/src/server/__tests__/configured-core-intake-transport.test.ts \
            apps/admin/src/server/__tests__/core-intake-http-transport.test.ts \
            apps/admin/src/server/core-intake-http-transport.ts \
            packages/persistence/src/core-workspace-binding.ts
