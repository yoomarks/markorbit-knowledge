name: Agent Format Preview

on:
  push:
    branches:
      - r1-k02-freeze-core-workspace-binding

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm prettier --write apps/admin/src/server/ready-package-core-intake-submit.ts packages/persistence/src/ready-package-core-intake-submission.ts
          git diff --no-ext-diff --unified=80 -- apps/admin/src/server/ready-package-core-intake-submit.ts packages/persistence/src/ready-package-core-intake-submission.ts
