name: Agent Format Raw Artifact Test

on:
  push:
    branches:
      - agent/raw-artifact-source-graph-extraction

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/raw-artifact-source-graph-extraction
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/admin/src/server/__tests__/raw-artifact-source-graph.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-format-raw-artifact-test.yml
          git add apps/admin/src/server/__tests__/raw-artifact-source-graph.test.ts
          git commit -m "chore: format raw artifact source graph test"
          git push origin HEAD:agent/raw-artifact-source-graph-extraction
