name: ADK-11 PREPARED Evidence Format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier output
        shell: bash
        run: |
          set -euo pipefail
          files=(
            packages/contracts/src/ai-grounded-prepared-evidence-v1.ts
            packages/contracts/src/ai-grounded-prepared-evidence-v1.test.ts
            packages/contracts/src/index.ts
            packages/persistence/src/ai-grounded-prepared-execution-ingestion.ts
            packages/persistence/src/ai-grounded-prepared-execution-ingestion.test.ts
            packages/persistence/src/ai-grounded-prepared-execution-evidence.ts
            packages/persistence/src/ai-grounded-prepared-execution-evidence.test.ts
            packages/persistence/package.json
            apps/worker/src/persist-adk-grounded-prepared-execution.ts
            apps/worker/src/persist-adk-grounded-prepared-execution.test.ts
            docs/architecture/ADK_11_SOURCE_GROUNDED_ASSIGNMENTS.md
          )
          pnpm exec prettier --write "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            echo "ADK-11 PREPARED evidence files already match Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "style: apply exact Prettier output for ADK-11 PREPARED evidence"
          git push origin HEAD:${{ github.head_ref }}
