name: Agent K-EXT-B Closeout

on:
  push:
    branches:
      - codex/k-ext-b-local-folder-worker

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/k-ext-b-local-folder-worker
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile K-EXT-B closeout
        run: |
          python - <<'PY'
          from pathlib import Path

          bootstrap = Path('apps/worker/src/bootstrap-local-folder.ts')
          text = bootstrap.read_text()
          text = text.replace('  LOCAL_FOLDER_CONNECTOR_ID,\n', '', 1)
          bootstrap.write_text(text)

          tests = Path('packages/worker-runtime/tests/local-folder-acquirer.test.ts')
          text = tests.read_text()
          marker = '''  it("fails closed when a scan encounters a symbolic link", async () => {'''
          addition = '''  it("rejects a root-scoped connector mismatch before filesystem access", async () => {
            const root = await tempRoot();
            await writeFile(join(root, "evidence.txt"), "evidence");
            const ctx = context({
              rootId: "research",
              relativePath: "",
              recursive: true,
              includeHidden: false,
            });

            const acquirer = new LocalFolderArtifactAcquirer({
              roots: { legal: root, research: join(root, "does-not-exist") },
            });
            await expect(acquirer.acquire(ctx)).rejects.toMatchObject({
              code: "CONNECTOR_NOT_SUPPORTED",
            });
          });

'''
          if addition not in text:
              if marker not in text:
                  raise SystemExit('test insertion marker not found')
              text = text.replace(marker, addition + marker, 1)
          tests.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          bullet_anchor = '- governed Workspace-scoped Manual Upload with bounded media/size policy, exact SHA-256 identity, targeted Job leases, idempotent replay, immutable RawArtifact provenance and Admin UI;\n'
          bullet = '- production Local Folder Worker ingestion with Worker-local root aliases, root-scoped connector scheduling, traversal/symlink fail-closed controls, stable snapshot digests, bounded scans and immutable RawArtifact/CAS reuse;\n'
          if bullet not in text:
              if bullet_anchor not in text:
                  raise SystemExit('README acquisition anchor not found')
              text = text.replace(bullet_anchor, bullet_anchor + bullet, 1)

          old_status = 'Production web acquisition and governed Workspace-scoped Manual Upload now exist for bounded acquisition.'
          new_status = 'Production web acquisition, governed Workspace-scoped Manual Upload, and root-scoped Local Folder Worker ingestion now exist for bounded acquisition.'
          text = text.replace(old_status, new_status, 1)
          text = text.replace(
              'Local Folder ingestion, automatic scheduling, a verified/implemented Core ReadyPackage V2 receiver,',
              'Automatic scheduling, a verified/implemented Core ReadyPackage V2 receiver,',
              1,
          )

          docs_anchor = '- [Manual Upload Ingestion V1](docs/architecture/MANUAL_UPLOAD_INGESTION_V1.md)\n'
          docs_link = '- [Local Folder Worker Ingestion V1](docs/architecture/LOCAL_FOLDER_WORKER_INGESTION_V1.md)\n'
          if docs_link not in text:
              if docs_anchor not in text:
                  raise SystemExit('README docs anchor not found')
              text = text.replace(docs_anchor, docs_anchor + docs_link, 1)
          readme.write_text(text)
          PY
      - name: Format closeout files
        run: pnpm exec prettier --write apps/worker/src/bootstrap-local-folder.ts packages/worker-runtime/tests/local-folder-acquirer.test.ts README.md
      - name: Commit closeout
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/bootstrap-local-folder.ts packages/worker-runtime/tests/local-folder-acquirer.test.ts README.md
          git commit -m "test: close out Local Folder Worker boundaries"
          git push origin HEAD:codex/k-ext-b-local-folder-worker
