name: Agent Fix Source Graph Return

on:
  push:
    branches:
      - agent/website-source-profile-contracts

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/website-source-profile-contracts
      - name: Add explicit guard fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("packages/contracts/src/source-graph-v1.ts")
          text = path.read_text()
          marker = "  }\n}\n\nexport function isSourceGraphEdge"
          replacement = "  }\n\n  return false;\n}\n\nexport function isSourceGraphEdge"
          if marker not in text:
              raise SystemExit("target marker not found")
          path.write_text(text.replace(marker, replacement, 1))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/source-graph-v1.ts
          git commit -m "fix: make source graph node guard total"
          git push origin HEAD:agent/website-source-profile-contracts
