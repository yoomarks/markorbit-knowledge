name: Temporary USPTO Fee Admissibility Format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-and-self-delete:
    if: github.head_ref == 'phase2/uspto-fee-evidence-admissibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target and remove temporary workflow
        run: |
          pnpm exec prettier --write apps/admin/src/server/official-evidence-admissibility.test.ts
          git rm .github/workflows/tmp-uspto-fee-admissibility-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/official-evidence-admissibility.test.ts
          git commit -m "style: format official evidence admissibility test"
          git push origin HEAD:${{ github.head_ref }}
