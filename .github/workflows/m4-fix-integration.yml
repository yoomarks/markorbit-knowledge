name: M4 Integration Fix

on:
  push:
    branches:
      - feature/m4-attachment-acquisition-reliability

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m4-attachment-acquisition-reliability
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/m4-attachment-patch.yml')
          text = path.read_text()
          old = "replace(smoke, 'Production Crawl4AI 1.1.0', 'Production Crawl4AI 1.2.0')"
          new = "replace(smoke, 'production Crawl4AI 1.1.0', 'production Crawl4AI 1.2.0')"
          if old not in text:
              raise SystemExit(0)
          path.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/m4-attachment-patch.yml
          git commit -m "M4 fix integration workflow"
          git push
