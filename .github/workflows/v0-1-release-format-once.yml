name: V0.1 Release Docs Format Once

on:
  push:
    branches:
      - codex/v0-1-release-readiness-freeze

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0-1-release-readiness-freeze
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write README.md docs/architecture/COLLECTION_SCHEDULER_V1.md docs/release/KNOWLEDGE_V0_1_RELEASE_READINESS_2026-08-12.md docs/operations/KNOWLEDGE_V0_1_BACKUP_RESTORE.md
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/architecture/COLLECTION_SCHEDULER_V1.md docs/release/KNOWLEDGE_V0_1_RELEASE_READINESS_2026-08-12.md docs/operations/KNOWLEDGE_V0_1_BACKUP_RESTORE.md
          git commit -m "chore: format v0.1 release docs"
          git push origin HEAD:codex/v0-1-release-readiness-freeze
