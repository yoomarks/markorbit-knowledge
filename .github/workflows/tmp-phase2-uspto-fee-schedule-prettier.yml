name: Temporary Phase2 USPTO Fee Schedule Prettier

on:
  push:
    branches:
      - phase2/uspto-fee-schedule-live-evidence

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2/uspto-fee-schedule-live-evidence
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/worker/src/bootstrap-uspto-fee-schedule.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/worker/src/bootstrap-uspto-fee-schedule.ts
          git commit -m "style: format USPTO Fee Schedule bootstrap"
          git push origin HEAD:phase2/uspto-fee-schedule-live-evidence
