name: EUIPO Seed Fallback Patcher

on:
  push:
    branches:
      - codex/euipo-discovery-seed-fallback
    paths:
      - .github/workflows/euipo-seed-fallback-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/euipo-discovery-seed-fallback
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply focused seed fallback
        run: |
          python <<'PY'
          from pathlib import Path

          provider_path = Path('packages/worker-runtime/src/http-website-discovery-provider.ts')
          provider = provider_path.read_text()
          before = '''      const normalizedSeedLocator = seedUrl.toString();
      seedLocators.add(normalizedSeedLocator);

      let robots: RobotsPolicy | null = null;'''
          after = '''      const normalizedSeedLocator = seedUrl.toString();
      seedLocators.add(normalizedSeedLocator);
      const candidateCountBeforeSeed = candidates.length;

      let robots: RobotsPolicy | null = null;'''
          if before not in provider:
              raise SystemExit('provider insertion anchor not found')
          provider = provider.replace(before, after, 1)

          before = '''      while (pageQueue.length > 0 && candidates.length < maxCandidates && fetchCount < maxFetches) {
        await visitNextPage();
      }
    }

    return candidates;'''
          after = '''      while (pageQueue.length > 0 && candidates.length < maxCandidates && fetchCount < maxFetches) {
        await visitNextPage();
      }

      if (
        candidates.length == candidateCountBeforeSeed &&
        candidates.length < maxCandidates &&
        canDiscover(seedUrl, seedUrl, constraints) &&
        !candidateLocators.has(normalizedSeedLocator)
      ) {
        const robotsAllowed = !respectRobots || robotsAllows(robots, seedUrl);
        candidates.push({
          candidateId: candidateId(normalizedSeedLocator),
          locator: normalizedSeedLocator,
          discoveredAt: new Date().toISOString(),
          status: "DISCOVERED",
          discoveredFrom: seed.locator,
          discoveryMethod: "SEED",
          depth: 0,
          metadata: {
            kind: candidateKind(seedUrl),
            seedId: seed.seedId,
            seedLocator: seed.locator,
            host: seedUrl.hostname,
            robotsAllowed,
            seedFallback: true,
            fallbackReason: "NO_REVIEWABLE_STRUCTURE",
          },
        });
        candidateLocators.add(normalizedSeedLocator);
      }
    }

    return candidates;'''
          if before not in provider:
              raise SystemExit('provider fallback anchor not found')
          provider = provider.replace(before, after, 1)
          provider_path.write_text(provider)

          test_path = Path('packages/integration-tests/tests/http-website-discovery.test.ts')
          tests = test_path.read_text()
          anchor = '''  it("bounds network work independently from candidate count", async () => {'''
          insertion = '''  it("falls back to the governed seed when a site exposes no reviewable structure", async () => {
    const requested: string[] = [];
    const fetcher = (async (input: string | URL | Request) => {
      const locator = typeof input === "string" ? input : input.toString();
      requested.push(locator);
      return new Response("forbidden", { status: 403 });
    }) as typeof globalThis.fetch;

    const provider = new HttpWebsiteDiscoveryProvider(fetcher);
    const result = await provider.discover({
      batchId: "batch_seed_fallback",
      createdAt: "2026-08-08T00:00:00Z",
      seeds: [
        {
          seedId: "seed_euipo",
          locator: "https://www.euipo.europa.eu/en/trade-marks/how-to-apply",
        },
      ],
      constraints: {
        maxDepth: 1,
        maxCandidates: 10,
        maxFetches: 8,
        sameHostOnly: true,
        respectRobots: true,
        discoverSitemaps: true,
      },
    });

    expect(requested).toEqual([
      "https://www.euipo.europa.eu/robots.txt",
      "https://www.euipo.europa.eu/en/trade-marks/how-to-apply",
      "https://www.euipo.europa.eu/sitemap.xml",
    ]);
    expect(result).toHaveLength(1);
    expect(result[0]).toMatchObject({
      locator: "https://www.euipo.europa.eu/en/trade-marks/how-to-apply",
      status: "DISCOVERED",
      discoveryMethod: "SEED",
      depth: 0,
      metadata: {
        seedFallback: true,
        fallbackReason: "NO_REVIEWABLE_STRUCTURE",
      },
    });
  });

'''
          if anchor not in tests:
              raise SystemExit('test insertion anchor not found')
          tests = tests.replace(anchor, insertion + anchor, 1)
          test_path.write_text(tests)

          config_path = Path('config/source-intelligence-d2-5-cohort.json')
          config = config_path.read_text()
          old = 'D2.5 dual-axis real-source calibration. Human priority and authority labels are explicit calibration inputs only; they do not establish legal truth, professional quality or identity.'
          new = 'D2.5 dual-axis real-source calibration, including governed seed fallback compatibility for structurally inaccessible websites. Human priority and authority labels are explicit calibration inputs only; they do not establish legal truth, professional quality or identity.'
          if old not in config:
              raise SystemExit('config purpose anchor not found')
          config_path.write_text(config.replace(old, new, 1))
          PY
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Format focused files
        run: pnpm exec prettier --write packages/worker-runtime/src/http-website-discovery-provider.ts packages/integration-tests/tests/http-website-discovery.test.ts config/source-intelligence-d2-5-cohort.json
      - name: Run focused discovery tests
        run: pnpm --filter @markorbit/integration-tests test -- http-website-discovery.test.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/worker-runtime/src/http-website-discovery-provider.ts packages/integration-tests/tests/http-website-discovery.test.ts config/source-intelligence-d2-5-cohort.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve governed seed when website discovery is blocked"
          git push origin HEAD:codex/euipo-discovery-seed-fallback
