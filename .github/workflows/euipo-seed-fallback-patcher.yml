name: EUIPO Seed Fallback Patcher

on:
  push:
    branches:
      - codex/euipo-discovery-seed-fallback
    paths:
      - ".github/workflows/euipo-seed-fallback-patcher.yml"
      - ".github/scripts/euipo_seed_fallback_patch.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/euipo-discovery-seed-fallback
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply focused seed fallback
        run: python .github/scripts/euipo_seed_fallback_patch.py
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Format focused files
        run: pnpm exec prettier --write packages/worker-runtime/src/http-website-discovery-provider.ts packages/integration-tests/tests/http-website-discovery.test.ts config/source-intelligence-d2-5-cohort.json
      - name: Run focused discovery tests
        run: pnpm --filter @markorbit/integration-tests test -- http-website-discovery.test.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/worker-runtime/src/http-website-discovery-provider.ts packages/integration-tests/tests/http-website-discovery.test.ts config/source-intelligence-d2-5-cohort.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve governed seed when website discovery is blocked"
          git push origin HEAD:codex/euipo-discovery-seed-fallback
