name: D2.16 Test Fix

on:
  push:
    branches:
      - codex/d2-16-audit-query-export
    paths:
      - .github/workflows/d2-16-test-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d2-16-audit-query-export
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Align keyset ordering and assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('packages/worker-runtime/src/source-intelligence-policy-audit-query.ts')
          text = runtime.read_text()
          old = '  return right.eventId.localeCompare(left.eventId);'
          new = '  if (left.eventId === right.eventId) return 0;\n  return left.eventId > right.eventId ? -1 : 1;'
          if old not in text:
              raise SystemExit('runtime comparator anchor missing')
          text = text.replace(old, new, 1)
          old = '  return event.eventId.localeCompare(cursor.eventId) < 0;'
          new = '  return event.eventId < cursor.eventId;'
          if old not in text:
              raise SystemExit('runtime cursor anchor missing')
          runtime.write_text(text)

          test = Path('packages/worker-runtime/tests/source-intelligence-policy-audit-query.test.ts')
          text = test.read_text()
          text = text.replace(
              'expect(first.events.map((item) => item.eventId)).toEqual(["sipa_c", "sica_b"]);',
              'expect(first.events.map((item) => item.eventId)).toEqual(["sipa_c", "sima_a"]);',
              1,
          )
          text = text.replace(
              'expect(second.events.map((item) => item.eventId)).toEqual(["sima_a"]);',
              'expect(second.events.map((item) => item.eventId)).toEqual(["sica_b"]);',
              1,
          )
          old = 'expect(firstJson).not.toContain("generatedAt");'
          new = 'expect(JSON.parse(firstJson)).not.toHaveProperty("generatedAt");'
          if old not in text:
              raise SystemExit('generatedAt assertion anchor missing')
          test.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write \
            packages/worker-runtime/src/source-intelligence-policy-audit-query.ts \
            packages/worker-runtime/tests/source-intelligence-policy-audit-query.test.ts
          pnpm --filter @markorbit/worker-runtime test -- source-intelligence-policy-audit-query.test.ts
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/worker-runtime/src/source-intelligence-policy-audit-query.ts \
            packages/worker-runtime/tests/source-intelligence-policy-audit-query.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: align D2.16 keyset ordering with SQLite"
          git push origin HEAD:codex/d2-16-audit-query-export
