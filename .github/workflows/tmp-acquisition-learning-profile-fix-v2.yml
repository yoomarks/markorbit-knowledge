name: Temporary Acquisition Learning Profile Fix V2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-acquisition-learning-profile-fix-v2.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply governed measurement fixes
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"expected {expected} matches in {path}, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          replace(
              "packages/contracts/src/acquisition-intelligence-v1.ts",
              "    etagObserved: boolean;\n    lastModifiedObserved: boolean;",
              "    etagObserved: boolean | null;\n    lastModifiedObserved: boolean | null;",
          )
          replace(
              "packages/contracts/src/acquisition-intelligence-learning-v1.ts",
              "  } else if (\n    !evidence.changeDetection.etagObserved &&\n    !evidence.changeDetection.lastModifiedObserved\n  ) {",
              "  } else if (\n    evidence.changeDetection.etagObserved === false &&\n    evidence.changeDetection.lastModifiedObserved === false\n  ) {",
          )

          p = Path("packages/worker-runtime/src/acquisition-learning-profile.ts")
          text = p.read_text()
          replacements = [
              ("  type DiscoverySurface,", "  type AcquisitionDiscoverySurface,"),
              ("  type RenderRequirement,", "  type AcquisitionRenderRequirement,"),
              ("  type SourceArchitecture,", "  type AcquisitionArchitecture,"),
              ("  type SourceLocaleStructure,", "  type AcquisitionLocaleStructure,"),
              ("    architecture: SourceArchitecture;", "    architecture: AcquisitionArchitecture;"),
              ("    discoverySurfaces: DiscoverySurface[];", "    discoverySurfaces: AcquisitionDiscoverySurface[];"),
              ("    renderRequirement: RenderRequirement;", "    renderRequirement: AcquisitionRenderRequirement;"),
              ("    localeStructure: SourceLocaleStructure;", "    localeStructure: AcquisitionLocaleStructure;"),
              ("    supportsHttpValidators: boolean;", "    supportsHttpValidators: boolean | null;"),
              ("      etagObserved: false,\n      lastModifiedObserved: false,", "      etagObserved: null,\n      lastModifiedObserved: null,"),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"profile replacement mismatch: {old!r}")
              text = text.replace(old, new, 1)
          marker = "export function buildSourceFingerprintFromAcquisitionProfile(input: {"
          helper = '''export function inferHttpValidatorSupport(\n  changeDetection: AcquisitionRunEvidence["changeDetection"] | undefined,\n): boolean | null {\n  if (!changeDetection) return null;\n  if (\n    changeDetection.validator304Count > 0 ||\n    changeDetection.etagObserved === true ||\n    changeDetection.lastModifiedObserved === true\n  ) {\n    return true;\n  }\n  if (\n    changeDetection.etagObserved === false &&\n    changeDetection.lastModifiedObserved === false\n  ) {\n    return false;\n  }\n  return null;\n}\n\n'''
          if text.count(marker) != 1:
              raise SystemExit("fingerprint builder marker mismatch")
          text = text.replace(marker, helper + marker, 1)
          old = "  evidenceRefs: string[];\n}): SourceFingerprint {"
          new = "  evidenceRefs: string[];\n  changeDetection?: AcquisitionRunEvidence[\"changeDetection\"];\n}): SourceFingerprint {"
          if text.count(old) != 1:
              raise SystemExit("fingerprint input marker mismatch")
          text = text.replace(old, new, 1)
          old = "    supportsHttpValidators: input.profile.fingerprint.supportsHttpValidators,"
          new = "    supportsHttpValidators:\n      input.changeDetection === undefined\n        ? input.profile.fingerprint.supportsHttpValidators\n        : inferHttpValidatorSupport(input.changeDetection),"
          if text.count(old) != 1:
              raise SystemExit("fingerprint support marker mismatch")
          text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path("apps/worker/src/acquisition-learning-profiles.ts")
          text = p.read_text()
          if text.count("supportsHttpValidators: true") != 4:
              raise SystemExit("expected four structural validator priors")
          p.write_text(text.replace("supportsHttpValidators: true", "supportsHttpValidators: null"))

          replace(
              "apps/worker/src/main.ts",
              "        evidenceRefs: evidence.evidenceRefs,\n      });",
              "        evidenceRefs: evidence.evidenceRefs,\n        changeDetection: evidence.changeDetection,\n      });",
          )
          replace(
              "apps/worker/src/live-acquisition-profile-evidence.ts",
              "    evidenceRefs: evidence.evidenceRefs,\n  });",
              "    evidenceRefs: evidence.evidenceRefs,\n    changeDetection: evidence.changeDetection,\n  });",
          )
          replace(
              "apps/worker/src/acquisition-learning-observation.ts",
              '    httpStatusCounts: observed > 0 ? { "200": observed } : {},',
              '    httpStatusCounts: {},',
          )
          replace(
              "apps/worker/src/acquisition-learning-observation.ts",
              '      "observation-scope:bounded-execution-receipt",',
              '      "observation-scope:bounded-execution-receipt",\n      "http-status-observation:unmeasured",',
          )
          PY

          cat > packages/worker-runtime/tests/acquisition-learning-measurement-semantics.test.ts <<'EOF'
          import { extractAcquisitionRunLessons } from "@markorbit/contracts";
          import { describe, expect, it } from "vitest";
          import {
            buildAcquisitionRunEvidenceFromProfile,
            buildSourceFingerprintFromAcquisitionProfile,
            type AcquisitionLearningObservation,
            type AcquisitionLearningProfile,
          } from "../src/acquisition-learning-profile";

          const profile: AcquisitionLearningProfile = {
            profileId: "static-index-html-v1",
            playbookId: "official-static-index-tree",
            playbookRevision: 1,
            fingerprint: {
              architecture: "STATIC_HTML",
              discoverySurfaces: ["INDEX_PAGE"],
              renderRequirement: "NONE",
              localeStructure: "SINGLE",
              supportsHttpValidators: null,
              attachmentKinds: ["HTML"],
              confidence: 0.9,
            },
          };

          function observation(
            changeDetection?: AcquisitionLearningObservation["changeDetection"],
          ): AcquisitionLearningObservation {
            return {
              runId: "run_validator_measurement",
              sourceId: "src_validator_measurement",
              startedAt: "2026-08-22T00:00:00.000Z",
              finishedAt: "2026-08-22T00:00:01.000Z",
              counts: { discovered: 1, attempted: 1, fetched: 1, accepted: 1, duplicates: 0, retries: 0 },
              knownCorpus: null,
              ...(changeDetection ? { changeDetection } : {}),
              bytes: 100,
              evidenceRefs: ["fixture:validator-measurement"],
            };
          }

          describe("acquisition learning measurement semantics", () => {
            it("keeps unmeasured validators unknown without fabricating unavailable lessons", () => {
              const evidence = buildAcquisitionRunEvidenceFromProfile({ profile, observation: observation() });
              expect(evidence.changeDetection.etagObserved).toBeNull();
              expect(evidence.changeDetection.lastModifiedObserved).toBeNull();
              const lessonTypes = extractAcquisitionRunLessons(evidence).map((lesson) => lesson.lessonType);
              expect(lessonTypes).not.toContain("HTTP_VALIDATORS_UNAVAILABLE");
              expect(lessonTypes).not.toContain("DIGEST_WATCH_REQUIRED");
              expect(
                buildSourceFingerprintFromAcquisitionProfile({
                  profile,
                  sourceId: evidence.sourceId,
                  observedAt: evidence.finishedAt,
                  evidenceRefs: evidence.evidenceRefs,
                  changeDetection: evidence.changeDetection,
                }).supportsHttpValidators,
              ).toBeNull();
            });

            it("derives support and fallback lessons only from measured observations", () => {
              const available = buildAcquisitionRunEvidenceFromProfile({
                profile,
                observation: observation({
                  etagObserved: true,
                  lastModifiedObserved: false,
                  validator304Count: 0,
                  digestChanges: 0,
                }),
              });
              expect(
                buildSourceFingerprintFromAcquisitionProfile({
                  profile,
                  sourceId: available.sourceId,
                  observedAt: available.finishedAt,
                  evidenceRefs: available.evidenceRefs,
                  changeDetection: available.changeDetection,
                }).supportsHttpValidators,
              ).toBe(true);

              const unavailable = buildAcquisitionRunEvidenceFromProfile({
                profile,
                observation: observation({
                  etagObserved: false,
                  lastModifiedObserved: false,
                  validator304Count: 0,
                  digestChanges: 0,
                }),
              });
              const lessonTypes = extractAcquisitionRunLessons(unavailable).map((lesson) => lesson.lessonType);
              expect(lessonTypes).toContain("HTTP_VALIDATORS_UNAVAILABLE");
              expect(lessonTypes).toContain("DIGEST_WATCH_REQUIRED");
            });
          });
          EOF

          cat > apps/worker/src/acquisition-learning-observation.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import type { ControlledCollectionCompletion } from "@markorbit/worker-runtime";
          import { buildReceiptAcquisitionLearningObservation } from "./acquisition-learning-observation";

          describe("receipt acquisition learning observation", () => {
            it("does not fabricate HTTP statuses absent from the execution receipt", () => {
              const completion = {
                context: { job: { id: "job_test", runId: "run_test", sourceId: "src_test", planId: "plan_test" } },
                receipt: {
                  executor: { executorId: "fixture", version: "1", mode: "PRODUCTION" },
                  itemsObserved: 3,
                  bytesPrepared: 300,
                  metadataOnly: false,
                },
                startedAt: "2026-08-22T00:00:00.000Z",
                finishedAt: "2026-08-22T00:00:01.000Z",
              } as unknown as ControlledCollectionCompletion;
              const observation = buildReceiptAcquisitionLearningObservation(completion);
              expect(observation?.httpStatusCounts).toEqual({});
              expect(observation?.evidenceRefs).toContain("http-status-observation:unmeasured");
            });
          });
          EOF
      - name: Format and validate
        run: |
          pnpm exec prettier --write \
            packages/contracts/src/acquisition-intelligence-v1.ts \
            packages/contracts/src/acquisition-intelligence-learning-v1.ts \
            packages/worker-runtime/src/acquisition-learning-profile.ts \
            packages/worker-runtime/src/http-acquisition-intelligence-client.ts \
            packages/worker-runtime/tests/acquisition-learning-profile.test.ts \
            packages/worker-runtime/tests/acquisition-learning-measurement-semantics.test.ts \
            packages/worker-runtime/tests/http-acquisition-intelligence-client.test.ts \
            apps/admin/src/server/acquisition-intelligence-worker-fingerprint.test.ts \
            apps/worker/src/acquisition-learning-observation.ts \
            apps/worker/src/acquisition-learning-observation.test.ts \
            apps/worker/src/acquisition-learning-profiles.ts \
            apps/worker/src/acquisition-learning-profiles.test.ts \
            apps/worker/src/live-acquisition-profile-evidence.ts \
            apps/worker/src/live-acquisition-profile-evidence.test.ts \
            apps/worker/src/main.ts \
            apps/worker/src/verify-acquisition-learning-profile-run.ts
          pnpm --filter @markorbit/contracts test
          pnpm --filter @markorbit/worker-runtime test
          pnpm --filter @markorbit/worker test
          pnpm typecheck
          pnpm format:check
      - name: Commit and push fixes
        run: |
          BRANCH=${{ github.event.pull_request.head.ref }}
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/contracts packages/worker-runtime apps/admin/src/server/acquisition-intelligence-worker-fingerprint.test.ts apps/worker/src
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve unknown acquisition observations"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/$BRANCH)" ]; then
              git rebase "origin/$BRANCH"
            fi
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            sleep 2
          done
          exit 1
