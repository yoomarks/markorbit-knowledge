name: Temporary scheduler in-flight coalescing verification

on:
  push:
    branches:
      - codex/scheduler-coalesce-inflight-v1

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/tmp/patch_scheduler_coalesce_inflight.py
      - run: python .github/tmp/fix_scheduler_duplicate_parse_run.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/persistence/src/collection-scheduler.ts packages/persistence/tests/collection-scheduler.test.ts
      - run: pnpm --filter @markorbit/persistence exec vitest run tests/collection-scheduler.test.ts tests/execution-ledger.test.ts tests/controlled-worker-execution.test.ts
      - run: pnpm typecheck
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/collection-scheduler.ts packages/persistence/tests/collection-scheduler.test.ts
          git commit -m "Scheduler: coalesce slots while a plan run is in flight" || true
          git push
