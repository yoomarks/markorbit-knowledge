name: Agent R1-K07 Format Apply

on:
  push:
    branches:
      - r1-k07-durable-vault-export

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r1-k07-durable-vault-export
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier
        run: |
          pnpm exec prettier --write \
            apps/admin/src/components/vault/vault-export-control.tsx \
            apps/admin/src/server/vault-export-service.ts \
            packages/persistence/src/obsidian-vault-projection.ts \
            packages/persistence/src/vault-export-run-registry.test.ts \
            packages/persistence/src/vault-export-run-registry.ts
          if git diff --quiet -- \
            apps/admin/src/components/vault/vault-export-control.tsx \
            apps/admin/src/server/vault-export-service.ts \
            packages/persistence/src/obsidian-vault-projection.ts \
            packages/persistence/src/vault-export-run-registry.test.ts \
            packages/persistence/src/vault-export-run-registry.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/admin/src/components/vault/vault-export-control.tsx \
            apps/admin/src/server/vault-export-service.ts \
            packages/persistence/src/obsidian-vault-projection.ts \
            packages/persistence/src/vault-export-run-registry.test.ts \
            packages/persistence/src/vault-export-run-registry.ts
          git commit -m "chore(r1-k07): format Vault export files"
          git push origin HEAD:r1-k07-durable-vault-export
