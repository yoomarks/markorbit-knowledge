name: Temporary UAE MoET canonical fix verification

on:
  push:
    branches:
      - codex/ae-moet-source-coverage-v1

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UAE canonical fixes
        run: python .github/tmp/fix_ae_moet_canonicals.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/persistence/src/priority-national-source-coverage.ts
      - run: >-
          pnpm --filter @markorbit/persistence exec vitest run
          tests/priority-national-source-coverage.test.ts
          tests/source-coverage-catalog.test.ts
          tests/retrieval-relevance-audit.test.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit canonical fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/persistence/src/priority-national-source-coverage.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: use verified UAE trademark classification and bulletin sources"
          git push
