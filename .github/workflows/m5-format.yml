name: M5 Format

on:
  push:
    branches:
      - agent/us-source-coverage-map-v1

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'M5 format source coverage files') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/us-source-coverage-map-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/contracts/src/source-coverage-v1.ts packages/persistence/src/source-coverage-catalog.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/source-coverage-v1.ts packages/persistence/src/source-coverage-catalog.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "M5 format source coverage files"
          git push
