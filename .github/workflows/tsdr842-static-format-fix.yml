name: TSDR 842 Static Format Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feature/842-tsdr-static-http'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/admin/src/app/api/internal/uspto-tsdr-web/acceptance/route.ts apps/admin/src/server/uspto-tsdr-web-acceptance-auth.ts apps/admin/src/server/uspto-tsdr-web-acceptance-auth.test.ts apps/worker/src/run-uspto-tsdr-web-acceptance.ts apps/worker/src/run-uspto-tsdr-web-acceptance.test.ts apps/worker/src/uspto-tsdr-web-acceptance-plan.ts apps/worker/src/uspto-tsdr-web-acceptance-plan.test.ts packages/worker-runtime/src/index.ts packages/worker-runtime/src/uspto-tsdr-static-web-acquirer.ts packages/worker-runtime/src/uspto-tsdr-static-web-acquirer.test.ts
      - name: Commit exact Linux formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "markorbit-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/admin/src/app/api/internal/uspto-tsdr-web/acceptance/route.ts apps/admin/src/server/uspto-tsdr-web-acceptance-auth.ts apps/admin/src/server/uspto-tsdr-web-acceptance-auth.test.ts apps/worker/src/run-uspto-tsdr-web-acceptance.ts apps/worker/src/run-uspto-tsdr-web-acceptance.test.ts apps/worker/src/uspto-tsdr-web-acceptance-plan.ts apps/worker/src/uspto-tsdr-web-acceptance-plan.test.ts packages/worker-runtime/src/index.ts packages/worker-runtime/src/uspto-tsdr-static-web-acquirer.ts packages/worker-runtime/src/uspto-tsdr-static-web-acquirer.test.ts
          git commit -m "style: format TSDR static web transport"
          git push origin HEAD:${{ github.head_ref }}
