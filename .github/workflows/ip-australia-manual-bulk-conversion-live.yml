name: IP Australia Manual Bulk Conversion Live

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ip-australia-manual-bulk-conversion-live.yml
      - scripts/admin-browser-calibration-core-auth-stub.mjs
      - scripts/ci-admin-auth-configure.sh
      - scripts/ci-admin-auth-stub-start.sh
      - scripts/ci-admin-control-plane-ready.sh
      - scripts/ci-admin-api-curl.sh
      - apps/worker/src/ip-australia-manual-artifact-acquirer.ts
      - apps/worker/src/ip-australia-manual-inventory.ts
      - apps/worker/src/ip-australia-manual-article-fidelity.ts
      - apps/worker/src/verify-ip-australia-manual-bulk-conversion.ts
      - apps/worker/src/main.ts
      - apps/worker/src/config.ts
      - apps/worker/package.json
      - apps/admin/src/server/raw-artifact-auto-conversion.ts
      - apps/admin/src/server/m3-converter-bootstrap.ts
      - apps/admin/src/server/production-conversion-worker-service.ts
      - apps/admin/src/app/api/worker/v1/artifacts/sessions/**
      - apps/admin/src/app/api/worker/v1/conversion/**
      - packages/worker-runtime/src/production-conversion-worker-runtime.ts
      - packages/worker-runtime/src/production-document-normalization.ts
      - packages/persistence/src/conversion-run-ledger.ts
      - packages/persistence/src/conversion-runtime-persistence.ts
      - packages/persistence/src/ready-package-registry.ts
      - packages/persistence/src/retrieval-index.ts
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: ip-australia-manual-bulk-conversion-live-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  bulk-conversion:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      MARKORBIT_CONTROL_PLANE_URL: http://127.0.0.1:3000
      MARKORBIT_ARTIFACT_MAX_BYTES: "16777216"
      MARKORBIT_IP_AU_CONVERSION_TIMEOUT_MS: "1800000"
      MARKORBIT_IP_AU_CONVERSION_POLL_MS: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure isolated evidence stores
        run: |
          echo "MARKORBIT_KNOWLEDGE_DB_PATH=$RUNNER_TEMP/ip-au-bulk-conversion.sqlite" >> "$GITHUB_ENV"
          echo "MARKORBIT_ARTIFACT_STORE_PATH=$RUNNER_TEMP/ip-au-bulk-artifacts" >> "$GITHUB_ENV"
          echo "MARKORBIT_STAGING_STORE_PATH=$RUNNER_TEMP/ip-au-bulk-staging" >> "$GITHUB_ENV"
          echo "MARKORBIT_REPOSITORY_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Configure isolated Admin auth
        run: bash scripts/ci-admin-auth-configure.sh

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @markorbit/admin build
          pnpm --filter @markorbit/worker build

      - name: Resolve authoritative Manual inventory baseline
        run: |
          pnpm --filter @markorbit/worker inventory:ip-australia-manual > "$RUNNER_TEMP/ip-au-inventory.json"
          node <<'NODE'
          const fs=require('node:fs');
          const report=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/ip-au-inventory.json','utf8'));
          const expected=Number(report.totalUniqueManualPageCount);
          if(!Number.isSafeInteger(expected)||expected<=0)throw new Error(`Invalid Manual inventory count ${report.totalUniqueManualPageCount}`);
          if(report.failedUpdateHistoryPageCount!==0||report.currentNavigationPageCount<=0)throw new Error('Authoritative Manual inventory is incomplete');
          fs.appendFileSync(process.env.GITHUB_ENV,`MARKORBIT_IP_AU_EXPECTED_COUNT=${expected}\n`);
          NODE

      - name: Start isolated Core auth stub
        run: bash scripts/ci-admin-auth-stub-start.sh

      - name: Start isolated control plane
        run: |
          pnpm --filter @markorbit/admin start > "$RUNNER_TEMP/admin.log" 2>&1 &
          echo "ADMIN_PID=$!" >> "$GITHUB_ENV"
          bash scripts/ci-admin-control-plane-ready.sh

      - name: Register connector
        run: |
          cat > "$RUNNER_TEMP/connector.json" <<'JSON'
          {"connectorId":"ip-australia-manual-http","displayName":"IP Australia Trade Marks Manual HTTP","version":"1.0.0","sourceTypes":["WEB"],"runtime":"NODE","capabilities":["COLLECT","WATCH"],"supportedJobTypes":["WEB_CRAWL","PAGE_UPDATE_CHECK"],"configurationSchema":{"type":"object","properties":{}},"secretSchema":{"type":"object","properties":{}},"outputArtifactKinds":["HTML"],"healthCheck":{"mode":"WORKER_PROBE","timeoutSeconds":30},"status":"ACTIVE","extensions":{"x-markorbit-source-specific-adapter":"ip-australia-trade-marks-manual"}}
          JSON
          bash scripts/ci-admin-api-curl.sh --silent --show-error --fail-with-body -X POST "$MARKORBIT_CONTROL_PLANE_URL/api/connectors" -H 'content-type: application/json' --data-binary "@$RUNNER_TEMP/connector.json" >/dev/null

      - name: Create governed Source
        run: |
          cat > "$RUNNER_TEMP/source.json" <<'JSON'
          {"name":"IP Australia Trade Marks Manual","slug":"ip-australia-trade-marks-manual-bulk-conversion-live","sourceType":"WEB","category":"OFFICIAL_GUIDANCE","authorityLevel":"PRIMARY_OFFICIAL","status":"ACTIVE","jurisdictions":["AU"],"languages":["en"],"connector":{"connectorId":"ip-australia-manual-http","version":"1.0.0"},"canonicalUri":"https://manuals.ipaustralia.gov.au/trademark","entrypoints":[{"uri":"https://manuals.ipaustralia.gov.au/trademark","label":"Trade Marks Manual"}],"tags":["ip-australia","trademark","manual","golden-corpus","bulk-conversion-live"]}
          JSON
          bash scripts/ci-admin-api-curl.sh --silent --show-error --fail-with-body -X POST "$MARKORBIT_CONTROL_PLANE_URL/api/sources" -H 'content-type: application/json' --data-binary "@$RUNNER_TEMP/source.json" > "$RUNNER_TEMP/source-create.json"
          node <<'NODE'
          const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/source-create.json','utf8'));
          if(!d?.source?.id)throw new Error('Source creation did not return an id');
          fs.appendFileSync(process.env.GITHUB_ENV,`MARKORBIT_IP_AU_SOURCE_ID=${d.source.id}\n`);
          NODE

      - name: Create full MANUAL plan
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/plan.json',JSON.stringify({sourceId:process.env.MARKORBIT_IP_AU_SOURCE_ID,name:'IP Australia Manual Bulk Conversion Live',status:'ACTIVE',schedule:{mode:'MANUAL'},priority:'HIGH',policy:{includePatterns:['https://manuals.ipaustralia.gov.au/trademark*'],excludePatterns:[],maxDepth:1,maxItems:700,renderJavascript:false,fetchAttachments:false,respectRobots:true,rateLimitPerMinute:120,timeoutSeconds:60,retry:{maxAttempts:1,backoffSeconds:15},locale:'en-AU'},output:{artifactKinds:['HTML']},extensions:{'x-markorbit-acceptance':'ip-australia-manual-bulk-conversion-live-v2'}}));
          NODE
          bash scripts/ci-admin-api-curl.sh --silent --show-error --fail-with-body -X POST "$MARKORBIT_CONTROL_PLANE_URL/api/plans" -H 'content-type: application/json' --data-binary "@$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/plan-create.json"
          node <<'NODE'
          const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/plan-create.json','utf8')); const p=d?.plan?.plan;
          if(!p?.id||p.status!=='ACTIVE')throw new Error('Active plan creation failed');
          fs.appendFileSync(process.env.GITHUB_ENV,`MARKORBIT_IP_AU_PLAN_ID=${p.id}\n`);
          NODE

      - name: Register production Worker
        run: |
          cat > "$RUNNER_TEMP/worker.json" <<'JSON'
          {"displayName":"IP Australia Manual Bulk Conversion Live Worker","desiredState":"ACTIVE","runtime":{"runtimeId":"node-worker","version":"1.0.0"},"supportedJobTypes":["WEB_CRAWL","PAGE_UPDATE_CHECK"],"connectorBindings":[{"connectorId":"ip-australia-manual-http","version":"1.0.0","capabilities":["COLLECT","WATCH"]}],"maxConcurrency":1,"labels":["production","ip-australia","manual","bulk-conversion-live"]}
          JSON
          bash scripts/ci-admin-api-curl.sh --silent --show-error --fail-with-body -X POST "$MARKORBIT_CONTROL_PLANE_URL/api/workers" -H 'content-type: application/json' --data-binary "@$RUNNER_TEMP/worker.json" > "$RUNNER_TEMP/worker-create.secret.json"
          node <<'NODE'
          const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/worker-create.secret.json','utf8'));
          if(!d?.view?.worker?.id||!d?.credential)throw new Error('Worker registration failed');
          process.stdout.write(`::add-mask::${d.credential}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV,`MARKORBIT_WORKER_ID=${d.view.worker.id}\nMARKORBIT_WORKER_CREDENTIAL=${d.credential}\n`);
          NODE
          rm -f "$RUNNER_TEMP/worker-create.secret.json"

      - name: Resolve Worker workspace and enable conversion
        run: |
          bash scripts/ci-admin-api-curl.sh --silent --show-error --fail "$MARKORBIT_CONTROL_PLANE_URL/api/workers/$MARKORBIT_WORKER_ID" > "$RUNNER_TEMP/worker-view.json"
          node <<'NODE'
          const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/worker-view.json','utf8')); const workspace=d?.view?.worker?.workspaceId;
          if(!workspace)throw new Error('Worker view is missing workspaceId');
          fs.appendFileSync(process.env.GITHUB_ENV,`MARKORBIT_WORKSPACE_ID=${workspace}\nMARKORBIT_CONVERSION_ENABLED=1\nMARKORBIT_CONVERSION_CAPABILITY_REVISION=1\n`);
          NODE

      - name: Register HTML Markdown conversion capability
        run: |
          node <<'NODE'
          const fs=require('node:fs'); const {randomBytes}=require('node:crypto');
          const alphabet='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
          const enc=(value,length)=>{let out='';let rem=value;for(let i=0;i<length;i+=1){out=alphabet[Number(rem&31n)]+out;rem>>=5n;}return out;};
          const id=`cwc_${enc(BigInt(Date.now()),10)}${enc(BigInt('0x'+randomBytes(10).toString('hex')),16)}`;
          const capability={contractVersion:'1.0',objectType:'CONVERSION_WORKER_CAPABILITY',id,workerId:process.env.MARKORBIT_WORKER_ID,capabilityRevision:1,supportedConverters:[{converterId:'builtin-html-markdown',versions:['1.0.0']}],acceptedArtifactKinds:['HTML'],acceptedMimePatterns:['text/html','application/xhtml+xml'],supportedOutputFormats:['MARKDOWN'],runtime:{runtimeId:'markorbit-production-html-markdown',version:'1.0.0'},createdAt:new Date().toISOString()};
          fs.writeFileSync(process.env.RUNNER_TEMP+'/conversion-capability.json',JSON.stringify(capability));
          NODE
          bash scripts/ci-admin-api-curl.sh --silent --show-error --fail-with-body -X POST "$MARKORBIT_CONTROL_PLANE_URL/api/conversion-runtime/capabilities" -H 'content-type: application/json' --data-binary "@$RUNNER_TEMP/conversion-capability.json" > "$RUNNER_TEMP/conversion-capability-result.json"

      - name: Dispatch full collection
        run: |
          node <<'NODE'
          const fs=require('node:fs'); fs.writeFileSync(process.env.RUNNER_TEMP+'/dispatch-request.json',JSON.stringify({planId:process.env.MARKORBIT_IP_AU_PLAN_ID}));
          NODE
          bash scripts/ci-admin-api-curl.sh --silent --show-error --fail-with-body -X POST "$MARKORBIT_CONTROL_PLANE_URL/api/runs" -H 'content-type: application/json' -H 'Idempotency-Key: ip-au-manual-bulk-conversion-live' --data-binary "@$RUNNER_TEMP/dispatch-request.json" > "$RUNNER_TEMP/dispatch.json"
          node <<'NODE'
          const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/dispatch.json','utf8'));
          if(!d?.record?.run?.id)throw new Error('Dispatch did not return run id');
          fs.appendFileSync(process.env.GITHUB_ENV,`MARKORBIT_COLLECTION_RUN_ID=${d.record.run.id}\n`);
          NODE

      - name: Start collection and conversion Worker
        env:
          NODE_ENV: test
          MARKORBIT_COLLECTION_PROVIDER: ip-australia-manual
          MARKORBIT_WORKER_POLL_INTERVAL_MS: "500"
          MARKORBIT_WORKER_KEEPALIVE_INTERVAL_MS: "15000"
          MARKORBIT_WORKER_MAX_COLLECTION_RUNTIME_MS: "840000"
          MARKORBIT_CONVERSION_LEASE_DURATION_SECONDS: "300"
        run: |
          pnpm --filter @markorbit/worker start > "$RUNNER_TEMP/worker.log" 2>&1 &
          echo "WORKER_PID=$!" >> "$GITHUB_ENV"

      - name: Resolve collected RawArtifact set against authoritative inventory
        run: |
          for attempt in $(seq 1 180); do
            bash scripts/ci-admin-api-curl.sh --silent --show-error --fail "$MARKORBIT_CONTROL_PLANE_URL/api/runs/$MARKORBIT_COLLECTION_RUN_ID" > "$RUNNER_TEMP/collection-run.json"
            status=$(node -e "const d=require('$RUNNER_TEMP/collection-run.json');process.stdout.write(d.run.run.status)")
            if [ "$status" = COMPLETED ]; then break; fi
            if [ "$status" = FAILED ] || [ "$status" = CANCELLED ]; then cat "$RUNNER_TEMP/collection-run.json"; cat "$RUNNER_TEMP/worker.log"; exit 1; fi
            sleep 5
          done
          node -e "const d=require('$RUNNER_TEMP/collection-run.json');if(d.run.run.status!=='COMPLETED')throw new Error('Collection run did not finish')"
          bash scripts/ci-admin-api-curl.sh --silent --show-error --fail "$MARKORBIT_CONTROL_PLANE_URL/api/artifacts?sourceId=$MARKORBIT_IP_AU_SOURCE_ID&runId=$MARKORBIT_COLLECTION_RUN_ID&artifactKind=HTML&limit=100" > "$RUNNER_TEMP/collection-artifacts.json"
          node <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/collection-artifacts.json','utf8'));
          const inventory=Number(process.env.MARKORBIT_IP_AU_EXPECTED_COUNT);
          if(!Number.isSafeInteger(d.total)||d.total<=0||d.total>inventory)throw new Error(`Invalid RawArtifact count ${d.total} for authoritative inventory ${inventory}`);
          fs.appendFileSync(process.env.GITHUB_ENV,`MARKORBIT_IP_AU_INVENTORY_COUNT=${inventory}\nMARKORBIT_IP_AU_EXPECTED_COUNT=${d.total}\n`);
          NODE

      - name: Verify auto conversions, ReadyPackages, retrieval and Core boundary against collected RawArtifacts
        run: |
          set -o pipefail
          pnpm --filter @markorbit/worker verify:ip-australia-manual-bulk-conversion -- "$MARKORBIT_IP_AU_SOURCE_ID" | tee "$RUNNER_TEMP/bulk-conversion-verification.log"

      - name: Write evidence summary
        if: always()
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const read=(name)=>{const p=`${process.env.RUNNER_TEMP}/${name}`;return fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):null;};
          const inventory=read('ip-au-inventory.json'); const artifacts=read('collection-artifacts.json'); const capability=read('conversion-capability-result.json');
          const lines=['## IP Australia Manual Bulk Conversion Live',''];
          if(inventory)lines.push(`- Authoritative inventory baseline: ${inventory.totalUniqueManualPageCount}`);
          if(artifacts)lines.push(`- Immutable HTML RawArtifacts / downstream expected set: ${artifacts.total}`);
          if(capability?.record?.capability)lines.push(`- Conversion capability: ${capability.record.capability.supportedConverters?.[0]?.converterId}@${capability.record.capability.supportedConverters?.[0]?.versions?.[0]}`);
          const verificationPath=process.env.RUNNER_TEMP+'/bulk-conversion-verification.log';
          if(fs.existsSync(verificationPath))lines.push('- Bulk conversion verifier: executed (see uploaded evidence log)');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE

      - name: Stop isolated processes
        if: always()
        run: |
          if [ -n "${WORKER_PID:-}" ]; then kill "$WORKER_PID" 2>/dev/null || true; fi
          if [ -n "${ADMIN_PID:-}" ]; then kill "$ADMIN_PID" 2>/dev/null || true; fi
          if [ -n "${AUTH_STUB_PID:-}" ]; then kill "$AUTH_STUB_PID" 2>/dev/null || true; fi

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ip-australia-manual-bulk-conversion-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ip-au-inventory.json
            ${{ runner.temp }}/source-create.json
            ${{ runner.temp }}/plan-create.json
            ${{ runner.temp }}/worker-view.json
            ${{ runner.temp }}/conversion-capability-result.json
            ${{ runner.temp }}/collection-run.json
            ${{ runner.temp }}/collection-artifacts.json
            ${{ runner.temp }}/bulk-conversion-verification.log
            ${{ runner.temp }}/worker.log
            ${{ runner.temp }}/admin.log
            ${{ runner.temp }}/admin-auth-stub.log
          if-no-files-found: warn
          retention-days: 30
