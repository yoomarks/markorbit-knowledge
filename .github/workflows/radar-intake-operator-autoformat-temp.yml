name: Radar Intake Operator Autoformat Temp

on:
  push:
    branches: [agent/radar-intake-operator-v1]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/radar-intake-operator-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Radar intake operator files
        run: |
          pnpm exec prettier --write apps/admin/src/server/radar-source-intake-request.ts apps/worker/src/operate-radar-source-intake.ts apps/admin/src/server/radar-source-intake-request.test.ts apps/admin/src/app/api/discovery/radar-intake/route.ts
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/server/radar-source-intake-request.ts apps/worker/src/operate-radar-source-intake.ts apps/admin/src/server/radar-source-intake-request.test.ts apps/admin/src/app/api/discovery/radar-intake/route.ts
          git commit -m "style: format Radar intake operator"
          git push origin HEAD:agent/radar-intake-operator-v1
