name: Temporary Global Reference Format

on:
  push:
    branches:
      - agent/global-reference-source-layer-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/global-reference-source-layer-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          packages/contracts/src/global-reference-source-v1.ts
          packages/persistence/src/global-reference-source-catalog.ts
          packages/persistence/tests/global-reference-source-catalog.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/global-reference-source-v1.ts packages/persistence/src/global-reference-source-catalog.ts packages/persistence/tests/global-reference-source-catalog.test.ts
          git commit -m "style: format global reference source files"
          git push origin HEAD:agent/global-reference-source-layer-v1
