services:
  crawl4ai-worker:
    build:
      context: ../..
      dockerfile: deploy/crawl4ai-worker/Dockerfile
    restart: unless-stopped
    read_only: true
    shm_size: 1gb
    tmpfs:
      - /tmp:size=512m,mode=1777
    environment:
      MARKORBIT_CONTROL_PLANE_URL: ${MARKORBIT_CONTROL_PLANE_URL:?required}
      MARKORBIT_WORKER_ID: ${MARKORBIT_WORKER_ID:?required}
      MARKORBIT_WORKER_CREDENTIAL: ${MARKORBIT_WORKER_CREDENTIAL:?required}
      MARKORBIT_WORKER_RUNTIME_VERSION: ${MARKORBIT_WORKER_RUNTIME_VERSION:-1.0.0}
      MARKORBIT_WORKER_POLL_INTERVAL_MS: ${MARKORBIT_WORKER_POLL_INTERVAL_MS:-2000}
      MARKORBIT_WORKER_KEEPALIVE_INTERVAL_MS: ${MARKORBIT_WORKER_KEEPALIVE_INTERVAL_MS:-30000}
      MARKORBIT_WORKER_ERROR_BACKOFF_MIN_MS: ${MARKORBIT_WORKER_ERROR_BACKOFF_MIN_MS:-1000}
      MARKORBIT_WORKER_ERROR_BACKOFF_MAX_MS: ${MARKORBIT_WORKER_ERROR_BACKOFF_MAX_MS:-30000}
      MARKORBIT_CRAWL4AI_REQUIRE_EGRESS_PROXY: "1"
      MARKORBIT_CRAWL4AI_EGRESS_PROXY: ${MARKORBIT_CRAWL4AI_EGRESS_PROXY:?required}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
